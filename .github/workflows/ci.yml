# The engine's own deterministic gate: the regression harness (negative fixtures,
# fail-closed unit invariants, doctrine lockstep, pinned fixture recall) runs on
# every push and pull request. A repo that evaluates others for deterministic
# gates runs one itself, and holds the invariants it holds the routine template
# to (tests/blocks/ci-workflow.mjs): actions pinned to the same commit SHAs,
# a read-only token, a timeout, and every Node major package.json declares.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # gitleaks on PATH, so the harness runs the branch a routine with the optional
      # step runs (issue #51): the exact release routine/assay-routine.yml pins,
      # checked against its published sha256 before it is ever executed. Bump both
      # files together (tests/blocks/ci-workflow.mjs holds them equal).
      - name: Install gitleaks (pinned + checksummed)
        env:
          GITLEAKS_VERSION: '8.21.2'
          GITLEAKS_SHA256: '5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - run: npm test
