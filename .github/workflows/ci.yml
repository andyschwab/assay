# The engine's own deterministic gate: the regression harness (negative fixtures,
# fail-closed unit invariants, doctrine lockstep, pinned fixture recall) runs on
# every push and pull request. A repo that evaluates others for deterministic
# gates runs one itself, and holds the invariants it holds the routine template
# to (tests/regression.mjs "ci-workflow"): actions pinned to the same commit SHAs,
# a read-only token, a timeout, and every Node major package.json declares.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
