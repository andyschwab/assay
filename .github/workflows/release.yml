# Cuts a release: a tag vX.Y.Z on the default branch, with notes compiled from the commit messages since the last
# tag (#229). The change record is git (CLAUDE.md), so the notes are the commits: every Consumer: trailer first (what
# a consumer pinned to assay must change, CONSUMERS.md), then every commit. A person dispatches it; nothing else
# runs it, and nothing else in this repository tags.
#
# Before it tags, it runs the gate on the dispatched commit (with assay's pinned tools on PATH, as ci.yml does) and
# the Consumer: trailer check over the release's commits, and refuses a version that is not vX.Y.Z or a tag that
# already exists. Only this job holds contents: write, to create the tag and the release.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: The tag to cut, vX.Y.Z
        type: string
        required: true
permissions: { contents: read }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # the notes and the trailer check read every commit since the last tag
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Refuse a malformed or existing version
        env: { VERSION: '${{ inputs.version }}' }
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$VERSION is not vX.Y.Z; nothing tagged"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then echo "::error::$VERSION already exists; nothing tagged"; exit 1; fi
      - run: npm ci
      - uses: ./.github/actions/tools
      - run: npm test
      - name: Check every contract change carries its Consumer trailer
        run: node lib/release-notes.mjs --check
      - name: Tag and publish the release
        env: { VERSION: '${{ inputs.version }}', GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          node lib/release-notes.mjs > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
