# Deletes the merged branches agents leave behind: the work lane's `work/<date>[letter]` (one integration branch per
# slice) and `work/<date>[letter]-<issue>-<slug>` (one per item), the sweep set's `sweep/<date>[-n]`, and an agent
# session's `claude/<name>`. A session cannot delete a ref, so a person dispatches this, by hand only. `dry_run`
# (default true) prints the plan and deletes nothing; a person reads it, then runs it again with dry_run off.
#
# Planned for deletion: a branch under PREFIXES whose tip the default branch holds, that a merged pull request came
# from, and that no open pull request still uses as its head or its base, so a slice in flight (an integration branch
# just cut, an item branch with no commit yet) is kept. Everything else is listed as kept. A failed read fails the run.
# The plan reads with the run's own token; only the delete job holds `contents: write`, and it runs only with dry_run
# off. No action and no checkout: the GitHub CLI on the runner calls the REST API, and nothing of the branches' code runs.
name: branch-cleanup
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would be deleted and delete nothing
        type: boolean
        default: true
permissions: { contents: read }
concurrency: { group: branch-cleanup, cancel-in-progress: false }
env:
  PREFIXES: work/ sweep/ claude/
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, pull-requests: read }
    outputs: { merged: '${{ steps.plan.outputs.merged }}' }
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - name: Plan the merged branches
        id: plan
        env: { DRY_RUN: '${{ inputs.dry_run }}' }
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          ours() { for p in $PREFIXES; do case "$1" in "$p"?*) return 0;; esac; done; return 1; }
          default=$(gh api "repos/$repo" --jq .default_branch)
          merged=() kept=()
          branches=$(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name')   # a failed read fails the run
          for b in $branches; do
            ours "$b" || continue
            # behind or identical: every commit on the branch is in the default branch
            status=$(gh api "repos/$repo/compare/$default...$b" --jq .status)
            done_prs=$(gh api --paginate "repos/$repo/pulls?state=closed&head=${repo%%/*}:$b&per_page=100" --jq '.[] | select(.merged_at) | .number' | wc -l)
            open_head=$(gh api --paginate "repos/$repo/pulls?state=open&head=${repo%%/*}:$b&per_page=100" --jq '.[].number' | wc -l)
            open_base=$(gh api --paginate "repos/$repo/pulls?state=open&base=$b&per_page=100" --jq '.[].number' | wc -l)
            if { [ "$status" = behind ] || [ "$status" = identical ]; } && [ "$done_prs" -gt 0 ] && [ "$open_head" -eq 0 ] && [ "$open_base" -eq 0 ]; then
              merged+=("$b")
            else
              kept+=("$b ($status from $default; merged PRs $done_prs, open as head $open_head, as base $open_base)")
            fi
          done
          echo "default branch: $default; prefixes: $PREFIXES"
          echo "merged, to delete (${#merged[@]}):"
          for b in "${merged[@]+"${merged[@]}"}"; do echo "  $b"; done
          echo "kept (${#kept[@]}):"
          for b in "${kept[@]+"${kept[@]}"}"; do echo "  $b"; done
          echo "merged=${merged[*]+"${merged[*]}"}" >> "$GITHUB_OUTPUT"
          if [ "${DRY_RUN:-true}" = true ]; then echo "dry run: nothing deleted. Dispatch again with dry_run off to delete the ${#merged[@]} merged branch(es)."; fi
  delete:
    needs: plan
    if: ${{ !inputs.dry_run && needs.plan.outputs.merged != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write }
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - name: Delete the planned branches
        env: { MERGED: '${{ needs.plan.outputs.merged }}' }
        run: |
          set -euo pipefail
          ours() { for p in $PREFIXES; do case "$1" in "$p"?*) return 0;; esac; done; return 1; }
          # the plan names branches under PREFIXES alone; anything else means the plan is not this workflow's: delete nothing
          for b in $MERGED; do ours "$b" || { echo "::error::$b is under none of $PREFIXES; nothing deleted"; exit 1; }; done
          n=0
          for b in $MERGED; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$b" --silent
            echo "deleted $b"; n=$((n + 1))
          done
          echo "deleted $n branch(es)"
