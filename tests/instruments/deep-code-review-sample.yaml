findings:
  - id: F1
    title: "Status aggregation ignores the source-of-truth hierarchy"
    area: A
    tag: "correctness"
    severity: Critical
    polarity: gap
    confidence: CONFIRMED
    latent: false
    mechanism_unproven: false
    observation: >
      An active secondary account overrides a primary-source termination, so the alert that depends on it computes an empty set.
    evidence:
      - src/lib/aggregate.ts:486
      - src/lib/alert.ts:35
    fix: >
      Make aggregation hierarchy-aware so a primary-source termination wins; add the mixed-status regression test.
    compounds: [F3]
    prior_id: F1
    prior_status: still-open
  - id: F2
    title: "Tenant selection is JWT-sub-only"
    area: T
    polarity: strength
    confidence: CONFIRMED
    observation: >
      No body, query, or header can select a tenant; anon GET returns 401 and a two-principal swap returns 403.
    evidence:
      - api/mw/tenant.ts:31
  - id: F3
    title: "Nightly job retries a partially-applied batch"
    area: W
    severity: High
    polarity: gap
    confidence: PLAUSIBLE
    mechanism_unproven: true
    observation: >
      The scheduler re-enqueues a failed batch without an idempotency key, so a mid-batch crash applies the first half twice.
    evidence:
      - jobs/nightly.ts:72
    fix: >
      Key each batch application on a stable id and skip already-applied rows; prove it with a crash-at-row-N test.
  - id: F4
    title: "Export recipient list may be caller-controlled"
    area: B
    tag: "A01 broken access control"
    severity: High
    polarity: gap
    confidence: unverified
    resolves_with: "the recipients table schema (is org_id NOT NULL?)"
    observation: >
      The export route reads the recipient list from the request body; whether the org filter below it can be bypassed depends on a column constraint not in the tree.
    evidence:
      - src/app/api/export/route.ts:40
    fix: >
      Derive recipients from the caller's org server-side and ignore the body list; add a two-principal test.
prior_not_rechecked: [F7]
