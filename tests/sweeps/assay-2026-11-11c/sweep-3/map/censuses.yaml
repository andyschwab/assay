# map/censuses.yaml — practice-review, assay @ 2b247c0 (authored; census-augmented mode)
# Each census's population and question are the check: of the yardstick requirement that reads it.
dimensions:
  - dimension: artifact-legibility
    depth: >
      The best instances write the rationale beside the decision itself, as with the two-job routine split
      and the --allow-exec boundary (F-103, F-105), and every claim in the agent contract replays against
      the code (F-111 to F-123); the misses are a choice stated without its reason (F-108, F-110).
    sampled:
      - name: decision-reconstruction
        what: "non-obvious decisions whose rationale reconstructs from the files alone"
        members: [F-101, F-102, F-103, F-104, F-105, F-106, F-107, F-108, F-109, F-110]
        method: "the ten decisions D1-D10 the terrain froze before assessment, one finding each"
        primary: true
      - name: doc-freshness
        what: "command and path claims in the agent contract (CLAUDE.md) that hold against the code"
        members: [F-111, F-112, F-113, F-114, F-115, F-116, F-117, F-118, F-119, F-120, F-121, F-122, F-123]
        method: "every command and path claim in CLAUDE.md as the terrain lists them, replayed against the code, not run"
  - dimension: context-economy
    depth: >
      The best modules load alone with a contract and a command of their own (F-201, F-203, F-205, F-207);
      the engine's central map/ scripts and views/improve/ do not, and their contracts run past a thousand
      lines (F-202, F-206, F-211).
    sampled:
      - name: modules-standalone
        what: "modules an agent can load alone with something to read and something to run"
        members: [F-201, F-202, F-203, F-204, F-205, F-206, F-207, F-208]
        method: "the eight load-bearing directories the terrain froze, one finding each"
        primary: true
  - dimension: deterministic-gates
    depth: >
      The gates a change passes are pinned, timed and fail closed on their own inputs (F-301 to F-305,
      F-312, F-313); the regression harness itself reads green when a networked tool does not install,
      in CI and in the release job (F-306, F-311, F-314).
    sampled:
      - name: change-gates
        what: "change gates that go red when what they need is absent or never finishes"
        members: [F-301, F-302, F-303, F-304, F-305, F-306, F-307, F-308, F-309, F-310, F-311, F-312, F-313]
        method: "every ci.yml and release.yml step and job timeout, and the harness runner's refusals, as the terrain froze them, one finding each"
        primary: true
  - dimension: verification
    depth: >
      Where an effect proves itself it does so by re-reading the effect, not the exit code: sha256 and an
      answer at the pin for tools, a re-read before each branch delete, a positive control for opengrep
      (F-402, F-405, F-409); the GitHub-side writes trust the CLI's exit (F-403, F-404).
    sampled:
      - name: effect-provability
        what: "effect channels that verify their effect rather than trusting a report"
        members: [F-401, F-402, F-403, F-404, F-405, F-406, F-407, F-408, F-409, F-410, F-411, F-412, F-413]
        method: "every effect channel slug in the terrain's inventory, one finding each"
  - dimension: delegation
    depth: >
      Credentials are scoped per job and traced in the code (F-517 to F-521), and the one person-held halt
      is real (F-504, F-525); the effects that execute untrusted code hold no gate that fails closed
      outside assay start (F-506, F-508).
    sampled:
      - name: credential
        what: "credentials whose reach is traced in the code"
        members: [F-517, F-518, F-519, F-520, F-521, F-522]
        method: "every secret the running engine and its workflows read, as the terrain froze them, one finding each"
        primary: true
  - dimension: improvement-loop
    depth: >
      Most recorded lessons became a validator rule or a harness block that fails on a recurrence
      (F-602, F-605, F-606, F-607); two stayed a written rule (F-603, F-604).
    sampled:
      - name: incidents-became-mechanisms
        what: "recorded lessons that became a mechanism"
        members: [F-601, F-602, F-603, F-604, F-605, F-606, F-607, F-608, F-609, F-610]
        method: "the ten lessons L1-L10 the terrain froze, one finding each"
        primary: true
  - dimension: multiplayer
    depth: >
      Every interface has a format contract stated outside the code, CONSUMERS.md first among them
      (F-701, F-714); the trailer rule that guards it leaves several of those formats unwatched (F-716).
    sampled:
      - name: agent-access-surface
        what: "interfaces an agent can reach through an API or format contract"
        members: [F-701, F-702, F-703, F-704, F-705, F-706, F-707, F-708, F-709, F-710, F-711, F-712, F-713]
        method: "the thirteen interfaces the terrain froze, one finding each"
        primary: true
