  requirement_agreement: 58  # measured 7 of 13 decided requirements identical in all three (54%). Re-blessed with #286 (M6): d-credentials-enumerated reads over the secrets enumerate listed and no sweep triaged them, so met, met, mixed reads mixed in all three; d-change-gates-fail-closed (met, met, mixed) reads not measured in all three, since this v0.8.0 enumeration lists no populations.changeGates; 8 of 12 agree (67%). The rise is a met that went and a contested row the run can no longer decide, not a judgment that converged. Re-blessed again with #286's rule for a member outside the candidate list (it can hold the row down, never read it met): no sweep triaged, so every credential member sits outside the list; sweep-3's gap holds its row unmet, and the strengths of sweep-1 and sweep-2 decide nothing (not-measured, not-measured, unmet); 7 of 12 agree (58%)
