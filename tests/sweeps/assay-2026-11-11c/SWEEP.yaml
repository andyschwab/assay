  candidate_agreement: 0     # measured per listed candidate (#312): 0 of 2 (0%). Before → after: per channel 3 of 10 (30%) → per candidate 0 of 2 (0%). Of 13 listed candidates, 11 are out of scope in every sweep, no scope disagreement; the 2 compared (http write (js), surface: migrate-run.mjs) part. The 3 identical channels per channel were effect findings no candidate maps to (34 slugs), counted apart
