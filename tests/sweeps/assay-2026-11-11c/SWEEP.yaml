# Re-measured under #298's channel key (a channel is the candidate its run's effect-triage maps to
# it, else its slug): 37 channels → 36, shared 10 → 10, identical 3 → 3 (30%), unchanged;
# requirement agreement 7 of 12 (58%), unchanged.
