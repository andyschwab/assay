- id: F-717
  dimension: multiplayer
  polarity: fact
  subject_type: artifact
  observation: >
    The run directory is the engine's only shared store, placed by one module and shared by copying it or by the routine's Actions artifact upload; no shared scope (team, fleet, project) exists as a principal with its own memory or permissions, so who can read a run is whatever the filesystem or the artifact's repository grants.
  evidence:
    - "lib/run-layout.mjs:1-12"
    - "CONSUMERS.md:83-86"
    - "routine/README.md:21-31"
  confidence: confirmed
  property: shared-scope-not-a-principal
