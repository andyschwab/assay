# Pass 3: deterministic gates. Census change-gates: F-301..F-312 (one per population member,
# in population order); F-313 onward are beyond the census.
- id: F-301
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The CI test job's first gate step runs npm ci against a committed lockfile (lockfileVersion 3 with per-package integrity hashes), so a missing registry, a lockfile out of step with package.json or a hash mismatch exits non-zero and the job goes red, bounded by the job's 15-minute timeout.
  evidence: [.github/workflows/ci.yml:30, .github/workflows/ci.yml:19, package-lock.json:4, package-lock.json:25]
  confidence: confirmed
  property: dependency-install-fails-closed
- id: F-302
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The CI lint step runs lib/check-syntax.mjs, which refuses an empty module list as unclean, counts any node --check that does not exit 0 (a signal kill included) as a failure, and throws if git cannot list, so it goes red rather than green when its input or tool is absent.
  evidence: [.github/workflows/ci.yml:31, package.json:10, lib/check-syntax.mjs:11-15]
  confidence: confirmed
  property: empty-input-refused
- id: F-303
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The CI typecheck step runs tsc -p tsconfig.json with allowJs, checkJs and noEmit over the engine's module globs, using the exactly pinned typescript devDependency that npm ci installs, so a type error or an absent compiler exits non-zero and the job goes red.
  evidence: [.github/workflows/ci.yml:32, package.json:11, package.json:18, tsconfig.json:3-5, tsconfig.json:12]
  confidence: confirmed
  property: typecheck-fails-closed
- id: F-304
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The CI build step runs npm run build, which is the same lib/check-syntax.mjs the lint step runs, so it fails red under exactly the lint step's conditions and adds no check of its own.
  evidence: [.github/workflows/ci.yml:33, package.json:12, package.json:10, lib/check-syntax.mjs:1-2]
  confidence: confirmed
  property: empty-input-refused
- id: F-305
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The CI tools step calls the local composite action, which installs and verifies the pinned instrument tools under set -euo pipefail and fails the step (putting nothing on PATH) when an install or a verify exits non-zero, before npm test runs.
  evidence: [.github/workflows/ci.yml:34-38, .github/actions/tools/action.yml:26-31]
  confidence: confirmed
  property: tool-precondition-fails-closed
- id: F-306
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The CI npm test step runs tests/regression.mjs, which goes red when no block file exists, when a block fails to load or throws, when no block exports the NEGATIVE or SCORED lists, when golden.json is missing (exit 2) or when any scored grade drifts, and the job's 15-minute timeout ends a hung block as a failed job rather than a pass.
  evidence: [.github/workflows/ci.yml:39, .github/workflows/ci.yml:19, tests/regression.mjs:28-44, tests/harness.mjs:72-73, tests/harness.mjs:77-78, tests/harness.mjs:111-117, tests/harness.mjs:141, tests/harness.mjs:151-163]
  confidence: confirmed
  property: empty-input-refused
- id: F-307
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The release workflow's version refusal runs under set -euo pipefail, reads the dispatched version through the environment, and exits 1 on any value that is not vX.Y.Z (an empty value included) or that names an existing tag, so nothing is tagged on a malformed or repeated input.
  evidence: [.github/workflows/release.yml:33-38, .github/workflows/release.yml:13-16]
  confidence: confirmed
  property: input-refused-before-effect
- id: F-308
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The release job's npm ci step installs from the committed lockfile and exits non-zero on a missing registry or a lockfile mismatch, halting the job before the tag step, inside the job's 20-minute timeout.
  evidence: [.github/workflows/release.yml:39, .github/workflows/release.yml:22, package-lock.json:4]
  confidence: confirmed
  property: dependency-install-fails-closed
- id: F-309
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
