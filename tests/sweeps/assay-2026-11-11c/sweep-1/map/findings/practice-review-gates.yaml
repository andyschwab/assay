  subject_type: control
  observation: >
    No commit or push hook or hook-installing script is tracked (package.json declares no prepare script and no hook directory or pre-commit config is in the tree), so the earliest automatic catch of a regression is CI on the pull request, with npm test before a pull request left to the contributor.
