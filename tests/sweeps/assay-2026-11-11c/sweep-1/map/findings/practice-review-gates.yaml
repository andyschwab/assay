  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The composite tools action is one bash step under set -euo pipefail that defaults an empty dir input to the runner temp directory rather than skipping, refuses a download whose sha256 differs from the adapter's pin, bounds each version probe at 60 seconds, exits 1 on a failed or unsupported install or a not-ready verify, and ci-interface.mjs runs the step's script to prove a failed install or verify fails it with nothing on PATH.
