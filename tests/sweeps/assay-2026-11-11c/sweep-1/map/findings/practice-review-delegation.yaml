- id: F-529
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    Every child process that runs the target's code or package manager gets an environment built from
    an allow-list (PATH, HOME, CI, proxy plumbing without userinfo, npm_config_* only), so tokens and
    cloud keys in the evaluator's environment never reach it.
  evidence: [map/child-env.mjs:1-8, map/child-env.mjs:10-38, map/fresh-clone.mjs:236, map/dependency-scan.mjs:85, map/structure-scan.mjs:97, map/start.mjs:270]
  confidence: confirmed
  property: child-env-allow-listed

- id: F-530
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    The allow-list passes HOME and runs the target's code as the evaluator's own user without a
    sandbox, so credentials kept in files under HOME (CLI logins, registry and SSH keys) stay readable
    by the executed code, a boundary the code names only by advising a disposable container or VM.
  evidence: [map/child-env.mjs:10, map/child-env.mjs:30, map/fresh-clone.mjs:79-82, map/scanners/CONTRACT.md:195-197]
  confidence: plausible
  property: file-credentials-reachable-by-executed-code

