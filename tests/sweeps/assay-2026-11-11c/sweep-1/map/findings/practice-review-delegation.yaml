- id: F-501
  dimension: delegation
  polarity: fact
  subject_type: effect
  observation: >
    `assay start` writes a new run directory and refuses before writing anything when the run's
    map/scanners.yaml already exists or any pinned tool is not ready, and executes the target's
    code (fresh-clone, knip) only under --allow-exec while still always running dependency-scan and
    the registry install of structure-scan.
  evidence: [map/start.mjs:463-466, map/start.mjs:471-473, map/start.mjs:488-489, map/start.mjs:357-359, map/start.mjs:498]
  confidence: confirmed
  effect:
    channel: run-start
    reversibility: reversible
    external: false
    gate_type: deterministic-halt
    fail_mode: closed
    telemetry: structured-event
    blast_scope: user
  reaches: [F-515, F-516, F-517]
  property: run-never-redrawn-in-place

