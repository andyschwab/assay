# Pass 4 — verification affordances (census-augmented: effect-provability, one finding per channel slug, F-401..F-423; probes F-424..)
- id: F-401
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    The run-start channel proves its own effect: after writing map/scanners.yaml it runs validate over the run it just drew (with --target when a target was given) and exits with validate's status rather than with its own success line.
  evidence: [map/start.mjs:498-503, map/start.mjs:519]
  confidence: confirmed
  property: effect-read-back
- id: F-402
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    The run-ingest channel refuses a report that does not describe the run it is filed under (a report exit that disagrees with the runner's exit, or a truncated report) and halts before writing any row, instead of trusting the tool's return code.
  evidence: [map/ingest.mjs:118-119, map/ingest.mjs:1244-1245]
  confidence: confirmed
  property: report-matches-run
- id: F-403
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    The run-record channel rewrites map/scanners.yaml under a lock and prints the row it computed, but never parses the rewritten file back to confirm the row landed; only a later measure or validate reads it.
  evidence: [map/record.mjs:164-168, map/record.mjs:216-218]
  confidence: confirmed
  property: effect-read-back
- id: F-404
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    The run-migrate channel checks each rewrite before writing it: every rewritten flow list is parsed back and compared with the value it replaces, the whole file is re-parsed, and any mismatch leaves the file untouched and exits 1.
  evidence: [map/migrate-run.mjs:83-91, map/migrate-run.mjs:112, map/migrate-run.mjs:130]
  confidence: confirmed
  property: write-verified-before-commit
- id: F-405
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    The run-compile channel validates the base before compiling and checks each child script's exit status, then prints "package assembled" without reading back the package it wrote, after the handoff step has already removed and rewritten its directory.
  evidence: [views/compile.mjs:55-58, views/compile.mjs:232-233, views/improve/handoff.mjs:604-609]
  confidence: confirmed
  property: effect-read-back
- id: F-406
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    The measure-write channel's output is not trusted as written: validate recomputes every requirement from the base and fails on any status, mechanism, row-count or id drift in yardstick.yaml.
  evidence: [yardstick/measure.mjs:585-589, map/validate.mjs:736-766]
  confidence: confirmed
  property: generated-file-drift-check
- id: F-407
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    The maturity-write channel's generated grades are recomputed from the base by validate, which fails on any counted or sampled drift against the written file.
  evidence: [views/improve/maturity.mjs:230-236, map/validate.mjs:651-679]
  confidence: confirmed
  property: generated-file-drift-check
