# ── credential census (credentials-below-boundary): one control per credential ──

- id: F-516
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "credential: github.token per workflow"
  observation: >
    The Actions token is held below any prompt boundary (no workflow calls a model) and scoped
    per job: every workflow defaults to contents read, write scopes are granted only to the job
    that writes, every checkout sets persist-credentials false, and the routine passes it to its
    one base-ref fetch through the environment in a job that never runs the change's code.
  evidence:
    - ".github/workflows/ci.yml:13-14"
    - ".github/workflows/tools-check.yml:11"
    - ".github/workflows/tools-check.yml:17"
    - ".github/workflows/release.yml:17"
    - ".github/workflows/release.yml:24"
    - ".github/workflows/branch-cleanup.yml:50"
    - ".github/workflows/branch-cleanup.yml:111"
    - "routine/assay-routine.yml:32-33"
    - "routine/assay-routine.yml:104-115"
  confidence: confirmed

- id: F-517
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "credential: ASSAY_READ_TOKEN"
  observation: >
    The optional ASSAY_READ_TOKEN is off by default, reaches only the two assay checkout steps
    with persist-credentials false, and the runbook scopes it to read access on one repository
    with rotation and revocation steps.
  evidence:
    - "routine/assay-routine.yml:58-65"
    - "routine/assay-routine.yml:117-124"
    - "RUNBOOK.md:58-71"
  confidence: confirmed

- id: F-518
  dimension: delegation
  polarity: gap
  subject_type: control
  label: "credential: GITHUB_TOKEN read from env by tools"
  observation: >
    `tools check` reads whatever GITHUB_TOKEN the operator's environment holds, of no stated
    scope, and passes it to curl as a command-line header argument (visible in the process
    table), and `tools install` hands uv the operator's full environment including that token.
  evidence:
    - "map/tools.mjs:202-203"
    - "map/tools.mjs:104-106"
    - ".github/workflows/tools-check.yml:20"
  confidence: confirmed

- id: F-519
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "credential: proxy userinfo"
  observation: >
    A proxy URL carrying userinfo is treated as a credential and dropped from every child a
    target's code runs in, failing closed on any '@' in the authority, with a note on the row
    saying which and why.
  evidence:
    - "map/child-env.mjs:12-24"
    - "map/child-env.mjs:31-32"
    - "map/scanners/CONTRACT.md:189-191"
  confidence: confirmed

