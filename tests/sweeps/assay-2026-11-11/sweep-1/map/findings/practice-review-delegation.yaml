- id: F-501
  dimension: delegation
  polarity: fact
  subject_type: effect
  observation: >
    fresh-clone runs the target's install, lifecycle scripts, build, lint, test and migrate-dry
    steps through a shell (`shell: true`) as the evaluator's user, and `assay start` runs it only
    when the operator passes --allow-exec, recording it skipped with the reason otherwise.
  evidence:
    - "map/fresh-clone.mjs:77-82"
    - "map/fresh-clone.mjs:310"
    - "map/start.mjs:410"
    - "map/start.mjs:459"
    - "map/scanners/CONTRACT.md:195-197"
  confidence: confirmed
  effect:
    channel: fresh-clone-exec
    reversibility: irreversible
    external: true
    gate_type: initiated-by-person
    fail_mode: closed
    telemetry: structured-event
    blast_scope: user

