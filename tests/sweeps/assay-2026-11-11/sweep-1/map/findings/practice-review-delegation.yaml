# ── probes ──

- id: F-522
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "the halt"
  observation: >
    The repository's irreversible or external moves are held at narrow points: the release only by
    a person's dispatch behind the full gate, target execution only under --allow-exec, and a
    hand-started branch sweep as a dry run unless a person turns it off.
  evidence:
    - ".github/workflows/release.yml:1-4"
    - "map/start.mjs:459"
    - ".github/workflows/branch-cleanup.yml:38-43"
    - ".github/workflows/branch-cleanup.yml:104-108"
  confidence: confirmed

- id: F-523
  dimension: delegation
  polarity: gap
  subject_type: control
  label: "release job composition"
  observation: >
    The release job that holds contents write runs npm ci, the tools install (with checkov's
    unpinned PyPI dependencies) and npm test before its final step hands GH_TOKEN to `gh`
    resolved from a PATH those earlier steps can extend, so the token step's integrity rests on
    every earlier step in the same job.
  evidence:
    - ".github/workflows/release.yml:24"
    - ".github/workflows/release.yml:39-41"
    - ".github/workflows/release.yml:44-50"
    - ".github/actions/tools/action.yml:29-31"
  confidence: plausible
  preconditions: [malicious-dependency]
  explained_by: [F-504]

- id: F-524
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "routine two-job split"
  observation: >
    The routine runs the change's own code only in a target job that holds no write token and
    hands forward only raw reports as data, while the gating job validates, compiles and ratchets
    from its own fresh checkouts and reads the baseline from the base branch.
  evidence:
    - "routine/assay-routine.yml:40-47"
    - "routine/assay-routine.yml:52-56"
    - "routine/assay-routine.yml:143-151"
    - "routine/assay-routine.yml:160-166"
    - "routine/run.mjs:162-166"
  confidence: confirmed

- id: F-525
  dimension: delegation
  polarity: gap
  subject_type: control
  label: "HOME reaches the target"
  observation: >
    The child environment allow-list passes HOME, so a target's install and scripts run with the
    evaluator's home directory and any credential files kept there, which the contract states as
    "not a sandbox" and leaves to running in a disposable container.
  evidence:
    - "map/child-env.mjs:10"
    - "map/child-env.mjs:28-30"
    - "map/scanners/CONTRACT.md:195-197"
    - "README.md:93-97"
  confidence: confirmed

- id: F-526
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "pinned binary checksum"
  observation: >
    Every binary tool download is checked against the sha256 its adapter pins before it is
    extracted or executed, a malformed tool block is refused, and a mismatch installs nothing.
  evidence:
    - "map/tools.mjs:57-71"
    - "map/tools.mjs:91-94"
    - "map/tools.mjs:118-130"
  confidence: confirmed

- id: F-527
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "workflow identity"
  observation: >
    Each automated effect acts as the repository's own Actions token with per-job scope and no
    third-party action in the jobs that write (branch-cleanup uses only the runner's gh CLI),
    so who acts and with what reach is stated in each workflow file.
  evidence:
    - ".github/workflows/branch-cleanup.yml:31-33"
    - ".github/workflows/branch-cleanup.yml:59"
    - ".github/workflows/branch-cleanup.yml:111-112"
    - ".github/workflows/tools-check.yml:17-23"
  confidence: confirmed

- id: F-528
  dimension: delegation
  polarity: fact
  subject_type: control
  label: "lane session identity"
  observation: >
    A lane session acts as whoever started it with that host's tools, and the lane names no tool
    allow-list or authorization of its own, leaving any authorization block to the consumer.
  evidence:
    - "map/lane.mjs:4-11"
    - "map/scanners/adapters/practice-review/lane.md:10"
  confidence: confirmed

- id: F-529
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "run record"
  observation: >
    Each operator channel leaves a machine-readable record in the run: a scanners.yaml row per
    instrument with status, reason and duration, and a routine.yaml written on every return path
    including failure and refusal.
  evidence:
    - "map/start.mjs:279-283"
    - "routine/run.mjs:190-202"
    - "map/record.mjs:144-151"
  confidence: confirmed

- id: F-530
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "instrument output QC"
  observation: >
    Automation gets output QC matched to its modality: an instrument with zero results reads
    clean only beside a positive control that fired on planted cases in the same run.
  evidence:
    - "map/start.mjs:252-259"
    - "map/start.mjs:193-213"
  confidence: confirmed

- id: F-531
  dimension: delegation
  polarity: gap
  subject_type: control
  label: "lane controls are prompt-level"
  observation: >
    The agentic lane sessions are controlled by a behavioural spec in the prompt and by the
    consumer validating what they publish, with no runtime monitoring or enforced tool limit
    defined in this repository.
  evidence:
    - "map/scanners/adapters/practice-review/lane.md:12"
    - "map/scanners/adapters/practice-review/lane.md:22"
    - "map/scanners/adapters/deep-code-review/lane.md:11"
    - "map/lane.mjs:4-11"
  confidence: plausible

- id: F-532
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "authorship recorded"
  observation: >
    AI authorship is structural: each lane's published checkout record names the model each pass
