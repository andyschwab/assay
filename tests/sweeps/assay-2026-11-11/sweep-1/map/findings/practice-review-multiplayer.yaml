# Pass 7 — multiplayer (agent access surface, shared substrate, authority domains, consent, concurrent writers)
# Census agent-access-surface: F-701..F-717 (one finding per enumerated interface).

- id: F-701
  dimension: multiplayer
  polarity: strength
  subject_type: contract
  observation: >
    The Map command group (start, validate, ingest, record, lane, tools, migrate-run, enumerate,
    project, toolchain, the three executing instruments, repo-census, variance, score, backlog,
    roster) is agent-consumable: its read commands print documented JSON (`lane --list --json`,
    `project --json`, `toolchain --json`, `variance --json`, `tools check --json`, `validate --json`),
    its write commands land typed files in the run, and every command's contract is a non-zero exit
    with a reason, never an empty success; `roster` is the one Map command with no machine output flag.
  evidence:
    - assay.mjs:19-38
    - CONSUMERS.md:22
    - CONSUMERS.md:26-27
    - CONSUMERS.md:32
    - CONSUMERS.md:37-38
    - map/validate.mjs:734-739
    - map/roster.mjs:37
  confidence: confirmed

- id: F-702
