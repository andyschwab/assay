- id: F-723
  dimension: multiplayer
  polarity: fact
  subject_type: artifact
  observation: >
    The shared substrate is the run directory, which lives with its subject (inside the evaluated
    repository or a separate collection), plus the uploaded workflow artifacts of a consumer's routine
    (the run kept 90 days, the inter-job reports 1 day); assay holds no shared store or index across
    runs beyond what a consumer collects.
  evidence:
    - map/SCHEMA.md:277-283
    - map/SCHEMA.md:326
    - routine/assay-routine.yml:78-82
    - routine/assay-routine.yml:184-188
  confidence: confirmed

- id: F-724
  dimension: multiplayer
  polarity: strength
  subject_type: process
  observation: >
    The issue tracker is used as a shared queue without duplication: the weekly tools check reads
    `tools check --json`, searches for its one open issue by title, opens it only when none exists and
    comments only when the list changed.
  evidence:
    - .github/workflows/tools-check.yml:27-35
  confidence: confirmed

- id: F-725
  dimension: multiplayer
  polarity: gap
