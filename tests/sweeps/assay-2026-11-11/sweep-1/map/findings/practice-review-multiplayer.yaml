- id: F-719
  dimension: multiplayer
  polarity: strength
  subject_type: control
  observation: >
    The run record (`map/scanners.yaml`) has one read-modify-write path shared by `record` and `ingest`,
    held under an exclusively created lock file so two writers (another agent's included) never
    interleave, waiting up to 30 seconds and then failing loud naming the lock, never writing unlocked.
  evidence:
    - map/record.mjs:5-10
    - map/record.mjs:146-170
    - map/ingest.mjs:1278
  confidence: confirmed

- id: F-720
  dimension: multiplayer
  polarity: gap
  subject_type: control
  observation: >
    The lock covers only the run record: `ingest` writes the scanner's findings file before taking it,
    `compile` removes and rewrites `handoff/` with no lock, and a writer that crashes holding the lock
    leaves it for a person to delete by hand, so two writers on one run directory are serialised only
    for the scanners.yaml row.
  evidence:
    - map/ingest.mjs:1254
    - map/ingest.mjs:1278
    - views/improve/handoff.mjs:602-604
    - map/record.mjs:150-151
  confidence: plausible

