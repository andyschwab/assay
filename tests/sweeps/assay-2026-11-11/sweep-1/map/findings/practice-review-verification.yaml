- id: F-417
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    Only the opengrep adapter declares a positive control; gitleaks, osv-scanner, checkov and
    zizmor read zero results as clean on a success exit alone, with nothing showing the tool
    could have found a planted hit.
  evidence:
