    - "map/scanners/adapters/gitleaks.yaml:55"
    - "map/scanners/adapters/osv-scanner.yaml:39-40"
    - "map/scanners/adapters/checkov.yaml:44"
    - "map/scanners/adapters/zizmor.yaml:43"
