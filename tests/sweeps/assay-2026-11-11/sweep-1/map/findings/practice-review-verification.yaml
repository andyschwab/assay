- id: F-421
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    Repeatability is measured, not assumed: committed blind sweep sets are gated at their own
    fact-presence and descriptor-agreement thresholds, each sweep must validate, a set with no
    threshold exits 2, and the fixture set is driven one point above its measure to prove the
    gate goes red.
  evidence:
    - "tests/blocks/sweep-gate.mjs:22-30"
    - "tests/blocks/sweep-gate.mjs:32-53"
    - "map/variance.mjs:249-264"
    - "map/variance.mjs:270-276"
  confidence: confirmed
- id: F-422
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    A sweep set must name its method_commit, but nothing compares it with the current method, so
    a change to METHOD.md or SCHEMA.md leaves the committed sets gating old sweeps green; re-running
    the set is an instruction in METHOD.md, not a check.
  evidence:
    - "map/variance.mjs:254"
    - "tests/blocks/sweep-gate.mjs:22-30"
    - "map/METHOD.md:768-770"
  confidence: confirmed
- id: F-423
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    Known-answer fixtures pin recall, mis-homing and false positives by exact equality with
    golden.json, and the scorer counts an item missed only when a method able to find it is
    recorded as ran, so drift in either direction fails the harness.
  evidence:
    - "tests/blocks/fixture-recall.mjs:14-28"
    - "tests/harness.mjs:151"
    - "map/score.mjs:15-21"
  confidence: confirmed
- id: F-424
  dimension: verification
  polarity: fact
  subject_type: control
  observation: >
    The scored fixtures grade committed, frozen runs, so the recall floor tests the projection and
    scorer over fixed output rather than a fresh draw of the method, which METHOD.md says proves
    the pipeline, not blind determinism.
  evidence:
    - "tests/blocks/fixture-recall.mjs:11-18"
    - "map/METHOD.md:765-768"
  confidence: confirmed
- id: F-425
  dimension: verification
  polarity: fact
