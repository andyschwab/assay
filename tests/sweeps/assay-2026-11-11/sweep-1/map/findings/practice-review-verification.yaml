# practice-review pass 4 — verification affordances (blind; assay at 4b81665)
# Census effect-provability (subject_type control): one finding per terrain §6 channel, F-401..F-415.
- id: F-401
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    fresh-clone-exec does not take a test step's exit 0 as the suite having run: it parses the
    runner's own pass/skip/fail counts, and ingest turns a passing step with skipped tests into
    a gap stating the skipped share, while an undeclared step is never recorded as passed.
  evidence:
    - "map/fresh-clone.mjs:17-21"
    - "map/fresh-clone.mjs:318-320"
    - "map/ingest.mjs:162-178"
  confidence: confirmed
- id: F-402
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    dependency-scan-audit counts an audit only when the exit is 0 or 1 and the report carries
    npm's vulnerabilities and metadata shape, so an error document or unreachable registry
    reads failed rather than zero advisories, and zero lockfiles audited never reads clean.
  evidence:
    - "map/dependency-scan.mjs:39-51"
    - "map/dependency-scan.mjs:281"
    - "map/dependency-scan.mjs:297"
  confidence: confirmed
- id: F-403
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    structure-scan-tools reads jscpd as failed when it exits 0 but writes no readable report,
    no duplicates list or no statistics totals, so a crashed or silent tool never reads as
    zero findings.
  evidence:
    - "map/structure-scan.mjs:38-41"
    - "map/structure-scan.mjs:133-139"
  confidence: confirmed
- id: F-404
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    tools-install checks its effect, not curl's exit: each pinned download is hashed against
    the adapter's sha256 before install, and the shared action then runs tools verify, which
    asks every bin its version and refuses one absent, broken or at another version (the PyPI
    path is version-pinned only, with no hash in its stamp).
  evidence:
    - "map/tools.mjs:126-127"
    - "map/tools.mjs:116-118"
    - "map/tools.mjs:149-157"
    - ".github/actions/tools/action.yml:29-30"
  confidence: confirmed
- id: F-405
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    instrument-run records an instrument as ran only when its exit is in the adapter's success
    set and its raw report then ingests, so a tool that exits cleanly with an unreadable report
    is recorded failed with the reason.
  evidence:
    - "map/start.mjs:100-114"
    - "map/start.mjs:266-271"
  confidence: confirmed
- id: F-406
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    run-start validates the run directory it just wrote and takes its exit from that validation,
    so the written scanners.yaml and findings are re-read rather than reported written.
  evidence:
    - "map/start.mjs:469-473"
    - "map/start.mjs:489"
  confidence: confirmed
- id: F-407
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    run-ingest halts on a report whose shape is wrong (a truncated report included) before
    writing, and validate later fails any scanner recorded ran with no rows and no explicit
    empty file, so the ingest's effect is checked from the base, not from its own success line.
  evidence:
    - "map/ingest.mjs:166"
    - "map/ingest.mjs:1244-1245"
    - "map/validate.mjs:305-307"
  confidence: confirmed
- id: F-408
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    run-record cannot make a claim of running stick on its own: a row recorded ran with no rows
    from that scanner fails validate, and a skipped or failed row without a reason is refused at
    the command.
  evidence:
    - "map/record.mjs:211-213"
    - "map/validate.mjs:305-307"
    - "map/validate.mjs:249-250"
  confidence: confirmed
- id: F-409
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    run-migrate is a dry run by default and writes a rewritten flow list only after it reads back
    under the strict reader to exactly what the legacy rule read and the whole file parses; the
    retired-id rename step writes and renames with no read-back of its own.
  evidence:
    - "map/migrate-run.mjs:18-21"
    - "map/migrate-run.mjs:85-92"
    - "map/migrate-run.mjs:100-104"
  confidence: confirmed
- id: F-410
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    run-compile runs validate before writing any view, and the generated sidecars it writes
    (maturity grades, yardstick.yaml) are recomputed from the base on the next validate and fail
    it on drift.
  evidence:
    - "views/compile.mjs:68-75"
    - "map/validate.mjs:585-602"
    - "map/validate.mjs:691-706"
  confidence: confirmed
- id: F-411
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    routine-run validates the run it drew before compiling and writes routine.yaml with the gate
    outcome on every return path, though a failure to write that record is only a printed
    warning and leaves the exit code unchanged.
  evidence:
    - "routine/run.mjs:190-201"
    - "routine/run.mjs:238-243"
  confidence: confirmed
- id: F-412
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    tools-check-issue trusts gh's exit code for the issue it opens or comments on and never reads
    the issue back; the next weekly run reads the last body only to avoid repeating itself.
  evidence:
    - ".github/workflows/tools-check.yml:32-35"
  confidence: confirmed
- id: F-413
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    release-publish gates heavily before the effect (version shape, existing tag, npm test, the
    trailer check) but takes gh release create's exit as the release existing, with no read-back
    of the tag or release afterwards.
  evidence:
    - ".github/workflows/release.yml:33-38"
    - ".github/workflows/release.yml:41-43"
    - ".github/workflows/release.yml:44-50"
  confidence: confirmed
- id: F-414
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    branch-delete re-reads each branch's tip before deleting (a precondition), but prints deleted
    and counts it from the DELETE call's exit alone, with no read after the call that the ref is
    gone.
  evidence:
    - ".github/workflows/branch-cleanup.yml:127-134"
  confidence: confirmed
- id: F-415
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    routine-artifact-upload sets no if-no-files-found on either upload, so a missing run directory
    is not refused by the step; the one-day handoff is checked downstream (a missing handoff is
    recorded failed by the gate) but the 90-day run upload has no check of its own.
  evidence:
    - "routine/assay-routine.yml:77-82"
    - "routine/assay-routine.yml:181-188"
    - "map/start.mjs:388-395"
  confidence: plausible
# ── probes: effects-vs-reports, decay condition, calibration harness ──
- id: F-416
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
