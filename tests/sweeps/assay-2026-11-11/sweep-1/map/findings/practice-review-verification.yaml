- id: F-418
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    Where a positive control exists it is fail-closed: the tool runs first over planted cases in a
    scratch copy outside any repository, and unless every planted hit is reported the instrument
    is recorded failed and the target is not run.
  evidence:
    - "map/start.mjs:191-213"
    - "map/start.mjs:252-258"
  confidence: confirmed
- id: F-419
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    validate --target checks every cited evidence path exists in the target and every cited line
