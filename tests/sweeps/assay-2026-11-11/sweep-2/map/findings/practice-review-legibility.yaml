# practice-review pass 1: artifact legibility (census-augmented: decision-reconstruction, 10 items)
- id: F-101
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  label: "decision: zero-dependency YAML reader"
  observation: >
    The zero-dependency YAML reader's rationale is written down: SCHEMA.md says the validator is zero-dependency so it copies into any target repo beside METHOD.md, and the reader's own header says it throws on unparsed constructs because a checker that silently accepts unparseable input hides what it exists to catch.
  evidence: ["map/SCHEMA.md:892-893", "lib/yaml-min.mjs:1-6", "lib/yaml-min.mjs:36-39"]
  confidence: confirmed
- id: F-102
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  label: "decision: ids carry no dimension"
  observation: >
    SCHEMA.md section 3 states why finding ids encode no dimension (a fixed per-dimension range is a budget a dense repo overflows, it would duplicate the dimension field, and ids are renumbered across runs anyway) and names the validator check that replaces it.
  evidence: ["map/SCHEMA.md:217-232"]
  confidence: confirmed
- id: F-103
