# Pass 3 — deterministic gates (practice-review), target assay at 4b81665.
# Census gates-coverage: one finding per ci.yml pull_request step (F-301..F-305).
- id: F-301
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  label: "CI lint step"
  observation: >
    The CI lint step runs `node lib/check-syntax.mjs` on every pull request, which runs `node --check` over every tracked engine module (tests/blocks included, fixture targets skipped), refuses an empty file list, and exits 1 naming each module that does not parse.
  evidence: [".github/workflows/ci.yml:31", "package.json:10", "lib/check-syntax.mjs:11-15"]
  confidence: confirmed
- id: F-302
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  label: "CI typecheck step"
  observation: >
    The CI typecheck step runs `tsc -p tsconfig.json` with allowJs and checkJs over the root, lib, map, owner, routine, views and yardstick modules, and no engine module opts out with a @ts-nocheck directive.
  evidence: [".github/workflows/ci.yml:32", "package.json:11", "tsconfig.json:3-5", "tsconfig.json:12"]
  confidence: confirmed
- id: F-303
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  label: "CI build step duplicates lint"
  observation: >
    The CI build step runs the same script as the lint step (`node lib/check-syntax.mjs`), so it re-runs the parse check and can catch no regression the lint step has not already caught.
  evidence: [".github/workflows/ci.yml:31-33", "package.json:10", "package.json:12", "lib/check-syntax.mjs:1-2"]
  confidence: confirmed
- id: F-304
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  label: "CI tools install and verify step"
  observation: >
    The CI tools step runs the composite action under `set -euo pipefail`, which installs every pinned tool (a fetched binary is refused on a sha256 mismatch), exits 1 on any failed or unsupported install, then verifies each tool answers at its pin and exits 1 otherwise, before `npm test` runs.
  evidence: [".github/workflows/ci.yml:38", ".github/actions/tools/action.yml:26-31", "map/tools.mjs:126-127", "map/tools.mjs:236-240", "map/tools.mjs:244"]
  confidence: confirmed
- id: F-305
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  label: "CI npm test step"
  observation: >
    The CI test step runs `node tests/regression.mjs`, which exits non-zero on any unit or negative failure, any block that does not load or throws, any drift from tests/golden.json, or a missing golden.json.
  evidence: [".github/workflows/ci.yml:39", "package.json:9", "tests/regression.mjs:28-44", "tests/harness.mjs:141", "tests/harness.mjs:152-163", "tests/README.md:3-5"]
  confidence: confirmed
