# ── controls and probes ────────────────────────────────────────────────────
- id: F-425
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "the child environment allow-list"
  observation: >
    Every child an instrument spawns over a target gets an environment built from an
    allow-list (PATH, HOME, CI, proxy/CA plumbing, the runner's npm_config_* values) that
    refuses any other name the caller tries to set, and a harness block pins it with a
    planted token.
  evidence: ["map/child-env.mjs:1-10", "map/child-env.mjs:27-39", "map/start.mjs:264-266", "tests/blocks/isolation.mjs:1-12"]
  confidence: confirmed

- id: F-426
  dimension: delegation
  polarity: gap
  subject_type: control
  label: "HOME reaches the target's scripts"
  observation: >
    HOME is on the child allow-list and the target's scripts run as the evaluator's user, so
    file-held credentials under HOME stay readable to them, while README.md says each child
    sees "never the evaluator's environment or credentials" before conceding it is not a
    sandbox.
  evidence: ["map/child-env.mjs:10", "README.md:92-97", "map/scanners/CONTRACT.md:195-197"]
  confidence: confirmed

- id: F-427
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "start's two refusals"
