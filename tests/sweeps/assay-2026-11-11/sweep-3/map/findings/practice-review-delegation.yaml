# ── credential census (9: GITHUB_TOKEN in tools.mjs; the job token per workflow job that
#    holds one; FETCH_TOKEN; ASSAY_READ_TOKEN; proxy userinfo) ─────────────────
- id: F-411
  dimension: delegation
  polarity: gap
  subject_type: control
  label: "GITHUB_TOKEN in tools check"
  observation: >
    map/tools.mjs takes whatever GITHUB_TOKEN the process holds and puts it in curl's argv
    as a bearer header for a release read of a public repository, and in tools-check.yml that
    token is the job's issues-write token.
  evidence: ["map/tools.mjs:201-203", ".github/workflows/tools-check.yml:17-20"]
  confidence: confirmed

- id: F-412
  dimension: delegation
  polarity: gap
  subject_type: control
  label: "ci.yml job token"
  observation: >
    ci.yml's checkout leaves persist-credentials at its default, so the job token (contents:
    read) sits in .git/config while `npm ci` and `npm test` run, the one checkout across the
    four workflows that does not set it false.
  evidence: [".github/workflows/ci.yml:13-14", ".github/workflows/ci.yml:24-26", ".github/workflows/ci.yml:30", ".github/workflows/release.yml:26-29", ".github/workflows/tools-check.yml:22-23"]
  confidence: confirmed

- id: F-413
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "tools-check job token"
  observation: >
    tools-check's token is granted issues write in its one job only (the workflow default is
    contents read), its checkout does not persist it, and the job runs only assay's own
    `tools check` and the gh CLI.
  evidence: [".github/workflows/tools-check.yml:11", ".github/workflows/tools-check.yml:17-23", ".github/workflows/tools-check.yml:27-35"]
  confidence: confirmed

- id: F-414
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "branch-cleanup plan token"
  observation: >
    The branch-cleanup plan job holds a contents-read, pull-requests-read token, has no
    checkout and runs no code of the branches, only gh REST reads.
  evidence: [".github/workflows/branch-cleanup.yml:31-33", ".github/workflows/branch-cleanup.yml:50", ".github/workflows/branch-cleanup.yml:59-61"]
  confidence: confirmed

- id: F-415
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "branch-cleanup delete token"
  observation: >
    contents write is granted only to the delete job, which runs only when the plan says
    dry_run is off and names branches, and which checks out nothing.
  evidence: [".github/workflows/branch-cleanup.yml:106-112", ".github/workflows/branch-cleanup.yml:121-125"]
  confidence: confirmed

- id: F-416
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "release job token"
  observation: >
    release.yml grants contents write to its one person-dispatched job, keeps it out of
    .git/config, and puts GH_TOKEN only in the final tag-and-publish step's environment, after
    `npm ci`, the tools action and `npm test` have run without it.
  evidence: [".github/workflows/release.yml:17", ".github/workflows/release.yml:24-29", ".github/workflows/release.yml:39-41", ".github/workflows/release.yml:44-45"]
  confidence: confirmed

- id: F-417
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "FETCH_TOKEN in the routine"
  observation: >
    The routine template hands its contents-read job token to one `git fetch` of the base
    branch through that step's environment (an extraheader via GIT_CONFIG_*), never
    .git/config, in the gate job that never executes the change.
  evidence: ["routine/assay-routine.yml:97-115", "routine/assay-routine.yml:32-33"]
  confidence: confirmed

- id: F-418
  dimension: delegation
  polarity: gap
  subject_type: control
  label: "ASSAY_READ_TOKEN"
  observation: >
    When a steward uncomments it, ASSAY_READ_TOKEN is handed to the assay checkout in the
    target job as well, the job that runs the change's own install and tests, and the
    template asks only for "a secret that can read it", naming no narrower scope.
  evidence: ["routine/assay-routine.yml:8-10", "routine/assay-routine.yml:58-65", "routine/assay-routine.yml:72-75", "routine/README.md:213-218"]
  confidence: plausible

- id: F-419
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "proxy userinfo"
  observation: >
    A proxy URL carrying userinfo is withheld from every instrument child (any '@' in the
    authority fails closed) and the step or lockfile row says which variable was dropped and
    why.
  evidence: ["map/child-env.mjs:12-25", "map/child-env.mjs:31-32", "map/fresh-clone.mjs:312-313", "map/dependency-scan.mjs:422-423"]
  confidence: confirmed

