# ── effects (one per channel in terrain.md's inventory) ─────────────────────
- id: F-401
  dimension: delegation
  polarity: fact
  subject_type: effect
  label: "the run directory"
  observation: >
    The map, ingest, record and view commands write only the local run directory; `start`
    refuses to redraw a run whose map/scanners.yaml exists, while the handoff compiler
    deletes and rewrites handoff/ on every compile.
  evidence: ["map/start.mjs:436-439", "map/start.mjs:469", "map/ingest.mjs:1251-1255", "views/improve/handoff.mjs:604-607"]
  confidence: confirmed
  effect:
    channel: run-dir-write
    reversibility: reversible
    external: false
    gate_type: none
    telemetry: structured-event
    blast_scope: user

- id: F-402
  dimension: delegation
  polarity: gap
  subject_type: effect
  label: "the pinned scanners over a target"
  observation: >
    `start` (and the routine's gate job) runs each adopted adapter's pinned binary over the
    target with the allow-listed child environment, and osv-scanner's args carry no offline
    flag, so the tree's package inventory goes to the OSV service, as the adapter's own
    comment says, with no step that holds it.
  evidence: ["map/start.mjs:264-266", "map/scanners/adapters/osv-scanner.yaml:27-38", "map/start.mjs:357"]
  confidence: plausible
  effect:
    channel: instrument-run
    reversibility: irreversible
    external: true
    gate_type: none
    telemetry: structured-event
    blast_scope: tenant
  preconditions: [insider]

- id: F-403
  dimension: delegation
  polarity: fact
  subject_type: effect
  label: "the target's own install and scripts"
  observation: >
    fresh-clone runs the target's install, lifecycle scripts, build, lint, typecheck, test
    and migrate-dry through a shell as the evaluator's user, and `start` runs it only when a
    person passes --allow-exec (else the run record says skipped and why), while the routine
    runs it in a token-less job of its own.
  evidence: ["map/fresh-clone.mjs:308-310", "map/start.mjs:459", "map/start.mjs:410", "map/scanners/CONTRACT.md:195-201", "routine/assay-routine.yml:48-56"]
  confidence: confirmed
  effect:
    channel: fresh-clone-exec
    reversibility: irreversible
    external: true
    gate_type: initiated-by-person
    fail_mode: closed
    telemetry: structured-event
    blast_scope: user
  preconditions: [malicious-dependency]
  escapes: [F-425]

- id: F-404
  dimension: delegation
  polarity: gap
  subject_type: effect
  label: "lockfile audit against the live registry"
  observation: >
    dependency-scan runs `npm|pnpm|yarn audit --json` from a scratch copy of each lockfile
    against the live registry on every `start` with a target and every routine run, without
    --allow-exec or any other stop, so each lockfile's dependency list leaves the machine.
  evidence: ["map/dependency-scan.mjs:24-31", "map/dependency-scan.mjs:274-278", "map/dependency-scan.mjs:398", "README.md:141-145"]
  confidence: confirmed
  effect:
    channel: dependency-audit
    reversibility: irreversible
    external: true
    gate_type: none
    telemetry: structured-event
    blast_scope: tenant
  preconditions: [insider]

- id: F-405
  dimension: delegation
  polarity: gap
  subject_type: effect
  label: "knip loading the target's configs"
  observation: >
    structure-scan npm-installs jscpd and knip into scratch and runs knip, which imports the
    target's tool configs (and first installs the target's dependencies into a full-tree
    copy), and while `start` passes --no-exec unless given --allow-exec, the
    `structure-scan` command itself executes unless a person adds --no-exec.
  evidence: ["map/structure-scan.mjs:21-27", "map/structure-scan.mjs:181-192", "map/structure-scan.mjs:413-414", "map/structure-scan.mjs:468", "map/start.mjs:355"]
  confidence: confirmed
  effect:
    channel: structure-scan-exec
    reversibility: irreversible
    external: true
    gate_type: initiated-by-person
    fail_mode: open
    telemetry: structured-event
    blast_scope: user
  preconditions: [malicious-dependency]
  escapes: [F-425]

