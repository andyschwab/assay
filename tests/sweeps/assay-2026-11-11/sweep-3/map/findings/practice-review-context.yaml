# practice-review — Pass 2, context-economy (assay at 4b81665)
# Census modules-standalone: F-101..F-109 (one per bounded context, subject_type artifact).
# Census doc-freshness (secondary): F-117..F-122.
# Spend side: F-123..F-128.

- id: F-101
  dimension: context-economy
  polarity: gap
  subject_type: artifact
  label: "map/ has no entry doc"
  observation: >
    map/ (25 modules beside METHOD.md and SCHEMA.md) has no directory entry doc that routes
    among its modules: the README gives it one line, and the nearest router, assay.mjs's
    command table, names only four of its seven library modules (doctrine, child-env and
    projects are unnamed), though every module opens with a header comment stating its role.
  evidence: ["README.md:237", "assay.mjs:15-17", "assay.mjs:19-38", "map/doctrine.mjs:1-6", "map/child-env.mjs:1-6", "map/projects.mjs:1-6"]
  confidence: confirmed
  explained_by: [F-112]

- id: F-102
  dimension: context-economy
  polarity: strength
  subject_type: artifact
  label: "map/scanners/ loads standalone"
  observation: >
    map/scanners/ has an entry contract that states its scope and routes to its sibling pages
    (CANDIDATES.md for the roster, INTAKE.md for adoption), and its boundary is a written rule
    held by a named harness block: the core names no external scanner, everything about one is
    a field of its adapter.
  evidence: ["map/scanners/CONTRACT.md:5-14", "map/scanners/INTAKE.md:1-10", "CLAUDE.md:33-41"]
  confidence: confirmed

