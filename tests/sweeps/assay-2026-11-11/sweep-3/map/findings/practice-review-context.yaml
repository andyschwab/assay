- id: F-123
  dimension: context-economy
  polarity: strength
  subject_type: control
  label: "model and spend on the run record, per pass"
  observation: >
    The run record carries the model id and inference spend of a judgment scanner on its row and,
    for practice-review, per pass, plus a duration on any row; `record` writes them, validate
    rejects a malformed value and warns when a judgment scanner ran with no model.
  evidence: ["map/record.mjs:12-26", "map/SCHEMA.md:393-396", "map/SCHEMA.md:427-436", "map/validate.mjs:251-255", "map/validate.mjs:296-303"]
  confidence: confirmed

- id: F-124
  dimension: context-economy
  polarity: strength
  subject_type: control
  label: "agreement measured per model pair"
  observation: >
    variance resolves each sweep's model of record per dimension (the pass's model, else the row's)
    and reports fact agreement per model pair, so a model change reads as its own row rather than
    blended into the whole.
  evidence: ["map/variance.mjs:96-101", "map/variance.mjs:134-147"]
  confidence: confirmed

- id: F-125
  dimension: context-economy
  polarity: strength
  subject_type: control
  label: "cost joined per scanner"
  observation: >
    roster joins, per scanner (the engine's work class), the duration and spend each run recorded
    on its row beside what it alone decides and corroborates, and prints "not recorded" or "not
    measured" rather than zero when there is none.
  evidence: ["map/roster.mjs:4-6", "map/roster.mjs:29-35", "map/roster.mjs:87-88", "map/roster.mjs:106-107", "map/scanners/INTAKE.md:87-88"]
  confidence: confirmed

- id: F-126
  dimension: context-economy
  polarity: gap
  subject_type: control
  label: "missing spend is silent"
  observation: >
    A judgment scanner that ran with no spend recorded passes validate without a warning (only a
    missing model warns), and the practice-review lane asks the session to report the model and
    wall clock per pass but not its spend.
  evidence: ["map/validate.mjs:253-254", "map/validate.mjs:296-303", "map/scanners/adapters/practice-review/lane.md:24", "map/scanners/adapters/practice-review/lane.md:26"]
  confidence: confirmed

- id: F-127
  dimension: context-economy
  polarity: gap
  subject_type: process
  label: "no model-tier rationale"
  observation: >
    assay records which model ran but never which model should run or why: a lane names no model
    and leaves it to the consumer, and neither the lane contract nor the practice-review lane holds
    a tier choice or its rationale.
  evidence: ["map/lane.mjs:10-11", "map/scanners/CONTRACT.md:930-931", "map/scanners/adapters/practice-review/lane.md:1-9"]
  confidence: confirmed

- id: F-128
  dimension: context-economy
  polarity: gap
  subject_type: process
  label: "no re-qualification when models ship"
  observation: >
    Nothing re-measures the method when a new model ships: tool pins get a weekly upstream check,
    but no workflow or rule ties a model release to a variance sweep, though assay's own yardstick
    asks a target for a dated qualification record per model with a named re-qualification trigger.
  evidence: [".github/workflows/tools-check.yml:1-5", "yardstick/requirements.yaml:819-831", "map/variance.mjs:48-52"]
  confidence: confirmed
  explained_by: [F-127]
