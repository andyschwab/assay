- id: F-219
  dimension: deterministic-gates
  polarity: strength
  subject_type: control
  label: "golden pin and bless guard"
  observation: >
    Recall on three known-answer fixtures and the instrument roster are pinned in golden.json and compared field by field, and --bless refuses to rewrite golden.json while any unit or negative invariant is red, a refusal itself pinned by a block.
  evidence: ["tests/golden.json:1-30", "tests/harness.mjs:131-153", "tests/blocks/bless-guard.mjs:12-22", "tests/blocks/fixture-recall.mjs:14-31"]
