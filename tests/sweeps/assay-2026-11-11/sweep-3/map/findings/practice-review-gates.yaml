- id: F-224
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  label: "validate exit reflects verdict"
  observation: >
    map/validate.mjs exits non-zero on any violation even in JSON mode, and refuses a legacy-format run, so a caller that checks only the exit code never reads green over a red base.
