- id: F-220
  dimension: deterministic-gates
  polarity: strength
  subject_type: control
  label: "CI file is itself gated"
  observation: >
    A harness block fails if ci.yml loses SHA pins, its contents:read-only permission, a job timeout, the engines-floor Node version, or any of the lint, typecheck, build and test steps, so weakening the gate set is caught by the gate set.
  evidence: ["tests/blocks/ci-workflow.mjs:13-58"]
  confidence: confirmed
- id: F-221
  dimension: deterministic-gates
  polarity: gap
  subject_type: process
  label: "no pre-commit gate"
  observation: >
    No pre-commit or pre-push hook is configured (package.json declares none and the root holds no hook directory), so the earliest automatic catch of a regression is CI on the pull request; running npm test before opening one is a documented expectation only.
  evidence: ["package.json:8-16", "CONTRIBUTING.md:4-5"]
