  dimension: deterministic-gates
  polarity: gap
  subject_type: process
  label: "red-then-green by convention"
  observation: >
    The rule that a new assertion is confirmed red with its rule reverted before it is trusted is enforced only by the pull request body and commit message saying so; no mechanism runs mutations or checks the claim.
  evidence: ["CLAUDE.md:60-64", ".github/PULL_REQUEST_TEMPLATE.md:7-9", "CONTRIBUTING.md:6-8"]
