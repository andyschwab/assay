- id: F-222
  dimension: deterministic-gates
  polarity: fact
  subject_type: process
  label: "required check not visible"
  observation: >
    Whether the ci test job is a required status check on main is set in repository settings and cannot be seen from files; the docs ask for npm test to be green but name no branch protection or required check.
  evidence: [".github/workflows/ci.yml:8-11", ".github/PULL_REQUEST_TEMPLATE.md:7-11", "CONTRIBUTING.md:4-5"]
