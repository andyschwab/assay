- id: F-217
  dimension: deterministic-gates
  polarity: gap
  subject_type: control
  label: "no rule-to-fixture meta-check"
  observation: >
    No block compares the validator's err() sites (167 in map/validate.mjs) against the negative fixtures, so the "one fixture per validator rule" property is maintained by convention, not checked.
  evidence: ["tests/blocks/negative-fixtures.mjs:41-43", "map/validate.mjs:67"]
