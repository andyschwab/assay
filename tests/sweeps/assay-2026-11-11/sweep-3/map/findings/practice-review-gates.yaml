- id: F-223
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  label: "typecheck has little to check"
  observation: >
    The central modules carry no JSDoc type annotations (none in map/validate.mjs or lib/yaml-min.mjs; 18 of 54 engine modules have any), so the non-strict checkJs typecheck verifies only what tsc infers.
  evidence: ["map/validate.mjs:109", "lib/yaml-min.mjs:7-12", "tsconfig.json:2-10"]
