  reaches: [F-216]
- id: F-218
  dimension: deterministic-gates
  polarity: strength
  subject_type: control
  label: "yaml-min pinned fail-closed"
  observation: >
    The strict reader lib/yaml-min.mjs is pinned by two blocks that require it to throw on duplicate keys, __proto__, unclosed or nested flow lists, flow maps and anchors, require q() to round-trip, and require the shared loader and variance to halt on an unparseable file.
  evidence: ["tests/blocks/yaml-strict.mjs:16-38", "tests/blocks/fail-closed.mjs:11-24", "lib/yaml-min.mjs:1-7"]
