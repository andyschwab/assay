# ── consent semantics ────────────────────────────────────────────────────────
- id: F-645
  dimension: multiplayer
  polarity: strength
  subject_type: process
  observation: >
    Owner sharing is a conscious act: the prompt tells the owner the block becomes the packet kept in the app's code and shown on the team's intake page, the owner copies the block back by hand, and secrets and names are refused both in the prompt and by the validator.
  evidence: ["owner/ask-owner.md:13-17", "owner/ask-owner.md:24-27", "owner/ask-owner.md:39-45", "owner/PACKET.md:41-53"]
  confidence: confirmed

- id: F-646
  dimension: multiplayer
  polarity: strength
  subject_type: process
  observation: >
