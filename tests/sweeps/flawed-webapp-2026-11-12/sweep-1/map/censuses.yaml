# map/censuses.yaml (authored) — flawed-webapp practice review
schema: censuses
version: 1
dimensions:
  - dimension: artifact-legibility
    depth: >
      The best instance is a real decision record: ADR-0001 carries context, decision, consequences and the road not taken for the storage choice (F-001), and several risky choices state their reasons in place (F-002, F-003); but half the drawn decisions carry no rationale (F-005, F-007, F-008) and the README's test command and coverage claims are false (F-017, F-018).
    sampled:
      - name: decision-reconstruction
        what: "non-obvious decisions whose rationale reconstructs from the files alone"
        members: [F-001, F-002, F-003, F-004, F-005, F-006, F-007, F-008, F-009, F-010]
        method: "the terrain froze no decision list, so this pass drew every non-obvious choice from all 12 files before assessing (storage, default-admin fallback, fire-and-forget sync, hardcoded key, unauthorized /sync, purge route, email body scope, prompt scope, swallowed parse errors, note id scheme), one finding each"
        primary: true
      - name: doc-freshness
        what: "concrete doc claims (README, ADR, and code-comment claims of a command, count, path, endpoint or capability) that hold against the code"
        members: [F-011, F-012, F-013, F-014, F-015, F-016, F-017, F-018, F-019, F-020, F-021, F-022, F-023, F-024, F-025, F-026, F-027]
        method: "every concrete claim in README.md from line 12, in docs/adr/0001-storage-choice.md, and in module-header comments, replayed against the code by reading (nothing run); README lines 7-10 and fixture-note comments excluded"
  - dimension: context-economy
    depth: >
      The best module, lib/auth.mjs, loads alone with a header to read and a smoke test to run (F-103), and server.mjs maps each route to one module (F-112), but the store's raw Map leaks into three callers (F-104) and no other module has anything to run (F-101, F-102, F-105, F-106, F-107, F-108).
    sampled:
      - name: modules-standalone
        what: "each source module an agent loads to change one concern can be loaded alone, with something to read and something to run"
        members: [F-101, F-102, F-103, F-104, F-105, F-106, F-107, F-108]
        method: "every non-test source file in the terrain's directory topology (server.mjs, lib/agent, lib/auth, lib/db, lib/mailer, lib/sync, routes/admin, config/settings), one finding each"
        primary: true
      - name: model-call-telemetry
        what: "every model call site emits a structured record of tier, spend and outcome"
        members: [F-109]
        method: "populations.modelCalls is empty; the one call site, the stub lib/agent.mjs callModel named by the terrain, judged at its call site"
  - dimension: deterministic-gates
    depth: >
      There is no best instance to grade: no CI step, hook, config-driven check or check-named package script exists for a change to pass through (F-201), so the change-gates census has no members and is not sampled (enumerate's populations.changeGates is empty and a read of all 12 target files found none; the absence is recorded as F-201, which is about the missing gates rather than a gate a change passes through); the nearest thing to a gate, the hand-run smoke test, cannot go red on the auth path it touches (F-203), and the HTTP interface swallows malformed input silently (F-204).
  - dimension: verification
    depth: >
      Verification is nominal: every outbound effect reports success without confirming it (F-301, F-302, F-303), no change states its verification (F-305), and the AI feature has no eval or output check (F-306, F-307), though the server is importable for in-process tests (F-309).
  - dimension: delegation
    depth: >
      The best instance is narrow: member reads are scoped to their owner (F-407) and request bodies are kept as JSON data (F-413), but every halt-class effect is ungated or behind a gate that fails open (F-401, F-402, F-403) and the assistant holds the full trifecta reaching an ungated send (F-405).
    sampled:
      - name: credential
        what: "every credential the app reads or declares: the hardcoded backup key and the hardcoded session-token table (populations.secrets empty)"
        members: [F-411, F-412]
        method: "enumerate.json secrets listed none; the terrain named the two hardcoded credentials outside the list; one finding each, judged on whether its reach is traced in code"
        primary: true
      - name: ingested-content
        what: "every point where outside text enters: request bodies, note text into the prompt, the question into the prompt, model output parsed as a directive"
        members: [F-413, F-414, F-415, F-416]
        method: "the terrain's four ingestion points, read at each site; one finding each"
  - dimension: improvement-loop
    depth: >
      No loop to judge: the tree records no lesson, so the incidents-became-mechanisms census has an empty population and no sampled measure (F-501); outstanding work lives in a TODO and an ADR rather than issues (F-502, F-503), and the app measures neither its use nor its worth (F-504, F-505).
  - dimension: multiplayer
    depth: >
      The best instance is a plain HTTP JSON route named in the README that an agent can call with no body (F-601, F-604); beyond that, request and payload contracts live only in code (F-602, F-603, F-606), the purge route is undocumented (F-605), and the assistant pools every member's notes without their sharing them (F-607, F-610).
    sampled:
      - name: agent-access-surface
        what: "interfaces the application offers a caller reachable and usable by an agent through an API or format contract stated outside the code"
        members: [F-601, F-602, F-603, F-604, F-605, F-606]
        method: "every interface drawn from the terrain: the five routes in server.mjs plus the backup payload format the external service reads; one finding each"
        primary: true
