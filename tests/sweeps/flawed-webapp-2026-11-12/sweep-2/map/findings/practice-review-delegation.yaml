- id: F-500
  dimension: delegation
  polarity: gap
  subject_type: effect
  label: "backup push of every note"
  observation: >
    POST /sync, served with no authorization check, sends every note in the workspace to the
    external backup service under a bearer key, fire-and-forget with errors swallowed and no
    record written of the push.
  evidence: [server.mjs:48, server.mjs:49, lib/sync.mjs:6, lib/sync.mjs:8, lib/sync.mjs:10, lib/sync.mjs:12]
  confidence: confirmed
  preconditions: [network-position]   # any caller who reaches the HTTP listener; no credential is needed
  effect:
    channel: backup-push
    reversibility: irreversible
    external: true
    gate_type: none
    telemetry: none
    blast_scope: tenant
