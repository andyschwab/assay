# map/censuses.yaml (authored, SCHEMA.md §6b): one entry per dimension, censuses with members, and the claim rows' context lists.
dimensions:
  - dimension: artifact-legibility
    depth: >
      The best instance is ADR-0001, which states the storage decision, the deadline behind it
      and the rejected alternative, and whose claims still hold against the store (F-100, F-108,
      F-109); beyond it rationale lives only in inline comments, and the README's concrete claims
      mostly fail replay (F-110, F-114, F-115).
    sampled:
      - name: decision-reconstruction
        what: "every non-obvious decision D1-D8; bar: its why reconstructs from the repository's files alone"
        members: [F-100, F-101, F-102, F-103, F-104, F-105, F-106, F-107]
        method: "every decision D1-D8 the terrain froze, one finding each"
        primary: true
      - name: doc-freshness
        what: "every concrete doc claim in README.md and ADR-0001; bar: it holds when replayed against the code"
        members: [F-108, F-109, F-110, F-111, F-112, F-113, F-114, F-115]
        method: "every doc claim the terrain froze, ADR first then README, one finding each, replayed against the code (nothing run)"
        primary: false
  - dimension: context-economy
    depth: >
      The best instance is lib/auth.mjs (F-202), a commented module with one narrow dependency
      and a smoke test to run, though that test is unwired and shallow; every other module
      lacks anything to run, and lib/db.mjs leaks its mutable state to three callers (F-203).
      The model-call-telemetry census has no members: the only model call is the stub callModel
      (lib/agent.mjs:27), which calls no provider SDK or HTTP API, so its sampled entry is
      omitted.
    sampled:
      - name: modules-standalone
        what: "every module the terrain froze; bar: loads alone with something to read and something to run, changeable without loading the rest"
        members: [F-200, F-201, F-202, F-203, F-204, F-205, F-206, F-207]
        method: "the terrain's 8 modules (server.mjs, lib/agent, auth, db, mailer, sync, routes/admin, config/settings), one finding each"
        primary: true
  - dimension: deterministic-gates
    depth: >
      There is no best instance to grade: the change-gates census has no members (no CI job,
      hook, check script or lint/typecheck config, confirmed by listing the whole target,
      F-300), so it never reads met; the nearest thing to a gate is a one-assertion smoke test
      that nothing runs and that would miss a regression in the auth module (F-301), and the
      only interface that fails loudly is the router's 404 (F-303), while the request-body
      interface swallows bad input (F-302).
  - dimension: verification
    depth: >
      The best instance is the deterministic stub model, a reproducible fixture a change to the
      assistant could be shown against (F-403); against it, both outbound integrations report
      success without confirming the effect (F-400, F-401), the one test cannot fail (F-402), and
      nothing checks the assistant's output (F-404). This pass decides no census, so none is sampled.
  - dimension: delegation
    depth: >
      The best instance is the purge's role check (F-502), the one effect with any gate, and it
      fails open because every unauthenticated caller holds the admin role (F-504); the other halt-class
      effects (F-500, F-501) stand ungated and the assistant holds the full trifecta (F-505).
    sampled:
      - name: credential
        what: "every secret the app reads; is what it can reach traced in the code"
        members: [F-506]
        method: "populations.secrets was empty; the one secret the terrain added (the backup key literal read at lib/sync.mjs:10), one finding"
        primary: true
      - name: ingested-content
        what: "every ingestion point; is its text kept as data, verbatim with provenance, escaped, never acted on"
        members: [F-507, F-508]
        method: "every ingestion point the terrain froze (note text via POST /notes, the question via POST /assistant), one finding each; none missed on a full read"
  - dimension: improvement-loop
    depth: >
      There is no best instance: the tree records no lesson, so the incidents-became-mechanisms census
      is empty and omitted (F-600), outstanding work lives in a TODO comment and ADR prose rather than
      issues (F-601, F-602), and the app neither measures its own impact nor emits structured usage or
      outcome records (F-603, F-604).
  - dimension: multiplayer
    depth: >
      The best instance is a bodiless route stated in the README by method, path and purpose
      (GET /notes F-700, POST /sync F-703), callable by an agent without the code; no interface has
      a request or response schema stated outside the code (F-701, F-702), and the purge route is
      undocumented (F-704).
    sampled:
      - name: agent-access-surface
        what: "every interface the terrain froze (five HTTP routes); bar: an agent can reach and use it through an API or format contract stated outside the code"
        members: [F-700, F-701, F-702, F-703, F-704]
        method: "every route the terrain froze (server.mjs:30, 35, 42, 47, 52), one finding each; no screen, command, tool or read-by-others data format exists in the target, so no member was added"
        primary: true
context:
