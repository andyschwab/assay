- id: F-606
  dimension: multiplayer
  polarity: gap
  subject_type: artifact
  property: shared-context-substrate
  label: "one workspace, two scopes"
  observation: >
    The context store is one global, unscoped workspace (a single notes map with an owner per
    note and no workspace, team or room principal), and it is read under two different scopes:
    GET /notes filters to the caller's own notes while the assistant builds its prompt from every
    note of every member, tagged with each owner's email, whoever asks.
  evidence: [lib/db.mjs:8, server.mjs:31, lib/agent.mjs:12, lib/agent.mjs:13, lib/agent.mjs:14, lib/agent.mjs:19]
  confidence: confirmed
- id: F-607
  dimension: multiplayer
  polarity: gap
  subject_type: process
  property: sharing-is-consented
  label: "automatic cross-member surfacing"
  observation: >
    Sharing a note with other members is never a conscious act: no note carries a visibility or
    share flag, and the assistant surfaces every member's note text to any caller automatically,
    while the README says it answers questions about "your notes".
  evidence: [lib/db.mjs:9, lib/db.mjs:10, server.mjs:38, lib/agent.mjs:12, README.md:4]
  confidence: confirmed
- id: F-608
  dimension: multiplayer
  polarity: gap
  subject_type: control
  property: sharing-is-consented
  label: "undisclosed privileged reader"
  observation: >
    A privileged identity is not disclosed by structure: any caller with a missing or unknown
    token becomes a default admin identity, and through the assistant that caller reads every
    member's notes, while the README describes admins only as managing the workspace.
  evidence: [lib/auth.mjs:9, lib/auth.mjs:10, lib/auth.mjs:11, lib/auth.mjs:12, lib/agent.mjs:12, README.md:3]
  confidence: confirmed
- id: F-609
  dimension: multiplayer
  polarity: fact
  subject_type: process
  property: sharing-is-consented
  label: "workspace backup disclosed"
  observation: >
    The one bulk sharing of all members' notes outside the app, the backup push, is disclosed in
    the README as pushing the workspace to the backup service, though no member consents per note
    and any caller can trigger it.
  evidence: [README.md:19, lib/sync.mjs:6, server.mjs:48]
  confidence: confirmed
