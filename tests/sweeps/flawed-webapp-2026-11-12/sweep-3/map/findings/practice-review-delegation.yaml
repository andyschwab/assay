    channel: assistant-email-send
    reversibility: irreversible
    external: true
    gate_type: none
    telemetry: unstructured
    blast_scope: tenant
  label: "every workspace note emailed to any address"
  preconditions: [prompt-injection]
  explained_by: [F-414]
  escapes: [F-415]

