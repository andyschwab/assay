- id: F-203
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  property: central-regression-caught
  observation: >
    A subtle regression in the central server (the dispatcher and its five route
    branches) is caught by no gate, at no time: the smoke suite never imports
    server.mjs, and its single assertion, assert.ok on authenticate with a valid
    token, cannot fail, because authenticate returns a truthy fallback admin
    identity for any token, so even a broken token lookup reads green; it carries
    no negative case that would turn red.
  evidence: [test/smoke.mjs:8, test/smoke.mjs:9, lib/auth.mjs:7, lib/auth.mjs:12, server.mjs:26]
  confidence: confirmed
- id: F-204
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  property: interface-contract-enforced
  observation: >
    The request-body interface fails silent: readBody catches a JSON parse error
    and resolves an empty object, so a malformed POST /notes body is stored as a
    note with empty text and answered 201, and a malformed POST /assistant body
    becomes an empty question; no field is validated, only coerced with String().
  evidence: [server.mjs:16, server.mjs:36, server.mjs:38, server.mjs:39, server.mjs:44]
  confidence: confirmed
