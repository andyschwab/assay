# map/censuses.yaml — assembled from the seven passes' census and context fragments
dimensions:
  - dimension: artifact-legibility
    depth: >
      The best instance is ADR-0001, a full decision record (context, decision, consequences,
      rejected alternative) the store's code links back to (F-001); elsewhere rationale lives in
      one-line code comments or nowhere (F-003, F-005, F-007).
    sampled:
      - name: decision-reconstruction
        what: "non-obvious decisions the terrain freezes, reconstructable from files alone"
        members: [F-001, F-002, F-003, F-004, F-005, F-006, F-007]
        method: "every non-obvious decision listed in the terrain (seven), one finding each"
        primary: true
      - name: doc-freshness
        what: "README doc claims replayed against the code"
        members: [F-008, F-009, F-010, F-011, F-012]
        method: "every README doc claim listed in the terrain (five), one finding each, replayed by reading the code"
  - dimension: context-economy
    depth: >
      The best instance is lib/auth.mjs, which loads alone with one import, commented code and the
      tree's one test to run (F-103), and server.mjs's imports route a reader to each module (F-112);
      but that test covers one path, and the other seven modules have nothing to run (F-101, F-104).
    sampled:
      - name: modules-standalone
        what: "every module in the terrain's module population (8)"
        members: [F-101, F-102, F-103, F-104, F-105, F-106, F-107, F-108]
        method: "every module in the terrain's Modules list (server.mjs, lib/db.mjs, lib/auth.mjs, lib/agent.mjs, lib/mailer.mjs, lib/sync.mjs, routes/admin.mjs, config/settings.mjs), one finding each, citing the module's own file"
        primary: true
      - name: model-call-telemetry
        what: "every model call site"
        members: [F-109]
        method: "populations.modelCalls of enumerate.json lists none; the whole tree was read, and the one call site it misses (the stub callModel in lib/agent.mjs) is the census's only member, one finding"
  - dimension: deterministic-gates
    depth: >
      There is no best instance to rate: no change gate exists (F-201), the one test
      runs by hand only (F-202) and its sole assertion cannot go red (F-203), and
      neither interface the target names fails loud on a wrong input (F-204, F-205).
      The change-gates census has no members (enumerate.json lists none, and reading the
      whole tree found none), so it carries no sampled entry and cannot read met; the
      confirmed absence is F-201, outside the census. No guard fixture exists, so the
      guard-fixtures context list is not written.
  - dimension: verification
    depth: >
      Weak: the best instance is an unused affordance, an exportable server over seeded data
      that could let a change demonstrate itself (F-309), while every success report on an
      external effect is unconfirmed (F-301, F-302, F-303) and the one test cannot fail (F-307).
  - dimension: delegation
    depth: >
      The best instance is thin: the only gate on any effect is the purge's role check (F-403),
      and it fails open through the admin fallback identity (F-414); the one containment that
      holds, the per-user note listing (F-415), is pierced by the ungated assistant email (F-401)
      driven from the full-trifecta assistant context (F-405).
    sampled:
      - name: credential
        what: "every secret the running application reads"
        members: [F-406, F-407]
        method: "enumerate.json populations.secrets lists none; every credential the terrain draws by reading (the literal backup key, the hardcoded session-token table), one finding each"
        primary: true
      - name: ingested-content
        what: "every point where outside text enters and is stored, rendered or handed to a model"
        members: [F-408, F-409, F-410]
        method: "every ingestion point the terrain lists (POST /notes text, POST /assistant question, the parsed model output), one finding each"
  - dimension: improvement-loop
    depth: >
      There is no best instance to judge: the repository records no lesson at all, so the lesson
      census has no members and none became a mechanism (F-501); outstanding work lives in a code
      comment and ADR prose rather than on a tracker (F-502, F-503, F-504), and the system neither
      measures its own impact nor emits usage or outcome records (F-505, F-506).
  - dimension: multiplayer
    depth: >
      The best instance is a route list: four of five HTTP routes are named with method, path and
      purpose in the README (F-601, F-604), but no request, auth or response contract is stated
      outside the code, purge is undocumented (F-605), and the shared context is one unscoped
      workspace surfaced to every caller without consent (F-606, F-607, F-608).
    sampled:
      - name: agent-access-surface
        what: "every HTTP route the app offers a caller"
        members: [F-601, F-602, F-603, F-604, F-605]
        method: "every HTTP route in the terrain (GET /notes, POST /notes, POST /assistant, POST /sync, POST /admin/purge), one finding each; the 404 fallthrough is not an interface"
        primary: true
context:
  - name: second-accounts
    members: [F-013, F-014, F-015, F-016, F-017, F-018]
  - name: model-qualification
    members: [F-110]
  - name: rubric-calibration
    members: [F-305]
  - name: change-verification
    members: [F-306]
  - name: ai-feature-evals
    members: [F-304]
  - name: ai-disclosure
    members: [F-411]
  - name: backlog-records
    members: [F-502, F-503]
