- id: F-602
  dimension: multiplayer
  polarity: gap
  subject_type: artifact
  observation: >
    POST /notes is listed in the README only as "create a note", while its request
    contract (a JSON body whose `text` field becomes the note) is stated nowhere but the
    handler, so an agent must read server.mjs to call it.
  evidence: ["server.mjs:35-40", "README.md:17"]
  confidence: confirmed
  source: practice-review
- id: F-603
  dimension: multiplayer
  polarity: gap
  subject_type: artifact
  observation: >
    POST /assistant is listed in the README, but its request field (`question`) and its
    response shape (`answer`, plus `emailed` when a mail went out) appear only in code,
    so an agent cannot form the call or tell that an email was sent from the docs.
  evidence: ["server.mjs:42-45", "lib/agent.mjs:40-42", "README.md:18"]
  confidence: confirmed
  source: practice-review
- id: F-604
  dimension: multiplayer
  polarity: strength
  subject_type: artifact
  observation: >
    POST /sync is listed in the README, needs no request body, and returns a JSON object
    (`ok`, `pushed`), so it is consumable by an agent from the docs alone.
  evidence: ["server.mjs:47-50", "lib/sync.mjs:13", "README.md:19"]
  confidence: confirmed
  source: practice-review
- id: F-605
  dimension: multiplayer
  polarity: gap
  subject_type: artifact
  observation: >
    POST /admin/purge is absent from the README's endpoint list, its own module's comment
    names it DELETE while the router matches POST, and its refusal is a plain-text 403
    rather than the JSON envelope the other routes use.
  evidence: ["server.mjs:52-54", "routes/admin.mjs:5-7", "README.md:14-19", "server.mjs:56"]
  confidence: confirmed
  source: practice-review
- id: F-606
  dimension: multiplayer
  polarity: gap
  subject_type: artifact
  observation: >
    The "workspace" the README and the purge comment speak of is not a principal: the
    store holds only users and one global notes map keyed by owner, with no team or
    shared-scope record carrying its own membership, memory or permissions.
  evidence: ["lib/db.mjs:2-11", "README.md:3-5", "routes/admin.mjs:5"]
  confidence: confirmed
  source: practice-review
- id: F-607
  dimension: multiplayer
  polarity: gap
  subject_type: control
  observation: >
    The two read surfaces disagree on scope: the human route returns only the caller's
    own notes, while the assistant builds its context from every user's notes, so what
    a member may see depends on which surface they ask.
  evidence: ["server.mjs:31", "lib/agent.mjs:12-15"]
  confidence: confirmed
  source: practice-review
- id: F-608
  dimension: multiplayer
  polarity: strength
  subject_type: control
  observation: >
    Each note line in the assistant's context carries an origin label naming its owner's
    email, and the asker's text sits under its own USER QUESTION heading, so the model
    can tell whose note each line came from.
  evidence: ["lib/agent.mjs:12-15", "lib/agent.mjs:19"]
  confidence: confirmed
  source: practice-review
- id: F-609
  dimension: multiplayer
  polarity: gap
  subject_type: control
  observation: >
    The emailed summary body drops those origin labels, joining every note's bare text,
    so its recipient cannot tell whose note each line was.
  evidence: ["lib/agent.mjs:38-39"]
  confidence: confirmed
  source: practice-review
- id: F-610
  dimension: multiplayer
  polarity: gap
  subject_type: process
  observation: >
    Sharing is never a conscious act: a note record has only id, owner and text with no
    visibility or share field, yet every note is surfaced to any caller's assistant,
    while the README tells members the assistant answers about "your notes".
  evidence: ["lib/db.mjs:8-11", "server.mjs:38", "lib/agent.mjs:12", "README.md:3-4"]
  confidence: confirmed
  source: practice-review
- id: F-611
  dimension: multiplayer
  polarity: gap
  subject_type: control
  observation: >
    The assistant is a privileged reader of all members' notes and owner emails, and that
    asymmetry is disclosed nowhere in the README, which describes the assistant only as
    answering and emailing "for you".
  evidence: ["lib/agent.mjs:12-15", "README.md:3-5", "README.md:18"]
  confidence: confirmed
  source: practice-review
- id: F-612
  dimension: multiplayer
  polarity: gap
  subject_type: control
  observation: >
    Assistant email goes out from one shared sender address, and neither the message nor
    the mailer's log line names the member whose request caused it, so acting-as is
    invisible to the recipient and to the record.
  evidence: ["lib/mailer.mjs:5-7", "lib/agent.mjs:39", "config/settings.mjs:7"]
  confidence: confirmed
  source: practice-review
- id: F-613
  dimension: multiplayer
  polarity: gap
  subject_type: artifact
  observation: >
    The router exposes no usage or outcome endpoint: its five routes are notes, assistant,
