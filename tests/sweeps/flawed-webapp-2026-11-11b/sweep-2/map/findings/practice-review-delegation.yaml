    reversibility: reversible
    external: false
    gate_type: none
    telemetry: none
    blast_scope: user
  reaches: [F-405]
  explained_by: [F-408]
  source: practice-review

- id: F-405
  dimension: delegation
  polarity: gap
  subject_type: capability
  label: "notes assistant holds the trifecta"
  observation: >
    The notes assistant puts the caller's question and every user's notes with their owners'
    emails into one prompt and acts on the model's output by sending email, so one context
    holds untrusted input, private data and an outbound write.
  evidence: ["lib/agent.mjs:11-21", "lib/agent.mjs:33-43", "server.mjs:42-45"]
  confidence: confirmed
  capabilities:
    untrusted_input: true
    private_data: true
    external_effect: write
  preconditions: [prompt-injection]
  reaches: [F-401]
  source: practice-review

- id: F-406
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    The backup API key (K1) is kept out of the model's prompt but is a literal in the source
