- id: F-411
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    The assistant reads every user's notes regardless of who is asking, while the same caller's
    direct read is limited to their own notes, so the assistant acts with ambient workspace-wide
    access rather than as the caller.
  evidence: ["lib/agent.mjs:11-15", "server.mjs:31"]
  confidence: confirmed
  source: practice-review

- id: F-412
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    Email the assistant sends "on the user's behalf" goes out from one shared sender address and
    carries nothing that names the requesting user, so a recipient cannot tell who caused it.
  evidence: ["lib/agent.mjs:1-2", "lib/mailer.mjs:5-7", "config/settings.mjs:7"]
  confidence: confirmed
  source: practice-review

- id: F-413
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    None of the irreversible effects exists in staged form or behind a person's confirmation:
    the email is sent in the same call that parses the directive, the purge clears in one step,
    and the backup push fires on request.
  evidence: ["lib/agent.mjs:36-40", "lib/db.mjs:27-31", "lib/sync.mjs:8-12"]
  confidence: confirmed
  source: practice-review

- id: F-414
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    The send-email directive is checked only for its syntax, not its provenance, so a directive
