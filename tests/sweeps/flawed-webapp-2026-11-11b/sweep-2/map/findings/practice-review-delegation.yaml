- id: F-408
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    `authenticate` returns a default identity with `role: 'admin'` for any unknown or missing
    bearer token instead of refusing, and every route resolves its caller through it.
  evidence: ["lib/auth.mjs:5-13", "server.mjs:26-27"]
  confidence: confirmed
  reaches: [F-402, F-404, F-405]
  source: practice-review

- id: F-409
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    `GET /notes` scopes the read to the caller's own notes by filtering on `owner === user.id`.
  evidence: ["server.mjs:30-33"]
  confidence: confirmed
  source: practice-review

- id: F-410
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    The purge is held behind one narrow admin-role check placed directly before the irreversible
    `purgeAll` call, refusing with 403 otherwise.
  evidence: ["routes/admin.mjs:7-8", "lib/auth.mjs:15-17"]
  confidence: confirmed
