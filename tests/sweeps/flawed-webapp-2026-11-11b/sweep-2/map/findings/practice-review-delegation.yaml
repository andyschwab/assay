- id: F-401
  dimension: delegation
  polarity: gap
  subject_type: effect
  label: "assistant emails the whole workspace"
  observation: >
    When the model's output contains a `TOOL:send_email <to> <subject>` line, `ask()` calls
    `sendEmail` immediately with a model-chosen recipient and a body made of every note in the
    workspace, with no allowlist, draft or confirmation between the parse and the send.
  evidence: ["lib/agent.mjs:35-39", "lib/mailer.mjs:5-8", "lib/mailer.mjs:1-2"]
  confidence: confirmed
  effect:
    channel: assistant-email-send
    reversibility: irreversible
    external: true
    gate_type: none
    telemetry: unstructured
    blast_scope: tenant
  preconditions: [prompt-injection]
  explained_by: [F-414]
  escapes: [F-409]
  source: practice-review

- id: F-402
  dimension: delegation
  polarity: gap
  subject_type: effect
  label: "anyone can purge the workspace"
  observation: >
    `handlePurge` gates `purgeAll` on `requireAdmin`, but any request with a missing or unknown
    token is resolved to an admin identity, so the check fails open and the unrecoverable clear
    of every note runs for an unauthenticated caller and leaves no record.
  evidence: ["routes/admin.mjs:6-11", "lib/db.mjs:27-31", "lib/auth.mjs:9-12", "server.mjs:52-54"]
  confidence: confirmed
  effect:
    channel: workspace-purge
    reversibility: irreversible
    external: false
    gate_type: deterministic-halt
    fail_mode: open
    telemetry: none
    blast_scope: tenant
  preconditions: [network-position]
  explained_by: [F-408]
  escapes: [F-410]
  source: practice-review

- id: F-403
  dimension: delegation
  polarity: gap
  subject_type: effect
  label: "ungated backup push of every note"
  observation: >
    `POST /sync` calls `pushBackup` with no authorization check (the handler says so), which
    POSTs the full note set to the backup endpoint with the shared backup key, swallows any
    failure, and writes no record of the push.
  evidence: ["server.mjs:47-50", "lib/sync.mjs:5-13", "config/settings.mjs:4"]
  confidence: plausible
  effect:
    channel: workspace-backup-push
    reversibility: irreversible
    external: false
    gate_type: none
    telemetry: none
    blast_scope: tenant
  preconditions: [network-position]
  source: practice-review

- id: F-404
  dimension: delegation
  polarity: fact
  subject_type: effect
  label: "note create (assistant's input)"
  observation: >
