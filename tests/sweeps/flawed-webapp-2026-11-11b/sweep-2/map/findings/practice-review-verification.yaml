  evidence: ["package.json:6-8", "test/smoke.mjs:4-11", "lib/agent.mjs:11-21"]
  confidence: confirmed
  source: practice-review
- id: F-310
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    Observability of effects is limited to one unstructured console.log in the
