# Pass 7 — Multiplayer (practice-review). Census: agent-access-surface (contract), then
# shared substrate, authority domains, consent semantics. Credential-boundary and gate
# facts are delegation's (F-401..F-405) and are not repeated here.

# ── Census: agent-access-surface (one per route handler, terrain order) ──

- id: F-601
  dimension: multiplayer
  polarity: gap
  subject_type: contract
  observation: >
    GET /notes — the handler answers JSON (`{notes: [...]}` via the shared `send` helper),
    but the README documents it only as a one-line name ("list your notes") with no
    authentication scheme, response shape or error shape an agent could find.
  evidence: ["server.mjs:30-33", "server.mjs:21-24", "README.md:16"]
  confidence: confirmed
  source: practice-review

- id: F-602
  dimension: multiplayer
  polarity: gap
  subject_type: contract
  observation: >
    POST /notes — the handler takes a JSON body whose `text` field it reads and answers
    `201 {id}`, but the README names only "create a note", documenting neither the `text`
    field, the bearer header nor the response, so the input contract exists only in code.
  evidence: ["server.mjs:35-40", "README.md:17"]
  confidence: confirmed
  source: practice-review

- id: F-603
  dimension: multiplayer
  polarity: gap
  subject_type: contract
  observation: >
    POST /assistant — the handler takes a JSON `question` and answers `{answer}` or
    `{answer, emailed}`, but the README describes it only as "ask the AI assistant (it can
    email summaries for you)", leaving the request field, the response fields and the
    email-trigger behaviour undocumented for an agent caller.
  evidence: ["server.mjs:42-45", "lib/agent.mjs:33-43", "README.md:18"]
  confidence: confirmed
  source: practice-review

- id: F-604
  dimension: multiplayer
  polarity: gap
  subject_type: contract
  observation: >
    POST /sync — the handler answers JSON `{ok, pushed}`, but the README documents it only
    as "push the workspace to the backup service", with no response shape and no statement
    of who may call it.
  evidence: ["server.mjs:47-50", "lib/sync.mjs:13", "README.md:19"]
  confidence: confirmed
  source: practice-review

- id: F-605
  dimension: multiplayer
  polarity: gap
  subject_type: contract
  observation: >
    POST /admin/purge — the route is absent from the README's endpoint list, and the
    handler's own comment names it `DELETE /admin/purge` while the dispatcher matches
