# ── census: modules-standalone ────────────────────────────────────────────────
- id: F-101
  dimension: context-economy
  polarity: gap
  subject_type: artifact
  observation: >
    server.mjs's header says each concern lives in one place behind lib/ and routes/,
    but the GET and POST /notes handlers read and write the store's raw notes Map inline
    (and POST /notes never updates the owner's notes list that lib/db.mjs keeps), so a
    change to note storage cannot be made in lib/db.mjs without also loading and editing
    the router.
  evidence: [server.mjs:1-2, server.mjs:30-40, lib/db.mjs:2-11]
  confidence: confirmed

- id: F-102
  dimension: context-economy
  polarity: strength
  subject_type: artifact
  observation: >
    lib/agent.mjs states its purpose and the stub's role in its header and is readable
    standalone, importing only the store's notes/users exports and sendEmail.
  evidence: [lib/agent.mjs:1-9, lib/agent.mjs:33-43]
  confidence: confirmed

- id: F-103
  dimension: context-economy
  polarity: strength
  subject_type: artifact
  observation: >
    lib/auth.mjs states its purpose on line 1, imports only sessions.lookup, and documents
    its default-identity fallback in place, so its behaviour is fully readable from the
    file alone.
  evidence: [lib/auth.mjs:1-17]
  confidence: confirmed

- id: F-104
  dimension: context-economy
  polarity: gap
  subject_type: artifact
  observation: >
    lib/db.mjs states its purpose but exports its storage itself (a mutable users array
    and a notes Map) rather than operations, and those raw structures are consumed
    directly by server.mjs and lib/agent.mjs, so the module cannot be changed (e.g.
    swapped for another store) by loading only itself.
  evidence: [lib/db.mjs:1-11, lib/db.mjs:19-31, server.mjs:31, server.mjs:38, lib/agent.mjs:12-13]
  confidence: confirmed

