# map/findings/practice-review-delegation.yaml — Pass 5 (delegation), targets/flawed-webapp @ 7f7c89d, blind

# ── Effect inventory (terrain slugs, pre-assigned ids) ──

- id: F-401
  dimension: delegation
  polarity: fact
  subject_type: effect
  observation: >
    POST /notes inserts a note into the in-memory workspace store owned by whichever
    principal authenticate() returns, including the admin-role default identity for a
    missing token, with no log line, and that note text is later fed verbatim into the
    assistant's prompt.
  evidence: [server.mjs:27, server.mjs:35-40, lib/auth.mjs:9-12, lib/agent.mjs:12-15]
  confidence: confirmed
  effect:
    channel: note-create
    reversibility: reversible
    external: false
    gate_type: none
    telemetry: none
    blast_scope: tenant
  reaches: [F-402]

- id: F-402
  dimension: delegation
  polarity: gap
  subject_type: effect
  observation: >
    When the model output contains a TOOL:send_email line, ask() sends every note in
    the workspace to the model-chosen recipient with a model-chosen subject, with no
    draft, confirmation, recipient allowlist or role check between the parse and the
    send, and the only trace is a console line (the fixture transport is log-only; the
    module states production posts to the mail relay).
  evidence: [lib/agent.mjs:33-41, lib/mailer.mjs:1-2, lib/mailer.mjs:5-8, server.mjs:42-45]
  confidence: confirmed
  effect:
    channel: assistant-email-send
    reversibility: irreversible
    external: true
    gate_type: none
    telemetry: unstructured
    blast_scope: tenant
  preconditions: [prompt-injection]
  escapes: [F-409]

- id: F-403
  dimension: delegation
  polarity: gap
  subject_type: effect
  observation: >
    POST /sync, which carries no authorization check, POSTs the full note set under the
    backup bearer key to the backup URL as a fire-and-forget fetch whose failure is
    swallowed, so any caller can overwrite the off-process backup copy with the current
    (possibly purged) state and nothing records that it happened.
  evidence: [server.mjs:47-50, lib/sync.mjs:5-13, config/settings.mjs:4]
  confidence: plausible
  effect:
    channel: workspace-backup-push
    reversibility: irreversible
    external: false
    gate_type: none
    telemetry: none
    blast_scope: tenant
  preconditions: [network-position]

- id: F-404
  dimension: delegation
  polarity: gap
  subject_type: effect
  observation: >
    POST /admin/purge clears every note and every user's note list behind a
    requireAdmin role check that fails open, because a missing or unknown bearer token
    resolves to a default identity carrying role admin, so any unauthenticated caller
    purges the workspace with no confirmation, quarantine or log.
  evidence: [server.mjs:52-54, routes/admin.mjs:6-10, lib/auth.mjs:9-17, lib/db.mjs:27-31]
  confidence: confirmed
  effect:
    channel: workspace-purge
    reversibility: irreversible
    external: false
    gate_type: deterministic-halt
    fail_mode: open
    telemetry: none
    blast_scope: tenant
  preconditions: [network-position]

# ── AI surface ──

- id: F-405
  dimension: delegation
  polarity: gap
  subject_type: capability
  label: "the notesbox assistant"
  observation: >
    The assistant co-holds all three legs in one prompt: the caller's question and every
    member-authored note text (untrusted), every note plus owner email addresses
    (private), and an email-send tool driven by a directive parsed from model output
    (external write).
  evidence: [server.mjs:42-45, lib/agent.mjs:11-20, lib/agent.mjs:27-29, lib/agent.mjs:33-39]
  confidence: confirmed
  capabilities:
    untrusted_input: true
    private_data: true
    external_effect: write
  preconditions: [prompt-injection]
  reaches: [F-402]

# ── Census: credential (subject_type control, 2 members) ──

- id: F-406
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    The backup service API key is a credential-shaped string literal committed in the
    settings module beside a "move to env before launch" TODO and read into the
    Authorization header at call time, so although it never enters the prompt it is held
    in source rather than injected out-of-band.
  evidence: [config/settings.mjs:5-6, lib/sync.mjs:10]
  confidence: confirmed

- id: F-407
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    The session bearer-token table is a hardcoded map of short, human-readable static
    token strings to user ids in source, with no expiry, rotation or out-of-band
    issuance, although no token is ever placed in the assistant's prompt.
  evidence: [lib/db.mjs:13-17, lib/db.mjs:19-25, lib/agent.mjs:11-15]
  confidence: confirmed

# ── Identity classes (probed separately) ──

- id: F-408
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    Every request with a missing or unrecognised token is served as one shared default
    principal with role admin and a placeholder email, so anonymous callers are
    indistinguishable from each other and hold admin authority by default.
  evidence: [lib/auth.mjs:5-12, server.mjs:27]
  confidence: confirmed

- id: F-409
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    A member resolves through the token table to one named user with a stated role, and
    the note listing route returns only notes whose owner is that user, so on the read
    route a member acts as themselves within their own notes.
  evidence: [lib/db.mjs:3-4, lib/db.mjs:19-25, server.mjs:30-33]
  confidence: confirmed

- id: F-410
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    The admin class has no identity of its own: requireAdmin reads only role === admin,
    which the default fallback also carries, and the configured adminEmails list is
    referenced by nothing, so a real admin and an anonymous caller are the same actor to
    the purge gate.
  evidence: [lib/auth.mjs:15-17, lib/auth.mjs:12, lib/db.mjs:5, config/settings.mjs:8]
  confidence: confirmed

# ── Halt, composition, observability, promotion, modality, authorship ──

- id: F-411
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    No irreversible operation exists in staged form: the assistant sends rather than
    drafts, and purge clears rather than quarantines, with no person-held confirming act
    at either boundary.
  evidence: [lib/agent.mjs:35-40, lib/mailer.mjs:5-8, routes/admin.mjs:6-10, lib/db.mjs:27-31]
  confidence: confirmed

- id: F-412
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    Nothing reasons over data flow at the send: the recipient and subject come from model
    output that may reproduce text any member wrote into a note, and the body is every
    note regardless of the caller, with no provenance check before sendEmail.
  evidence: [lib/agent.mjs:12-19, lib/agent.mjs:28-29, lib/agent.mjs:35-39]
  confidence: confirmed

- id: F-413
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    Two individually reachable unauthenticated calls chain: a purge via the admin-role
    default identity followed by a sync pushes the emptied note set over the backup, and
    no check spans the two calls.
  evidence: [routes/admin.mjs:7-8, lib/auth.mjs:12, server.mjs:47-50, lib/sync.mjs:6-12]
  confidence: plausible

- id: F-414
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    Only the email send leaves any trace, as an unstructured console line, while note
    creation, purge and backup push emit nothing and the push swallows its own failure,
    so no effect produces a durable machine-parseable record a trigger or halt could
    hang on.
  evidence: [lib/mailer.mjs:7, server.mjs:35-40, lib/db.mjs:27-31, lib/sync.mjs:8-13]
  confidence: confirmed

- id: F-415
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    Notes are scoped to their owner on the list route but there is no sanctioned path for
    a note to be shared beyond its owner; the assistant instead reads and emails every
    note in the workspace, bypassing the scope rather than promoting through a gate.
  evidence: [server.mjs:30-40, lib/agent.mjs:12-15, lib/agent.mjs:38]
  confidence: confirmed

- id: F-416
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    The assistant acts with agency (it sends email on its own parse of model output) yet
    carries no behavioral spec beyond a two-line inline prompt, no monitoring of its
    actions, and no pre-release verification, the only test exercising authenticate.
  evidence: [lib/agent.mjs:16-20, lib/agent.mjs:35-39, test/smoke.mjs:5-9]
  confidence: confirmed

- id: F-417
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    The outbound email is sent from the assistant's sender address with a model-chosen
    subject and the raw note text as body, and sendEmail receives neither the requesting
    user nor any statement of AI authorship, so the recipient cannot tell who asked or
    that a model chose to send it.
  evidence: [config/settings.mjs:7, lib/mailer.mjs:5-7, lib/agent.mjs:37-39]
  confidence: confirmed

- id: F-418
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    The assistant's only reachable effect is one authored function, sendEmail, invoked by
    app code after parsing; the model never sees the backup key, the token table or a raw
    platform call, so both credentials sit below the prompt boundary.
  evidence: [lib/agent.mjs:8-9, lib/agent.mjs:11-20, lib/agent.mjs:35-39]
  confidence: confirmed
