# map/findings/practice-review-verification.yaml — Pass 4 (verification), targets/flawed-webapp @ 7f7c89d, blind
# Census effect-provability (subject_type control): note-create F-301, assistant-email-send F-302,
# workspace-backup-push F-303, workspace-purge F-304. Further probes F-305 onward.

- id: F-301
  dimension: verification
  polarity: strength
  subject_type: control
  label: "note-create report follows the write"
  observation: >
    The note-create channel reports 201 only after a synchronous in-process Map.set and returns
    the stored note's id, which the same principal can read back through GET /notes, so the
    success report is tied to an effect that has already happened and is checkable (the trace is
    in-memory only and the random six-character id is set without a collision check).
  evidence: [server.mjs:35-40, server.mjs:30-33]
  confidence: confirmed

- id: F-302
  dimension: verification
  polarity: gap
  subject_type: control
  label: "assistant email reports sent unconditionally"
  observation: >
    The assistant-email-send channel cannot prove delivery: sendEmail is a log-only transport that
    returns a constant sent-true, ask() discards that return value and reports the recipient as
    emailed regardless, and the only trace is an unstructured console line.
  evidence: [lib/mailer.mjs:1-2, lib/mailer.mjs:5-8, lib/agent.mjs:39-40]
  confidence: confirmed

- id: F-303
  dimension: verification
  polarity: gap
  subject_type: control
  label: "backup push is false-green"
  observation: >
    The workspace-backup-push channel is the effects-vs-reports shape: the fetch is not awaited,
    its rejection is swallowed by an empty catch, and pushBackup returns ok-true with the local
    note count before any response exists, which POST /sync relays as a 200, so a dropped push
    reports success and leaves no trace.
  evidence: [lib/sync.mjs:7-13, server.mjs:47-50]
  confidence: confirmed

- id: F-304
  dimension: verification
  polarity: gap
  subject_type: control
  label: "purge reports a constant, untraced"
  observation: >
    The workspace-purge channel returns a hard-coded purged-true literal rather than anything
    derived from the store (no count of notes cleared), and neither purgeAll nor handlePurge
    records which principal purged or when, so the irreversible clear leaves no checkable trace.
  evidence: [lib/db.mjs:27-31, routes/admin.mjs:6-10]
  confidence: confirmed

- id: F-305
  dimension: verification
  polarity: gap
  subject_type: contract
  label: "the only test cannot fail"
  observation: >
    The single test asserts only that authenticate returns something truthy for one valid token,
    and authenticate returns a truthy default identity for any token, so the assertion passes
    whatever the token resolution does and the suite reports green regardless of auth behaviour.
  evidence: [test/smoke.mjs:7-11, lib/auth.mjs:7-12]
  confidence: confirmed

- id: F-306
  dimension: verification
  polarity: gap
  subject_type: control
  label: "model output acted on unchecked"
  observation: >
    Decay condition: nothing checks the assistant's output before acting on it; the reply is
    regex-matched for a send-email directive and the parsed recipient and subject go straight to
    sendEmail with no allow-list, schema or confirmation check, however the output reads.
  evidence: [lib/agent.mjs:33-41]
  confidence: confirmed

- id: F-307
  dimension: verification
  polarity: gap
  subject_type: process
  label: "no calibration harness"
  observation: >
    No calibration harness exists for the assistant prompt or its directive parser: the only test
    file never imports the agent, package.json defines no test or eval script, and the prompt is
    not exercised against frozen inputs anywhere in the target.
  evidence: [test/smoke.mjs:4-5, package.json:6-8, lib/agent.mjs:16-20]
  confidence: confirmed

- id: F-308
  dimension: verification
  polarity: fact
  subject_type: artifact
  label: "deterministic stub model and seed data"
  observation: >
    The model call is a deterministic stub over seeded in-memory users and notes, which would let
    the assistant path be demonstrated reproducibly, but no test, example or script uses it.
  evidence: [lib/agent.mjs:23-31, lib/db.mjs:2-11, test/smoke.mjs:4-11]
  confidence: confirmed

- id: F-309
  dimension: verification
  polarity: gap
  subject_type: control
  label: "no structured observability"
  observation: >
    The app has no request or effect logging beyond two unstructured console lines (the listen
    banner and the mailer line), so no route's effect leaves a machine-parseable record a check
    could be built on.
  evidence: [server.mjs:26-57, server.mjs:60, lib/mailer.mjs:7]
  confidence: confirmed

- id: F-310
  dimension: verification
  polarity: gap
  subject_type: artifact
  label: "reliability asserted, not measured"
  observation: >
    The backup module justifies dropping push failures with an unmeasured claim that failures are
    rare inside the VPC, with no counter, retry record or check backing it.
  evidence: [lib/sync.mjs:7, lib/sync.mjs:12]
  confidence: confirmed
