# map/censuses.yaml — targets/flawed-webapp @ 7f7c89d, blind, census-augmented (SCHEMA.md §6b)
# met/of are read off members (strength = met, gap = not met, fact = no verdict); none typed here.
dimensions:
  - dimension: artifact-legibility
    depth: >
      The best instance is complete: ADR-0001 records context, decision, the adapter interface,
      consequences and the rejected alternative, linked both ways with the code (F-001); the other
      reconstructed reasons are single inline comments with no record behind them (F-002, F-003, F-008).
    sampled:
      - name: decision-reconstruction
        what: "non-obvious design choices whose rationale reconstructs from files alone"
        members: [F-001, F-002, F-003, F-004, F-005]
        method: "every decision the terrain lists, D1-D5, one finding each citing the decision's own file:line; strength where a stated reason is in a file"
        primary: true
  - dimension: context-economy
    depth: >
      Self-contained modules such as lib/auth.mjs and lib/sync.mjs state their purpose and read whole
      from one file (F-103, F-106); the storage boundary and the README's claims are where a bounded
      context is misled (F-104, F-114, F-109, F-112, F-113).
    sampled:
      - name: modules-standalone
        what: "the module can be understood and changed loading only itself and the interfaces it imports, its purpose stated in the file"
        members: [F-101, F-102, F-103, F-104, F-105, F-106, F-107, F-108]
        method: "every source module the terrain lists (8), one finding each, read with its header and imports against the bar"
        primary: true
      - name: doc-freshness
        what: "each checkable doc claim is true of the code today"
        members: [F-109, F-110, F-111, F-112, F-113, F-114, F-115]
        method: "every checkable claim the terrain lists, C1-C7, one finding each, checked against the code and package.json it describes"
  - dimension: deterministic-gates
    depth: >
      The best instance is an unused affordance: the server exports itself and listens only when run
      directly, so routes could be tested in-process (F-210); the one existing assert cannot fail (F-207),
      has no wired command (F-206), and nothing runs it automatically (F-208).
    sampled:
      - name: gates-coverage
        what: "a test exercises the route's behaviour and would fail on a regression in it"
        members: [F-201, F-202, F-203, F-204, F-205]
        method: "every route handler in server.mjs's router (5), one finding each, checked against every file under test/"
        primary: true
  - dimension: verification
    depth: >
      Only note-create ties its success report to an effect already made and readable back (F-301), and
      that in memory with no trace; every external or irreversible channel reports success regardless
      (F-302, F-303, F-304), and the one test is green by construction (F-305).
    sampled:
      - name: effect-provability
        what: "the effect can prove it happened: verified, or a durable checkable trace, not success reported unconditionally"
        members: [F-301, F-302, F-303, F-304]
        method: "every effect channel in the terrain's inventory (4), one finding each citing the channel's handler lines"
        primary: true
  - dimension: delegation
    depth: >
      The credential boundary against the model holds: the model reaches one authored function and never
      sees either secret (F-418), and members are scoped to their own notes on the read route (F-409); the
      admin-role default identity (F-408) and the assistant's full trifecta reaching an ungated send
      (F-405 to F-402) defeat both.
    sampled:
      - name: credential
        what: "the secret is held below the prompt boundary and out of source, injected out-of-band"
        members: [F-406, F-407]
        method: "every runtime secret the terrain lists (2), one control finding each, judged on both legs"
        primary: true
  - dimension: improvement-loop
    # incidents-became-mechanisms not measured: the target records no incident or lesson, so the
    # population is empty (terrain.md); no census is typed in its place.
    depth: >
      The one durable home is a well-formed, dated decision record used once (F-502); no correction has
      become a mechanism (F-503, F-504), and the app emits nothing to measure itself by (F-506, F-507).
  - dimension: multiplayer
    depth: >
      The only per-user authority boundary is the list route scoping reads to the caller (F-611); the
      shared default identity undermines it (F-610) and the assistant bypasses it (F-612), and reach over
      a JSON API (F-606) comes with no stated contract on any route (F-601 to F-605).
    sampled:
      - name: agent-access-surface
        what: "an agent can consume the interface from a stated contract, with a clear acting identity"
        members: [F-601, F-602, F-603, F-604, F-605]
        method: "every route handler in server.mjs's router (5), one finding each, checked against the README, the handler's request/response code and identity resolution"
        primary: true
