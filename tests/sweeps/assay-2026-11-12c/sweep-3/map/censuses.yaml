        primary: true
  - dimension: verification
    depth: "The best instances confirm effects instead of trusting reports: the orchestrator reads an instrument ran only when its report ingests (F-410), fresh-clone reads the runner's own test counts rather than the exit code (F-407), and the method's own repeatability is a gated number from blind sweeps (F-414); the weak spot is the GitHub-side jobs, which trust a CLI exit code (F-402, F-403, F-404), and the unchecked verification section of a change (F-411)."
