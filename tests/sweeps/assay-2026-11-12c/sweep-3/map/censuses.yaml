  - dimension: deterministic-gates
    depth: "The best gate is the regression harness CI runs on every pull request: it refuses an empty, unloadable or throwing block set as red, needs every pinned instrument verified first, and is itself guarded by negative fixtures that must stay red for their own reason (F-305, F-318, F-321, F-323); its one soft edge is that a local run without gitleaks skips that block's scan cases (F-310)."
    sampled:
