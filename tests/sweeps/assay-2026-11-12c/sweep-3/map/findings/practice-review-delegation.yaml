# Pass 5 — delegation surface (assay at 2b247c0). Effect findings first (one per channel
# slug from the terrain), then the controls, capabilities, and the censuses.

- id: F-501
  dimension: delegation
  polarity: strength
  subject_type: effect
  observation: >
    migrate-run rewrites a run's files in place only under --write (a dry run otherwise),
    refuses a rename that would land on an existing file, and leaves a file untouched unless
    every rewritten flow list reads back under the strict reader to exactly what the legacy
    rule read; what it did is printed to the console only.
  evidence: ["map/migrate-run.mjs:24", "map/migrate-run.mjs:44", "map/migrate-run.mjs:87", "map/migrate-run.mjs:112", "RUNBOOK.md:86"]
  confidence: confirmed
  effect:
    channel: migrate-run-write
    reversibility: reversible
    external: false
    gate_type: deterministic-halt
    fail_mode: closed
    telemetry: unstructured
    blast_scope: user

- id: F-502
  dimension: delegation
  polarity: strength
  subject_type: effect
  observation: >
    The release workflow tags and publishes a GitHub release only when a person dispatches it
    on the default branch, after refusing a malformed or existing version and running the full
    test gate and the Consumer-trailer check, with contents write held by that one job.
  evidence: [".github/workflows/release.yml:11", ".github/workflows/release.yml:23", ".github/workflows/release.yml:24", ".github/workflows/release.yml:37", ".github/workflows/release.yml:38", ".github/workflows/release.yml:41", ".github/workflows/release.yml:43", ".github/workflows/release.yml:50"]
  confidence: confirmed
  effect:
    channel: release-publish
    reversibility: irreversible
    external: true
    gate_type: initiated-by-person
    fail_mode: closed
    telemetry: audited
    blast_scope: fleet
    verified_as:
      principal: workflow-job-token
      privilege: bound
      triggered_by: person-dispatch

