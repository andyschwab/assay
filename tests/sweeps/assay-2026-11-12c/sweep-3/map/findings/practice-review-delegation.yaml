- id: F-511
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    The --allow-exec halt lives only in `assay start`: the routine's single-job path
    (`node assay.mjs routine <repo> --out <run>` without --handoff) calls drawOfflineMap with
    no skip reason and no --no-exec, so a steward's local routine run executes the target's
    install, scripts and knip config load in place with no flag asked.
  evidence: ["routine/run.mjs:234", "map/start.mjs:356", "map/start.mjs:359", "map/start.mjs:488", "assay.mjs:65"]
  confidence: confirmed
  property: control-matches-modality

- id: F-512
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    Every child that runs a target's code or package manager gets an environment built from
    an allow-list (PATH, HOME, CI, proxy plumbing without userinfo, npm_config_* only), so
    tokens, cloud keys and agent sockets in the evaluator's environment never reach it.
  evidence: ["map/child-env.mjs:4", "map/child-env.mjs:7", "map/child-env.mjs:10", "map/child-env.mjs:35", "map/fresh-clone.mjs:236", "map/start.mjs:270"]
  confidence: confirmed

- id: F-513
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    The allow-list passes HOME through to target-executing children, so a target's install
    script can read credential files under the operator's home directory (package registry,
    git or CLI tokens) even though their environment variables are dropped; the code says it
    is not a sandbox and leaves containment to the operator's choice of machine.
  evidence: ["map/child-env.mjs:10", "map/fresh-clone.mjs:81", "map/fresh-clone.mjs:310"]
  confidence: plausible
  preconditions: [malicious-dependency]

