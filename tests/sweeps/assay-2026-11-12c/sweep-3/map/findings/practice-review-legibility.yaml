# Pass 1 — artifact legibility (practice-review). Census-augmented: one finding per decision
# (decision-reconstruction, D1-D21 drawn from the contract docs' stated choices) and per checkable
# doc claim (doc-freshness); the second-accounts context list follows.

# ── decision-reconstruction: one finding per non-obvious decision ──
- id: F-101
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    The choice that findings state facts while only the views compute severity or urgency is written with its why (it keeps assay from issuing a verdict or a price) in the README, named as the rule's one home.
  evidence: ["README.md:32", "README.md:34", "README.md:37"]
  confidence: confirmed
- id: F-102
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    The routine's push trigger on the default branch carries its rationale beside it: a pull request measures only the change, so admin merges or direct pushes would otherwise go unmeasured until the weekly schedule.
  evidence: ["routine/README.md:10"]
  confidence: confirmed
- id: F-103
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    Splitting the routine template into a target job and a gate job is explained by the threat it answers: code run by the change could rewrite the ratchet or the measurement and make its own gate read held.
  evidence: ["routine/README.md:132", "routine/README.md:137"]
  confidence: confirmed
- id: F-104
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    Reading the baseline from the base branch on a pull request, never from the change's tree, is justified in place: grading against its own copy would let a change switch off the gate meant to hold it.
  evidence: ["routine/README.md:183", "routine/README.md:186"]
  confidence: confirmed
- id: F-105
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    Pinning the routine's engine as a full commit SHA rather than a branch states its reason inline (a branch moves; a scheduled run must run the exact engine a steward reviewed).
  evidence: ["routine/README.md:210", "routine/README.md:211"]
  confidence: confirmed
- id: F-106
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    Leaving `--since` out of the routine template is explained by the permission it would cost: fetching a previous scheduled run needs `actions: read`, and the routine promises `contents: read` only.
  evidence: ["routine/README.md:259", "routine/README.md:260"]
  confidence: confirmed
- id: F-107
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    The allow-listed child environment for target code names why each kept variable is kept (the package manager must be found and find its cache) and states plainly that it is not a sandbox, so the disposable-VM advice follows from the files.
  evidence: ["map/child-env.mjs:4", "map/scanners/CONTRACT.md:195", "map/scanners/CONTRACT.md:196"]
  confidence: confirmed
- id: F-108
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    The definition of an adopted instrument as offline (no hosting-platform API, a package registry allowed) carries its reasoning: a tool needing a remote configuration API is a forever-fail whose absence would read as coverage.
  evidence: ["map/scanners/CONTRACT.md:168", "map/scanners/CONTRACT.md:170", "map/scanners/CONTRACT.md:178"]
  confidence: confirmed
- id: F-109
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    Refusing to draw a map until pinned tools are ready, rather than recording the instrument skipped, is reconstructable from the contract (a tool is a precondition of a measurement, never one of its results) and the routine page (a refusal is never read as a failed measurement), though most code sites cite only an issue number.
  evidence: ["map/scanners/CONTRACT.md:890", "routine/README.md:88"]
