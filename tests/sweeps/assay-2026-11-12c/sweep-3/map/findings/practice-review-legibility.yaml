  observation: >
    Cutting releases only from a person-dispatched workflow, with nothing else tagging, is explained in the workflow header: the notes are the commits' Consumer trailers, and the gate and trailer check run before the tag.
  evidence: [".github/workflows/release.yml:3", ".github/workflows/release.yml:4", ".github/workflows/release.yml:6"]
