- id: F-119
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    Stripping instrument output tails from the archived run is justified by who can download the routine's artifact (anyone who can read workflow runs, unfiltered, for its retention period).
  evidence: ["routine/README.md:31", "routine/README.md:32"]
