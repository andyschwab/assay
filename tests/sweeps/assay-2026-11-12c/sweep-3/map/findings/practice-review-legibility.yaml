- id: F-117
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    Adding a harness block only as a new file, never editing an existing one, is reconstructable from the harness page: the runner discovers blocks and composes the gate line from their labels, so the line is computed, never hand-edited.
