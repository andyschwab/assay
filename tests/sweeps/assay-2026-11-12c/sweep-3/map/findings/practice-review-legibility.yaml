- id: F-120
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    Requiring CODEOWNERS on `packet/` and the workflows is explained in the install steps: without it anyone who opens a pull request could edit the baseline it is graded against or the workflow that grades it.
  evidence: ["routine/README.md:237", "routine/README.md:239"]
  confidence: confirmed
- id: F-121
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    Limiting the consumer contract to one page and two pure modules states its reason: anything past the page may change in any commit, and a consumer needing a value no command prints asks for a command.
  evidence: ["CONSUMERS.md:4", "CONSUMERS.md:103"]
