  polarity: strength
  subject_type: control
  observation: >
    Scanner output files enter through ingest, which halts on an exit outside the tool's
    success set or a malformed report, builds leak-list observations from rule id and location
    only (never the matched value), and drops tool-output tails before archiving the raw
