# ── effects (one per channel; slugs from the terrain's effect inventory) ─────────────────

- id: F-500
  dimension: delegation
  polarity: strength
  subject_type: effect
  observation: >
    migrate-run rewrites a stored run's files in place (renames retired ids, re-emits flow
    lists) only when a person passes --write, prints what would change otherwise, and refuses
    with exit 1 when a rename would land on an existing path or a list cannot round-trip;
    the retired-id step substitutes text across every text file without a round-trip check.
  evidence: [map/migrate-run.mjs:24, map/migrate-run.mjs:44, map/migrate-run.mjs:99, map/migrate-run.mjs:102, map/migrate-run.mjs:122, map/migrate-run.mjs:130]
  confidence: confirmed
  effect:
    channel: run-migrate
    reversibility: irreversible
    external: false
    gate_type: initiated-by-person
    fail_mode: closed
    telemetry: unstructured
    blast_scope: user

- id: F-501
  dimension: delegation
  polarity: strength
  subject_type: effect
  observation: >
    branch-cleanup deletes merged branches through the REST API on every push to the default
    branch with no person in the loop, behind deterministic checks: a hand-run is a dry run
    by default, only the delete job holds contents write, the delete refuses the default
    branch or a KEEP name before deleting anything, re-reads each branch and skips one that
    moved or became protected, and set -euo pipefail with a 10-minute timeout fails the run on
    any failed read; each deletion is only an echo line in the Actions log.
  evidence: [.github/workflows/branch-cleanup.yml:57, .github/workflows/branch-cleanup.yml:66, .github/workflows/branch-cleanup.yml:108, .github/workflows/branch-cleanup.yml:111, .github/workflows/branch-cleanup.yml:124, .github/workflows/branch-cleanup.yml:130, .github/workflows/branch-cleanup.yml:131, .github/workflows/branch-cleanup.yml:132]
  confidence: confirmed
  effect:
    channel: branch-delete
    reversibility: reversible-with-window
    external: true
    gate_type: deterministic-halt
    fail_mode: closed
    telemetry: unstructured
    blast_scope: tenant
    verified_as:
      principal: github-actions-job-token
      privilege: bound
      triggered_by: push-to-default-branch

