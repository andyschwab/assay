# ── credential census (populations.secrets, in scope) ────────────────────────────────────

- id: F-512
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    GH_TOKEN is the job's own github.token in three workflows, set per job or per step and
    bounded by each job's permissions block: branch-cleanup's plan reads (contents and
    pull-requests read) and only its delete job holds contents write, release sets it only on
    the tag-and-publish step under contents write, and tools-check's job holds issues write
    and contents read.
  evidence: [.github/workflows/branch-cleanup.yml:59, .github/workflows/branch-cleanup.yml:61, .github/workflows/branch-cleanup.yml:111, .github/workflows/branch-cleanup.yml:112, .github/workflows/release.yml:24, .github/workflows/release.yml:45, .github/workflows/tools-check.yml:17, .github/workflows/tools-check.yml:19]
  confidence: confirmed

- id: F-513
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    GITHUB_TOKEN is set from the job token in tools-check and read in one place,
    map/tools.mjs latestOf, which sends it as a bearer header only to the GitHub releases
    endpoint of a github: upstream to read the latest tag; the job's token can also write
    issues, which that read never uses.
  evidence: [.github/workflows/tools-check.yml:20, map/tools.mjs:201, map/tools.mjs:202, map/tools.mjs:203]
  confidence: confirmed

- id: F-514
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    FETCH_TOKEN is the job token placed only in the routine job's base-branch fetch step,
    which runs only on pull_request, and passed to that one git fetch through GIT_CONFIG
