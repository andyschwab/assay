- id: F-515
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    ASSAY_READ_TOKEN is a commented-out checkout token in both of the routine template's
    engine checkouts, for a private engine fork only, with persist-credentials false so it is
    never left where the change's scripts run; the runbook states its reach (read access to
    that one repository) and how to rotate and revoke it.
  evidence: [routine/assay-routine.yml:64, routine/assay-routine.yml:65, routine/assay-routine.yml:124, RUNBOOK.md:60, RUNBOOK.md:62, RUNBOOK.md:65, routine/README.md:161]
