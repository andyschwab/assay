dimensions:
  - dimension: artifact-legibility
    depth: >
      The best instances are rationale written at the point of the choice and held by a check: the one-rule home guarded against restatement (F-144), the strict YAML reader's fail-closed reason at the reader (F-101), and the --allow-exec boundary explained in both the README and the skip reason (F-103); the misses are small, unexplained build-tooling choices (F-114, F-115) and one README environment claim the code outgrew (F-132).
    sampled:
      - name: decision-reconstruction
        what: "the 18 non-obvious decisions frozen before assessment; met when the files state why it was chosen over the obvious alternative"
        members: [F-100, F-101, F-102, F-103, F-104, F-105, F-106, F-107, F-108, F-109, F-110, F-111, F-112, F-113, F-114, F-115, F-116, F-117]
        method: "closed list D1-D18 frozen from the terrain's Pass 1 candidates and the docs: D1 zero runtime deps, D2 one strict YAML reader, D3 engine calls no model / lanes execute nothing, D4 fresh-clone and knip only under --allow-exec, D5 child-env allow-list, D6 fresh-clone clones rather than runs in place, D7 routine read-only permissions, D8 ASSAY_REF full SHA, D9 property-named axes, D10 no history file, D11 golden re-bless vs never re-bless assertions, D12 ids carry no dimension, D13 offline allows the package registry, D14 start never redraws a run in place, D15 build is the lint syntax check, D16 @types/node 20 under engines >=22, D17 core names no scanner, D18 structure-scan installs its tools at run time; one finding each"
        primary: true
      - name: doc-freshness
        what: "26 concrete doc claims (command, count, path, capability) in README.md, CLAUDE.md, RUNBOOK.md and CONTRIBUTING.md; met when the code bears the claim out"
        members: [F-118, F-119, F-120, F-121, F-122, F-123, F-124, F-125, F-126, F-127, F-128, F-129, F-130, F-131, F-132, F-133, F-134, F-135, F-136, F-137, F-138, F-139, F-140, F-141, F-142, F-143]
        method: "closed list C1-C26 read top to bottom: README help, start usage, start refuses until tools verify, tools install/verify flags, composite action input, ingest form and row flip, record --model/--pass, lane flags, validate --lane, migrate-run --write, ratchet --baseline, yardstick --floor, six owner-evidence requirements, owner commands, child env names, three exec instruments, four adapter-run instruments, view pages/data files, TypeScript dev-only; CLAUDE.md core-names block, no-history block, score --answers; RUNBOOK --bless, routine/run.mjs usage, ASSAY_READ_TOKEN step; CONTRIBUTING lint/typecheck in CI; each replayed against the code by reading, one finding each"
  - dimension: context-economy
    depth: >
      The best modules are the four instruments and the scanner adapters, each with a long head comment, a directly importing test and at most seven in-repository imports (F-205, F-206, F-207, F-208, F-209); the hubs that tie layers together (validate, ingest, views, routine) reach 15 to 20 files (F-203, F-204, F-211, F-214).
    sampled:
      - name: modules-standalone
        what: "every module an agent loads to change one concern; met when it has a head comment or README, a test that imports or runs it, and transitive in-repo imports of at most ten source files"
        members: [F-200, F-201, F-202, F-203, F-204, F-205, F-206, F-207, F-208, F-209, F-210, F-211, F-212, F-213, F-214]
        method: "closed list of 15 from git ls-files outside tests/: assay.mjs, lib/, map/ core (21 map/*.mjs not listed separately), map/validate.mjs, map/ingest.mjs, map/fresh-clone.mjs, map/dependency-scan.mjs, map/repo-census.mjs, map/structure-scan.mjs, map/scanners/adapters/, yardstick/, views/ (top-level), views/improve/, owner/, routine/; import closure read off every relative import (static and dynamic) of every non-test .mjs"
        primary: true
  - dimension: deterministic-gates
    depth: >
      The best gates are genuinely fail-closed by construction: the release trailer check refuses a shallow history and a missing surface (F-308), the tools action fails on an unpinned or unanswering tool (F-303), and the validator's negative fixtures must each be red for their one named reason (F-319); the weak seam is the test harness reading green over a skipped real-tool case (F-304, F-310) and validate reading citations clean with no target (F-312).
    sampled:
      - name: change-gates
        what: "every change gate (CI step, hook, check script); met when it goes red, not green, if what it needs is absent or never finishes"
        members: [F-300, F-301, F-302, F-303, F-304, F-305, F-306, F-307, F-308, F-309, F-310, F-311, F-312]
        method: "the 24 candidates of populations.changeGates in map/raw/enumerate.json, each triaged once in map/census-triage.yaml; 13 checks are members, 11 setup, effect or scheduled steps out of scope"
        primary: true
  - dimension: verification
    depth: >
      The best instance is strong: the practice-review rubric's repeatability is a blind sweep set
      gated at its own threshold with divergences classed by direction (F-400), backed by
      mechanical refusals of reported-but-unconfirmed outcomes (F-410, F-411, F-412) and of
      unresolvable citations (F-415); it stops short where verification rides prose, an unread PR
      verification section (F-403) and confirmed-red record (F-404), no model-in-the-loop eval
      (F-406, F-407), and a routine that can exit green without its record (F-414).
  - dimension: delegation
    depth: >
      The best instances are strong: branch deletion re-reads each planned branch@sha and refuses the
      default branch or a KEEP name before deleting anything (F-502), a release runs only on a person's
      dispatch after refusing a bad version and passing the suite (F-505), every credential the engine
      reads is the run's own job-scoped token or a read-only secret with persist-credentials off
      (F-513, F-515, F-516), and outside text is fenced and escaped as data (F-521, F-522); the weak
      edge is that executing the target is halted only in start, not in the fresh-clone and
      structure-scan commands themselves (F-506, F-508).
    sampled:
      - name: credentials-below-boundary
        what: "every secret the running engine reads (populations.secrets), each judged on whether its read site and reach are traced and scoped"
        members: [F-513, F-514, F-515, F-516]
        method: "the 14 names in populations.secrets of map/raw/enumerate.json, each triaged once in map/census-triage.yaml; 10 planted test or doc names out of scope"
        primary: true
      - name: ingested-content
        what: "every point where text from outside the team enters the engine, judged on whether it is kept as data and never acted on as an instruction"
        members: [F-517, F-518, F-519, F-520, F-521, F-522, F-523, F-524, F-525, F-526, F-527, F-528]
        method: "the terrain's ingestion list walked to each reading site: enumerate's tree read, the executed target, README claims, owner-evidence transcripts, instrument output, a review session's machine report, the lane's published files, the routine handoff, a prior run, the packet, ask-owner --found, upstream release metadata"
  - dimension: improvement-loop
    depth: >
      The best instance is strong: a recorded incident (a package shipped with its code scanner never run) became four negative fixtures CI runs that cite the incident and refuse each unrecorded disposition (F-603), and most lessons named in module headers carry a harness block of their own (F-602, F-611, F-612, F-617); the weak spots are the calibration lessons about variance identity and prior-run contamination, held by code or prose with no pinning check (F-606, F-608, F-609).
    sampled:
      - name: incidents-became-mechanisms
        what: "every lesson the repository records in a contract doc or module header (an incident, calibration result or named cause); bar: it became a test, lint, hook or guard that would catch the same failure again"
        members: [F-600, F-601, F-602, F-603, F-604, F-605, F-606, F-607, F-608, F-609, F-610, F-611, F-612, F-613, F-614, F-615, F-616, F-617, F-618]
        method: "closed list of 19 lessons from contract docs and non-test module headers (test headers excluded): L1 yaml-min fail-closed lesson (lib/yaml-min.mjs:6); L2 validate's CI-1 lesson (map/SCHEMA.md:916); L3 five loader copies / map-shaped file read as zero (map/project.mjs:52,58); L4 package shipped with queued scanner never run (map/SCHEMA.md:365); L5 empty channelCandidates read closed #269 (map/SCHEMA.md:878); L6 hand-drafted inventory missed channels (map/METHOD.md:100, map/enumerate.mjs:250); L7 prior-run pinning tautology (map/METHOD.md:76, map/SCHEMA.md:983); L8 docker-socket strength over an uninspected container (map/METHOD.md:42); L9 cal5/cal6 subject_type flip (map/SCHEMA.md:189, map/variance.mjs:14); L10 basename identity key blind (map/variance.mjs:21); L11 backlog crash wrote empty class exit 0 (map/backlog.mjs:49); L12 decisions.yaml misreads (map/validate.mjs:397); L13 sibling run report listed (views/compile.mjs:128); L14 flow list split on commas #182 (map/migrate-run.mjs:12); L15 set +e misjudged #166 (map/repo-census.mjs:708); L16 deploy word in a comment #165 (map/repo-census.mjs:1068); L17 enclosing repository history (map/start.mjs:234); L18 exit 0 with tests skipped #30 (map/fresh-clone.mjs:241); L19 low descriptor agreement measured (map/variance.mjs:38); found by searching non-test files for once/used to/before/calibration measured/prior run/earlier version/#NNN cause phrasing"
        primary: true
  - dimension: multiplayer
    depth: >
      The best instance is strong: CONSUMERS.md is a single consumer contract that gives most commands' usage with their JSON output shapes and names every run data file, whose fields views/README.md and SCHEMA.md state, down to versioned schemas for the agent-iterable handoff sequence and report model (F-700, F-710, F-711); the misses are three view commands documented only in code and two promised data files (enumerate.json, yardstick.yaml) whose full fields no doc page gives (F-703, F-706, F-708).
    sampled:
      - name: agent-access-surface
        what: "every interface assay offers a caller, person or program; met when a contract outside the code (doc usage, schema or field listing) names it"
        members: [F-700, F-701, F-702, F-703, F-704, F-705, F-706, F-707, F-708, F-709, F-710, F-711, F-712, F-713, F-714, F-715, F-716, F-717, F-718, F-719, F-720, F-721, F-722, F-723, F-724, F-725, F-726, F-727]
        method: "closed list: the four assay.mjs command families (assay.mjs:18-58 GROUPS: Map, Yardstick, Routine, Views); the ten rows of CONSUMERS.md's run layout table (CONSUMERS.md:90-99); the composite action .github/actions/tools; the reusable branch-cleanup workflow; the routine template routine/assay-routine.yml; the two lane seeds (map/scanners/adapters/*/lane.md); the owner packet manifest, the owner prompt and the owner-evidence transcripts (owner/); the two contract modules (CONSUMERS.md:108-109); and the input formats a caller authors (scanner adapter, canon, ratchet baseline, requirements register); one finding each"
        primary: true
