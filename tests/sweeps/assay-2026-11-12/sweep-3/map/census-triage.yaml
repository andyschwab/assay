schema: census-triage
version: 1
censuses:
  - census: credential
    triage:
      - candidate: "ADMIN_PASSWORD"
        out_of_scope: "an inert string planted in the enumerate test fixture (tests/enumerate-fixture/nextjs)"
      - candidate: "API_KEY"
        out_of_scope: "an inert fake value in the gitleaks sample report under tests/instruments"
      - candidate: "ASSAY_PLANTED_TOKEN"
        out_of_scope: "an inert planted name the isolation tests set to prove children never see it"
      - candidate: "ASSAY_READ_TOKEN"
        finding: F-521
      - candidate: "ASSAY_TEST_EVALUATOR_TOKEN"
        out_of_scope: "an inert planted value tests/blocks/adapter-runner.mjs sets to prove a tool never sees it"
      - candidate: "BACKUP_API_KEY"
        out_of_scope: "named only inside a test fixture's planted run (tests/fixtures/notesbox); no site in assay reads it"
      - candidate: "DECISION_KEYS"
        out_of_scope: "a constant list of YAML object keys in map/decisions.mjs, not a credential"
      - candidate: "EMAIL_SEND_API_KEY"
        out_of_scope: "a credential name inside test packet fixtures; no site in assay reads it"
      - candidate: "FETCH_TOKEN"
        finding: F-520
      - candidate: "GH_TOKEN"
        finding: F-518
      - candidate: "GITHUB_TOKEN"
        finding: F-519
      - candidate: "LEGACY_API_KEY"
        out_of_scope: "an inert string planted in the enumerate test fixture (tests/enumerate-fixture/nextjs)"
      - candidate: "POINTER_COMMAND_KEYS"
        out_of_scope: "a constant list of packet pointer keys in yardstick/packet.mjs, not a credential"
      - candidate: "POINTER_KEYS"
        out_of_scope: "a constant list of packet pointer keys in yardstick/packet.mjs, not a credential"
      - candidate: "POINTER_PATH_KEYS"
        out_of_scope: "a constant list of packet pointer keys in yardstick/packet.mjs, not a credential"
      - candidate: "POINTER_PATH_OR_LIST_KEYS"
        out_of_scope: "a constant list of packet pointer keys in yardstick/packet.mjs, not a credential"
      - candidate: "SEARCH_API_KEY"
        out_of_scope: "an inert name planted in the enumerate test fixture (tests/enumerate-fixture/nextjs)"
      - candidate: "STRIPE_SECRET_KEY"
        out_of_scope: "an example name in the owner prompt's prose and the enumerate test fixture; assay reads no such secret"
      - candidate: "STRIPE_WEBHOOK_SECRET"
        out_of_scope: "an inert name planted in the enumerate test fixture (tests/enumerate-fixture/nextjs)"
      - candidate: "TOP_KEYS"
        out_of_scope: "a constant list of packet top-level keys in yardstick/packet.mjs, not a credential"
      - candidate: "TRIAGE_KEYS"
        out_of_scope: "a constant list of triage entry keys in map/effect-triage.mjs, not a credential"
  - census: change-gates
    triage:
      - candidate: "ci step: branch-cleanup.yml/delete: Delete the planned branches"
        out_of_scope: "an effect step (deletes merged branches after merge), not a check a change passes through; its gate is Pass 5's on branch-delete"
      - candidate: "ci step: branch-cleanup.yml/plan: Plan the merged branches"
        out_of_scope: "plans the branch-delete effect on a push already merged to the default branch; it checks no change, and the gate in front of that effect is Pass 5's"
      - candidate: "ci step: ci.yml/test: ./.github/actions/tools"
        finding: F-300
      - candidate: "ci step: ci.yml/test: actions/checkout"
        out_of_scope: "a setup step that checks nothing"
      - candidate: "ci step: ci.yml/test: actions/setup-node"
        out_of_scope: "a setup step that checks nothing"
      - candidate: "ci step: ci.yml/test: npm ci"
        out_of_scope: "a setup step that installs the pinned dev dependencies; it checks nothing of the change"
      - candidate: "ci step: ci.yml/test: npm run build"
        finding: F-301
      - candidate: "ci step: ci.yml/test: npm run lint"
        finding: F-302
      - candidate: "ci step: ci.yml/test: npm run typecheck"
        finding: F-303
      - candidate: "ci step: ci.yml/test: npm test"
        finding: F-304
      - candidate: "ci step: release.yml/release: ./.github/actions/tools"
        finding: F-305
      - candidate: "ci step: release.yml/release: actions/checkout"
        out_of_scope: "a setup step that checks nothing"
      - candidate: "ci step: release.yml/release: actions/setup-node"
        out_of_scope: "a setup step that checks nothing"
      - candidate: "ci step: release.yml/release: Check every contract change carries its Consumer trailer"
        finding: F-306
      - candidate: "ci step: release.yml/release: npm ci"
        out_of_scope: "a setup step that installs the pinned dev dependencies; it checks nothing of the change"
      - candidate: "ci step: release.yml/release: npm test"
        finding: F-307
      - candidate: "ci step: release.yml/release: Refuse a malformed or existing version"
        out_of_scope: "a gate in front of the release-publish effect (it checks the dispatched version input, not the change), recorded on that effect's finding by Pass 5"
      - candidate: "ci step: release.yml/release: Tag and publish the release"
        out_of_scope: "an effect step (tags and publishes a release), not a check"
      - candidate: "ci step: tools-check.yml/check: actions/checkout"
        out_of_scope: "a setup step that checks nothing, in a weekly scheduled job no change passes through"
      - candidate: "ci step: tools-check.yml/check: Open or update the issue for pins behind upstream"
        out_of_scope: "a weekly scheduled drift report that opens an issue (the pin-drift-issue effect, Pass 5's); no change passes through it"
      - candidate: "script: lint"
        finding: F-308
      - candidate: "script: test"
        finding: F-309
      - candidate: "script: typecheck"
        finding: F-310
      - candidate: "script: validate"
        finding: F-311
  - census: model-call-telemetry
    triage: []
