# map/censuses.yaml — practice-review, assay at 2b247c0 (authored; one dimension entry per pass)
dimensions:
  - dimension: artifact-legibility
    depth: >
      The best instances are rationale written beside the rule it explains and pinned by a test, such as the one
      rule's single home guarded by doc-consistency (F-104, F-155) and the two-job routine split (F-111); the weak
      spots are choices whose why lives only in an issue number (F-106, F-116) and two README claims the code has
      outgrown (F-124, F-132).
    sampled:
      - name: decision-reconstruction
        what: "every non-obvious decision a newcomer would question; can its why be reconstructed from the repository's files alone?"
        members: [F-100, F-101, F-102, F-103, F-104, F-105, F-106, F-107, F-108, F-109, F-110, F-111, F-112, F-113, F-114, F-115, F-116]
        method: "17 decisions drawn from the terrain and the slice docs (no server/db, zero deps, strict YAML reader, dimensionless ids, no severity in the map, SHA pins, lane executes nothing, no history file, --allow-exec gate, child-env allow-list, offline definition, two-job routine, doctrine module, core names no scanner, re-bless asymmetry, canon vs findings, tools as precondition), one finding each"
        primary: true
      - name: doc-freshness
        what: "every command, path and count claim in README.md and CLAUDE.md; does it hold when replayed against the code?"
        members: [F-117, F-118, F-119, F-120, F-121, F-122, F-123, F-124, F-125, F-126, F-127, F-128, F-129, F-130, F-131, F-132, F-133, F-134, F-135, F-136, F-137, F-138, F-139, F-140, F-141, F-142, F-143, F-144, F-145, F-146, F-147, F-148, F-149, F-150, F-151, F-152, F-153, F-154]
        method: "README.md read top to bottom and CLAUDE.md in full; every concrete command, flag, path or count claim grouped by sentence or code line (38 claims), each checked against the script's usage line, the file it names, or the guard that pins it; pages README routes to were not claim-checked beyond the pointers themselves"
  - dimension: context-economy
    depth: >
      The best modules load alone with a doc, a command and their own blocks: scanners as one adapter file each with a core that names none (F-204), and the gate doctrine in one 89-line home pinned by a lockstep block (F-205); the harness, which runs only as a whole, is the cost every module shares (F-212).
    sampled:
      - name: modules-standalone
        what: "every module (a file, package or directory an agent loads to change one concern): can an agent load it alone, with something to read and something to run, and change it without loading the rest?"
        members: [F-200, F-201, F-202, F-203, F-204, F-205, F-206, F-207, F-208, F-209, F-210, F-211, F-212]
        method: "the terrain's load-bearing dirs, closed as 13 modules: assay.mjs, map instruments, map/ingest, map/validate, map/scanners adapters, map/doctrine, yardstick/, views/, views/improve/, lib/, routine/, owner/, tests harness; one finding each, citing the module's own files, imports read at each file head"
        primary: true
  - dimension: deterministic-gates
    depth: >
      The best gates are built to refuse vacuity: the harness reads an empty or throwing block as red (F-304), the
      syntax gate refuses an empty listing (F-301), the trailer check refuses a shallow history (F-306), and each
      validator check carries a single-reason negative fixture (F-312); the holes are outside CI, where npm test reads
      green without gitleaks (F-309) and validate claims clean citations it never resolved (F-311).
    sampled:
      - name: change-gates
        what: "every change gate (CI step, hook, config-driven check or package script named for a check): does it go red when the tool, secret, input or target it needs is absent, or its check never finishes?"
        members: [F-300, F-301, F-302, F-303, F-304, F-305, F-306, F-307, F-308, F-309, F-310, F-311]
        method: "populations.changeGates of map/raw/enumerate.json (24 candidates), each triaged once in map/census-triage.yaml: 12 judged one finding each, 12 out of scope (setup steps, effect steps, a gate in front of the release effect, a scheduled drift job); no git hooks exist (no .husky or .githooks), and no further config-driven gate was found in the tree"
        primary: true
  - dimension: verification
    depth: >
      The best instance is strong: the practice-review method's repeatability is a blind sweep set the harness gates
      at its own threshold with divergence sorted by direction (F-400), and instruments confirm a clean result against
      a planted positive control (F-409), though only one instrument has a control (F-410) and no check reads a change's
      stated verification (F-403, F-404).
  - dimension: delegation
    depth: >
      The best instances are real halts: release tags only on a person's dispatch after the full gate
      (F-508), branch deletion re-reads every planned tip before it deletes (F-509), and the target's
      code runs only behind --allow-exec with an allow-listed environment (F-500); the weak seam is the
      review sessions, bounded by prose rules with no data-not-instructions rule for the target's text
      (F-512, F-530) and target-carried scanner config that can silence hits (F-527).
    sampled:
      - name: credential
        what: "every secret the running application or its workflows read (populations.secrets candidates): is what it can reach traced in the code, where it is read and what it may do there?"
        members: [F-518, F-519, F-520, F-521]
        method: "the 21 populations.secrets candidates of map/raw/enumerate.json, each triaged once in parts/triage-credential.yaml: four real secrets judged one finding each, seventeen out of scope (planted fixture strings, example names, key-list constants)"
        primary: true
      - name: ingested-content
        what: "every place outside text enters assay (scanner reports, the target tree, owner answers, lane inputs, release metadata) and is stored, rendered or handed to a model: is it kept as data, stored with provenance, rendered escaped, never acted on as an instruction?"
        members: [F-522, F-523, F-524, F-525, F-526, F-527, F-528, F-529, F-530, F-531, F-532, F-533, F-534]
        method: "enumerated from the code: ingest of scanner reports, their rendering in the views, their handoff to agents, enumerate's and repo-census's and fresh-clone's reads of the target, target-carried scanner config, the owner packet, ask-owner --found, the target read by a review session, the deep-code-review lane inputs, the routine's handoff artifact, and tool release metadata; one finding each"
  - dimension: improvement-loop
    depth: >
      The best instance is a closed loop: a field or review failure is narrated in the header of a dedicated harness block that cites its issue and turns red if the fix regresses (F-618, F-622, F-628), and the method's own calibration misses became enumerators and yardstick rules rather than notes (F-601, F-602); the two lessons still held only as prose are the blind-derivation rule and variance's fact identity (F-603, F-604).
    sampled:
      - name: incidents-became-mechanisms
        what: "every lesson the repository records (incident, calibration case, review correction, fix naming its cause): did it become a mechanism (test, lint, hook, guard) that would catch the same failure again?"
        members: [F-600, F-601, F-602, F-603, F-604, F-605, F-606, F-607, F-608, F-609, F-610, F-611, F-612, F-613, F-614, F-615, F-616, F-617, F-618, F-619, F-620, F-621, F-622, F-623, F-624, F-625, F-626, F-627]
        method: "Closed list from two sources. (1) Lessons narrated in prose in map/METHOD.md, map/SCHEMA.md, CLAUDE.md and the headers of map/enumerate.mjs, map/variance.mjs, lib/yaml-min.mjs and views/improve/handoff.mjs, found by grep for lesson/calibration/cal5/false-green/docker-socket/hand-drafted/in-the-field wording: docker-socket miss, hand-drafted channel inventory, hand-derived tool-def channels, pinned-prior tautology, cal5/cal6 identity key, CI-1 fail-closed, handoff false-green (7). (2) Every tests/blocks/*.mjs whose first six lines narrate a prior defect in past tense (grep for was/were/used to/before this fix/once held/printed/silently kept/crashed/found by/predates/had, hand-filtered to drop false hits: corroboration, instrument-roster, intake-maintain-improve, lane-collected, lane-reviewed, refusal-commands, migrate-run, migrate-run-retired-id, retired-names, second-secret-scanner-adapter, which narrate renames or refactors, not failures), plus score-path, which names its lesson (21). The field-measured census-mode and descriptor figures are folded into the sweep-gate member (F-622). Excluded: SCHEMA.md's false-green cron guard (a dimension-assignment worked case, decision rationale) and CLAUDE.md's house rules (rules, not lessons). Not read: tests/sweeps, tests/fixtures/*/map, ANSWERS.yaml, git history."
        primary: true
  - dimension: multiplayer
    depth: >
      The best of the agent surface is high: CONSUMERS.md is one stated, release-pinned contract with the JSON
      shape of each command's output (F-708, F-720), and the run's data files carry versioned schema ids built
      for an agent or a renderer that imports nothing (F-742, F-743, F-744); the gaps are at the edges, a
      fresh-clone dispatch the contract asks for but does not pin (F-710) and two Improve pages with no data
      twin (F-747, F-748).
    sampled:
      - name: agent-access-surface
        what: "Every interface assay offers a caller (each command in the assay.mjs command table, each data file or format a caller reads or writes, the composite action, the reusable workflow, the routine template, the contract modules): can an agent reach and use it through an API or format contract stated outside the code?"
