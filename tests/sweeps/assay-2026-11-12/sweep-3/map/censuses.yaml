        method: "Closed list: the 31 commands of the assay.mjs command table (assay.mjs:18-58); every run file in CONSUMERS.md's run layout and the views/README.md data-file table, with the view pages as one member and axes.md, leverage.md, security-gate.yaml and the handoff directory each their own (20); the lane listing JSON and the lane seed format; the caller-authored inputs (adapter yaml, packet manifest, requirements register via yardstick --json, map/censuses.yaml); the composite tools action, the branch-cleanup reusable workflow, the routine template, and the two contract modules. Met = invocation and a machine-readable output or format stated in a doc outside the code; off-CONSUMERS members met only with plausible confidence."
