- id: F-500
  dimension: delegation
  polarity: strength
  subject_type: effect
  label: "fresh-clone runs the target's own code"
  observation: >
    fresh-clone runs the target's install, lifecycle scripts, build, lint, typecheck, test and migrate
    steps through a shell with a per-step SIGKILL timeout and an allow-listed environment (PATH, HOME,
    CI, npm_config_*, proxy plumbing without userinfo), and `assay start` runs it only under the
    flag --allow-exec, recording it skipped with the reason otherwise; the flag is a command-line
    argument, so it holds against an unflagged call but not against a caller (person or agent) who
    passes it, and the file states it is not a sandbox.
