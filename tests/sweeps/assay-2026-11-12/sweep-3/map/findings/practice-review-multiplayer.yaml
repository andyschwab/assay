# Discovery
- id: F-762
  dimension: multiplayer
  polarity: strength
  subject_type: artifact
  observation: >
    Context is consolidated in one substrate: the run directory, placed by one module, is what instruments write,
    lanes read as inputs and publish into, and views read, rather than a store per integration.
  evidence: ["CONSUMERS.md:85", "map/scanners/CONTRACT.md:917", "map/scanners/CONTRACT.md:919"]
  confidence: confirmed
  property: shared-context-substrate
- id: F-763
  dimension: multiplayer
  polarity: strength
  subject_type: artifact
  observation: >
    The owner's context lives in one packet read the same way beside or inside the repository, and a run carries a
    copy of it kept apart from what the run decided rather than merged.
  evidence: ["owner/PACKET.md:7", "views/README.md:79", "README.md:134"]
  confidence: confirmed
  property: shared-context-substrate
- id: F-764
  dimension: multiplayer
  polarity: strength
  subject_type: process
  observation: >
    The routine's automatic artifact upload states who can read it (anyone who can read the repository's workflow
