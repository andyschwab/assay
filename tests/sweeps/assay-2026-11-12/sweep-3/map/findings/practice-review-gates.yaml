- id: F-300
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    ci.yml's tools step runs the composite action under set -euo pipefail, so a failed tools install (download,
    checksum, unsupported platform) or a verify that finds any pinned tool absent, broken or at another version exits
