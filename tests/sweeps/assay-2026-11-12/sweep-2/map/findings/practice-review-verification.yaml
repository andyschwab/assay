# Pass 4 — verification (practice-review). Context lists: rubric-calibration,
# change-verification, ai-feature-evals; discovery: change-demonstrable,
# effect-confirmed-not-reported, output-checked-regardless-of-fluency.

# ── rubric-calibration (d-calibration-harness context) ─────────────────────
- id: F-301
  dimension: verification
  polarity: strength
  subject_type: process
  observation: >
    The practice-review method is hardened by measurement: blind sweeps of one frozen target are
    committed as sweep sets, and npm test runs `variance --set` over every committed set and fails
    when fact presence, descriptor agreement or requirement agreement falls below the set's threshold.
  evidence: ["map/variance.mjs:58", "map/variance.mjs:303", "tests/blocks/sweep-gate.mjs:22", "tests/blocks/sweep-gate.mjs:24", "README.md:230"]
  confidence: confirmed

- id: F-302
  dimension: verification
  polarity: strength
  subject_type: process
  observation: >
    Divergence between sweeps is disposed into named classes rather than left as a raw percentage:
    each descriptor divergence is classed safer, riskier or unordered with a both-ways judgment-drift
    flag, and the method backlog files it under a closed class list (descriptor-divergence,
    coverage-divergence, evidence-inaccuracy, un-enumerated-population).
  evidence: ["map/variance.mjs:228", "map/variance.mjs:229", "map/variance.mjs:246", "map/backlog.mjs:67", "map/backlog.mjs:72"]
  confidence: confirmed

- id: F-303
  dimension: verification
  polarity: gap
  subject_type: process
  observation: >
    Nothing ties a committed sweep set to the method it measured: the set records a method_commit
    that is only checked to be a non-empty string, so after METHOD.md or SCHEMA.md changes the gate
    still passes on sweeps drawn under the old method, and re-running the set is a doc instruction.
  evidence: ["map/variance.mjs:286", "tests/blocks/sweep-gate.mjs:22", "map/METHOD.md:783"]
  confidence: confirmed

- id: F-304
  dimension: verification
  polarity: gap
  subject_type: process
  observation: >
    Because the sweep sets are frozen and each set authors its own threshold (any value 0–100), the
    repeatability gate re-measures the same stored files every run, so it pins variance.mjs's
    arithmetic over old sweeps rather than the current method's repeatability, and no floor bounds
    the threshold a set may declare.
  evidence: ["map/variance.mjs:290", "tests/blocks/sweep-gate.mjs:23", "tests/blocks/sweep-gate.mjs:24"]
  confidence: confirmed

- id: F-305
  dimension: verification
  polarity: gap
  subject_type: process
  observation: >
    The gate does not require any committed set to be blind: `blind` must merely be a boolean and is
    printed, and the only set the harness requires by name is the fixture-sized notesbox set, so a
    non-blind set (authored beside its answers) satisfies the repeatability gate.
  evidence: ["map/variance.mjs:287", "map/variance.mjs:396", "tests/blocks/sweep-gate.mjs:19"]
  confidence: confirmed

- id: F-306
  dimension: verification
  polarity: gap
  subject_type: process
  observation: >
    The deep-code-review lane is a relied-on judgment rubric pinned at an external commit, but no
    sweep set for it is named anywhere outside the blind tests/sweeps/ path (the harness requires only
    the practice-review fixture set) and its checks grade stored reports, so its repeatability is not
    measured that this pass could see.
  evidence: ["map/scanners/adapters/deep-code-review/lane.md:17", "tests/blocks/sweep-gate.mjs:19", "tests/blocks/dcr-fixture-runs.mjs:2"]
  confidence: plausible

# ── ai-feature-evals (d-ai-feature-evals context) ──────────────────────────
- id: F-307
  dimension: verification
  polarity: fact
  subject_type: artifact
  observation: >
    The engine's code calls no model: its AI features are the lane seed bodies (practice-review,
    deep-code-review) and the ask-owner prompt, each answered in a session or tool a person started,
    and the routine always records the judgment scanners skipped.
  evidence: ["map/lane.mjs:4", "routine/run.mjs:19", "owner/ask-owner.md:13"]
  confidence: confirmed

- id: F-308
  dimension: verification
  polarity: strength
  subject_type: process
  observation: >
    The lanes' answers are graded for quality in CI: npm test scores the stored practice-review and
    deep-code-review runs over the public fixtures against their known-answer sheets (recall,
    mis-homed, false positives on the control) and fails on any drift from the scores pinned in golden.json.
  evidence: ["tests/blocks/fixture-recall.mjs:11", "tests/blocks/dcr-fixture-runs.mjs:11", "tests/golden.json:12", "tests/harness.mjs:151"]
  confidence: confirmed

- id: F-309
  dimension: verification
  polarity: gap
  subject_type: process
  observation: >
    That CI eval grades frozen, non-blind outputs (the same agent wrote the answers and the findings),
    so a change to a lane prompt, the pinned reviewer method or the model is never re-answered in CI;
    the eval proves the pipeline and recall floor, not the current feature's answer quality.
  evidence: ["tests/fixtures/README.md:64", "tests/fixtures/README.md:65", "tests/blocks/dcr-fixture-runs.mjs:5"]
  confidence: confirmed

- id: F-310
  dimension: verification
  polarity: gap
  subject_type: process
  observation: >
    The ask-owner prompt, whose answers become a repository's packet, has its rendering tested and its
    reply checked for format by validate-packet, but no eval of the quality of the answers a model
    produces from it was found.
  evidence: ["owner/ask-owner.md:8", "tests/blocks/ask-owner.mjs:14", "tests/blocks/ask-owner.mjs:22"]
  confidence: plausible

# ── change-verification (d-change-carries-verification context) ────────────
- id: F-311
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    The pull request template has a "How this is verified" section, but it is an HTML comment the
    author may leave empty, and no workflow or harness block reads the pull request body, so CI never
    refuses an empty verification section.
  evidence: [".github/PULL_REQUEST_TEMPLATE.md:5", ".github/PULL_REQUEST_TEMPLATE.md:7", ".github/workflows/ci.yml:11"]
  confidence: confirmed

- id: F-312
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    CLAUDE.md requires the pull request body and the commit message that land an assertion to say it
    was confirmed red, but nothing checks either text for that statement.
  evidence: ["CLAUDE.md:62", "CLAUDE.md:63", "tests/README.md:53"]
  confidence: confirmed

- id: F-313
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    The repository does enforce a mandatory statement in commit messages for one class of change: a
    commit touching the consumer surface must carry a `Consumer:` trailer, and npm test (over the
    repository's own history) and the release job refuse one without it; the trailer states consumer
    impact, not verification.
  evidence: ["lib/release-notes.mjs:15", "lib/release-notes.mjs:37", "tests/blocks/consumer-contract.mjs:126", ".github/workflows/release.yml:43"]
  confidence: confirmed

# ── discovery ──────────────────────────────────────────────────────────────
- id: F-314
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    Tool installation confirms its effect rather than trusting the download: each fetched archive is
    checked against its pinned sha256 before use, and the composite action follows install with
    `tools verify --run`, which asks each binary its version and refuses one that does not print the pin.
  evidence: ["map/tools.mjs:127", "map/tools.mjs:156", ".github/actions/tools/action.yml:29", ".github/actions/tools/action.yml:30"]
  confidence: confirmed
  property: effect-confirmed-not-reported

- id: F-315
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    An instrument's success is not taken from its exit code alone: a report that fails to ingest
    records the instrument failed, and for an adapter with a positive control, zero hits on the target
    count as clean only after the planted cases fired.
  evidence: ["map/start.mjs:112", "map/start.mjs:256", "map/start.mjs:259"]
  confidence: confirmed
  property: effect-confirmed-not-reported

- id: F-316
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    The positive control is optional per adapter, and only opengrep of the five adapters with a
    `run:` block declares one; checkov, gitleaks, osv-scanner and zizmor runs that report zero hits
    are trusted as clean without a planted case proving the run could see anything.
  evidence: ["map/start.mjs:258", "map/scanners/adapters/opengrep.yaml:55", "map/scanners/adapters/checkov.yaml:20", "map/scanners/adapters/gitleaks.yaml:41", "map/scanners/adapters/osv-scanner.yaml:27", "map/scanners/adapters/zizmor.yaml:34"]
  confidence: confirmed
  property: effect-confirmed-not-reported

- id: F-317
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    `assay start` and the routine re-read what they wrote before reporting success: start exits with
    validate's status over the run it just drew, and the routine validates the run against the target
    before it compiles or gates.
  evidence: ["map/start.mjs:502", "map/start.mjs:519", "routine/run.mjs:239", "routine/run.mjs:240"]
  confidence: confirmed
  property: effect-confirmed-not-reported

- id: F-318
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    The routine's own record is not confirmed: finish() catches a failed write of routine.yaml as a
    warning and returns the original exit code, so a routine can exit 0 with gate held while the run
    carries no record of what happened.
  evidence: ["routine/run.mjs:195", "routine/run.mjs:199", "routine/run.mjs:200"]
  confidence: confirmed
  property: effect-confirmed-not-reported

- id: F-319
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    The release job treats `gh release create`'s exit status as the release having happened; no step
    reads the tag or release back.
  evidence: [".github/workflows/release.yml:50"]
  confidence: confirmed
  property: effect-confirmed-not-reported

- id: F-320
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    Findings are checked against the tree however fluent they read: `validate --target` fails closed on
    a cited path that does not exist in the target and on a cited line past the end of its file, and
    `validate --lane` refuses to check a collected lane without the target it read.
  evidence: ["map/validate.mjs:98", "map/validate.mjs:376", "map/validate.mjs:380"]
  confidence: confirmed
  property: output-checked-regardless-of-fluency

- id: F-321
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    That evidence check runs only when a caller remembers `--target`: validate and compile read the
    target from the argument alone, while ingest falls back to the target the run record holds, so a
    plain `compile <run>` packages findings whose citations were never resolved.
  evidence: ["map/validate.mjs:93", "views/compile.mjs:48", "views/compile.mjs:72", "map/ingest.mjs:1227"]
  confidence: confirmed
  property: output-checked-regardless-of-fluency

- id: F-322
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    The resolution check confirms a path and a line number exist, not that the line says what the
    observation claims, and a cited directory is skipped; the code states this limit, and a lane is
    otherwise asked to re-resolve its own evidence by reading.
  evidence: ["map/validate.mjs:362", "map/validate.mjs:377", "map/scanners/adapters/practice-review/lane.md:23"]
  confidence: confirmed
  property: output-checked-regardless-of-fluency

- id: F-323
  dimension: verification
  polarity: strength
  subject_type: process
  observation: >
    A change to the engine demonstrates itself as a reviewable diff: scored public fixtures pin recall
    and false positives in golden.json, a moved score fails npm test until re-blessed in the same pull
    request, and `--bless` refuses to rewrite the pins while any unit or negative check is red.
  evidence: ["tests/regression.mjs:12", "tests/harness.mjs:131", "tests/harness.mjs:133", ".github/PULL_REQUEST_TEMPLATE.md:9"]
  confidence: confirmed
  property: change-demonstrable
