        primary: true
  - dimension: deterministic-gates
    depth: >
      The best instance is strong: CI's npm test sits behind a tools action that refuses a missing or wrong-version instrument (F-201), runs a harness that refuses an empty or unloadable block set (F-206), and pins each validator rule with a negative that must be red for its own reason only (F-216); the weak points are a local npm test that can read green without gitleaks (F-213), a lint that only parses (F-233), and no commit hook (F-228).
    sampled:
      - name: change-gates
        what: "every change gate a change passes through (CI step, job, hook, config-driven check script), asked whether it goes red when what it needs is absent or never finishes"
        members: [F-201, F-202, F-203, F-204, F-205, F-206, F-207, F-208, F-209, F-210, F-211, F-212, F-213, F-214, F-215]
        method: "every candidate in populations.changeGates of map/raw/enumerate.json (24), each triaged once in census_triage; 15 judged as gates and 9 set out of scope (setup steps that check nothing, and the branch-delete, release-publish and issue-upsert effects). No commit or push hook and no other config-driven check was found beyond tsconfig.json, which the typecheck script covers"
        primary: true
  - dimension: verification
    depth: >
      The best instance is real measurement: the practice-review method's repeatability is a committed
      blind sweep set gated in npm test with divergence classed by direction and filed into closed classes
      (F-301, F-302), and evidence citations fail closed against the target (F-320); it is bounded by a gate
      that re-measures frozen sweeps without tying them to the current method (F-303, F-304) and by
      checks that run only when a flag is remembered (F-321).
  - dimension: delegation
    depth: >
      The best instances are real gates at the irreversible boundary: a release exists only after a
      person's dispatch, the gate and a version check, with the write token held by the publish step
      alone (F-407), branch deletes re-read each planned branch@sha before acting (F-408), and every
      target-touching child gets one allow-listed environment a planted-token test pins (F-433); the
      weak edge is the outward reads nobody gates, where dependency inventories leave for advisory
      databases on every run (F-404, F-411) and fetched code runs with floating dependencies (F-405, F-427).
