  candidate_agreement: 0     # measured per listed candidate (#312): 0 of 2 (0%). Before → after: per channel 1 of 9 (11%) → per candidate 0 of 2 (0%). Of 13 listed candidates, 11 are out of scope in every sweep, no scope disagreement; the 2 compared part (http write (js) on external; surface: migrate-run.mjs on gate_type and telemetry), in both directions. The rest of the effects sit outside v0.9.0's list (16 slugs no candidate maps to), counted apart
