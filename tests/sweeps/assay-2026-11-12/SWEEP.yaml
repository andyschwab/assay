# its own slice (M5) and each closed census was triaged once per candidate in map/census-triage.yaml
# (M6). What the record should know:
# - No send-back: each lane's own check found violations and the lane fixed them before publishing
#   (sweep-1 none, sweep-2 22 from one indentation slip, sweep-3 1); every run validated on collection.
# - sweep-2's gates and delegation subagents each imported the target's lib/yaml-min.mjs once to parse
