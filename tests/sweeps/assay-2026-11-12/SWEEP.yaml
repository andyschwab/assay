# node assay.mjs variance --set tests/sweeps/assay-2026-11-12
#
# BLIND, the sweep after M4 (#262), M5 (#263), #287 and M6 (#286) at v0.9.0: three practice-review
# lanes over this repository at the SAME commit as assay-2026-11-11b and -11c (2b247c0), so only the
# method changed. Each lane was a fresh child session seeded by `assay lane practice-review` at
# v0.9.0, all passes claude-opus-5-5, the target read-only, given the run's map/raw/enumerate.json at
