#   subagents' own files, writing nothing. No other deviation.
# - Spend per session (practice-review row of each run record): USD 17.69, 19.64, 21.70.
# Against assay-2026-11-11c read at the same engine (58%, 7 of 12): requirement agreement 10 of 14.
# The three closed censuses agree in every sweep: d-credentials-enumerated (21 candidates, the same 4
# judged and 17 out of scope in all three), d-change-gates-fail-closed and d-model-call-telemetry (an
# empty list); d-readme-true and d-decisions-reconstruct, which parted in -11c, now agree too. Still
# parting: d-effects-gated and d-effects-traced (the effect rows, which agreed in -11c),
# d-capability-budget and d-agent-consumable-surface (an open census). Descriptor agreement fell to
# 1 of 9 (30% in -11c): the lanes name channels the listing does not (11 slugs seen by one sweep).
# Re-measured under #298's channel key (a channel is the candidate its run's effect-triage maps to
# it, else its slug): 20 channels → 18, shared 9 → 9, identical 1 → 1 (11%), unchanged: v0.9.0's
# list named 2 of the 12 channels, so most effects keep their slug until a sweep reads a list that
# names them; requirement agreement 10 of 14 (71%), unchanged.
