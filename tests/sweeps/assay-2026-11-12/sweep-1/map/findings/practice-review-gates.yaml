- id: F-300
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The branch-cleanup delete step runs under set -euo pipefail in a job with a 10-minute timeout, refuses every
    entry that names no planned tip or names the default branch or a KEEP pattern before deleting anything, and
    re-reads each branch so a failed read or failed DELETE fails the job rather than passing.
  evidence: [.github/workflows/branch-cleanup.yml:110, .github/workflows/branch-cleanup.yml:117, .github/workflows/branch-cleanup.yml:123, .github/workflows/branch-cleanup.yml:129]
  confidence: confirmed
- id: F-301
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The branch-cleanup plan step runs under set -euo pipefail with a 10-minute job timeout, so a failed GitHub read
    (including inside a piped wc -l count) fails the run rather than planning nothing; its one `|| true` only
    absorbs grep -c's exit on a zero count, and the harness pins the failed-read case red against a fake gh.
  evidence: [.github/workflows/branch-cleanup.yml:57, .github/workflows/branch-cleanup.yml:68, .github/workflows/branch-cleanup.yml:82, tests/blocks/branch-cleanup.mjs:141]
