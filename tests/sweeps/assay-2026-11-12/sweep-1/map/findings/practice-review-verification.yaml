# practice-review Pass 4 — verification affordances (assay @ 2b247c0), blind.
# Context lists filled: rubric-calibration (F-400..F-403), change-verification (F-404..F-406),
# ai-feature-evals (F-407, F-408). Discovery: effect-confirmed-not-reported (F-409..F-413),
# output-checked-regardless-of-fluency (F-414, F-415), change-demonstrable (F-416).
- id: F-400
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    The practice-review method is hardened by measurement: committed blind sweep sets (several
    fresh contexts over one target commit) are measured by variance.mjs on fact presence,
    descriptor agreement and requirement agreement, divergence is classed by direction
    (safer, riskier, unordered, both-ways as judgment drift), and npm test fails any set below
    its own SWEEP.yaml threshold.
  evidence:
    - map/variance.mjs:52
    - map/variance.mjs:58
    - tests/blocks/sweep-gate.mjs:22
    - map/METHOD.md:421
  confidence: confirmed
  label: "blind sweep sets gated in CI"
- id: F-401
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    A sweep set records the method_commit it was drawn at, but nothing compares that to the
    current METHOD.md or SCHEMA.md; re-running the set when the method changes what a pass
    records is a prose instruction, so the gated repeatability figure can describe an older method.
  evidence:
    - map/METHOD.md:783
    - map/variance.mjs:286
    - tests/blocks/sweep-gate.mjs:23
  confidence: plausible
- id: F-402
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    The known-answer scorer disposes every planted item into named classes (recovered, missed,
    mis-homed, out-of-scope, and false positive on a control target) and exits 1 on a missed or
    mis-homed item; the regression harness pins each scored fixture's counts in tests/golden.json.
  evidence:
    - map/score.mjs:12
    - map/score.mjs:186
    - tests/blocks/fixture-recall.mjs:14
    - tests/blocks/fixture-recall.mjs:28
  confidence: confirmed
- id: F-403
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    The deep-code-review lane's output is scored against known answers from stored machine
    reports, but I found no repeatability measure for it (no blind n-run set the harness names
    for it); the sweep gate requires only the fixture-notesbox set by name.
  evidence:
    - tests/blocks/dcr-fixture-runs.mjs:1
    - tests/blocks/sweep-gate.mjs:19
    - map/scanners/adapters/deep-code-review/lane.md:3
  confidence: plausible
- id: F-404
  dimension: verification
  polarity: gap
  subject_type: contract
  observation: >
    The pull request template carries a "How this is verified" section asking for concrete
    evidence, but no workflow or harness block reads the pull request body, so an empty or
    deleted section lands as long as the CI steps pass.
  evidence:
    - .github/PULL_REQUEST_TEMPLATE.md:5
    - .github/workflows/ci.yml:11
    - .github/workflows/ci.yml:39
  confidence: confirmed
- id: F-405
  dimension: verification
  polarity: fact
  subject_type: contract
  observation: >
    The one commit-message check CI enforces is the Consumer trailer rule (npm test runs it over
    this repository's history and release.yml runs it before tagging); it states what a consumer
    must change, not how the change was verified.
  evidence:
    - tests/blocks/consumer-contract.mjs:122
    - lib/release-notes.mjs:36
    - .github/workflows/release.yml:42
  confidence: confirmed
- id: F-406
  dimension: verification
  polarity: gap
  subject_type: contract
  observation: >
    CLAUDE.md requires the pull request body and commit message landing a new assertion to say it
    was confirmed red with its rule reverted, but the guard only checks that CLAUDE.md states the
    rule, never that a change carries the statement.
  evidence:
    - CLAUDE.md:60
    - CLAUDE.md:62
    - tests/blocks/doc-consistency.mjs:90
  confidence: confirmed
- id: F-407
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    The deep-code-review lane's answers are evaluated in CI: real machine reports stored for two
    public fixtures are re-converted and scored on the scanner's rows alone, and the named planted
    items must recover on their axis.
  evidence:
    - tests/blocks/dcr-fixture-runs.mjs:2
    - tests/blocks/dcr-fixture-runs.mjs:11
    - tests/blocks/dcr-fixture-runs.mjs:26
  confidence: confirmed
- id: F-408
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    The practice-review lane's answer quality is graded in CI only over stored fixture runs, which
    METHOD.md says prove the pipeline rather than the lane when authored beside the answers;
    nothing re-evaluates the lane when its seed or METHOD.md changes, so a prompt change is not
    re-scored until someone re-runs and commits a fixture.
  evidence:
    - tests/blocks/fixture-recall.mjs:11
    - map/METHOD.md:779
    - map/scanners/adapters/practice-review/lane.md:3
  confidence: plausible
- id: F-409
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    start does not trust an instrument's exit code alone: a run counts only once its report
    ingests, and an instrument with a positive control must report every planted hit on a scratch
    copy before its zero results on the target read as clean, else it is recorded failed and the
    target is not run.
  evidence:
    - map/start.mjs:104
    - map/start.mjs:112
    - map/start.mjs:256
  confidence: confirmed
  property: effect-confirmed-not-reported
- id: F-410
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    A scanner recorded ran is not taken on the record's word: validate fails a run whose
    record says ran while the base carries no rows and no explicit (possibly empty) findings file
    from it; record defers to that check by design.
  evidence:
    - map/validate.mjs:309
    - map/record.mjs:32
  confidence: confirmed
  property: effect-confirmed-not-reported
- id: F-411
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    Installing a tool is confirmed, not reported: each download is checked against its pinned
    sha256 before install, and the tools action then asks every installed binary its version and
    fails the step unless each answers at its pin.
  evidence:
    - map/tools.mjs:126
    - map/tools.mjs:149
    - .github/actions/tools/action.yml:30
  confidence: confirmed
  property: effect-confirmed-not-reported
- id: F-412
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    The routine's finish() catches a failure to write routine.yaml, prints a warning and still
    returns the exit code it computed, so a routine job can exit 0 with no run record although the
    record is the stated reason the step exists.
  evidence:
    - routine/run.mjs:190
    - routine/run.mjs:199
    - routine/run.mjs:200
  confidence: confirmed
  property: effect-confirmed-not-reported
- id: F-413
  dimension: verification
  polarity: fact
  subject_type: control
  observation: >
    The release and branch-delete jobs take the gh call's exit status under set -e as the effect;
    neither reads the release or the ref back afterwards, though branch-cleanup re-reads each
    branch tip before deleting.
  evidence:
    - .github/workflows/release.yml:50
    - .github/workflows/branch-cleanup.yml:129
    - .github/workflows/branch-cleanup.yml:131
  confidence: confirmed
  property: effect-confirmed-not-reported
- id: F-414
