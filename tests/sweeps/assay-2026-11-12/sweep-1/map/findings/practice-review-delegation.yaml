# ── capabilities (the two review lanes) ──────────────────────────────────────
- id: F-511
  dimension: delegation
  polarity: gap
  subject_type: capability
  label: "practice-review lane session"
  observation: >
    The practice-review lane's session reads an arbitrary target tree and the run's enumeration (untrusted), may
    review a private repository, and publishes an Artifact page, and its only restraint on acting on injected text
    is the seed's prose HARD RULES, with any authorization block left to the consumer.
  evidence: [map/scanners/adapters/practice-review/lane.md:11, map/scanners/adapters/practice-review/lane.md:13, map/scanners/adapters/practice-review/lane.md:25, map/lane.mjs:10]
