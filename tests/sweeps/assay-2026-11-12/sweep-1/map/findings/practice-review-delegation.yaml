# ── effects ──────────────────────────────────────────────────────────────────
- id: F-500
  dimension: delegation
  polarity: gap
  subject_type: effect
  observation: >
    `migrate-run` rewrites and renames a stored run's files in place only under --write, refusing a rename that would
    land on an existing file and any list that does not read back identically, but it keeps no backup and its only
    account of what it rewrote is console output, so a rewrite leaves no durable record.
  evidence: [map/migrate-run.mjs:19, map/migrate-run.mjs:99, map/migrate-run.mjs:102, map/migrate-run.mjs:126]
  confidence: confirmed
  effect:
    channel: migrate-run
    reversibility: irreversible
    external: false
    gate_type: deterministic-halt
    fail_mode: closed
    telemetry: none
    blast_scope: user
