    lands as a structured row in map/scanners.yaml beside the archived raw report.
  evidence: [map/start.mjs:464, map/record.mjs:7, map/ingest.mjs:1251, map/ingest.mjs:1254]
  confidence: confirmed
  effect:
    channel: run-write
    reversibility: reversible
