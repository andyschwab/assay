# ── credential census ────────────────────────────────────────────────────────
- id: F-513
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    ASSAY_READ_TOKEN is read only by the commented-out token line of the two engine checkout steps, with
    persist-credentials off, and the runbook states its reach as read access to the one engine repository and
    how to rotate or revoke it.
  evidence: [routine/assay-routine.yml:64, routine/assay-routine.yml:65, routine/assay-routine.yml:124, RUNBOOK.md:62]
  confidence: confirmed
- id: F-514
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    FETCH_TOKEN carries the job token into the gate job's one `git fetch` of the base branch through a per-command
    config header in that step's environment, never .git/config, in a workflow whose permissions are contents read
    and a job that never runs the change's code.
  evidence: [routine/assay-routine.yml:33, routine/assay-routine.yml:110, routine/assay-routine.yml:114, routine/assay-routine.yml:115]
  confidence: confirmed
- id: F-515
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    GH_TOKEN is the job token in four jobs, each declaring its own permissions block (release contents write,
    branch-cleanup plan read-only, its delete job contents write, tools-check issues write), and is used only by
    the gh CLI calls those jobs make.
  evidence: [.github/workflows/release.yml:24, .github/workflows/branch-cleanup.yml:59, .github/workflows/branch-cleanup.yml:111, .github/workflows/tools-check.yml:17]
  confidence: confirmed
- id: F-516
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    GITHUB_TOKEN is set only in the tools-check job and read in one place, map/tools.mjs, which sends it solely as a
    bearer header on the read of a GitHub upstream's latest release.
  evidence: [.github/workflows/tools-check.yml:20, map/tools.mjs:201, map/tools.mjs:202]
  confidence: confirmed

# ── ingested-content census (I1–I6) ──────────────────────────────────────────
- id: F-517
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    I1, scanner reports: ingest checks each tool's exit against its success set, never copies a matched secret,
    writes each row with its source and native id, collapses every text field to one line inside quoted or folded
    scalars, and archives the raw report with output tails dropped.
  evidence: [map/ingest.mjs:15, map/ingest.mjs:1163, map/ingest.mjs:1170, map/ingest.mjs:99]
  confidence: confirmed
- id: F-518
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    I2, the target tree: enumerate, toolchain and repo-census read the checkout's files as data and execute
    nothing of it, writing what they find to the run's JSON as members and evidence.
  evidence: [map/enumerate.mjs:12, map/toolchain.mjs:2, map/repo-census.mjs:13, map/start.mjs:19]
  confidence: confirmed
- id: F-519
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    I3, the owner packet: it is parsed defensively as data, never instructions, its command pointers are never
    executed, and any secret- or email-shaped value anywhere in it is refused.
  evidence: [yardstick/packet.mjs:7, yardstick/packet.mjs:65, yardstick/packet.mjs:275, yardstick/packet.mjs:309]
  confidence: confirmed
- id: F-520
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    I4, a review lane's collected outputs: the consumer's `validate --lane` requires the lane recorded ran and every
    file it publishes present, reads each citation against the target, and the lane is told to publish its files
    verbatim and HTML-escaped.
  evidence: [map/validate.mjs:4, map/validate.mjs:327, map/validate.mjs:329, map/scanners/adapters/practice-review/lane.md:25]
  confidence: confirmed
- id: F-521
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    I5, the owner's decisions: validate holds their keys, actions, dates and a role-not-name `by`, but the handoff's
    waived list renders a decision's free-text reason and `by` with whitespace collapsed only, while the findings
    list beside it escapes the same reason with mdText.
  evidence: [map/validate.mjs:417, views/improve/handoff.mjs:127, views/improve/handoff.mjs:314, views/improve/handoff.mjs:328]
  confidence: confirmed
- id: F-522
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    I6, target text in the handoff: every scanner observation and fix is fenced as data from the scanned repo under
    a tag hashed from the run's own scanner text, with fence markers inside a body spaced out so no text can close
    its fence.
  evidence: [views/improve/handoff.mjs:26, views/improve/handoff.mjs:153, views/improve/handoff.mjs:155, views/improve/handoff.mjs:161]
  confidence: confirmed

