# ── discovery ────────────────────────────────────────────────────────────────
- id: F-525
  dimension: delegation
  polarity: strength
  subject_type: control
  property: acting-principal-stated
  observation: >
    Every workflow that writes acts as its own job token with a stated per-job scope over a read-only default,
    so who acts with what is readable job by job.
  evidence: [.github/workflows/release.yml:17, .github/workflows/release.yml:24, .github/workflows/branch-cleanup.yml:50, .github/workflows/tools-check.yml:11]
  confidence: confirmed
- id: F-526
  dimension: delegation
  polarity: gap
  subject_type: control
  property: acting-principal-stated
  observation: >
    A review lane's session runs as whatever principal and tool set the consumer starts it with; the engine names
    no model, operator or authorization, so the acting identity of the model context is not stated anywhere in the tree.
  evidence: [map/lane.mjs:10, map/lane.mjs:11, map/scanners/adapters/practice-review/lane.md:11]
  confidence: confirmed
- id: F-527
  dimension: delegation
  polarity: strength
  subject_type: control
  property: scope-promotion-path
  observation: >
    branch-cleanup's dispatched or called run is a dry run by default that prints its plan, and graduates to deleting
    only on a default-branch push or when a person or caller turns dry_run off, with a caller granting at most the
    permissions the delete job needs.
  evidence: [.github/workflows/branch-cleanup.yml:7, .github/workflows/branch-cleanup.yml:10, .github/workflows/branch-cleanup.yml:43, .github/workflows/branch-cleanup.yml:66]
  confidence: confirmed
- id: F-528
  dimension: delegation
  polarity: strength
  subject_type: control
  property: policy-reads-provenance
  observation: >
    The handoff labels each remedy by origin, scanner-verbatim, triage or eval-authored, fencing target-derived
    text as data and leaving the evaluator's own prose unfenced but provenance-labeled, so an executing agent sees
    where each entry came from.
  evidence: [views/improve/handoff.mjs:6, views/improve/handoff.mjs:12, views/improve/handoff.mjs:27, views/improve/handoff.mjs:28]
  confidence: confirmed
- id: F-529
  dimension: delegation
  polarity: strength
  subject_type: control
  property: control-matches-modality
  observation: >
    Automation gets output checks (an instrument's exit must sit in its success set or ingest halts), while the
    agentic review lanes get a behavioural spec (the seed's HARD RULES) plus the consumer's validation of what they
    publish before it is recorded.
  evidence: [map/ingest.mjs:9, map/ingest.mjs:11, map/scanners/adapters/practice-review/lane.md:13, map/validate.mjs:4]
  confidence: confirmed
