- id: F-620
  dimension: improvement-loop
  polarity: strength
  subject_type: artifact
  observation: >
    roster.mjs computes what each scanner is worth over the runs given: the requirements it
    alone decides, the known answers only it recovers, the facts it corroborates, and its
    recorded duration and spend.
  evidence: [map/roster.mjs:2, map/roster.mjs:23, map/roster.mjs:29]
  confidence: confirmed
  property: impact-self-measured
- id: F-621
  dimension: improvement-loop
  polarity: strength
