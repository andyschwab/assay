    command to exactly one script and one line of purpose, so adding or reading a command
    touches this table alone, and tests/blocks/cli-commands.mjs runs against it.
  evidence: [assay.mjs:2, assay.mjs:18, assay.mjs:84, tests/blocks/cli-commands.mjs:1]
  confidence: confirmed

