  - dimension: context-economy
    depth: >
      The best instance is the scanner seam: a new scanner joins as one adapter file with no core change, proven by two invented-scanner blocks and held by a core-names guard (F-208), and the CLI's one-command-one-script table routes a stranger to the file a task needs (F-200, F-216); the hubs that span layers (validate, ingest, the Improve report) and the large single-file contracts are where loading one subsystem stops being possible (F-202, F-204, F-210, F-217).
    sampled:
      - name: modules-standalone
        what: "every module M1-M14 frozen in the terrain; met when an agent can load it alone, with something to read and something to run, and change it without loading the rest"
        members: [F-200, F-201, F-202, F-203, F-204, F-205, F-206, F-207, F-208, F-209, F-210, F-211, F-212, F-213]
        method: "every module M1-M14 frozen in the terrain, one finding each, citing the module's own file(s)"
        primary: true
  - dimension: deterministic-gates
    depth: >
      The best gates fail closed by construction and are themselves pinned red: the tools action and the branch-cleanup
      scripts are cut from their YAML and run against planted failures (F-302, F-301, F-321, F-322), and the harness
      refuses an empty or broken block set (F-313's runner half, F-320); the gaps are skip-when-absent paths, a
      gitleaks-only assertion pair, validate's valueless --target, and the routine's no-baseline skip (F-313, F-315, F-316).
    sampled:
      - name: change-gates
        what: "every change gate (CI step, hook, or package script named for a check) goes red when the tool, secret, input or target it needs is absent, or its check never finishes"
        members: [F-300, F-301, F-302, F-303, F-304, F-305, F-306, F-307, F-308, F-309, F-310, F-311, F-312, F-313, F-314, F-315, F-316]
        method: "every candidate in populations.changeGates of map/raw/enumerate.json (24: 20 CI steps, 4 package scripts) triaged once in census-triage, 16 judged and 8 setup or effect steps out of scope; plus one member outside the list, the routine template's gate step (F-316)"
        primary: true
  - dimension: verification
    depth: >
      The best instance is the practice-review method's calibration harness: blind sweep sets measured on three agreement layers, divergence classed by direction, and gated in npm test at a committed threshold (F-400), with a known-answer scorer that sorts every planted item into named classes (F-402) and instruments that must fire a positive control before a clean result counts (F-409).
  - dimension: delegation
    depth: >
      The best instance is the release and branch-delete halts: a person's dispatch on the default branch behind the
      full test gate, and a delete that refuses the default branch and re-reads each branch before deleting, each with
      write held by one job (F-507, F-506); the credentials the tree reads are all traced to stated job scopes
      (F-513 to F-516), while migrate-run leaves no record of what it rewrote (F-500) and the review lanes hold the
      trifecta behind prose rules alone (F-511, F-512).
    sampled:
      - name: credential
        what: "every secret name populations.secrets lists that grants access, judged on whether what it can reach is traced in the code"
        members: [F-513, F-514, F-515, F-516]
        method: "every candidate in populations.secrets of map/raw/enumerate.json (21), triaged in map/census-triage.yaml: 4 judged one finding each, 17 out of scope as fixture strings or YAML key lists"
        primary: true
      - name: ingested-content
        what: "every ingestion point, judged on whether its text is kept as data with provenance, rendered escaped and never acted on"
        members: [F-517, F-518, F-519, F-520, F-521, F-522]
        method: "every ingestion point I1-I6 frozen in the terrain, one finding each"
        primary: false
  - dimension: improvement-loop
    depth: >
      Where the loop closes it closes hard: the lesson and its regression block live in one
      file header with the issue cited, and negative fixtures pin the exact refusal message
      (F-604, F-608, F-611); the gaps are lessons answered by prose or by a code change no
      check pins (F-601, F-605, F-614).
    sampled:
      - name: incidents-became-mechanisms
        what: "every lesson the repository records (calibration lessons, incidents, review corrections, rules and fixes that name the failure they came from), met when it became a test, lint, hook or guard that would catch the same failure again"
        members: [F-600, F-601, F-602, F-603, F-604, F-605, F-606, F-607, F-608, F-609, F-610, F-611, F-612, F-613, F-614]
        method: "lessons enumerated and frozen before judging, by grepping the docs, code comments and harness block headers outside tests/sweeps and fixture maps for recorded failures: L1 docker-socket sampled class (METHOD.md:42), L2 pinned prior canon (METHOD.md:76), L3 hand-drafted inventory missed channels (METHOD.md:100), L4 hand-derived tool-def channels (enumerate.mjs:275), L5 empty candidate list read closed #269 (SCHEMA.md:878), L6 cal5/cal6 census subject_type flip (SCHEMA.md:189), L7 descriptor drift both ways (variance.mjs:38), L8 variance exit 0 at any level (sweep-gate.mjs:2), L9 scanner never run shipped (SCHEMA.md:365), L10 fail-closed reader / CI-1 (yaml-min.mjs:6), L11 loader skipped/misread files (project.mjs:58), L12 owner overlay misread (validate.mjs:397), L13 no database met by silence (yardstick/README.md:33), L14 multiplayer census dropped (maturity-ladder.mjs:4), L15 red-then-green (CLAUDE.md:62); one finding each"
        primary: true
