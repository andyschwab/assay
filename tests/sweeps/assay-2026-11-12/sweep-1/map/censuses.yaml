        what: "concrete command, flag, path, count and capability claims in README.md, CLAUDE.md and CONSUMERS.md that hold against the code"
        members: [F-110, F-111, F-112, F-113, F-114, F-115, F-116, F-117, F-118, F-119, F-120, F-121, F-122, F-123, F-124, F-125, F-126, F-127, F-128, F-129, F-130, F-131]
