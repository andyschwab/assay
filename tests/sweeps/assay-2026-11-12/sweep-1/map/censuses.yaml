dimensions:
  - dimension: artifact-legibility
    depth: >
      The best instance is the routine's two-job split, whose README section states the threat it answers and
      what each job may do (F-108), alongside rules whose guards repeat their own why (F-102, F-103); the
      weakest are a front door whose prose has drifted from the code on the child environment, the outside
      reach and the steward term (F-119, F-120, F-121).
    sampled:
      - name: decision-reconstruction
        what: "non-obvious decisions D1-D10 whose rationale a newcomer can reconstruct from the repository's files alone"
        members: [F-100, F-101, F-102, F-103, F-104, F-105, F-106, F-107, F-108, F-109]
        method: "every decision D1-D10 frozen in the terrain, one finding each, citing where it is made and where its rationale lives"
        primary: true
