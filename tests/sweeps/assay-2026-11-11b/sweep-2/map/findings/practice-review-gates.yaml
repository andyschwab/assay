# Pass 3 — deterministic gates (census gates-coverage F-301..F-305, then gate findings F-310..)
- id: F-301
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: "The ci.yml test job runs on every pull request and push to main with a contents: read token, a 15-minute timeout, actions pinned to 40-hex commit SHAs, and fails on the first red step of npm ci, lint, typecheck, build, the pinned-tools install and npm test, over Node 22 and 24; tests/blocks/ci-workflow.mjs holds those invariants of the file."
  evidence: [".github/workflows/ci.yml:8-14", ".github/workflows/ci.yml:17-22", ".github/workflows/ci.yml:24-39", "tests/blocks/ci-workflow.mjs:16-58"]
  confidence: confirmed
