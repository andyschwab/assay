# practice-review Pass 2 — context economy (census-augmented: modules-standalone F-201..F-209, doc-freshness F-211..F-220; others F-230+)
- id: F-201
  dimension: context-economy
  polarity: gap
  subject_type: artifact
  observation: >
    map/ (about 30 scripts, the largest module) has no entry doc of its own: its role is stated only in the root
    README's layout line and architecture prose, map/METHOD.md is the built-in scanner's method rather than a module
    index, and its library exports consumed by views/ (chains, capabilities, supervision, doctrine) are named only in
    a comment in assay.mjs, though every script carries a header with its own usage line.
  evidence: ["README.md:239", "README.md:57-60", "map/METHOD.md:6-13", "assay.mjs:15-17", "map/start.mjs:1-14", "views/improve/report.mjs:21-24"]
  confidence: confirmed
