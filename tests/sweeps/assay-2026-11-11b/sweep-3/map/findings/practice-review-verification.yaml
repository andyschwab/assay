- id: F-301
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    `run-draw`: after writing map/scanners.yaml, `assay start` runs `validate` over the run (with --target when a target was given) and exits by validate's status, and an instrument whose exit is outside its success set or whose report fails to ingest is recorded failed with its stderr tail rather than read as ran.
  evidence: ["map/start.mjs:498-504", "map/start.mjs:519", "map/start.mjs:104-116"]
  confidence: confirmed

- id: F-302
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    `run-record`: a row `record` writes as `ran` is not trusted on its own; validate refuses a scanner recorded ran when the base carries no rows from it and no explicit findings file, and `record` refuses skipped/failed without a reason.
  evidence: ["map/record.mjs:30-34", "map/record.mjs:211-214", "map/validate.mjs:308-309"]
  confidence: confirmed

- id: F-303
