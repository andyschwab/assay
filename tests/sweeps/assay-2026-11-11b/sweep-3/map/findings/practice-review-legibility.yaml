    `rule-5-property-named-axes` — the rationale for CLAUDE.md rule 5 reconstructs from files alone: map/scanners/CONTRACT.md §1 explains that shared property-named axes let independent scanners converge on one claim instead of splitting across tool-named chapters, and that an axis no present scanner contributes reads "not measured" because coverage is a capability, not a count.
