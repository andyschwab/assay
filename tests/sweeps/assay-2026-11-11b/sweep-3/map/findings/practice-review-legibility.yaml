- id: F-007
  dimension: artifact-legibility
  polarity: gap
  subject_type: artifact
  observation: >
    `rule-7-scanners-as-adapters-operators-as-consumers` — only the scanner half of CLAUDE.md rule 7 has a reconstructable rationale (INTAKE.md: adoption and retirement are one adapter file with nothing in the core, so frozen runs still project); the operator half (a row names its consumer and is phrased for any operator; assay depends on no operator's repository) is restated in yardstick/README.md and views/README.md without a reason, and the block that holds it gives its motive only as a heading and an issue number (#147).
