- id: F-006
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    `rule-6-no-confidential-material` — the rationale for CLAUDE.md rule 6 reconstructs from files alone: the rule itself states the repository is public, SECURITY.md and README.md restate what the tree carries and why planted strings under tests/ are not findings, and the no-history-file block states why no run history or dated log is kept (it restates the commit that made the change).
