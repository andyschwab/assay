# Pass 1 — artifact legibility (census-augmented: decision-reconstruction, F-001..F-007)
- id: F-001
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    `rule-1-map-states-what-is` — the rationale for CLAUDE.md rule 1 reconstructs from files alone: README.md gives the rule its one home and calls it what "makes it honest", and map/METHOD.md states why (it keeps the evidence reusable and stops a strengths-first framing from muting a critical finding, "the failure this architecture exists to prevent").
  evidence: ["CLAUDE.md:11-14", "README.md:32-37", "map/METHOD.md:25-28"]
  confidence: confirmed
- id: F-002
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    `rule-2-no-claim-without-evidence` — the rationale for CLAUDE.md rule 2 reconstructs from files alone: map/SCHEMA.md explains why the format is pinned and validated (comparability across runs, stable ids for "still open?" diffs), why the validator fails closed on unparseable input, and map/METHOD.md explains why an unobserved claim is never a fact, with a recorded case of a sampled strength that certified an un-inspected class.
  evidence: ["CLAUDE.md:15-16", "map/SCHEMA.md:14-18", "map/SCHEMA.md:914-916", "map/METHOD.md:34-45"]
  confidence: confirmed
- id: F-003
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    `rule-3-fail-loud-never-empty` — the rationale for CLAUDE.md rule 3 reconstructs from files alone: map/scanners/INTAKE.md states that a tool erroring into "0 findings" lowers coverage while reading as clean, map/scanners/CONTRACT.md requires the real exit code for the same reason, and yardstick/measure.mjs explains why a clean run with a run record is a measurement while a run with neither findings nor record is not.
  evidence: ["CLAUDE.md:17-21", "map/scanners/INTAKE.md:25-30", "map/scanners/CONTRACT.md:152-158", "yardstick/measure.mjs:484-489"]
  confidence: confirmed
