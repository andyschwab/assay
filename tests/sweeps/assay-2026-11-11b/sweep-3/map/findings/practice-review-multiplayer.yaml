# ── beyond the census ──────────────────────────────────────────────────────────────
- id: F-632
  dimension: multiplayer
  polarity: strength
  subject_type: contract
  observation: >
    CONSUMERS.md is a single operator contract (commands, flags, outputs, run-layout paths, two importable
    modules) that states anything not on it is internal, and a commit touching its surface must carry a
    `Consumer:` trailer checked by `release-notes.mjs --check` in the harness.
  evidence: ["CONSUMERS.md:3-9", "CONSUMERS.md:37-38", "CONSUMERS.md:119-138"]
  confidence: confirmed
- id: F-633
  dimension: multiplayer
  polarity: gap
  subject_type: contract
  observation: >
    Several machine modes exist but are absent from CONSUMERS.md, which declares anything unlisted
    internal: validate --json (its usage line does not name it either), measure --json, score --json,
    enumerate --json and tools check --json.
  evidence: ["CONSUMERS.md:4-7", "CONSUMERS.md:25", "map/validate.mjs:3", "map/validate.mjs:779", "yardstick/measure.mjs:580", "map/score.mjs:187", "map/enumerate.mjs:35", "map/tools.mjs:27"]
  confidence: confirmed
- id: F-634
  dimension: multiplayer
  polarity: gap
  subject_type: artifact
  observation: >
    The dispatcher's command list is human text only (`help` prints padded lines from GROUPS); no
    machine listing of the commands exists for an agent to discover the surface.
  evidence: ["assay.mjs:62-72", "assay.mjs:75"]
  confidence: confirmed
- id: F-635
  dimension: multiplayer
  polarity: strength
  subject_type: contract
  observation: >
    The run directory is the shared substrate between scanners, people and agents, and one module
    (lib/run-layout.mjs) places every path in it, a module CONSUMERS.md lets consumers import.
  evidence: ["lib/run-layout.mjs:1-6", "CONSUMERS.md:83-99", "CONSUMERS.md:108"]
  confidence: confirmed
- id: F-636
  dimension: multiplayer
  polarity: strength
  subject_type: control
  observation: >
    Concurrent writers to the run record (record, ingest, another agent) go through one
    read-modify-write under an exclusive lock file map/scanners.yaml.lock that waits up to 30s then fails
    loud, and a harness block pins that four parallel writers lose no row.
  evidence: ["map/record.mjs:145-169", "map/SCHEMA.md:376-379", "tests/blocks/run-record-lock.mjs:1-6"]
  confidence: confirmed
- id: F-637
  dimension: multiplayer
  polarity: gap
  subject_type: control
  observation: >
    The run-record lock file records no holder (no pid, host or writer), so a lock left by a crashed
    writer blocks every writer for 30s and then needs a person to judge whether a writer is still running
    and remove the file by hand.
  evidence: ["map/record.mjs:148-150", "map/record.mjs:158", "map/record.mjs:161"]
  confidence: confirmed
- id: F-638
  dimension: multiplayer
  polarity: strength
  subject_type: contract
  observation: >
    The Improve handoff is published as versioned data formats for an agent that iterates the work
    (handoff/sequence.json `assay.handoff-sequence/1`, views/improve/chains.json `assay.chains/1`,
    views/improve/report.json `assay.improve-report/1`), each checked before writing and read back by
    validate.
  evidence: ["views/README.md:168-170"]
  confidence: confirmed
- id: F-639
  dimension: multiplayer
  polarity: strength
  subject_type: contract
  observation: >
    Every view is written twice, once as data and once as a page, and views/README.md makes the data
    file the contract a publisher builds on, with any operator-specific field naming its consumer.
  evidence: ["views/README.md:23-27"]
  confidence: confirmed
- id: F-640
  dimension: multiplayer
  polarity: strength
  subject_type: contract
  observation: >
    A review lane is a multi-agent handoff contract: its frontmatter names the files it reads (inputs)
    and publishes (outputs), a lane with inputs is refused a seed without --inputs-dir, and
    `validate --lane` fails unless the scanner is recorded ran and every output is in the run.
  evidence: ["map/scanners/CONTRACT.md:917-927", "map/scanners/adapters/practice-review/lane.md:7-9", "map/lane.mjs:18-19", "map/validate.mjs:321-331"]
  confidence: confirmed
- id: F-641
  dimension: multiplayer
  polarity: gap
  subject_type: contract
  observation: >
    The deep-code-review lane's frontmatter carries no `outputs:` key although its body publishes a
    machine report and a review, so `lane --list` reports it with no outputs and `validate --lane
    deep-code-review` checks no published file.
  evidence: ["map/scanners/adapters/deep-code-review/lane.md:1-7", "map/scanners/adapters/deep-code-review/lane.md:23", "map/validate.mjs:328-330", "map/lane.mjs:85"]
  confidence: confirmed
- id: F-642
  dimension: multiplayer
  polarity: fact
  subject_type: process
  observation: >
    A lane's outputs reach the run as text blocks delimited `--- <path> (verbatim) ---` on one published
    page, and no engine script parses those delimiters; collecting them into the run is the consumer's
    own step.
  evidence: ["map/scanners/CONTRACT.md:918-919", "map/scanners/adapters/practice-review/lane.md:25"]
  confidence: confirmed
- id: F-643
  dimension: multiplayer
  polarity: strength
  subject_type: artifact
  observation: >
    Findings and run-record rows carry origin labels: each finding's `source:` names the scanner that
    produced it, and the run record holds per scanner the model of record, spend, duration and, for a
    lane, the head it reviewed and the day.
  evidence: ["map/SCHEMA.md:108", "map/ingest.mjs:153", "map/record.mjs:18-28"]
  confidence: confirmed
- id: F-644
  dimension: multiplayer
  polarity: strength
  subject_type: artifact
  observation: >
    Each measured requirement row carries its provenance: `basis: owner` when the repository's own packet
    decided it versus `run`, and `reviewed:` (which lane, at which head, on which day) when a lane decided it.
  evidence: ["yardstick/measure.mjs:18-20", "yardstick/measure.mjs:428", "yardstick/measure.mjs:441-442", "yardstick/measure.mjs:462"]
  confidence: confirmed
- id: F-645
  dimension: multiplayer
  polarity: gap
  subject_type: artifact
  observation: >
    The run record says which model ran a scanner but not who acted: `record` takes no actor flag, so a
    disposition (ran, skipped with a reason) is unattributed, unlike the decisions overlay and the ratchet
    baseline, which carry a `by` role.
  evidence: ["map/record.mjs:12", "map/record.mjs:46-60", "map/decisions.mjs:18", "yardstick/ratchet.mjs:35-37"]
  confidence: confirmed
- id: F-646
  dimension: multiplayer
  polarity: strength
  subject_type: control
  observation: >
    Consent to waive a gap is an explicit, optional owner overlay (owner/decisions.yaml: finding, action,
    reason, by, at), never deleting a finding, and validate refuses a `by` shaped like an email address or
    a person's name.
  evidence: ["map/decisions.mjs:3-20", "map/validate.mjs:395-398", "map/validate.mjs:421-422"]
  confidence: confirmed
- id: F-647
  dimension: multiplayer
  polarity: strength
  subject_type: process
  observation: >
    Automation never writes the consent overlay: the routine states that owner/decisions.yaml stays a
    human's own act and that it opens no issues, and a ratchet baseline is written by the command but
    committed only by the steward.
  evidence: ["routine/README.md:125-128", "yardstick/ratchet.mjs:9-11", "yardstick/ratchet.mjs:303"]
  confidence: confirmed
- id: F-648
  dimension: multiplayer
  polarity: strength
  subject_type: contract
  observation: >
    The owner packet records who answered as a role with how it was produced (answered.by, answered.via),
    refuses anything email-shaped or name-shaped in role fields, and the owner prompt marks the reply as
    data, never instructions.
  evidence: ["owner/PACKET.md:45-53", "owner/PACKET.md:73-76", "owner/ask-owner.md:9"]
  confidence: confirmed
- id: F-649
  dimension: multiplayer
  polarity: strength
  subject_type: process
  observation: >
    The routine discloses its privileged-reader asymmetry in its contract doc: the uploaded run artifact
    is readable by anyone who can read the repository's workflow runs, and ingest drops output tails and
    userinfo before archiving for that reason.
  evidence: ["routine/README.md:28-36"]
  confidence: confirmed
- id: F-650
  dimension: multiplayer
  polarity: strength
  subject_type: process
  observation: >
    The two-job routine hands the change-executing job's reports to the gate job only through a handoff
    directory treated as data, so the job that runs the change never shares a job with the engine,
    baseline or run the gate reads.
  evidence: ["routine/README.md:130-152"]
  confidence: confirmed
- id: F-651
  dimension: multiplayer
  polarity: gap
  subject_type: artifact
  observation: >
    ask-owner's header says the enumeration "prints to stdout only" and "is never persisted into a run",
    while start writes it into the run as map/raw/enumerate.json, so the owner prompt does not read that
    shared run file.
  evidence: ["owner/ask-owner.mjs:20-22", "map/start.mjs:18-19", "CONSUMERS.md:92"]
  confidence: confirmed
- id: F-652
  dimension: multiplayer
  polarity: fact
  subject_type: contract
  observation: >
    A lane names no model and no operator; the consumer that seeds the session supplies the model and any
    authorization, so who a review session acts as is set outside the engine.
  evidence: ["map/lane.mjs:10-11", "map/scanners/CONTRACT.md:930-931"]
  confidence: confirmed
