# Pass 7 — multiplayer (shared context + agent access). Census: agent-access-surface,
# one finding per command in assay.mjs GROUPS (assay.mjs:18-58), in table order, F-601..F-631.
- id: F-601
  dimension: multiplayer
  polarity: strength
  subject_type: artifact
  observation: >
    `start` writes a schema'd machine file (the run record map/scanners.yaml, SCHEMA.md §5a, plus
    map/raw/enumerate.json) and documents an exit-code contract (exit 3 when tools are not ready,
    exit 2 when a run record already exists, nothing written in either case).
  evidence: ["map/start.mjs:2-3", "map/start.mjs:15-19", "map/start.mjs:43", "CONSUMERS.md:20"]
  confidence: confirmed
- id: F-602
  dimension: multiplayer
  polarity: strength
  subject_type: artifact
  observation: >
    `validate` has a --json mode printing { ok, total, errors, warnings, evidencePathErrors } whose
    exit code still reflects the verdict, and CONSUMERS.md promises exit 0 only for a run that validates.
  evidence: ["map/validate.mjs:779-784", "CONSUMERS.md:25"]
  confidence: confirmed
- id: F-603
  dimension: multiplayer
  polarity: strength
  subject_type: artifact
  observation: >
    `ingest` writes <run>/map/findings/<tool>.yaml in the SCHEMA.md finding format and archives the
    raw report under map/raw/, and requires the tool's own exit code so a crashed tool halts rather
    than reading as zero findings.
  evidence: ["map/ingest.mjs:9-14", "map/ingest.mjs:48-52"]
  confidence: confirmed
- id: F-604
