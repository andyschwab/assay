dimensions:
  - dimension: artifact-legibility
    depth: >
      Where a decision is written down it is written beside the code it governs, with the why:
      the strict YAML reader, the routine's two jobs and the child-env allow-list each carry their
      rationale in the file header or contract (F-001, F-003, F-005); the gap is the release path,
      whose reason for being person-dispatched is never stated and whose runbook contradicts it
      (F-010, F-011).
    sampled:
      - name: decision-reconstruction
        what: "non-obvious design decisions whose rationale reconstructs from files alone"
        members: [F-001, F-002, F-003, F-004, F-005, F-006, F-007, F-008, F-009, F-010]
        method: "every decision listed in the terrain, D1-D10, one finding each, decided before the pass read for rationale"
        primary: true
  - dimension: context-economy
    depth: >
      The best modules load standalone from one contract page (yardstick/, routine/, owner/:
      F-103, F-107, F-108), and a harness block holds doc claims to the code (F-112); the map/ core
      and views/improve/ have no entry page and lean on 55 KB-plus contracts a review lane must read
      whole (F-101, F-105, F-113, F-114).
    sampled:
      - name: modules-standalone
        what: "bounded modules a fresh context can load standalone from an entry doc and bounded imports"
        members: [F-101, F-102, F-103, F-104, F-105, F-106, F-107, F-108, F-109]
        method: "every module listed in the terrain, M1-M9, one finding each"
        primary: true
  - dimension: deterministic-gates
    depth: >
      The test gate is unusually strong: a fail-closed harness with one negative fixture per
      validator rule, pinned golden scores a bless cannot rewrite over red, and SHA-pinned actions
      the harness itself checks (F-206, F-209, F-213, F-221); lint and build are only a syntax
      check, tests are outside typecheck, and no hook runs before CI (F-202, F-204, F-215, F-219).
    sampled:
      - name: gates-coverage
        what: "gate steps that run automatically before merge or tag and fail loud"
        members: [F-201, F-202, F-203, F-204, F-205, F-206, F-207]
        method: "every step of the ci.yml pull_request job (npm ci, lint, typecheck, build, tools action, test) plus the release.yml gate, one finding each"
        primary: true
  - dimension: verification
    depth: >
      Where the engine proves an effect it does so properly: tools are checksum-verified before
      execution, branch deletes re-read branch@sha, and migrate-run reads its rewrite back before
      writing (F-312, F-315, F-308), and the engine measures its own repeatability and publishes the
      low numbers (F-327, F-328); about half the channels trust a return code or a console line
      instead (F-302, F-306, F-309, F-319, F-334).
    sampled:
      - name: effect-provability
        what: "effect channels that verify their effect rather than trusting a return code"
        members: [F-301, F-302, F-303, F-304, F-305, F-306, F-307, F-308, F-309, F-310, F-311, F-312, F-313, F-314, F-315, F-316, F-317]
        method: "every effect channel in the terrain's inventory, F-401..F-417, one finding each"
        primary: true
  - dimension: delegation
    depth: >
      Credentials sit below the execution boundary (child-env strips the environment, the routine's
      target job holds no token, each workflow job holds only the scope it needs: F-425, F-427,
      F-430); the open edges are a local routine run that executes the target with no opt-in flag
      (F-413), HOME left reachable to the target's scripts (F-426), and lane rules held only as
      prompt text (F-436).
    sampled:
      - name: credential
        what: "runtime credentials held least-privilege and out of reach of executed target code"
        members: [F-420, F-421, F-422, F-423]
        method: "every runtime credential in the terrain's credential population (GH_TOKEN, GITHUB_TOKEN, ASSAY_READ_TOKEN, FETCH_TOKEN), one finding each; planted test strings and key-name constants excluded by the stated rule"
        primary: true
  - dimension: improvement-loop
    depth: >
      Most of the agent contract's rules are held by a named harness block, and doc-consistency
      refuses a misnumbered rule citation (F-502, F-507, F-512, F-513); the process rules (red then
      green, learnings to the issue tracker) and the no-confidential-material rule are held by prose
      or a single name check (F-506, F-510, F-511).
    sampled:
      - name: lessons-mechanized
        what: "agent-contract rules held by a mechanism that catches a violation automatically"
        members: [F-501, F-502, F-503, F-504, F-505, F-506, F-507, F-508, F-509, F-510, F-511, F-512]
        method: "every rule in CLAUDE.md (ground rules 1-7, re-bless, new block, red-then-green, learnings to issues, change record is git), one finding each"
        primary: true
  - dimension: multiplayer
    depth: >
      Every view and handoff has a schema'd data form beside its page, and every finding carries its
      origin (F-601..F-610, F-616, F-617); what is missing is cross-repository aggregation and a
      record of who drew or reviewed a run (F-618, F-631).
    sampled:
      - name: agent-access-surface
        what: "interfaces exposing an agent-consumable, schema'd data form, not only a human page"
        members: [F-601, F-602, F-603, F-604, F-605, F-606, F-607, F-608, F-609, F-610]
        method: "every interface listed in the terrain, I1-I10, one finding each"
        primary: true
