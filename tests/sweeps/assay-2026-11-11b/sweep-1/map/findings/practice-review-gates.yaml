# practice-review pass 3: deterministic gates (census-augmented; gates-coverage census = F-201..F-207)
- id: F-201
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: npm ci runs first in the ci.yml test job on every pull request and push to main, installing exactly the lockfile's tree with the two devDependencies pinned to exact versions, so lockfile drift fails the job before any check runs.
  evidence: [".github/workflows/ci.yml:8-11", ".github/workflows/ci.yml:30", "package.json:18"]
  confidence: confirmed
- id: F-202
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  observation: npm run lint runs pre-merge in ci.yml and fails loud, but it is only node --check over the tracked modules (a parse check), so no lint rule (unused code, shadowing, unsafe patterns) is enforced and the step is weaker than its name.
  evidence: [".github/workflows/ci.yml:31", "package.json:10", "lib/check-syntax.mjs:1-5", "lib/check-syntax.mjs:11-15"]
  confidence: confirmed
- id: F-203
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: npm run typecheck runs tsc with checkJs over every engine directory on both Node majors pre-merge, so a type error in an engine module fails the CI job.
  evidence: [".github/workflows/ci.yml:20-22", ".github/workflows/ci.yml:32", "package.json:11", "tsconfig.json:3-5", "tsconfig.json:12"]
  confidence: confirmed
- id: F-204
  dimension: deterministic-gates
  polarity: fact
  subject_type: contract
  observation: npm run build runs pre-merge but invokes the same lib/check-syntax.mjs as lint, so the step re-runs the parse check and adds no gate (the engine is zero-dependency ESM with nothing to build or emit).
  evidence: [".github/workflows/ci.yml:33", "package.json:10", "package.json:12", "tsconfig.json:5"]
  confidence: confirmed
- id: F-205
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: The tools action step installs each pinned instrument only after its download matches the adapter's sha256, verifies each answers at its pin, and fails the step with nothing on PATH otherwise, so npm test runs against the same instruments a routine runs.
