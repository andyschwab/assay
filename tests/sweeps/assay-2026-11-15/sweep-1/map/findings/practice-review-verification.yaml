- id: F-300
  dimension: verification
  polarity: gap
  subject_type: contract
  observation: >
    The pull request template's "How this is verified" section is an HTML-comment prompt, and no
    workflow or harness block reads a pull request body, so an empty or unedited section lands
    unrefused; the only test touching the template checks that CONTRIBUTING.md names it.
  evidence: [".github/PULL_REQUEST_TEMPLATE.md:5-10", ".github/workflows/ci.yml:10-13", "tests/blocks/gate-command.mjs:59-63"]
  confidence: confirmed
- id: F-301
  dimension: verification
  polarity: strength
  subject_type: process
  observation: >
    CONTRIBUTING.md's landing steps name the concrete evidence a change carries (the gate's one
    exit line, each new assertion confirmed red then green, a reasoned re-bless of golden.json),
    and a harness block fails if any of those steps drops out of the page.
  evidence: ["CONTRIBUTING.md:19-42", "CONTRIBUTING.md:53-54", "tests/blocks/gate-command.mjs:59-63"]
  confidence: confirmed
- id: F-302
  dimension: verification
  polarity: gap
  subject_type: process
  observation: >
    For an assertion outside the red-proof list, the "confirmed red" evidence is a statement in
