# Pass 1 — artifact legibility (practice-review). Census-augmented: D1–D11 (decision-reconstruction),
# sampled doc claims (doc-freshness), and the second accounts met on the way (context list).

# ── decision-reconstruction: D1–D11, one finding each ──
- id: F-001
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    D1 (no runtime dependencies, an own YAML reader) reconstructs from the files: the reader's header
    and validate's header say a hand-rolled subset reader throws on input it cannot read because a
    checker that silently accepts unparseable input hides what it exists to catch, and enumerate's
    header gives the zero-dependency reason (it copies into any target); package.json declares
    dev dependencies only.
  evidence:
    - "lib/yaml-min.mjs:1-7"
    - "map/validate.mjs:10-12"
    - "map/enumerate.mjs:12"
    - "package.json:18-19"
  confidence: confirmed

- id: F-002
  dimension: artifact-legibility
  polarity: gap
  subject_type: artifact
  observation: >
