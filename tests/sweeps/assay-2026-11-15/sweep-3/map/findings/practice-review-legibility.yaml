    is done but not why: the README names typecheck as checkJs over the engine's modules and
    tsconfig carries no comment; no file read names the reason over the obvious alternative of
    writing TypeScript, beyond the zero-dependency, copy-into-any-target reasoning that D1 gives.
  evidence:
