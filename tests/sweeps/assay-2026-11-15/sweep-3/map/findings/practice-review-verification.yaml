- id: F-400
  dimension: verification
  polarity: strength
  subject_type: artifact
  observation: >
    The practice-review method (map/METHOD.md, typed a skill) and its lane seed have their
    repeatability measured rather than assumed: map/variance.mjs takes three measures over blind
    sweeps of one target (fact presence, descriptor agreement per listed candidate, requirement
    agreement), sorts each descriptor divergence by direction into target change or judgment drift,
    and the harness gates every committed sweep set at its own SWEEP.yaml threshold; the recorded
    figures for the newest blind set over this repository (13% fact presence, 40% descriptor
    agreement, 92% requirement agreement) are stated beside the measure.
  evidence:
    - "map/METHOD.md:1-5"
    - "map/METHOD.md:829-836"
    - "map/scanners/adapters/practice-review/lane.md:1-10"
    - "map/variance.mjs:24-72"
    - "map/variance.mjs:294-298"
    - "tests/blocks/sweep-gate.mjs:17-31"
    - "README.md:232-243"
  confidence: confirmed
