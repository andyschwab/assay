- id: F-300
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The ci.yml tools step runs the composite action under set -euo pipefail, whose install exits 1 on
    any failed or unsupported tool and whose verify marks a tool absent, broken (including a version
    probe killed at its 60 s timeout) or other-version and exits 1, so a missing tool turns the step red;
    a download with no time limit of its own is bounded by the job's 15-minute timeout, and an empty
    instrument selection reads as success because nothing is needed.
  evidence:
    - ".github/workflows/ci.yml:21"
    - ".github/workflows/ci.yml:37"
    - ".github/actions/tools/action.yml:25-31"
    - "map/tools.mjs:73"
    - "map/tools.mjs:142"
    - "map/tools.mjs:149-158"
    - "map/tools.mjs:233-244"
  confidence: confirmed
- id: F-301
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The ci.yml gate step runs lib/gate.mjs, which counts any step status other than 0 as failed
    (a null status from a missing command or a signal included), stops red when the pinned tools do
    not verify, and exits 1 when any step failed; a step that never finishes is cut off by the job's
    15-minute timeout, so it never reads green.
  evidence:
    - ".github/workflows/ci.yml:21"
    - ".github/workflows/ci.yml:38"
    - "lib/gate.mjs:39-58"
  confidence: confirmed
