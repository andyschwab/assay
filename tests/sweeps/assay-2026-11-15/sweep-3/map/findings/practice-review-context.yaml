- id: F-200
  dimension: context-economy
  polarity: gap
  subject_type: artifact
  label: "M1 assay.mjs"
  observation: >
    assay.mjs has a head comment (lines 1-9) and imports only node built-ins, so it loads alone,
    but no file in tests/blocks/ or tests/regression.mjs imports it: tests reach it only by
