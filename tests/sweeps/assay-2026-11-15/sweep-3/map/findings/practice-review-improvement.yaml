# ── discovery ──
- id: F-850
  dimension: improvement-loop
  polarity: strength
  subject_type: process
  property: impact-self-measured
  observation: >
    A target's movement between runs is computed, not studied: Since compares two runs' measurements and
    separates what the repository moved from what the engine re-ruled, and the ratchet fails when a held
    requirement slides back against a committed baseline.
  evidence:
    - "views/since.mjs:1-12"
    - "yardstick/ratchet.mjs:1-7"
  confidence: confirmed
- id: F-851
  dimension: improvement-loop
  polarity: gap
  subject_type: artifact
  property: impact-self-measured
  observation: >
    The engine's own shipped changes carry no impact field: the pull request template asks what changed and
    how it is verified, and the engine measures its own recall and repeatability (pinned scores, sweep
    gates), but no record states what a change was worth to a target before and after.
  evidence:
    - ".github/PULL_REQUEST_TEMPLATE.md:1-10"
    - "CONTRIBUTING.md:38-42"
  confidence: plausible
- id: F-852
  dimension: improvement-loop
  polarity: strength
  subject_type: process
  property: usage-outcome-records-emitted
  observation: >
    Every run emits a structured run record by design: the engine SHA, each scanner's status with its reason
    and its duration, which variance reads back as each sweep's cost, never estimated.
  evidence:
    - "map/start.mjs:335-350"
    - "map/start.mjs:361-374"
    - "map/variance.mjs:82-84"
  confidence: confirmed
