# map/censuses.yaml (authored) — assay at a17104d, practice-review lane
dimensions:
  - dimension: artifact-legibility
    depth: "The best instance is very strong: the routine's two-job split (F-010) and the effect-scope rule (F-013) argue each choice against the obvious alternative at the point of the choice, and the doc-consistency block holds stated counts and the one rule's home to the code (F-037, F-070, F-075); but the operator-facing docs have drifted where nothing guards them, on the outside reach, the child environment, release and pinning (F-043, F-036, F-052, F-071)."
    sampled:
      - name: decision-reconstruction
        what: "a non-obvious decision (a dependency, a shortcut, a default, a boundary) whose why a newcomer can reconstruct from the files alone"
        members: [F-001, F-002, F-003, F-004, F-005, F-006, F-007, F-008, F-009, F-010, F-011, F-012, F-013, F-014, F-015, F-016, F-017, F-018, F-019, F-020, F-021, F-022]
        method: "the terrain draws no decision list, so the pass drew it before assessing: every non-obvious choice met while reading the terrain's legibility slice (README, CLAUDE.md, CONTRIBUTING, RUNBOOK, CONSUMERS, routine/README) and the module heads it names, plus the workflows and adapters those pages route to; one finding per decision, 22 in all"
        primary: true
      - name: doc-freshness
        what: "a concrete doc claim (command, flag, count, path, capability) in README.md, the pages it routes to and CLAUDE.md that holds when replayed against the code"
        members: [F-030, F-031, F-032, F-033, F-034, F-035, F-036, F-037, F-038, F-039, F-040, F-041, F-042, F-043, F-044, F-045, F-046, F-047, F-048, F-049, F-050, F-051, F-052, F-053, F-054, F-055, F-056, F-057]
        method: "each concrete claim in README.md (views, architecture, owner, external services, quickstart, layout), CLAUDE.md, CONTRIBUTING.md, RUNBOOK.md, and CONSUMERS.md's releases and modules sections, read against the code it names with sed and grep, oldest page untimed (git history out of scope); a group of quickstart flags checked together is one member; 28 in all; fresh-clone not run (read-only pass)"
  - dimension: context-economy
    depth: "The best modules are small and self-explaining: lib/yaml-min.mjs, lib/run-layout.mjs and map/doctrine.mjs each carry a head comment, a direct test and no in-repository import (F-118, F-120, F-109), and the deferred yardstick import in map/passes.mjs is a stated, deliberate cut of a load cycle (F-132); the measurement hub yardstick/measure.mjs is what pushes the views, the ratchet and the routine past the bar (F-131)."
    sampled:
      - name: modules-standalone
        what: "a module has a head comment or directory README to read, a test file that imports it directly, and static in-repository imports reaching at most ten source files"
        members: [F-100, F-101, F-102, F-103, F-104, F-105, F-106, F-107, F-108, F-109, F-110, F-111, F-112, F-113, F-114, F-115, F-116, F-117, F-118, F-119, F-120, F-121, F-122]
        method: "the terrain's load-bearing directories (map, map/scanners, views, views/improve, yardstick, lib, owner, routine) and the command line, each taken by its central modules: every command entry point assay.mjs routes to for a layer's main job plus the shared libraries the README and CLAUDE.md name; head comments read with sed, direct test imports found by grep over tests/ (sweeps and fixture maps excluded), and transitive closures computed over static relative imports (deferred await import() not counted, as it does not load with the module)"
        primary: true
  - dimension: deterministic-gates
    depth: "The best instance is the landing gate itself: CI runs npm run gate, which verifies the pinned tools first and stops red when one is missing, counts any non-zero or null step status as a failure, and includes prove-red, which requires each core invariant's check red under its mutation (F-202, F-211, F-212); the one weak member is the test script run on its own, whose binary-dependent halves return early green and whose blocks carry no timeout (F-209)."
    sampled:
      - name: change-gates
        what: "a change gate goes red, not green, when the tool, secret, input or target it needs is absent or its check never finishes"
        members: [F-200, F-201, F-202, F-203, F-204, F-205, F-206, F-207, F-208, F-209, F-210, F-211, F-212, F-213, F-214]
        method: "every populations.changeGates candidate of map/raw/enumerate.json (21) triaged once, the setup and effect steps out of scope, plus the four lib/gate.mjs steps enumerate does not list as candidates (tools verify, prove-red, passes, release-notes in the gate); lib/gate.mjs's test, typecheck and lint steps are the package scripts' members"
        primary: true
  - dimension: verification
    depth: "The best instance is the practice-review method's calibration harness: committed blind sweep sets gated at their own thresholds in npm test, with divergence split into named classes and directions (F-306, F-308), though its own figures are low and its staleness under a method change is ungated (F-307, F-309)."
  - dimension: delegation
    depth: "Where assay's own effects leave the machine they are gated with care: the release refuses unless its version, tag, branch, tests and trailer check hold and alone holds contents write (F-400), and branch-cleanup re-reads every branch before deleting it (F-401). The weak point is where the target's or upstream code runs: fresh-clone, structure-scan and the dependency audit run in the routine with nothing in front of them (F-405, F-407, F-408), and the PyPI tool installs have only a stamp that fails open (F-404)."
    sampled:
      - name: credential
        what: "what each secret the running workflows and code read can reach is traced to its read site and the uses it reaches"
        members: [F-440, F-441, F-442, F-443]
        method: "every member of populations.secrets in map/raw/enumerate.json (30), triaged once in census_triage; the four read by the shipped workflows, routine template or engine code each judged at its read site"
        primary: true
      - name: ingested-content
        what: "text from outside the team is kept as data, stored with its provenance, rendered escaped and never acted on as an instruction"
        members: [F-450, F-451, F-452, F-453, F-454, F-455, F-456, F-457, F-458, F-459, F-460, F-461]
        method: "every point drawn from the tree where outside text or code enters: the target tree (enumerate), instrument reports and a reviewer's machine report (ingest), the routine handoff, the rendered views and handoff prompts, the review lane's reading of the target, downloaded tools, ask-owner's --found file, the services declaration, the README replay, and upstream release metadata"
  - dimension: improvement-loop
    depth: "The best instance is mechanical: the lesson that a red proof said once in a commit message is never re-checked became prove-red, a mutation list the gate re-proves on every CI run (F-627), and most recorded lessons sit in the header of the block that now catches them (F-603, F-609, F-616); the loop leaks where a lesson became a listing nothing forces anyone to triage (F-600) or a prose rule validate only half checks (F-613)."
    sampled:
      - name: incidents-became-mechanisms
        what: "a recorded lesson (an incident, calibration finding, review correction or fix naming its cause) became a test, check or tool that would catch the same failure again"
        members: [F-600, F-601, F-602, F-603, F-604, F-605, F-606, F-607, F-608, F-609, F-610, F-611, F-612, F-613, F-614, F-615, F-616, F-617, F-618, F-619, F-620, F-621, F-622, F-623, F-624, F-625, F-626, F-627, F-628, F-629, F-630, F-631]
        method: "blind read of the tree, no git history: grep of every tracked file outside the excluded paths for incident and calibration wording (once read/wrote/shipped, a prior calibration run, cal5/cal6, used to, before that fact existed, an earlier version, measured in the field, a crash once) plus the agent contract's How a change lands; each hit that names a past failure or its cause is one member, the mechanism looked for in tests/blocks, tests/prove-red.mjs and the code; house rules naming no cause excluded"
        primary: true
  - dimension: multiplayer
    depth: "The best instance is the consumer contract and its named-schema data twins: every person-facing page has a data file under a stated schema, the fix sequence written explicitly for an agent that iterates it (F-741, F-742, F-737), the commands an agent may call listed with their flags and JSON output shapes (F-704, F-708, F-720), and exit codes promised to mean failure (F-782); the gaps are narrow, one command and two small file formats stated only in code (F-726, F-749, F-751)."
