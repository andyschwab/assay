# decision-reconstruction census (F-001..F-022): the non-obvious decisions, one finding each
- id: F-001
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    The choice to read YAML with an in-house zero-dependency reader instead of a YAML library is explained at the reader
    itself: it reads only the subset with one meaning and throws on everything else, because a checker that silently
    accepts unparseable input hides what it exists to catch, and the subset has one documented home.
  evidence: [lib/yaml-min.mjs:1-7, assay.mjs:8-9, map/SCHEMA.md:1826]
  confidence: confirmed
- id: F-002
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    The founding boundary that a finding records facts and only the views compute severity is stated once in the README
    with its reason (a finding may say irreversible and ungated, never critical; assay issues no verdict and prices nothing).
  evidence: [README.md:35-40, CLAUDE.md:12-15]
  confidence: confirmed
- id: F-003
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    The retirement of the Scorecard instrument from the adopted roster is reconstructable from its adapter, which says it
    needs GitHub API access at run time and so breaks the offline rule, and why the adapter is kept (frozen runs still project).
  evidence: [map/scanners/adapters/scorecard.yaml:12-19]
  confidence: confirmed
- id: F-004
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    Gating fresh-clone and structure-scan's knip step behind --allow-exec is explained where it is chosen: they execute
    the target's own install scripts and tool configs on the machine, the env allow-list is not a sandbox, and the skip
    reason tells the operator to re-run in a disposable container or VM.
  evidence: [README.md:91-102, map/start.mjs:490]
  confidence: confirmed
- id: F-005
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    The child-process environment allow-list explains each admitted name (the package manager must be found and find its
    cache; proxy plumbing so a registry is reachable) and why a proxy URL carrying user:pass@ is dropped (it is a credential).
  evidence: [map/child-env.mjs:1-19]
  confidence: confirmed
- id: F-006
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    The split of finding ids into a lane range below F-10000 and an ingest range above is explained at its module: a lane
    authors in a scratch run and cannot see the ids ingest gave, so disjoint ranges remove any renumbering at collection.
  evidence: [map/ids.mjs:1-13]
  confidence: confirmed
- id: F-007
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    Pinning the routine's ASSAY_REF to a full commit SHA rather than a branch carries its reason where the steward sets it:
    a branch moves, and a scheduled run must run the exact engine a steward reviewed.
  evidence: [routine/README.md:210-212, routine/assay-routine.yml:37]
  confidence: confirmed
- id: F-008
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    That releases are cut only by a person-dispatched workflow, the only job holding contents write, which refuses a
    malformed or existing version, is stated in the workflow's header beside the steps that enforce it.
  evidence: [.github/workflows/release.yml:1-8, .github/workflows/release.yml:33-38]
  confidence: confirmed
- id: F-009
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    The gate's shape (stop at a missing tool, otherwise run every check whatever the previous did) is explained at the
    gate: the suite needs the tools, and running every step lets one run name every red step.
