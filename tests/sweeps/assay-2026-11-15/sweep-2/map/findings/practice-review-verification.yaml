- id: F-306
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    The practice-review method's repeatability is measured, not assumed: blind sweep sets are
    committed and npm test runs variance --set over every one, failing when any measure falls below
    the set's own threshold, with a fixture set proving the gate can go red.
