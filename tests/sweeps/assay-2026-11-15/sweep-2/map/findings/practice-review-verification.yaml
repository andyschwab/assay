- id: F-309
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    Nothing in the gate asks whether a committed blind set still stands for the current method:
    variance --check-method is exercised only on a scratch copy pinned to HEAD, so a change to the
    pass-recording text leaves the stored sets re-measured green under a method they were not run on.
  evidence: [lib/gate.mjs:27-34, tests/blocks/sweep-gate.mjs:21-25, tests/blocks/sweep-check-method.mjs:75-90, map/sweep-method.mjs:1-19]
