- id: F-300
  dimension: verification
  polarity: gap
  subject_type: contract
  observation: >
    The pull request template carries a "How this is verified" section asking for the gate's exit
    line and each red seen, but no CI step reads the pull request body, so an empty section or the
    template's unchanged placeholder lands as readily as a filled one.
  evidence: [.github/PULL_REQUEST_TEMPLATE.md:5-10, .github/workflows/ci.yml:10-38, CONTRIBUTING.md:53-54]
  confidence: confirmed
- id: F-301
  dimension: verification
  polarity: gap
  subject_type: process
  observation: >
    For an assertion that holds no core invariant, the only record that it was confirmed red is a
    line the contributor writes in the commit message and the pull request body, and no check reads
    either for it.
  evidence: [CLAUDE.md:55-63, CONTRIBUTING.md:29-33, lib/gate.mjs:27-34]
  confidence: confirmed
- id: F-302
  dimension: verification
  polarity: fact
  subject_type: contract
  observation: >
    The one check that reads commit messages on every change is the Consumer trailer rule, which
    exits 1 naming each commit that touches the consumer surface without a Consumer trailer; it
    reads consumer impact, not the verification a change carries.
  evidence: [lib/release-notes.mjs:13-16, lib/release-notes.mjs:103-111, lib/gate.mjs:33]
  confidence: confirmed
- id: F-303
  dimension: verification
  polarity: gap
  subject_type: process
  observation: >
    A re-bless of tests/golden.json is to say in its commit why each pinned number moved, but
