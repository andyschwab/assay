# ── outside the census ─────────────────────────────────────────────────────────────
- id: F-780
  dimension: multiplayer
  polarity: fact
  subject_type: artifact
  observation: >
    assay offers no HTTP route, server or MCP tool: its interfaces are a command-line dispatcher over node, the files a run holds, three importable modules and its shipped workflows, and the one route candidate enumerate lists is a comment example.
  evidence: [assay.mjs:1-9, map/effect-signals.mjs:293, CONSUMERS.md:164-166]
  confidence: confirmed
- id: F-781
  dimension: multiplayer
  polarity: fact
  subject_type: contract
  observation: >
    Sixteen of the thirty commands are on the consumer contract; the other fourteen (enumerate, the four instruments, score, backlog, roster, measure, validate-packet, ask-owner, owner, since, candidates) have documented usage but are internal by the page's own rule and may change in any commit without notice.
  evidence: [CONSUMERS.md:3-7, CONSUMERS.md:13-14, CONSUMERS.md:16-35, assay.mjs:20-58]
  confidence: confirmed
- id: F-782
  dimension: multiplayer
  polarity: strength
  subject_type: contract
  observation: >
    The consumer contract states that a command that cannot do its work exits non-zero and says why, never printing an empty result with exit 0, so a calling agent can trust an exit code.
  evidence: [CONSUMERS.md:37-38, assay.mjs:76-91]
  confidence: confirmed
- id: F-783
  dimension: multiplayer
  polarity: strength
  subject_type: artifact
  property: shared-context-substrate
  observation: >
    One run directory is the consolidated substrate every scanner, review lane and view reads and writes, its paths placed by one module and every scanner's output passing one port and one adapter format rather than a store per integration.
  evidence: [CONSUMERS.md:142-145, lib/run-layout.mjs:56-59, map/scanners/CONTRACT.md:40-46, map/scanners/CONTRACT.md:1230-1234]
  confidence: confirmed
- id: F-784
  dimension: multiplayer
  polarity: strength
  subject_type: contract
  property: shared-context-substrate
  observation: >
    A run states its target as identity { repository, path }, never a local path, and the cross-run candidates tally counts runs of one target once by that identity, so runs drawn by different people meet on one name.
  evidence: [CONSUMERS.md:149, views/README.md:343-345, map/SCHEMA.md:597-601]
  confidence: confirmed
- id: F-785
  dimension: multiplayer
  polarity: fact
  subject_type: artifact
  property: shared-context-substrate
