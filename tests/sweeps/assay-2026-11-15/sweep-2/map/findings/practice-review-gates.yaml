- id: F-216
  dimension: deterministic-gates
  polarity: fact
  subject_type: process
  observation: >
    No commit or push hook ships in the repository (the only hook files are enumerate
    fixtures under tests/enumerate-fixture/gates/), so a regression is caught by hand when a
    contributor runs npm run gate before pushing, and otherwise first by CI on the pull request.
  evidence: [CONTRIBUTING.md:19-27, .github/workflows/ci.yml:10-13]
  confidence: confirmed
  property: central-regression-caught

- id: F-217
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    A regression in the central measurement module yardstick/measure.mjs that breaks one of
    its six pinned rules is caught on the pull request by the gate's prove-red step, which
    mutates each rule and requires its named block red, and by the harness's blocks that import
