# Pass 3 (gates): the change-gates census (d-change-gates-fail-closed), the guard-fixtures
# context list (d-guards-bite), and the discovery questions central-regression-caught and
# interface-contract-enforced.

# ── change-gates census: the enumerated candidates judged in scope ─────────────────────────
- id: F-200
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The ci.yml tools step runs the composite action under set -euo pipefail, and its install
    exits 1 on any failed download, checksum mismatch or unsupported platform and its verify
    exits 1 unless every pinned instrument answers at its pin, so an absent or wrong tool turns
    the step red and puts nothing on PATH; the 15-minute job timeout bounds a hang (the one
    open edge: verify over an empty selection exits 0, plausible only if every adapter lost its
    tool block).
  evidence: [.github/workflows/ci.yml:37, .github/workflows/ci.yml:21, .github/actions/tools/action.yml:26-31, map/tools.mjs:233-240, map/tools.mjs:241-244]
  confidence: confirmed

- id: F-201
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The ci.yml npm ci step installs from the committed package-lock.json, and npm ci refuses
    (exits non-zero) when the lockfile is absent or disagrees with package.json, so a change
    that moves a devDependency without its lockfile goes red before the gate runs.
  evidence: [.github/workflows/ci.yml:32, package.json:19]
  confidence: plausible

- id: F-202
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The ci.yml gate step runs npm run gate (lib/gate.mjs) on every push to main and pull
    request, on Node 22 and 24, after the tools step has verified every pinned instrument, and
    the gate counts any non-zero or null spawn status (a missing command, a signal) as a failed
    step and exits 1; a hang is bounded only by the job's 15-minute timeout (spawnSync carries
    none), and the one disclosed skip left inside it is services-live when no docker daemon
    answers, named on the gate line rather than failed.
  evidence: [.github/workflows/ci.yml:10-13, .github/workflows/ci.yml:21-24, .github/workflows/ci.yml:38, lib/gate.mjs:40, lib/gate.mjs:51-52, lib/gate.mjs:58, tests/blocks/services-live.mjs:15-20]
  confidence: confirmed
  property: central-regression-caught

- id: F-203
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The release step "Refuse a malformed or existing version" runs under set -euo pipefail and
    exits 1 when the dispatched version is not vX.Y.Z or names a tag that already exists, read
    against a full-history checkout, so an empty or malformed input never reaches the tag.
  evidence: [.github/workflows/release.yml:33-38, .github/workflows/release.yml:28]
  confidence: confirmed
  property: interface-contract-enforced

- id: F-204
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The release job's npm ci step installs from the committed lockfile and npm ci exits
    non-zero when it is missing or out of step with package.json, failing the release before
    any tag.
  evidence: [.github/workflows/release.yml:39, package.json:19]
  confidence: plausible

- id: F-205
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The release job calls the same tools action as ci.yml, whose install and verify exit 1 on
    any absent, broken or other-version instrument under set -euo pipefail, so the release
    stops before npm test when a pinned tool is missing; the job's 20-minute timeout bounds a
    hang.
  evidence: [.github/workflows/release.yml:40, .github/workflows/release.yml:22, .github/actions/tools/action.yml:26-30, map/tools.mjs:241-244]
  confidence: confirmed

- id: F-206
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The release job's npm test runs only after the tools action verified every pinned
    instrument, so the suite's binary-dependent halves (gitleaks, checkov) cannot silently
    return early there, and a block that hangs is ended red by the job's 20-minute timeout.
  evidence: [.github/workflows/release.yml:40-41, .github/workflows/release.yml:22, tests/blocks/gitleaks-not-a-secret.mjs:51, tests/blocks/checkov-agreed-values.mjs:50]
  confidence: plausible

- id: F-207
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The release step "Check every contract change carries its Consumer trailer" runs
    lib/release-notes.mjs --check, which exits 1 on a shallow history, on a CONSUMERS.md with
    no surface block, on a range with no commit adding CONSUMERS.md, on any git error, and on
    each surface commit with no Consumer trailer, so it never reads an unreadable range as
    clean.
  evidence: [.github/workflows/release.yml:42-43, lib/release-notes.mjs:69, lib/release-notes.mjs:76, lib/release-notes.mjs:96-102, lib/release-notes.mjs:106-110]
  confidence: confirmed

- id: F-208
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The lint script (lib/check-syntax.mjs) runs node --check over every tracked engine module,
    exits 1 when git lists no module rather than reading an empty list as clean, and a git
    failure throws out of execFileSync with a non-zero exit.
  evidence: [package.json:11, lib/check-syntax.mjs:11-15]
  confidence: confirmed

- id: F-209
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  observation: >
    Run on its own, the test script (node tests/regression.mjs) reads green with gitleaks or
    checkov absent, because three blocks return early without a failure when the binary does
    not answer, and it skips services-live when no docker daemon answers; and it spawns each
    block with no timeout, so a hung block never reaches a verdict outside a CI job's timeout.
  evidence: [package.json:9, tests/blocks/gitleaks-not-a-secret.mjs:51, tests/blocks/gitleaks-fixtures-and-vendored-bundles.mjs:61, tests/blocks/checkov-agreed-values.mjs:50, tests/blocks/services-live.mjs:20, tests/harness.mjs:171-175]
  confidence: confirmed

- id: F-210
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The typecheck script runs tsc -p tsconfig.json with checkJs over the engine's module
    globs, so an absent typescript install exits non-zero (command not found) and an include
    that matched nothing is a tsc error, never a silent pass.
  evidence: [package.json:12, tsconfig.json:3-4, tsconfig.json:12, package.json:19]
  confidence: plausible

