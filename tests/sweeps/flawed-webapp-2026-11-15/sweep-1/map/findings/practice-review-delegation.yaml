- id: F-403
  dimension: delegation
  polarity: gap
  subject_type: effect
  label: "every note of every user deleted"
  observation: >
    POST /admin/purge clears the whole note store and every user's note list with no copy kept,
    behind a requireAdmin check that passes whenever the token is missing or unknown, because the
    default identity authenticate returns then carries the admin role, so the gate fails open on
