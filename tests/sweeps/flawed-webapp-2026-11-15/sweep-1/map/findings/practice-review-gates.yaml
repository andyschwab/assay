- id: F-200
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  observation: >
    No change gate exists in the reviewed tree: package.json declares only a `start` script, with
    no test, lint, typecheck or check script, and the tree holds no CI workflow or commit hook,
    so the `npm run test:all` the README names as the full suite resolves to no script at all.
  evidence: ["package.json:6-8", "README.md:29-33"]
  confidence: confirmed
- id: F-201
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  property: central-regression-caught
  observation: >
    A subtle regression in server.mjs, the module that holds the whole route dispatch and the
    body parse, is caught by no gate at any point (not pre-commit, not CI, not by hand), because
    nothing in the tree runs the one test file and that file imports only lib/auth.mjs, never
    server.mjs.
  evidence: ["server.mjs:26-57", "test/smoke.mjs:4-5", "package.json:6-8"]
  confidence: confirmed
- id: F-202
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  property: central-regression-caught
  observation: >
    Even run by hand, the smoke test's one assertion cannot go red on a token-lookup regression
    in lib/auth.mjs, because `authenticate` returns a truthy default identity for any missing or
