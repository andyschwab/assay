  evidence: ["server.mjs:59-63"]
  confidence: confirmed
- id: F-205
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  property: interface-contract-enforced
  observation: >
    The request-body interface fails silently, not loudly: `readBody` turns malformed JSON into
    an empty object, and the routes coerce absent fields to empty strings, so a wrong body still
    creates an empty note with 201 or sends an empty question to the assistant with 200.
  evidence: ["server.mjs:16", "server.mjs:36-39", "server.mjs:43-44"]
  confidence: confirmed
- id: F-206
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  property: interface-contract-enforced
  observation: >
    `readBody` checks nothing about the stream it reads: it accumulates a body of any size with
    no cap, validates no field type or shape against a schema, and registers no error listener,
    so an aborted request can leave its promise unsettled rather than refused.
  evidence: ["server.mjs:11-18"]
  confidence: plausible
