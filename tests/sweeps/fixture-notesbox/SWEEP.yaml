# SWEEP.yaml — one sweep set (tests/sweeps/README.md). Gated by npm test:
# node assay.mjs variance --set tests/sweeps/fixture-notesbox
#
# FIXTURE-SIZED and NOT BLIND: three copies of the notesbox fixture's practice-review passes,
# one with a finding dropped (F-031) and one with one descriptor re-judged
# (assistant-email telemetry). It proves the gate reads the number and can go red;
# it measures nothing about the method's repeatability.
# Re-measured under #298's channel key (a channel is the candidate its run's effect-triage maps to
# it, else its slug): no effect triage, so every channel keeps its slug: 2 channels, 2 shared, 1
# identical (50%) and requirement agreement 1 of 1, unchanged.
target: "notesbox (tests/fixtures/notesbox)"
target_commit: "fixture"
method_commit: "ebccbf1"
date: "2026-10-01"
blind: false
threshold:
  fact_presence: 80
  candidate_agreement: 0     # not measured: these sweeps carry no candidate list (map/raw/enumerate.json), so no listed candidate is compared (#312); the gate's red case for descriptors stays on descriptor_agreement
  descriptor_agreement: 50
  requirement_agreement: 100  # the dropped finding and the re-judged descriptor move no verdict: 4 of 4 identical
sweeps: [sweep-1, sweep-2, sweep-3]
