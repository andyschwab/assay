dimensions:
  - dimension: artifact-legibility
    depth: >
      The best instance is complete: ADR-0001 carries status, date, context, decision,
      consequences and a why-not section, and the code it governs links back to it (F-101,
      F-120, F-122); the practice covers one of seven non-obvious decisions (F-121).
    sampled:
      - name: decision-reconstruction
        what: "non-obvious decisions whose why reconstructs from the files alone"
        members: [F-101, F-102, F-103, F-104, F-105, F-106, F-107]
        method: "every decision the terrain froze before assessment, D1-D7, one finding each"
        primary: true
  - dimension: context-economy
    depth: >
      The best instance is lib/auth.mjs, the one module a test loads alone (F-213); the
      README's endpoint list holds for four of its claims but miscounts the routes and names
      a test command that does not exist (F-201, F-207).
    sampled:
      - name: doc-freshness
        what: "README claims that hold when replayed against the code"
        members: [F-201, F-202, F-203, F-204, F-205, F-206, F-207, F-208]
        method: "every concrete README claim the terrain listed, C1-C8, one finding each"
        primary: true
      - name: modules-standalone
        what: "modules an agent can load alone, with something to read and something to run"
        members: [F-211, F-212, F-213, F-214, F-215, F-216, F-217, F-218]
        method: "every source module the terrain listed, eight, one finding each"
  - dimension: deterministic-gates
    depth: >
      No gate in the target holds: the one check is a smoke file nothing runs, whose only
      assertion cannot go red (F-301, F-315), and package.json declares no test, lint or
      typecheck (F-311).
    sampled:
      - name: change-gates
        what: "change gates that go red when what they need is absent or never finishes"
        members: [F-301]
        method: "every check the target tree runs on a change (CI job or step, hook, config-driven check); the tree holds one, the smoke suite"
        primary: true
  - dimension: verification
    depth: >
      The synchronous in-memory effects report what they did (F-403, F-404), while the two
      outward effects report success regardless of the outcome (F-401, F-402).
    sampled:
      - name: effect-provability
        what: "effect channels whose reported result is tied to the effect happening"
        members: [F-401, F-402, F-403, F-404]
        method: "every effect channel in the terrain's inventory, four, one finding each"
        primary: true
  - dimension: delegation
    depth: >
      The one held boundary is that the backup key never enters the prompt (F-518); every
      route's gate fails open through the admin fallback identity (F-510, F-503).
    sampled:
      - name: credential
        what: "secrets the running app reads whose reach is traced in the code"
        members: [F-506, F-507]
        method: "every secret the app reads, enumerated from the tree before assessment: the inline backup key and the inline bearer-token table"
        primary: true
  - dimension: improvement-loop
    depth: >
      No lesson is recorded and no agent spec exists (F-601, F-602); the one dated
      decision record names a follow-up nothing tracks (F-604, F-605).
  - dimension: multiplayer
    depth: >
      Two of five routes are named outside the code in a form an agent can call (F-701,
      F-704); the workspace is shared state with no principal of its own.
    sampled:
      - name: agent-access-surface
        what: "interfaces an agent can reach through a contract stated outside the code"
        members: [F-701, F-702, F-703, F-704, F-705]
        method: "every HTTP route the server dispatches, five, one finding each"
        primary: true
