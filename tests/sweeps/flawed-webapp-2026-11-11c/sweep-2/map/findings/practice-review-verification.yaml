- id: F-401
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    The email-send channel reports success regardless of the effect: the mailer returns a
    constant sent-true after a log-only write, and the assistant ignores that return and
    reports the directive's recipient as emailed, so nothing ties the reported result to a
    message having been delivered.
  evidence: [lib/mailer.mjs:1-8, lib/agent.mjs:39-40, server.mjs:42-44]
  confidence: confirmed
  property: effect-reported-without-verification
- id: F-402
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    The backup-push channel reports ok-true with the note count before the outbound POST
    settles: the fetch is not awaited, its failure is swallowed by an empty catch, and the
    route returns 200 with that report whether the backup service received anything.
  evidence: [lib/sync.mjs:7-13, server.mjs:47-49]
  confidence: confirmed
  property: effect-reported-without-verification
- id: F-403
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    The workspace-purge channel's reported result is reached only after the synchronous
    in-process clear of the note map and every user's note list has run, so the 200 response
    follows the effect, though the purged-true body is a constant rather than read back from
    the emptied store.
  evidence: [lib/db.mjs:27-31, routes/admin.mjs:8-10]
  confidence: confirmed
  property: effect-reported-after-completion
- id: F-404
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    The note-create channel writes the note synchronously into the in-memory map and returns
    201 with the same id it just set, so the reported id names a note that exists when the
    response is sent.
  evidence: [server.mjs:35-39]
  confidence: confirmed
  property: effect-reported-after-completion
- id: F-410
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    Nothing checks the model's output before it acts: a TOOL:send_email line parsed from the
    model's answer sends the whole workspace's note text to whatever recipient and subject it
    names, with no check of the recipient against the workspace's users or the configured
    admin addresses and no check of the content, as the module's own header comment states.
  evidence: [lib/agent.mjs:4-7, lib/agent.mjs:33-41, config/settings.mjs:8, lib/db.mjs:2-6]
  confidence: confirmed
  property: model-output-unchecked
- id: F-411
  dimension: verification
