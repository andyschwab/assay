- id: F-701
  dimension: multiplayer
  polarity: gap
  subject_type: contract
  observation: >
    GET /notes is named in the README with a one-line purpose, but no contract outside the code
    states its bearer-token auth scheme or its response shape, and a caller that omits the token
    silently receives the default identity's empty list instead of an error, so an agent cannot
    use it from the stated contract alone.
  evidence: [README.md:16, server.mjs:30-33, lib/auth.mjs:6-12]
