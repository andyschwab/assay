  property: shared-scope-is-principal
- id: F-711
  dimension: multiplayer
  polarity: strength
  subject_type: control
  observation: >
    The direct read path is per-user: GET /notes returns only the notes whose owner is the
    authenticated caller, and POST /notes stamps each new note with the caller as owner.
  evidence: [server.mjs:31-32, server.mjs:38]
  confidence: confirmed
  property: per-user-read-scope
