- id: F-313
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  observation: >
    No schema validation guards the HTTP interface: readBody swallows a JSON parse failure
    into an empty object and the handlers coerce missing fields to empty strings, so a
    malformed request creates an empty note or asks an empty question with a 200/201
    instead of failing loudly.
  evidence: [server.mjs:11-19, server.mjs:35-39, server.mjs:42-45]
  confidence: confirmed
  property: interface-fails-loud
- id: F-314
  dimension: deterministic-gates
  polarity: gap
  subject_type: process
  observation: >
    A subtle regression in the central request path, such as dropping the owner filter on
    GET /notes or the requireAdmin check before purge, would pass the target's only check,
    which never calls those lines, so within the tree nothing catches it before manual use
    or production.
  evidence: [server.mjs:30-33, routes/admin.mjs:7, test/smoke.mjs:5-9]
  confidence: confirmed
  property: regression-caught-pre-merge
