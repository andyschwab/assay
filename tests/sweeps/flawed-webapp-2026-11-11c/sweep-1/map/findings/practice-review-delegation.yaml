- id: F-512
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    For the authenticated member class, scoping holds on two of the five routes (GET /notes filters to the member's own notes, purge refuses a member role) and fails on the other two that touch others' data, since POST /assistant reads and can email every member's notes and POST /sync pushes every note.
  evidence: [lib/db.mjs:3-4, server.mjs:31, server.mjs:38, routes/admin.mjs:7, lib/agent.mjs:12-15, lib/agent.mjs:38, server.mjs:47-50]
