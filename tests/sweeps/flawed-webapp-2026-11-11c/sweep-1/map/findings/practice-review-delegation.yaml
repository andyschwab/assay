- id: F-506
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    The backup API key, a 40-character literal held in source, is read at exactly one site that sends it as a bearer header to the backup URL with the full note set, but nothing in the tree states what the key may do at the backup service (push only, or read and delete), so its reach there is guessed, not traced.
  evidence: [config/settings.mjs:4-6, lib/sync.mjs:8-12]
  confidence: confirmed
  property: credential-scope-traced
- id: F-507
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    The bearer token table is read at one site, sessions.lookup called from authenticate, and what a token can do is traceable in code, it resolves to one user record whose role field is checked in one place, requireAdmin, used only by the purge route.
  evidence: [lib/db.mjs:13-25, lib/auth.mjs:6-8, lib/auth.mjs:15-17, routes/admin.mjs:7]
  confidence: confirmed
  property: credential-scope-traced
