- id: F-304
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  observation: >
    No test exercises the central server module or any route, the assistant, backup push or purge (the suite imports only the auth module and asserts one call), so a subtle regression in the request handler, including the per-user note filter or the admin purge check, would be caught by no check at any stage, contrary to the README's claim that every endpoint is covered.
  evidence: [test/smoke.mjs:4-11, server.mjs:26-57, routes/admin.mjs:6-11, README.md:35]
  confidence: confirmed
  property: central-module-untested
- id: F-305
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  observation: >
    The HTTP interface has no request schema: the body reader turns malformed JSON into an empty object instead of rejecting it, and handlers coerce missing fields to empty strings, so a bad request from a client or agent silently creates an empty note or an empty question rather than failing loudly.
  evidence: [server.mjs:11-19, server.mjs:36-38, server.mjs:43-44]
  confidence: confirmed
  property: interface-input-unvalidated
- id: F-306
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: >
    The smoke suite uses the runtime's built-in assert module at top level with no try/catch and no dependencies, so a failing assertion throws uncaught and exits non-zero rather than being swallowed, and the suite needs nothing installed to run.
  evidence: [test/smoke.mjs:4-11, package.json:1-9]
  confidence: confirmed
  property: gate-exit-propagates
