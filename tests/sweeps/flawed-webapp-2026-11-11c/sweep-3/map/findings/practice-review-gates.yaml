- id: F-301
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  label: "smoke suite assertion cannot fail"
  observation: >
    The smoke suite's only assertion checks that authenticate returns something truthy for the token it names, but authenticate never returns a falsy value because an unknown or missing token falls back to a default admin identity, so if that token were removed from the session table (or the lookup broke) the assertion would still pass and the gate goes green with nothing verified.
  evidence: [test/smoke.mjs:7-9, lib/auth.mjs:5-13, lib/db.mjs:13-24]
  confidence: confirmed
  property: gate-assertion-vacuous
- id: F-302
  dimension: deterministic-gates
