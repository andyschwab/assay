- id: F-706
  dimension: multiplayer
  polarity: strength
  subject_type: artifact
  property: no-human-only-interface
  observation: >
    Every capability the app offers is reachable over HTTP with JSON responses and none sits only behind a human screen, since the app has no UI and the whole surface is the one route table.
  evidence: [server.mjs:21-24, server.mjs:26-57]
