- id: F-701
  dimension: multiplayer
  polarity: strength
  subject_type: artifact
  label: "GET /notes"
  property: interface-contract-stated-outside-code
  observation: >
    GET /notes takes no request input, and the README endpoint list states its method, path and purpose, which is enough for an agent to form a valid call from the outside contract alone, though the response shape (a JSON object with a notes array of id, owner, text) is stated nowhere outside the code.
  evidence: [README.md:12-16, server.mjs:30-33]
  confidence: confirmed
