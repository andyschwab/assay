- id: F-707
  dimension: multiplayer
  polarity: gap
  subject_type: contract
  property: uniform-response-format
  observation: >
    The response format is not uniform across the surface: the purge handler bypasses the shared JSON helper and answers a refusal with a plain-text body, while every other route and the 404 fallback answer in JSON.
  evidence: [routes/admin.mjs:7-10, server.mjs:21-24, server.mjs:56]
  confidence: confirmed
- id: F-708
  dimension: multiplayer
  polarity: gap
  subject_type: artifact
  property: shared-scope-is-a-principal
  observation: >
    All state lives in one process-wide in-memory store of users, notes and sessions with no workspace entity, so the shared scope the README describes ("admins manage the workspace") is not a principal with its own memory or permissions but only the implicit sum of per-user-owned notes, and it is lost on restart.
  evidence: [lib/db.mjs:2-11, lib/db.mjs:27-31, README.md:3-5, docs/adr/0001-storage-choice.md:22-23]
  confidence: confirmed
- id: F-709
  dimension: multiplayer
  polarity: gap
  subject_type: artifact
  property: single-ownership-record
  observation: >
    Note ownership is recorded twice, as each note's owner field and as each user's notes list, and creating a note writes only the owner field, so the two shared records of who owns what diverge on the first write.
  evidence: [lib/db.mjs:3-4, lib/db.mjs:9-10, server.mjs:37-38]
  confidence: confirmed
- id: F-710
  dimension: multiplayer
  polarity: gap
  subject_type: artifact
  property: consistent-read-scope
  observation: >
    The two read paths over the same store apply different scopes: GET /notes filters to the caller's own notes, while the assistant reads every note in the store into its prompt and its buildPrompt takes the caller but never uses it to narrow the read.
  evidence: [server.mjs:31, lib/agent.mjs:11-15]
  confidence: confirmed
- id: F-711
  dimension: multiplayer
  polarity: strength
  subject_type: artifact
  property: context-origin-labels
  observation: >
    The assistant's prompt labels each workspace note with its owner's identity and separates the workspace notes from the caller's question under distinct headings, so the context entries carry origin labels for the read that produced them.
  evidence: [lib/agent.mjs:12-15, lib/agent.mjs:19]
  confidence: confirmed
- id: F-712
  dimension: multiplayer
  polarity: gap
  subject_type: artifact
  property: context-origin-labels
  observation: >
    The origin labels do not travel with the assistant's output: the emailed summary body is every note's bare text joined without its owner, so a recipient cannot tell whose note each line came from.
  evidence: [lib/agent.mjs:38-39]
  confidence: confirmed
- id: F-713
  dimension: multiplayer
  polarity: gap
  subject_type: process
  property: sharing-is-a-conscious-act
  observation: >
    Sharing is automatic surfacing rather than a conscious act: any caller's question to the assistant draws every member's notes into the context it answers from, with no per-note share flag, consent field or opt-out in the note record.
  evidence: [lib/agent.mjs:12-15, lib/db.mjs:8-11, server.mjs:38, server.mjs:42-45]
  confidence: confirmed
- id: F-714
  dimension: multiplayer
  polarity: gap
  subject_type: artifact
  property: privileged-reader-disclosed
  observation: >
    The privileged-reader asymmetry is undisclosed and contradicted by the docs: the README says the assistant answers questions about "your notes" and that GET /notes lists your notes, while the assistant in fact reads every member's notes, so every caller of the assistant is a reader of all members' content and nothing states it structurally.
  evidence: [README.md:3-5, README.md:16, README.md:18, lib/agent.mjs:12-15]
  confidence: confirmed
- id: F-715
  dimension: multiplayer
  polarity: gap
  subject_type: artifact
  property: usage-telemetry-endpoint
  observation: >
    The interface surface has no usage or outcome telemetry endpoint, population-level or otherwise: the route table offers only the five working routes, and the only usage traces are unstructured console lines from the mailer and the listen call.
  evidence: [server.mjs:30-56, lib/mailer.mjs:7, server.mjs:60]
