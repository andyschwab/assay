- id: F-207
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  label: "Smoke assertion cannot fail"
  observation: >
    The single smoke assertion checks only that authenticate returns a truthy user, which
    authenticate always does (it falls back to a default identity for any unknown token),
    so the test cannot fail on the auth regression it appears to guard.
  evidence:
    - test/smoke.mjs:7-9
    - lib/auth.mjs:7-12
  confidence: confirmed
- id: F-208
  dimension: deterministic-gates
  polarity: gap
  subject_type: process
  label: "No CI in the target"
  observation: >
    No CI configuration exists inside the target (its 12 files include no workflow or CI
    file, and package.json carries no test hook), so a regression in the central module is
    caught at no point automatically, only if someone runs the smoke file by hand.
  evidence:
    - package.json:1-9
    - test/smoke.mjs:1-11
  confidence: confirmed
- id: F-209
  dimension: deterministic-gates
  polarity: gap
  subject_type: process
  label: "No lint or typecheck"
  observation: >
    The target has no lint or typecheck configuration and no devDependencies or scripts for
    either (plain .mjs with no JSDoc types), so interface drift between modules is not
    checked statically.
  evidence:
    - package.json:1-9
  confidence: confirmed
- id: F-210
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  label: "Body parse fails silently"
  observation: >
    readBody swallows a JSON parse error and resolves an empty object, so a malformed request
    body reaches every POST handler as {} instead of failing loudly with a 400.
  evidence:
    - server.mjs:11-19
  confidence: confirmed
- id: F-211
  dimension: deterministic-gates
