# Pass 3 — Deterministic gates (census-augmented: gates-coverage = 5 routes + ADR-0001 storage interface)
- id: F-200
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  label: "GET /notes untested"
  observation: >
    The GET /notes handler's owner filter is pinned by no test: the only test file imports
    authenticate alone and never exercises the router, so a regression that dropped the
    owner filter would pass every gate the target has.
  evidence:
    - server.mjs:30-33
    - test/smoke.mjs:5
  confidence: confirmed
- id: F-201
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  label: "POST /notes untested, unvalidated"
  observation: >
    The POST /notes handler accepts any body without a schema, coercing a missing or
    non-string text field to a string and storing it, and no test exercises the route.
  evidence:
    - server.mjs:35-40
    - test/smoke.mjs:5
  confidence: confirmed
