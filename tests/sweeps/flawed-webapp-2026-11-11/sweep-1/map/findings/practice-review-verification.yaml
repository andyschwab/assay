# ── Census: effect-provability, one finding per terrain effect channel ──

- id: F-400
  dimension: verification
  polarity: strength
  subject_type: control
  observation: >
    The note-create channel's report is derived from the write itself: the handler sets
    the note in the store synchronously and returns 201 with that same id, and GET /notes
    lets the owner read the note back, so the report cannot outrun the effect.
  evidence: [server.mjs:37-39, server.mjs:30-32]
  confidence: confirmed

- id: F-401
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    The assistant-email-send channel reports `emailed: <to>` without checking the mailer's
    result, and the mailer's log-only transport returns `{ sent: true }` unconditionally,
    so the success report is produced whether or not any mail is delivered.
  evidence: [lib/agent.mjs:39-40, lib/mailer.mjs:1-2, lib/mailer.mjs:5-8]
  confidence: confirmed

- id: F-402
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    The backup-push channel fires an un-awaited fetch whose rejection is swallowed by an
    empty catch and returns `{ ok: true, pushed: N }` before the request resolves, so it
    reports success regardless of whether the backup service received anything.
  evidence: [lib/sync.mjs:7-13, server.mjs:47-50]
  confidence: confirmed

- id: F-403
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    The workspace-purge channel returns the constant literal `{ purged: true }` rather than
    anything derived from post-purge state (no count, no readback), and no route reads the
    workspace as a whole to confirm it (GET /notes filters to the caller's own notes).
  evidence: [lib/db.mjs:27-31, routes/admin.mjs:8-10, server.mjs:31]
  confidence: confirmed

