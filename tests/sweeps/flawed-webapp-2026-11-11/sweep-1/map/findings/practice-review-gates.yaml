# ── Schemas / contracts at interfaces ──

- id: F-312
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  observation: >
    Request-body parsing has no schema and fails silent: readBody swallows a JSON parse
    error into an empty object, so a malformed POST /notes body yields a 201 with an
    empty-text note and a malformed POST /assistant body an empty question, rather than a
    400.
  evidence: [server.mjs:11-19, server.mjs:36-39, server.mjs:43-44]
  confidence: confirmed

- id: F-313
