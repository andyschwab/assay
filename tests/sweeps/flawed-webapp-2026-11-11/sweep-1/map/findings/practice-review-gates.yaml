# ── Test / lint / typecheck / CI presence and the test-command claim ──

- id: F-305
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  observation: >
    The README's test command `npm run test:all` names a script that package.json does
    not define (its only script is `start`), so the documented gate entry point fails
    and no `npm test` exists either.
  evidence: [README.md:29-33, package.json:6-8]
  confidence: confirmed

- id: F-306
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  observation: >
    The README claims every endpoint is covered by the smoke suite, while the suite holds
    one assertion against authenticate() and touches none of the five routes.
  evidence: [README.md:35, test/smoke.mjs:4-11, server.mjs:26-57]
  confidence: confirmed

- id: F-307
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  observation: >
    The smoke suite's single assertion (a valid bearer token resolves a user) cannot fail
    on an auth regression, because authenticate() never returns a falsy value: an unknown
    or missing token falls back to a default admin identity, so `assert.ok(u)` passes
    whether or not the token lookup works.
  evidence: [test/smoke.mjs:7-9, lib/auth.mjs:5-13]
  confidence: confirmed

- id: F-308
  dimension: deterministic-gates
  polarity: gap
  subject_type: contract
  observation: >
    No lint, typecheck or formatter is configured in the subtree: package.json declares
    no such script or devDependency and the tree holds no lint or tsconfig/jsconfig file,
    so the untyped .mjs modules get no static check.
  evidence: [package.json:1-9]
  confidence: confirmed

- id: F-309
  dimension: deterministic-gates
