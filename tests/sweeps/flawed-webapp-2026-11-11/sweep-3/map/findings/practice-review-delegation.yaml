- id: F-501
  dimension: delegation
  polarity: gap
  subject_type: effect
  observation: >
    When the assistant's model output contains a TOOL:send_email line, ask() calls
    sendEmail with the model-chosen recipient and subject and a body joined from every
    note in the workspace, with no confirmation, draft, recipient check or other step
    between the parse and the send.
  evidence: [lib/agent.mjs:35-39, lib/agent.mjs:1-7, lib/mailer.mjs:1-8, server.mjs:42-45]
  confidence: confirmed
  label: "email of every workspace note to any address"
  effect:
    channel: email-send
    reversibility: irreversible
    external: true
    gate_type: none
    telemetry: unstructured
    blast_scope: tenant
  preconditions: [prompt-injection]
  explained_by: [F-510]
  escapes: [F-511]

