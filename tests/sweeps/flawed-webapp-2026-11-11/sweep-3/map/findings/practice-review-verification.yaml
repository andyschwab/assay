  evidence: [server.mjs:59-63, test/smoke.mjs:4-5]
  confidence: confirmed

- id: F-411
  dimension: verification
  polarity: fact
  subject_type: artifact
  observation: >
    The model call is a deterministic in-process stub that echoes any TOOL:send_email line
    with an address found in its prompt, so the assistant-to-email path is reproducible
