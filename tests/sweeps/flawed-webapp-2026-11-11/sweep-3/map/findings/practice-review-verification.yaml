- id: F-408
  dimension: verification
  polarity: gap
  subject_type: artifact
  observation: >
    The only test file asserts that authenticate returns a truthy user for one token and
    imports nothing else, so no test, example or fixture exercises any effect channel
    (mailer, sync, note write, purge) or the server, and package.json defines no test script.
  evidence: [test/smoke.mjs:1-11, package.json:6-8]
