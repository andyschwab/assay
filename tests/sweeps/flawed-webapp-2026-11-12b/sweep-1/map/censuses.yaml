schema: coverage
dimensions:
  - dimension: artifact-legibility
    depth: >
      The best instance is the storage decision: ADR-0001 records context, decision, consequences and the rejected alternative, and the code links back to it (F-101), and its persistence claim holds against the code (F-115); everywhere else rationale is a one-line comment or absent (F-103, F-107), and half the README's concrete claims do not hold (F-108, F-111, F-112).
    sampled:
      - name: decision-reconstruction
        what: "the terrain's frozen non-obvious decisions: can a newcomer reconstruct why each was made from the files alone?"
        members: [F-101, F-102, F-103, F-104, F-105, F-106, F-107]
        method: "terrain's frozen list D1-D7, one finding each"
        primary: true
      - name: doc-freshness
        what: "the terrain's concrete doc claims in README.md and the ADR: does each hold when replayed against the code?"
        members: [F-108, F-109, F-110, F-111, F-112, F-113, F-114, F-115]
        method: "terrain's list C1-C8, one finding each, replayed against the code by reading (no fresh-clone run: execution not allowed)"
  - dimension: context-economy
    depth: >
      The best instance is lib/auth.mjs (F-203): a head comment, a test that imports it directly and one in-repo import; every module is small and commented, but only that one has anything to run, and the one model call records nothing (F-209).
    sampled:
      - name: modules-standalone
        what: "every module in the terrain's module population: can an agent load it alone, with something to read (head comment), something to run (a test importing it directly), and at most ten transitive in-repo imports?"
        members: [F-201, F-202, F-203, F-204, F-205, F-206, F-207, F-208]
        method: "the terrain's frozen module list (8 modules), one finding each, the three-part check read off the tree"
        primary: true
      - name: model-call-telemetry
        what: "every model call site: does the call emit one structured record of its tier, spend and outcome?"
        members: [F-209]
        method: "populations.modelCalls of map/raw/enumerate.json (one candidate, lib/agent.mjs), triaged once; no stand-in outside the list found on reading all 12 files"
  - dimension: deterministic-gates
    depth: >
      No change gate exists in the target (F-301), so the change-gates census has no member; the nearest thing to a gate, the unwired smoke file, asserts a check that cannot go red because authentication never returns falsy (F-302, F-303).
  - dimension: verification
    depth: >
      The best instance is an unused affordance: the server can be imported and driven in-process (F-408), but no test drives it, and the two outward effects report success without confirming it (F-403, F-404).
  - dimension: delegation
    depth: >
      The best instance is thin: per-owner read scoping on GET /notes holds (F-513) and the backup key stays below the model boundary (F-506), but the only effect gate, the purge's role check, opens for a tokenless caller (F-504, F-516) and the assistant's email send has no gate at all (F-502, F-505).
    sampled:
      - name: credential
        what: "every secret the app reads (populations.secrets): is what it can reach traced in the code, read site and uses?"
        members: [F-506, F-507]
        method: "enumerate.json populations.secrets (backupApiKey, tokenTable), one finding each, read site and reach traced"
        primary: true
      - name: ingested-content
        what: "every ingestion point: is its text kept as data, stored verbatim with provenance, rendered escaped, never acted on?"
        members: [F-508, F-509]
        method: "terrain's I1-I2, one finding each; the remaining routes read no body, so none missed"
  - dimension: improvement-loop
    depth: >
      There is no best instance: the target records no lesson at all (F-601), keeps its two backlog items as a code TODO and ADR prose rather than issues (F-602, F-603), and neither measures its own impact nor emits usage or outcome records (F-604, F-605).
  - dimension: multiplayer
    depth: >
      The best instance is thin: four of the five routes are named by method and path in the README (F-701 to F-704), but no route's body or response is stated anywhere outside the code, the admin purge route is undocumented (F-705), and the shared context store has no scope principal or consent model (F-706, F-707, F-708).
    sampled:
      - name: agent-access-surface
        what: "every route the app offers a caller: is it named by a contract kept outside the code (e.g. a doc page giving method and path)?"
        members: [F-701, F-702, F-703, F-704, F-705]
        method: "terrain's frozen list of five routes, confirmed against the server.mjs dispatch, one finding each"
        primary: true
context:
  - name: second-accounts
    members: [F-116, F-117, F-118]
  - name: model-qualification
    members: [F-210]
  - name: guard-fixtures
    members: [F-303]
  - name: change-verification
    members: [F-402]
  - name: ai-feature-evals
    members: [F-401]
  - name: ai-disclosure
    members: [F-510]
  - name: backlog-records
    members: [F-602, F-603]
