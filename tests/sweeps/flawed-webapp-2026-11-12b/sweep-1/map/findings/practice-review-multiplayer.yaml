- id: F-706
  dimension: multiplayer
  polarity: gap
  subject_type: artifact
  observation: >
    The context store is one process-global notes map with no workspace, room or project object,
    so the shared scope is not a principal with its own memory or permissions; privacy is decided
    per route instead, GET /notes filtering to the caller's own notes while the assistant reads
    every note in the map.
  evidence: [lib/db.mjs:2-11, server.mjs:31, lib/agent.mjs:12-15]
  confidence: confirmed
  property: shared-context-substrate
- id: F-707
  dimension: multiplayer
  polarity: gap
  subject_type: control
  observation: >
    Sharing is automatic, not a conscious act: every member's note text, tagged with its owner's
    email, is placed into the prompt of any caller of the assistant, with no opt-in, per-note
    visibility flag or owner consent anywhere in the store or the prompt builder.
  evidence: [lib/agent.mjs:11-20, lib/agent.mjs:33-34, lib/db.mjs:8-11, server.mjs:42-45]
  confidence: confirmed
  property: sharing-is-consented
- id: F-708
  dimension: multiplayer
  polarity: gap
  subject_type: artifact
  observation: >
    The privileged reader is not disclosed: the README says the assistant answers questions about
    "your notes", while the code gives it every member's notes, so a member cannot tell from the
    product's own description that their notes reach other members' assistant sessions.
  evidence: [README.md:3-5, README.md:18, lib/agent.mjs:12-15]
  confidence: confirmed
  property: sharing-is-consented
