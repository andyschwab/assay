  property: control-matches-modality
- id: F-516
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    authenticate returns a default identity with role 'admin' for any missing or unknown bearer
    token, so the unauthenticated principal class holds admin and every route, the role-checked
    purge included, treats a tokenless caller as an administrator.
  evidence: [lib/auth.mjs:5-13, lib/auth.mjs:15-17, server.mjs:27]
  confidence: confirmed
  property: acting-principal-stated
  label: "tokenless caller is admin"
