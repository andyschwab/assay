- id: F-501
  dimension: delegation
  polarity: gap
  subject_type: effect
  observation: >
    POST /notes writes the request's text into the shared in-memory note store under the caller's id with no log line, and a caller with a missing or unknown token is accepted as the fallback identity, so anyone who reaches the port can write into the store the assistant reads.
  evidence: [server.mjs:35-39, lib/auth.mjs:9-12]
  confidence: confirmed
  effect:
    channel: note-create
    reversibility: reversible
    external: false
    gate_type: none
    telemetry: none
    blast_scope: tenant
  reaches: [F-505]
  label: "unauthenticated note write"
- id: F-502
  dimension: delegation
  polarity: gap
  subject_type: effect
  observation: >
    When the model's output carries a TOOL:send_email line, ask() sends every note in the workspace to the address and subject the output names with no confirmation, allowlist or draft step between the parse and the send, and the transport records only one console line.
  evidence: [lib/agent.mjs:35-40, lib/mailer.mjs:1-8, server.mjs:42-45]
  confidence: confirmed
  effect:
    channel: assistant-email-send
    reversibility: irreversible
    external: true
    gate_type: none
    telemetry: unstructured
    blast_scope: tenant
  preconditions: [prompt-injection]
  escapes: [F-513]
  label: "email of every note to any address"
- id: F-503
  dimension: delegation
  polarity: gap
  subject_type: effect
  observation: >
    POST /sync pushes the full note set to the external backup URL with no authorization check, fire-and-forget with its error swallowed and no log, and answers ok regardless of the outcome.
  evidence: [server.mjs:47-50, lib/sync.mjs:5-13, config/settings.mjs:4]
  confidence: confirmed
  effect:
    channel: backup-push
    reversibility: irreversible
    external: true
