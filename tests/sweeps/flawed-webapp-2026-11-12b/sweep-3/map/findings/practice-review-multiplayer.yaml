- id: F-706
  dimension: multiplayer
  polarity: gap
  subject_type: artifact
  observation: >
    Context lives in one process-wide store with no shared scope as a principal: notes carry
    only an `owner`, users carry no workspace, room or project, and the "workspace" is the
    whole map implicitly; the note-list route reads it as private per owner while the
    assistant reads it as shared across every owner, so the private/shared boundary is set per
    code path rather than by the store.
  evidence: [lib/db.mjs:2-11, server.mjs:31, lib/agent.mjs:12-15]
  confidence: confirmed
  property: shared-context-substrate
- id: F-707
  dimension: multiplayer
  polarity: gap
  subject_type: process
  observation: >
    Sharing is automatic, not a conscious act: any caller's assistant question builds a prompt
    holding every member's notes with each owner's email, and no note carries a shared/private
    flag or any act by its owner that would admit it to another member's assistant context.
  evidence: [lib/agent.mjs:11-20, lib/agent.mjs:33-34, server.mjs:42-44, lib/db.mjs:8-11]
  confidence: confirmed
  property: sharing-is-consented
