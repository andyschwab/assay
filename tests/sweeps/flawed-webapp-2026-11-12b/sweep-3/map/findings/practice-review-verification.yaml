- id: F-401
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    The backup push (channel backup-push) fires its HTTP request without awaiting it, swallows
    any failure with an empty catch, and returns ok true with the note count regardless, which
    POST /sync sends back as a 200, so the success report never confirms the push happened.
  evidence: [lib/sync.mjs:7-13, server.mjs:47-49]
  confidence: confirmed
  property: effect-confirmed-not-reported
- id: F-402
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    The assistant's email send (channel assistant-email-send) reports emailed with the recipient
    without reading the transport's result, and the transport itself returns sent true
    unconditionally while only logging a line (its own header says nothing ever actually sends),
    so the report is decoupled from the effect.
  evidence: [lib/agent.mjs:39-40, lib/mailer.mjs:1-2, lib/mailer.mjs:5-8]
  confidence: confirmed
  property: effect-confirmed-not-reported
- id: F-403
  dimension: verification
  polarity: fact
  subject_type: control
  observation: >
    The workspace purge (channel workspace-purge) clears the in-memory store synchronously and
    returns a constant purged true that the admin route writes out as a 200; the report is a
    literal, not read back from the store's state, though the in-process clear has no
    asynchronous step where it could drop.
  evidence: [lib/db.mjs:27-31, routes/admin.mjs:8-10]
  confidence: confirmed
  property: effect-confirmed-not-reported
- id: F-404
  dimension: verification
  polarity: fact
  subject_type: control
  observation: >
    Note creation (channel note-create) writes the note into the in-memory map synchronously and
    then answers 201 with the new id; nothing reads the write back, but the report follows an
    in-process write with no failure path that could be swallowed.
  evidence: [server.mjs:35-39]
  confidence: confirmed
  property: effect-confirmed-not-reported
- id: F-405
  dimension: verification
  polarity: gap
  subject_type: control
  observation: >
    The only check a change can run asserts that authenticate returns a truthy user for a valid
