- id: F-036
  dimension: deterministic-gates
  polarity: fact
  subject_type: process
  observation: "No pre-commit hook exists; the earliest automatic catch of a regression is CI on the pull request, and whether the ci check is required by branch protection is not visible from the tree (the runbook states the release convention as a green ci check before merge)."
  evidence: [.github/workflows/ci.yml:8-11, RUNBOOK.md:11-12, .github/PULL_REQUEST_TEMPLATE.md:1-11]
  confidence: plausible

- id: F-037
