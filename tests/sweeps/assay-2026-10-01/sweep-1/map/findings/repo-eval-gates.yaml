- id: F-026
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: "CI runs on every push to main and every pull request, on Node 20 and 22, executing npm ci, lint, typecheck, build and the regression harness."
  evidence: [.github/workflows/ci.yml:7-11, .github/workflows/ci.yml:20-31, .github/workflows/ci.yml:47]
  confidence: confirmed

- id: F-027
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: "The engine's own CI workflow pins actions to commit SHAs, runs with a read-only token and a timeout, and the harness asserts those invariants on it and on the shipped routine template."
  evidence: [.github/workflows/ci.yml:13-14, .github/workflows/ci.yml:19, .github/workflows/ci.yml:24-25, tests/regression.mjs:3505-3512]
  confidence: confirmed

- id: F-028
  dimension: deterministic-gates
  polarity: strength
  subject_type: contract
  observation: "The harness carries one negative fixture per validator rule, each required to fail for its own named violation and no other, so removing any rule turns the suite red."
  evidence: [tests/regression.mjs:76-82, tests/regression.mjs:112-114, tests/regression.mjs:146]
  confidence: confirmed

- id: F-029
  dimension: deterministic-gates
  polarity: strength
