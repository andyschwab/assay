# map/findings/repo-eval-context.yaml — neutral evidence base for assay at
# c30912c (blind sweep 1). Pass 2: context economy (docs routing, module
# boundaries, doc freshness, and the spend side: model tier and inference spend).

- id: F-014
  dimension: context-economy
  polarity: strength
  subject_type: artifact
  observation: "The 58-line agent contract routes a stranger to the four authoritative documents (README front door, SCHEMA format, METHOD scanner, yardstick and views contracts) before stating the ground rules."
  evidence: [CLAUDE.md:3-7]
  confidence: confirmed

- id: F-015
  dimension: context-economy
  polarity: strength
  subject_type: artifact
  observation: "The README's layout section maps each top-level directory to one responsibility (map, yardstick, views, owner, routine, lib, tests), matching the three-layer architecture it draws."
  evidence: [README.md:30-41, README.md:168-181]
  confidence: confirmed

- id: F-016
  dimension: context-economy
  polarity: strength
  subject_type: artifact
  observation: "Every run artifact path is owned by one module (lib/run-layout.mjs), so a task touching the run layout loads one file rather than tracing path construction across the engine."
  evidence: [lib/run-layout.mjs:1-6]
  confidence: confirmed

- id: F-017
  dimension: context-economy
  polarity: strength
  subject_type: artifact
  observation: "The command dispatcher lists every command with its script and a one-line purpose, grouped by layer, so the CLI surface loads from one 73-line file."
  evidence: [assay.mjs:18-46]
  confidence: confirmed

- id: F-018
  dimension: context-economy
  polarity: strength
