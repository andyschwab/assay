- id: F-058
  dimension: delegation
  polarity: gap
  subject_type: capability
  label: "the repo-eval steward session"
  observation: >
    The repo-eval method runs in a coding-agent session the operator opens, pointed at the untrusted
    target tree and writing its findings; the method states that a person sends any output but sets
    no bound on the session's own tools, so the session can hold untrusted input, private target
    content and whatever external effects its host grants.
  evidence: [README.md:112-114, README.md:131-132, map/METHOD.md:737-741]
  confidence: plausible
  capabilities:
    untrusted_input: true
    private_data: true
    external_effect: true
  preconditions: [prompt-injection]
  reaches: [F-049]
- id: F-059
  dimension: delegation
  polarity: fact
  subject_type: capability
  label: "the handoff plan session"
  observation: >
    Each handoff plan prompt is written for an agent session in the target repository; it carries
    scanner text from the target fenced as data with a hash-tagged closing marker and inert markers
    inside, and instructs the session never to deploy or send anything on its own.
  evidence: [views/improve/handoff.mjs:149-155, views/improve/handoff.mjs:214, views/improve/handoff.mjs:344-346, map/METHOD.md:597-601]
  confidence: plausible
  capabilities:
    untrusted_input: true
    private_data: true
    external_effect: false
- id: F-060
  dimension: delegation
