# Pass 5 — delegation. One effect finding per terrain channel (9), one capability finding per
# AI surface the repository authors (3), then the credential census, job classes and controls.
- id: F-049
  dimension: delegation
  polarity: fact
  subject_type: effect
  label: "run the evaluated repository's own code"
  observation: >
    fresh-clone runs the target's own install (lifecycle scripts included), build, lint, typecheck,
    test and migrate-dry scripts through a shell on the evaluator's machine; assay start runs it only
    under --allow-exec, while the fresh-clone command itself runs it when invoked.
  evidence: [assay.mjs:25, map/start.mjs:267, map/start.mjs:300, map/fresh-clone.mjs:316, map/fresh-clone.mjs:390]
  confidence: confirmed
  effect:
    channel: fresh-clone-exec
    reversibility: irreversible
    external: true
    gate_type: deterministic-halt
    fail_mode: closed
    telemetry: structured-event
    blast_scope: user
  preconditions: [malicious-dependency]
- id: F-050
  dimension: delegation
  polarity: fact
  subject_type: effect
  label: "run a pull request's code in CI"
  observation: >
    The routine template's target job runs the checked-out change's install and tests in place on
    every schedule, push to main, pull request and manual dispatch, in a job of its own with
    contents read only and no persisted credentials.
  evidence: [routine/assay-routine.yml:16-33, routine/assay-routine.yml:47-74, routine/README.md:111-125]
  confidence: confirmed
  effect:
    channel: routine-target-exec
    reversibility: irreversible
    external: true
    gate_type: scope-bound
    fail_mode: closed
    telemetry: structured-event
    blast_scope: tenant
  preconditions: [insider]
- id: F-051
  dimension: delegation
  polarity: fact
  subject_type: effect
  label: "send a lockfile to the package registry's audit"
  observation: >
    dependency-scan runs npm, pnpm or yarn audit against every lockfile from a scratch directory
    holding only the lockfile and its package.json, with the allow-listed environment, which sends
    the dependency graph to the package registry.
  evidence: [map/dependency-scan.mjs:81-91, map/dependency-scan.mjs:231-236, map/dependency-scan.mjs:355, map/scanners/CONTRACT.md:358-366]
  confidence: confirmed
  effect:
    channel: dependency-audit
    reversibility: irreversible
    external: true
    gate_type: scope-bound
    fail_mode: closed
    telemetry: structured-event
    blast_scope: user
- id: F-052
  dimension: delegation
  polarity: gap
  subject_type: effect
  label: "publish the run as a workflow artifact"
  observation: >
    The routine uploads the whole run directory as a workflow artifact on every firing, if always(),
    kept 90 days and downloadable by anyone who can read the repository's workflow runs (anyone, on
    a public repository), with no filter at the upload step.
  evidence: [routine/assay-routine.yml:188-195, routine/README.md:29-36]
  confidence: confirmed
  effect:
    channel: routine-artifact-upload
    reversibility: irreversible
    external: true
    gate_type: none
    telemetry: unstructured
    blast_scope: tenant
  preconditions: [insider]
- id: F-053
