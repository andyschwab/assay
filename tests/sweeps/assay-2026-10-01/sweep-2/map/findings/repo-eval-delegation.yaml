    private_data: true
    external_effect: false
- id: F-061
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    During this sweep's start, the pnpm audit of the copied fresh-clone-pnpm lockfile spawned a
    "pnpm add pnpm@10.33.0" and timed out: the package.json copied into the scratch directory names a
    packageManager version, so the target's manifest can select a package-manager binary that is
    fetched and run, which the contract's account of what an audit loads does not cover.
  evidence: [map/dependency-scan.mjs:85-89, map/dependency-scan.mjs:355, tests/instruments/fresh-clone-pnpm/package.json:4, map/scanners/CONTRACT.md:159-163]
  confidence: plausible
- id: F-062
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    Every child the instruments spawn gets an environment built from an allow-list (PATH, HOME, CI
    and the npm_config_* values the instrument sets), so no token, cloud key, agent socket or
    database URL of the evaluator reaches the target's code.
  evidence: [map/child-env.mjs:1-21, map/scanners/CONTRACT.md:153-162]
  confidence: confirmed
- id: F-063
  dimension: delegation
  polarity: fact
  subject_type: control
  observation: >
    The contract states the environment allow-list is not a sandbox: the target's scripts still run as
    the evaluator's user with that user's filesystem and network, and isolation is left to running
    in a disposable container or VM.
  evidence: [map/scanners/CONTRACT.md:163-166, README.md:59-61, assay.mjs:53-54]
  confidence: confirmed
- id: F-064
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    Credential census (2 runtime credentials): the optional ASSAY_READ_TOKEN is commented out by
    default and both checkouts set persist-credentials false; the workflow token reaches only the gate
    job's one base-branch fetch through that step's environment, in the job that never runs the
    change's code.
  evidence: [routine/assay-routine.yml:55, routine/assay-routine.yml:63-64, routine/assay-routine.yml:105-114, routine/assay-routine.yml:122-123]
  confidence: confirmed
- id: F-065
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    Job classes are assessed apart: the target job executes the change and hands forward only data;
    the gate job checks the repository and the pinned engine out afresh and never executes the change,
    so the change cannot rewrite the engine, baseline or run its gate reads.
  evidence: [routine/assay-routine.yml:40-46, routine/README.md:111-141]
  confidence: confirmed
- id: F-066
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    The routine's halt on a regressing pull request holds only if the installer marks the routine job
    a required status check and adds CODEOWNERS for packet/ and .github/workflows/; the template cannot
    set either, and without them the gate is a red mark that does not block a merge.
  evidence: [routine/README.md:200-217]
  confidence: confirmed
- id: F-067
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    Authorship is structural in the outputs: authored roadmap prose is labeled as the evaluating
    agent's own voice beside scanner-verbatim text, and the index and report colophon name the model
    of record per scanner and per pass, or say none was recorded.
  evidence: [map/METHOD.md:604-606, map/SCHEMA.md:381-384, views/improve/handoff.mjs:273-274]
  confidence: confirmed
