    map/SCHEMA.md (878 lines), and the method names SCHEMA.md authoritative, so a repo-eval session
    loads both, about 1,665 lines, before reading the target.
  evidence: [map/METHOD.md:265-273, map/SCHEMA.md:5-12, README.md:131-132]
  confidence: confirmed
