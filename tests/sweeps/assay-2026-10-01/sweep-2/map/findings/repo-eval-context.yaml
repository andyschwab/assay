# Pass 2 — context economy. Module census (terrain.md, 8 load-bearing directories): one
# finding per module, subject_type artifact, met = loadable standalone from its own docs.
- id: F-013
  dimension: context-economy
  polarity: strength
  subject_type: artifact
  observation: >
    The front door routes a stranger in one screen: a table of the four views and their data files,
    the one rule, the architecture, a quickstart and a directory layout, and the agent contract
    names which document owns which contract.
  evidence: [README.md:1-28, README.md:168-181, CLAUDE.md:3-7]
  confidence: confirmed
- id: F-014
