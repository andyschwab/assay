# map/findings/repo-eval-gates.yaml — Pass 3, deterministic gates, over assay at c30912c
# (blind sweep 3). Census-augmented: one finding per interface contract (gates-coverage
# population, subject_type contract), then the CI and harness facts.

- id: F-024
  dimension: deterministic-gates
  polarity: strength
  subject_type: control
  observation: >
    CI runs on every push to main and every pull request, on Node 20 and 22, executing
    npm ci, lint, typecheck, build and the regression harness, with a read-only token, a
    timeout, and actions pinned to commit SHAs.
  evidence: [.github/workflows/ci.yml:8-31, .github/workflows/ci.yml:47]
  confidence: confirmed

- id: F-025
  dimension: deterministic-gates
  polarity: fact
  subject_type: control
  observation: >
    The `lint` and `build` scripts are the same syntax check (node --check over every tracked
    engine module); no linter with style or correctness rules runs.
  evidence: [package.json:10-12, lib/check-syntax.mjs:1-15]
  confidence: confirmed

- id: F-026
  dimension: deterministic-gates
  polarity: strength
  subject_type: control
  observation: >
    The typecheck runs tsc with checkJs over every engine module directory (root, lib, map,
    owner, routine, views, yardstick); the tests directory is outside its include list.
  evidence: [tsconfig.json:1-12, package.json:11]
  confidence: confirmed

- id: F-027
  dimension: deterministic-gates
  polarity: strength
  subject_type: control
  observation: >
    Each validator rule has a negative fixture that must validate red for its own named
    violation and for no other, so removing a rule or breaking a fixture turns the harness red.
  evidence: [tests/regression.mjs:72-133, tests/regression.mjs:146-158]
  confidence: confirmed

- id: F-028
  dimension: deterministic-gates
  polarity: strength
  subject_type: control
  observation: >
    `--bless` of golden.json refuses to write while any unit or negative assertion fails, so
    only pinned scores can be re-blessed, never a failing invariant.
  evidence: [tests/regression.mjs:4988-5005, CLAUDE.md:47-50]
  confidence: confirmed

- id: F-029
  dimension: deterministic-gates
