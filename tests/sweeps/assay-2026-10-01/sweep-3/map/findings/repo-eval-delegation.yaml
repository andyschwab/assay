# ── AI surfaces (capabilities) ──

- id: F-066
  dimension: delegation
  polarity: gap
  subject_type: capability
  label: "the repo-eval session over a target"
  observation: >
    The repo-eval session reads the whole target repository (untrusted text, possibly private
    code) and is told to run `assay start` and `enumerate`, which run dependency-scan against
    the registry, while METHOD.md's ground rules give that session no instruction to treat the
    target's own files (including a target CLAUDE.md) as data rather than instructions.
  evidence: [map/METHOD.md:33-59, map/METHOD.md:83-87, map/METHOD.md:126-127, README.md:131-132]
  confidence: confirmed
  capabilities:
    untrusted_input: true
    private_data: true
    external_effect: true
  preconditions: [prompt-injection]
  reaches: [F-056, F-055, F-067]

- id: F-067
  dimension: delegation
  polarity: fact
  subject_type: capability
  label: "the session a handoff plan prompt is pasted into"
  observation: >
    A handoff plan prompt is pasted into a coding session that edits the target repository;
    scanner text inside it is fenced as data, while the roadmap prose the eval agent authored
    renders unfenced as the eval agent's own voice, under a standing guard against deploying,
    publishing or sending.
  evidence: [views/improve/handoff.mjs:26-30, views/improve/handoff.mjs:150-155, views/improve/handoff.mjs:345-348]
  confidence: confirmed
  capabilities:
    untrusted_input: true
    private_data: true
    external_effect: false
  preconditions: [prompt-injection]

- id: F-068
  dimension: delegation
  polarity: gap
  subject_type: control
  observation: >
    The handoff's data fence covers scanner text only; prose the eval agent wrote after reading
    the untrusted target is rendered unfenced, so an instruction carried from the target into
    the eval agent's roadmap prose reaches the implementing session as trusted text.
  evidence: [views/improve/handoff.mjs:26-30, map/METHOD.md:601-606]
  confidence: plausible
  explained_by: [F-066]

- id: F-069
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    The handoff fence closes only on a per-run hash tag no fenced text can carry, marker runs
    inside a body are spaced out, and a harness block pins that target text stays data across
    the handoff and the views.
  evidence: [views/improve/handoff.mjs:150-155, tests/regression.mjs:4392-4400]
  confidence: confirmed

- id: F-070
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    ask-owner prints a prompt for the owner to paste into their own AI and performs no effect
    itself; a steward-supplied --found file is swept for secret- and email-shaped values and
    refused if it carries a template marker.
  evidence: [owner/ask-owner.mjs:1-7, owner/ask-owner.mjs:29-35]
  confidence: confirmed

# ── credential census (one control per credential) ──

- id: F-071
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    ASSAY_READ_TOKEN, the optional secret for a private assay fork, is commented out by default
    and, when enabled, rides only the checkout steps with persist-credentials false, so it is
    not left in .git/config where the change's scripts run.
  evidence: [routine/assay-routine.yml:8-10, routine/assay-routine.yml:57-64, routine/assay-routine.yml:116-123]
  confidence: confirmed

- id: F-072
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    The job token reaches exactly one git fetch in the gate job through environment-scoped git
    config, never .git/config, in a job that never runs the change's code.
  evidence: [routine/assay-routine.yml:96-114]
  confidence: confirmed

- id: F-073
  dimension: delegation
  polarity: strength
  subject_type: control
  observation: >
    The engine's CI downloads the gitleaks release pinned by version and checks its published
    sha256 before installing it, under set -euo pipefail.
  evidence: [.github/workflows/ci.yml:32-46]
  confidence: confirmed

- id: F-074
  dimension: delegation
  polarity: fact
  subject_type: control
  observation: >
    Every engine effect runs as the invoking OS user or the CI job's own token; the engine has
    no identity, role or per-scope permission model of its own, and no egress control beyond
    dropping proxy and token variables from child environments.
  evidence: [map/child-env.mjs:4-8, routine/assay-routine.yml:32-33, README.md:98-114]
  confidence: confirmed
