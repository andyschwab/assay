# map/findings/repo-eval-delegation.yaml — Pass 5, delegation, over assay at c30912c
# (blind sweep 3). One effect finding per terrain channel (11), the capability findings
# for the two documented agent contexts, the credential census (one control per
# credential), and the halt / containment controls the effects are measured against.

# ── containment and halt controls (referenced by escapes / reaches below) ──

- id: F-052
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "the --allow-exec halt on start"
  observation: >
    `assay start` runs fresh-clone only when given --allow-exec and otherwise records it
    skipped with the reason, so the default start path never executes the target's code.
  evidence: [map/start.mjs:196-199, map/start.mjs:245, map/start.mjs:278]
  confidence: confirmed

- id: F-053
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "the child environment allow-list"
  observation: >
    Every child process that runs the target's scripts or package manager gets only PATH,
    HOME, CI and the instrument's own npm_config_* values, so the evaluator's tokens, cloud
    keys, agent sockets and DATABASE_URL never reach it as environment.
  evidence: [map/child-env.mjs:1-21, map/fresh-clone.mjs:62-67, map/dependency-scan.mjs:79]
  confidence: confirmed

- id: F-054
  dimension: delegation
  polarity: strength
  subject_type: control
  label: "the scratch-copy audit"
  observation: >
    Each audit runs in a scratch directory holding only the lockfile and its package.json,
    so the target's .npmrc, .yarnrc and .pnpmfile.cjs are never loaded by the package manager.
  evidence: [map/dependency-scan.mjs:20-27, map/dependency-scan.mjs:80-92]
  confidence: confirmed

# ── effect channels (terrain inventory, one each) ──

- id: F-055
  dimension: delegation
  polarity: gap
  subject_type: effect
  label: "run the target's code on the evaluator's machine"
  observation: >
    The `assay fresh-clone` command runs the target's install (lifecycle scripts included),
    build, lint, typecheck, test and migrate scripts as the evaluator's user with no flag of
    its own; the --allow-exec halt exists only in `start`, and the child keeps HOME, so the
    scripts can read the evaluator's home-directory files despite the environment allow-list.
  evidence: [assay.mjs:25, map/fresh-clone.mjs:62-67, map/fresh-clone.mjs:388-390, map/fresh-clone.mjs:649-663, map/child-env.mjs:10-16]
  confidence: confirmed
  effect:
    channel: fresh-clone-exec
    reversibility: irreversible
    external: true
    gate_type: none
    telemetry: structured-event
    blast_scope: user
  preconditions: [malicious-dependency]
  escapes: [F-053]

- id: F-056
  dimension: delegation
  polarity: gap
  subject_type: effect
  label: "audit lockfiles against the registry"
  observation: >
    `assay start` runs dependency-scan without --allow-exec, and the scratch copy carries the
    target's package.json, whose packageManager field pnpm honours: in this sweep's start,
    auditing a fixture whose package.json names pnpm@10.33.0 spawned `pnpm add pnpm@10.33.0`
    from the registry and the audit timed out.
  evidence: [map/start.mjs:200, map/dependency-scan.mjs:84-92, map/dependency-scan.mjs:355, tests/instruments/fresh-clone-pnpm/package.json:4]
  confidence: confirmed
  effect:
    channel: dependency-audit
    reversibility: reversible
    external: true
    gate_type: scope-bound
    fail_mode: open
    telemetry: structured-event
    blast_scope: user
  preconditions: [malicious-dependency]
  escapes: [F-054]

