# map/findings/repo-eval-improvement.yaml — Pass 6, improvement loop, over assay at
# c30912c (blind sweep 3). Census-augmented: one finding per incident/lesson the tree
# records as having become a mechanism (subject_type process), then the spec, review,
# impact and instrumentation facts.

- id: F-075
  dimension: improvement-loop
  polarity: strength
  subject_type: artifact
  observation: >
    CLAUDE.md is an agent spec that accumulates the repository's rules (six ground rules, the
    checks, how a change lands) and states that taste the code relies on is written there or
    in the owning contract, never only in a code comment.
  evidence: [CLAUDE.md:9-37, CLAUDE.md:47-58]
  confidence: confirmed

- id: F-076
  dimension: improvement-loop
  polarity: strength
  subject_type: process
  observation: >
    Engine learnings have a stated durable home (an issue on the tracker, landed as a reviewed
    change that cites it with a HISTORY.md entry), and the mechanism is in use: engine code and
    harness blocks cite the issues that produced them (#30, #47, #49, #50, #51, #53, #57).
  evidence: [CLAUDE.md:51-58, CONTRIBUTING.md:11-12, map/child-env.mjs:1-2, tests/regression.mjs:808, tests/regression.mjs:4392-4393, tests/regression.mjs:4588]
  confidence: confirmed

