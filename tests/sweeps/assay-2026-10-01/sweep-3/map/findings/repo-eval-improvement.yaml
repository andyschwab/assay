- id: F-083
  dimension: improvement-loop
  polarity: fact
  subject_type: process
  observation: >
    The red-then-green rule (revert the pinned rule, see the assertion fail for its own reason,
    restore) is a written process whose evidence of use is a HISTORY.md entry per change; no
    tool re-performs it, and HISTORY.md was not read in this blind sweep.
  evidence: [CLAUDE.md:47-50, CONTRIBUTING.md:6-7]
  confidence: unverified

- id: F-084
  dimension: improvement-loop
  polarity: strength
  subject_type: process
  observation: >
    The engine measures its own worth on known answers: recall per scored fixture and the
    control's false-positive count are pinned, and repeatability is reported as fact presence
    and descriptor agreement with the direction of each divergence.
  evidence: [tests/regression.mjs:135-141, README.md:152-166]
  confidence: confirmed

- id: F-085
  dimension: improvement-loop
  polarity: strength
  subject_type: artifact
  observation: >
    The artifact emits structured outcome records by design: the run record names each
    scanner's status, reason, model and spend, and the routine writes routine.yaml on every
    path so a fleet collector reads the outcome from the artifact alone.
  evidence: [map/SCHEMA.md:323-385, routine/README.md:37-45]
  confidence: confirmed

- id: F-086
  dimension: improvement-loop
  polarity: fact
  subject_type: artifact
  observation: >
    The engine emits no usage telemetry of its own (it runs no service and keeps no store
    beyond the run directory); per-run spend is recorded only when the operator passes
    --spend to record.
  evidence: [README.md:98-101, map/SCHEMA.md:376-382]
  confidence: confirmed
