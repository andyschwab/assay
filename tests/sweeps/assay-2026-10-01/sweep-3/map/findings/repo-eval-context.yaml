  polarity: strength
  subject_type: artifact
  observation: >
    The map/ context loads from its own contracts: METHOD.md (the scanner), SCHEMA.md (the
    finding format, declared authoritative) and scanners/CONTRACT.md (the adapter port).
  evidence: [map/SCHEMA.md:1-20, map/METHOD.md:1-35, map/scanners/CONTRACT.md:1-12]
  confidence: confirmed

