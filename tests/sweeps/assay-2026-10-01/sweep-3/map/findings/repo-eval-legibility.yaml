- id: F-008
  dimension: artifact-legibility
  polarity: gap
  subject_type: artifact
  observation: >
    Code and test comments cite finding ids from evaluation runs (for example F-1213, F-1230,
    F-1217) as the origin of a rule, while the repository's own rule keeps run history out
    of the tree, so those citations resolve to nothing a reader of the files can open.
  evidence: [tests/regression.mjs:176, views/severity.mjs:2, views/owner.mjs:129, CLAUDE.md:34-37]
  confidence: confirmed

- id: F-009
  dimension: artifact-legibility
  polarity: fact
  subject_type: artifact
  observation: >
    The repository keeps no ADR directory; decision rationale lives in the contracts
    (METHOD, SCHEMA, CONTRACT), in code comments, in issue numbers cited in comments, and in
    HISTORY.md, which CLAUDE.md requires every change to add an entry to (HISTORY.md was
    not read in this blind sweep).
  evidence: [README.md:179-180, CLAUDE.md:47-58, map/start.mjs:24]
  confidence: confirmed

- id: F-010
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    CLAUDE.md names the authoritative document for each contract (SCHEMA for findings,
    METHOD for the scanner, yardstick/README for requirements, views/README for view data)
    so a reader knows which file wins on a conflict.
  evidence: [CLAUDE.md:3-7, map/METHOD.md:267-273]
