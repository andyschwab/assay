# map/findings/repo-eval-legibility.yaml — Pass 1, artifact legibility, over assay at
# c30912c (blind sweep 3). Facts with file:line evidence; no severity, no priority.
# Census-augmented: one finding per sampled non-obvious decision (decision-legibility
# population, subject_type artifact), then the whole-repo facts.

- id: F-001
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    The decision that finding ids carry no dimension meaning is stated with its rationale
    (a per-dimension range is an arbitrary budget a dense repo overflows, and would only
    duplicate the dimension field) in the schema it governs.
  evidence: [map/SCHEMA.md:186-205]
  confidence: confirmed

- id: F-002
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    The decision that `assay start` runs fresh-clone only under --allow-exec is explained
    beside the code (it runs the target's install, lifecycle scripts and tests on the
    evaluator's machine) and again in the scanner contract.
  evidence: [map/start.mjs:16-27, map/scanners/CONTRACT.md:153-172]
  confidence: confirmed

- id: F-003
  dimension: artifact-legibility
  polarity: strength
  subject_type: artifact
  observation: >
    The decision to integrate but not adopt OpenSSF Scorecard is recorded with its reason
    (its checks need a hosting platform's API at run time, which an offline run lacks).
  evidence: [map/scanners/CONTRACT.md:138-151, map/scanners/CONTRACT.md:184-188]
  confidence: confirmed

- id: F-004
