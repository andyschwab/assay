# tests/mapping/MAPPING.yaml — the known-answer mapping set (#261, M3 of #257): public findings,
# each with the one requirement that takes it, or none. Held by tests/blocks/finding-maps-to-one-requirement.mjs
# through yardstick/population.mjs requirementTaking, the one reading of "which requirement takes
# this finding" (yardstick/README.md, "The four deciding kinds").
#
# Each entry names a finding of a committed public run (tests/sweeps/*, tests/fixtures/*) by its run
# and id; the block reads the finding itself from the run. `member` is the term of the yardstick's
# members: vocabulary a careful reader holding the yardstick places it on, read off the rows'
# "Population: every <term>" clauses: what the finding is about, never which row it should land on.
# An effect or capability finding and an instrument row carry no member: their own facets and their
# scanner's bindings place them. `requirement` is the answer, `none` when no requirement takes it,
# and `why` says why in one line. A row's population blurred, widened over another's, or renamed
# turns an entry red.
