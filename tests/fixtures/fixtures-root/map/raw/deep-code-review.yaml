findings:
  - id: F1
    title: "Committed lockfile pins minimist 1.2.5 with a critical prototype-pollution advisory"
    area: K
    tag: "A03 supply chain · GHSA-xvch-5gv4-984h"
    severity: High
    polarity: gap
    confidence: CONFIRMED
    latent: true
    mechanism_unproven: false
    observation: >
      targets/lockfiles/app resolves minimist 1.2.5. npm audit on a scratch install
      reports 1 critical (GHSA-xvch-5gv4-984h, affects 1.0.0 - 1.2.5). Dependabot's fix PR #3
      (to 1.2.6) was closed without merging, and CI runs no audit, so nothing blocks it.
      No code in the repo imports minimist, so it is latent. The target's README says the
      pin is planted on purpose; this report treats that as owner acceptance to record,
      not as a fix.
    evidence:
      - targets/lockfiles/app/package-lock.json:15
      - targets/lockfiles/app/package.json:7
    snippet: "\"version\": \"1.2.5\","
    fix: >
      If the fixture must keep the vulnerable pin, record the acceptance where a gate can
      read it (an audit allowlist entry scoped to this path, with an expiry). Otherwise bump
      to minimist 1.2.8 in package.json and regenerate the lockfile with npm install.
  - id: F2
    title: "slugify mangles common Latin-1 accented letters it claims to fold"
    area: A
    tag: "correctness · i18n"
    severity: Medium
    polarity: gap
    confidence: CONFIRMED
    latent: false
    mechanism_unproven: false
    observation: >
      ACCENTS has 16 entries and leaves out ì î ò ô õ ù û ý ÿ å ã æ ø ß. fold() maps any
      letter missing from it to a separator. Run at start_sha: 'Crème brûlée' gives
      'creme-br-lee', "Côte d'Ivoire" gives 'c-te-d-ivoire', 'São Paulo' gives
      's-o-paulo', 'Ångström' gives 'ngstrom', 'Straße' gives 'stra-e'. The ADR says the
      table covers the Latin-1 accents. The tests use only é, so they never see the gap.
    evidence:
      - targets/clean-lib/index.mjs:3
      - targets/clean-lib/index.mjs:8
      - targets/clean-lib/docs/adr/0001-fold-table-over-normalize.md:14
    snippet: "const ACCENTS = { à: 'a', á: 'a', â: 'a', ä: 'a', ç: 'c',"
    fix: >
      Complete the table for the Latin-1 Supplement letters (à-ÿ, with ß to 'ss', æ to 'ae',
      ø to 'o', å to 'a'). This keeps the ADR's no-normalize decision. Add assertions for
      'Crème brûlée', "Côte d'Ivoire" and 'São Paulo' to test/slugify.test.mjs.
  - id: F3
    title: "All-non-Latin input slugs to the empty string, so distinct inputs share one key"
    area: D
    tag: "data integrity · key collision"
    severity: Medium
    polarity: gap
    confidence: CONFIRMED
    latent: false
    mechanism_unproven: false
    observation: >
      fold() returns a space for non-ASCII letters, and trim() then removes all of them.
      slugify('日本') and slugify('Привет') both return ''. The ADR says non-Latin scripts
      'collapse to hyphens' and that slugs end up in URLs and primary keys. In fact every
      such title gets the same empty key, and an empty path segment.
    evidence:
      - targets/clean-lib/index.mjs:8
      - targets/clean-lib/index.mjs:22
      - targets/clean-lib/docs/adr/0001-fold-table-over-normalize.md:22
      - targets/clean-lib/docs/adr/0001-fold-table-over-normalize.md:28
    snippet: "return /[a-z0-9]/.test(ch) ? ch : ' ';"
    fix: >
      Decide the contract and pin it with a test: either throw (or return null) when the
      slug would be empty, so callers must supply a fallback key, or document that ''
      is a possible result. Then correct the ADR's 'collapse to hyphens' line to match.
  - id: F4
    title: "CI runs on Node 20, which reached end of life on 2026-04-30"
    area: K
    tag: "EOL runtime"
    severity: Medium
    polarity: gap
    confidence: CONFIRMED
    latent: false
    mechanism_unproven: false
    observation: >
      Both jobs set node-version '20'. Node 20 stopped getting security fixes on 2026-04-30,
      so the gate tests a runtime nobody supports. No package.json declares engines, so
      the supported range is not stated anywhere. This container runs Node 22, and the
      clean-lib suite passes on it.
    evidence:
      - .github/workflows/ci.yml:17
      - .github/workflows/ci.yml:26
    snippet: "node-version: '20'"
    fix: >
      Set node-version to a supported LTS (22 or 24), or read it from a committed .nvmrc.
      Add "engines": {"node": ">=22"} to each target's package.json.
  - id: F5
    title: "Legacy lockfile is truncated JSON, so npm ci cannot install"
    area: K
    tag: "reproducible build"
    severity: Medium
    polarity: gap
    confidence: CONFIRMED
    latent: false
    mechanism_unproven: false
    observation: >
      targets/lockfiles/legacy/package-lock.json ends at line 8, inside the packages
      object. JSON.parse fails and npm ci exits 1 with EUSAGE. So the minimist 1.2.8 the
      manifest declares is never locked, and no scanner can confirm it. The README says
      this is deliberate; CI never exercises it.
    evidence:
      - targets/lockfiles/legacy/package-lock.json:8
      - targets/lockfiles/legacy/package.json:7
    snippet: "\"name\": \"legacy-export\","
    fix: >
      Regenerate the lockfile with npm install --package-lock-only. If the truncation is the
      fixture's point, rename the file or mark it in .gitattributes so a tool reading it
      knows it is a fixture and not a real lock.
  - id: F6
    title: "Third-party actions are pinned to mutable major tags, not commit SHAs"
    area: K
    tag: "CICD-SEC-3 · supply chain"
    severity: Medium
    polarity: gap
    confidence: CONFIRMED
    latent: false
    mechanism_unproven: false
    observation: >
      actions/checkout@v4 and actions/setup-node@v4 are each used twice. Whoever controls
      a tag can move it, so the code CI executes can change without any commit to this
      repository. No dependabot.yml or renovate config exists to keep SHA pins current.
    evidence:
      - .github/workflows/ci.yml:14
      - .github/workflows/ci.yml:15
      - .github/workflows/ci.yml:23
      - .github/workflows/ci.yml:24
    snippet: "- uses: actions/checkout@v4"
    fix: >
      Pin each action to a full 40-character commit SHA with the version as a trailing
      comment, and add .github/dependabot.yml with a github-actions ecosystem entry to
      bump the pins.
  - id: F7
    title: "Workflow sets no token permissions, job timeouts or concurrency"
    area: W
    tag: "least privilege · CI cost"
    severity: Low
    polarity: gap
    confidence: CONFIRMED
    latent: false
    mechanism_unproven: false
    observation: >
      ci.yml has no top-level permissions block, so GITHUB_TOKEN gets the repository default.
      That default may be write on push events in this public repo. No job sets
      timeout-minutes, and there is no concurrency group to cancel superseded runs. The
      jobs only need read access.
    evidence:
      - .github/workflows/ci.yml:6
      - .github/workflows/ci.yml:11
    snippet: "on:"
    fix: >
      Add a top-level 'permissions: contents: read', 'timeout-minutes: 5' on each job, and a
      concurrency group keyed on the workflow and ref with cancel-in-progress true.
  - id: F8
    title: "CI has no lint, format or dependency-scan step, and the lockfiles target has no job"
    area: K
    tag: "gate coverage"
    severity: Low
    polarity: gap
    confidence: CONFIRMED
    latent: false
    mechanism_unproven: false
    observation: >
      The workflow runs two test scripts and nothing else. No linter or formatter is declared
      anywhere, nothing runs npm audit, and targets/lockfiles is in no job. So the F1
      advisory and the F5 broken lockfile never turn CI red, and a green CI says nothing
      about them.
    evidence:
      - .github/workflows/ci.yml:10
      - .github/workflows/ci.yml:18
    snippet: "jobs:"
    fix: >
      Add a job that runs npm audit --audit-level=high in each target with a lockfile (the
      F1 acceptance goes in an allowlist), and a lint step (eslint or node --check) over
      targets/*/**/*.mjs.
  - id: F9
    title: "Public repository ships no LICENSE"
    area: Q
    tag: "licensing"
    severity: Low
    polarity: gap
    confidence: CONFIRMED
    latent: false
    mechanism_unproven: false
    observation: >
      The repository is public on GitHub, but git ls-files shows no LICENSE, COPYING or
      SECURITY file, and no package.json has a license field. With no licence, the default
      is all rights reserved: others cannot legally reuse the fixtures.
    evidence:
      - targets/clean-lib/package.json:4
    snippet: "\"private\": true,"
    fix: >
      Add a root LICENSE (for example MIT) and a license field in each package.json, if
      reuse is intended.
  - id: F10
    title: "Nit: fold() doc comment says it returns '' but it returns a space"
    area: H
    tag: "doc drift"
    severity: Nit
    polarity: gap
    confidence: CONFIRMED
    latent: false
    mechanism_unproven: false
    observation: >
      The comment on fold() says it returns '' when a character has no ASCII base. The code
      returns ' ', and the slug's separator collapsing depends on that space.
    evidence:
      - targets/clean-lib/index.mjs:5
      - targets/clean-lib/index.mjs:8
    snippet: "// Fold a single character to its ASCII base, or '' if it has none."
    fix: >
      Change the comment to "or a space (a separator) if it has none".
  - id: S1
    title: "clean-lib tests are behavioural, wired into CI, and go red on a planted defect"
    area: J
    polarity: strength
    confidence: CONFIRMED
    observation: >
      Seven exact-output assertions, including the type guard. CI runs them on push and on
      pull_request. Changing the separator in a scratch worktree made the suite exit 1.
    evidence:
      - targets/clean-lib/test/slugify.test.mjs:7
      - targets/clean-lib/test/slugify.test.mjs:13
      - .github/workflows/ci.yml:18
  - id: S2
    title: "slugify rejects non-string input explicitly"
    area: A
    polarity: strength
    confidence: CONFIRMED
    observation: >
      A non-string argument throws a TypeError instead of being coerced, and a test pins it.
    evidence:
      - targets/clean-lib/index.mjs:18
  - id: S3
    title: "The resolvable lockfile carries registry integrity hashes"
    area: K
    polarity: strength
    confidence: CONFIRMED
    observation: >
      The app lockfile records a resolved URL and a sha512 integrity value. npm ci verified
      the hash on install.
    evidence:
      - targets/lockfiles/app/package-lock.json:16
      - targets/lockfiles/app/package-lock.json:17

