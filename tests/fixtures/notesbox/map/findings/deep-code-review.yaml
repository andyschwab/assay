  native_category: "B"
  polarity: gap
  severity: Critical
  observation: >
    authenticate() returns a role 'admin' default identity for a missing or unknown token, and requireAdmin() only checks that role. Probe: POST /admin/purge with no Authorization header returned 200 {"purged":true} and Dana's notes were then gone; anonymous POST /notes and POST /assistant also succeed.
