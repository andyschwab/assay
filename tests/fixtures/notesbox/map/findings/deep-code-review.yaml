  observation: >
    pushBackup does not await fetch, discards every failure with .catch(() => {}), sets no timeout, and returns {ok:true, pushed:n} before any response arrives. The store is in memory (lost on restart), so a failed backup is silent data loss. The comment's claim that the relay is inside the VPC does not match the public https backupUrl.
