# Known-answer sheet for the flawed-webapp target (notesbox).
# Ground truth: every item below is planted on purpose. An evaluation run over this
# target is scored against this sheet — which planted items it recovered, which it
# missed, what it flagged that is not here. Matching is by evidence path + class,
# never by wording. Method classes: eval-pass | dcr | gitleaks | fresh-clone |
# dependency-scan (the path-scoped methods; repo-census and the other repo-scoped
# instruments are answered in the repo-root sheet, never here — see /README.md).
target: flawed-webapp

planted:
  - id: P-01
    class: committed-secret
    axis: code-security
    also_axes: [delegation]
    polarity: gap
    evidence: config/settings.mjs:6
    detectable_by: [gitleaks, eval-pass]
    note: >
      A backup-service API key hardcoded in source (inert string shaped as a
      credential). A shared concern across axes: a code scanner / gitleaks lands it
      on code-security; repo-eval's delegation credential census lands the same fact
      on delegation. Either recovers it.

  - id: P-02
    class: auth-fail-open
    axis: delegation
    polarity: gap
    also_axes: [code-security]
    evidence: lib/auth.mjs:12
    detectable_by: [eval-pass, dcr]
    note: >
      authenticate() returns a default identity with role 'admin' for any unknown
      or missing token, so every unauthenticated request is treated as an admin.
      Fails open, and open to the most privileged role.

  - id: P-03
    class: injection-to-effect
    axis: delegation
    polarity: gap
    evidence: lib/agent.mjs:39
    detectable_by: [eval-pass, dcr]
    note: >
      The assistant builds one prompt from untrusted note content AND private
      workspace notes, then parses the model's reply for a TOOL:send_email directive
      and sends — no draft/confirm halt between parse and send. A note containing
      "TOOL:send_email x@y subj" drives a real outbound email to the injected
      recipient (verified: fires via a planted note, not just the question). The full
      trifecta: untrusted input + private data + external effect in one context.

  - id: P-04
    class: missing-authorization
    axis: delegation
    also_axes: [code-security]
    polarity: gap
    evidence: lib/sync.mjs:8
    detectable_by: [eval-pass, dcr]
    note: >
      POST /sync requires no authorization and pushes every user's notes to an
      external backup service (lib/sync.mjs), authenticated by the hardcoded backup
      key. An unguarded external effect with no authority check — repo-eval's
      delegation pass lands it on delegation (authority + halt); a code scanner lands
      the same route on code-security. Cross-tenant read + external egress, reachable
      by any caller.

  - id: P-07
    class: effects-vs-reports
    axis: verification
    polarity: gap
    evidence: lib/sync.mjs:12
    detectable_by: [eval-pass, dcr]
    note: >
      pushBackup fires the backup POST fire-and-forget (not awaited) and swallows any
      failure with .catch(() => {}), then returns { ok: true } unconditionally. It
      reports success while the effect may have dropped — a half-reliable integration
      that trusts a return value it never checked.

  - id: P-05
    class: stale-doc
    axis: artifact-legibility
    polarity: gap
    evidence: README.md:32
    detectable_by: [eval-pass, fresh-clone]
    note: >
      The README documents `npm run test:all` as the test command, but package.json
      defines no such script (the real entry point is `node test/smoke.mjs`). A
      documented command that does not run. fresh-clone replays the README's
      commands and records this one missing at this line.

  - id: P-06
    class: false-green-test
    axis: verification
    polarity: gap
    evidence: test/smoke.mjs:9
    detectable_by: [eval-pass]
    note: >
      The smoke suite asserts that a valid token resolves a user, but never asserts
      an INVALID token is rejected — so it stays green while P-02 (fail-open) and
      P-04 (missing authz) stand. A test that reassures without checking the thing
      that matters.

strengths:
  - id: S-01
    class: decision-record
    axis: artifact-legibility
    polarity: strength
    evidence: docs/adr/0001-storage-choice.md:1
    detectable_by: [eval-pass]
    note: >
      A full ADR (context / decision / consequences / why-not-the-alternative) whose
      rationale reconstructs from the file alone. A planted strength the maturity read
      should name, not just gaps.

  - id: S-02
    class: interface-boundary
    axis: context-economy
    polarity: strength
    evidence: lib/db.mjs:1
    detectable_by: [eval-pass]
    note: >
      Storage sits behind a narrow module interface (ADR-0001 enacted), so a task can
      load lib/db.mjs without pulling in the rest of the app, and the storage engine
      can be swapped without touching call sites.

# Computed chains the report SHOULD lead with (untrusted-input / unauthenticated
# entry -> ungated effect). Recorded so a run's chain section can be scored too.
chains:
  - id: C-01
    entry: P-03
    reaches: external email send
    note: injected note content -> assistant email effect, no halt (P-03 alone).
  - id: C-02
    entry: P-02
    reaches: P-04 workspace read + /admin/purge destructive effect
    note: >
      fail-open-to-admin (P-02) defeats the requireAdmin gate on /admin/purge, so an
      unauthenticated caller can purge all notes; and reaches the unguarded /sync
      cross-tenant read (P-04). The gate exists; the auth defect walks through it.

# What each path-scoped offline instrument should record over this target, keyed
# by the instrument's check name: an absence has no single file to cite, so these
# match by method + check + polarity. They are the target's standing facts, not
# planted defects; they pin the instruments' readings, so a change in what an
# instrument records here reads as missed.
#   fresh-clone     install / build / migrate read not-declared and yield no row
#                   (no dependencies, nothing to build, no database); the three
#                   below are the declared-gate gaps. P-05 above is its fourth row.
#   dependency-scan no lockfile, so nothing to audit: a recorded clean run, no rows.
instruments:
  - id: I-01
    check: test
    detectable_by: [fresh-clone]
    axis: deterministic-gates
    polarity: gap
    note: >
      package.json declares no test script: the smoke suite runs only when someone
      types `node test/smoke.mjs`. The other face of P-05 — the documented command
      is missing and the real one is not declared.

  - id: I-02
    check: lint
    detectable_by: [fresh-clone]
    axis: deterministic-gates
    polarity: gap
    note: No lint script is declared.

  - id: I-03
    check: typecheck
    detectable_by: [fresh-clone]
    axis: deterministic-gates
    polarity: gap
    note: No typecheck script is declared.

# Expected requirement statuses (assay #18): what measuring a run of this target
# against assay's yardstick (yardstick/requirements.yaml) should read, per requirement,
# each tied to an item on this sheet. A row whose deciding method did not run reads
# not-measured and is graded out of scope, never a miss; a claim-kind row reads
# not-measured from a run alone and is never listed here as anything else. The
# contract is assay's yardstick/README.md, "Known answers".
requirements:
  - id: d-secrets-out-of-history
    status: unmet
    reason: "P-01: a backup-service API key is hardcoded in config/settings.mjs."
  - id: d-routes-authorized
    status: unmet
    reason: "P-02 authenticates every unknown token as admin, and P-04 serves POST /sync with no authorization check."
  - id: d-dependencies-known-clean
    status: met
    reason: "package.json declares no dependencies, so no advisory can apply (dependency-scan: no lockfile, a recorded clean run)."
  - id: d-effects-gated
    status: unmet
    reason: "P-03 sends the assistant's email and P-04 pushes the backup with no halt before either effect."
  - id: d-effects-traced
    status: unmet
    reason: "P-04/P-07: the backup push is fired and forgotten, its failure swallowed, and leaves no record."
  - id: d-gates-fail-closed
    status: unmet
    reason: "C-02: the one gated effect, /admin/purge behind requireAdmin, opens for any caller because authentication fails open to admin (P-02)."
  - id: d-capability-budget
    status: unmet
    reason: "P-03: the assistant holds untrusted input, private data and an external effect in one context, and reaches an ungated email send."
  - id: d-effects-provable
    status: unmet
    reason: "P-03's email is only logged as text and P-07's backup push leaves nothing to check from outside."
  - id: d-fresh-clone-runs
    status: unmet
    reason: "package.json declares no build step, and the requirement reads an undeclared build unmet (absence is not a pass)."
  - id: d-schema-versioned
    status: not-applicable
    reason: "No database signal anywhere in the tree: lib/db.mjs is an in-memory Map, with no database dependency and no migrations."
  - id: d-tests-execute-core
    status: unmet
    reason: "I-01: package.json declares no test script."
  - id: d-lint-typecheck-gate
    status: unmet
    reason: "I-02 and I-03: no lint and no typecheck script is declared."
