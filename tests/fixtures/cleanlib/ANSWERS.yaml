# Known-answer sheet for the clean-lib target (slugify) — the CONTROL.
# This target is kept deliberately healthy. Its job is to catch the OTHER failure
# mode: an evaluator or instrument that manufactures problems in a clean codebase.
# Matching is by evidence path + class (an instrument answer: by check name).
# Method classes: eval-pass | dcr | gitleaks | fresh-clone | dependency-scan
# (repo-scoped instruments are answered in the repo-root sheet).
target: clean-lib

# No planted defects. A run over this target SHOULD produce no code-security,
# delegation, or correctness gaps. The assertion is near-emptiness, not literal
# zero: a minor style nit is tolerable, a Medium-or-above gap is a false positive
# that counts against the evaluator — unless it is one of the instrument answers
# at the end of this sheet, which record what the offline instruments measure
# here (standing facts, not manufactured problems).
planted: []

max_gaps_above:            # the control's tolerance gate (scored by the harness)
  severity: Low            # anything Medium+ here is a false positive
  count: 0

strengths:
  - id: S-01
    class: decision-record
    axis: artifact-legibility
    polarity: strength
    evidence: docs/adr/0001-fold-table-over-normalize.md:1
    detectable_by: [eval-pass]
    note: >
      A full ADR whose "why not the alternative" reconstructs the design choice
      (explicit fold table over NFKD, for cross-version output stability) from the
      file alone.

  - id: S-02
    class: behavioral-test
    axis: verification
    polarity: strength
    evidence: test/slugify.test.mjs:9
    detectable_by: [eval-pass]
    note: >
      The test suite asserts actual output across the edge cases the code exists to
      handle (accents, punctuation, collapsing, trimming, the type guard) — a real
      check, the opposite of flawed-webapp's P-06 false-green smoke test.

  - id: S-03
    class: no-effect-surface
    axis: delegation
    polarity: strength
    evidence: index.mjs:1
    detectable_by: [eval-pass]
    note: >
      A pure function with no I/O, no network, no credentials, no agent surface —
      nothing to delegate and nothing to gate. The delegation axis should read this
      as contained (no power to act), never as an un-scanned blank.

# What each path-scoped offline instrument should record over this target, keyed
# by the instrument's check name (an absence has no file to cite). Standing facts,
# not planted defects: this sheet stays a control. They pin the instruments'
# readings on a healthy target — an instrument that starts reading anything else
# here is either a new false positive (an unanswered gap) or a miss.
#   fresh-clone     test runs and passes (`npm test`); install / build / migrate
#                   read not-declared with no row (no dependencies, nothing to
#                   build, no database). The two below are its only rows.
#   dependency-scan no lockfile, so nothing to audit: a recorded clean run, no rows.
instruments:
  - id: I-01
    check: lint
    detectable_by: [fresh-clone]
    axis: deterministic-gates
    polarity: gap
    note: >
      A zero-dependency plain-JS library declares no linter. The instrument records
      the absence; whether that matters is the views' call, not the map's.

  - id: I-02
    check: typecheck
    detectable_by: [fresh-clone]
    axis: deterministic-gates
    polarity: gap
    note: No typecheck is declared (plain JS, no type annotations to check).

# Expected requirement statuses (assay #18): what measuring a run of this target
# against assay's yardstick (yardstick/requirements.yaml) should read, per requirement,
# each tied to an item on this sheet. A row whose deciding method did not run reads
# not-measured and is graded out of scope, never a miss; a claim-kind row reads
# not-measured from a run alone and is never listed here as anything else. The
# contract is assay's yardstick/README.md, "Known answers".
requirements:
  - id: d-secrets-out-of-history
    status: met
    reason: "The control carries no credential anywhere in its tree or history."
  - id: d-dependencies-known-clean
    status: met
    reason: "package.json declares no dependencies, so no advisory can apply (dependency-scan: no lockfile, a recorded clean run)."
  - id: d-effects-gated
    status: not-measured
    reason: "S-03: a pure function with no effect to gate; never met by an empty population."
  - id: d-effects-traced
    status: not-measured
    reason: "S-03: no effect, so no record to keep; never met by an empty population."
  - id: d-gates-fail-closed
    status: not-measured
    reason: "S-03: no gate exists to fail open or closed."
  - id: d-capability-budget
    status: not-measured
    reason: "S-03: no AI surface to budget."
  - id: d-effects-provable
    status: not-measured
    reason: "S-03: no effect to prove."
  - id: d-fresh-clone-runs
    status: unmet
    reason: "package.json declares no build step, and the requirement reads an undeclared build unmet (absence is not a pass)."
  - id: d-schema-versioned
    status: not-applicable
    reason: "No database signal anywhere in the tree: a string library with no storage."
  - id: d-tests-execute-core
    status: met
    reason: "S-02: npm test runs the behavioural suite and it passes from a clean checkout."
  - id: d-lint-typecheck-gate
    status: unmet
    reason: "I-01 and I-02: no lint and no typecheck is declared."
