# Known-answer sheet for the lockfiles target — dependency-scan's fixture (assay #17).
# Two planted lockfiles give the dependency-scan instrument something to find; no
# other method has anything to say here. Matching is by evidence path + class (an
# instrument answer: by check name). Method classes: dependency-scan, osv-scanner.
target: lockfiles

# Two answers of different kinds:
#   P-01 is DETERMINISTIC and offline: legacy/package-lock.json is truncated JSON, so
#        npm refuses it before it reaches the registry (`npm audit` exits 1 with
#        ENOLOCK). It reads failed on any runner, network or not, and is always in
#        scope.
#   P-02 is an ADVISORY answer and depends on npm's advisory feed at run time: it can
#        drift if GitHub withdraws or re-scores the advisory. To re-check it when the
#        feed changes, from this target's app/ directory:
#          npm audit --package-lock-only --json
#        and confirm minimist 1.2.5 still reports GHSA-xvch-5gv4-984h at severity
#        critical. If it does not, re-run `node assay.mjs dependency-scan` and
#        `node assay.mjs ingest` over this target, update P-02 / I-01 to what the feed
#        now says (or pin another long-standing advisory), and refresh the frozen copy
#        in assay's tests/fixtures/lockfiles in the same reviewed change.
# Both lockfiles sit in their own directory: the scorer matches a path by suffix, so
# a root package-lock.json:1 would also match legacy/package-lock.json:1.
planted:
  - id: P-01
    class: unreadable-lockfile
    axis: code-security
    polarity: gap
    evidence: legacy/package-lock.json:1
    detectable_by: [dependency-scan]
    note: >
      A lockfile cut off mid-document. No package manager can read it, so nothing
      audits the legacy-export package's dependencies. A tool that cannot audit a
      lockfile must say so, never read it as clean.

  - id: P-02
    class: known-advisory
    axis: code-security
    polarity: gap
    evidence: app/package-lock.json:1
    detectable_by: [dependency-scan]
    note: >
      app/package-lock.json pins minimist 1.2.5, inside the range of the long-standing
      critical prototype-pollution advisory GHSA-xvch-5gv4-984h (fixed in 1.2.6).

  - id: P-03
    class: known-advisory
    axis: code-security
    polarity: gap
    evidence: python/requirements.txt:1
    detectable_by: [osv-scanner]
    note: >
      python/requirements.txt pins PyYAML 5.3.1, inside the range of the long-standing
      critical arbitrary-code-execution advisory GHSA-8q59-q68h-6hv4 / PYSEC-2021-142
      (fixed in 5.4). It is not an npm-family lockfile, so dependency-scan never reads
      it; osv-scanner does (assay #179). An advisory answer: re-check it as P-02's note says,
      from python/: osv-scanner scan source --all-packages --format json .

# What dependency-scan records over this target, keyed by its native category.
instruments:
  - id: I-01
    check: critical
    detectable_by: [dependency-scan]
    axis: code-security
    polarity: gap
    note: The advisory on P-02, at its own severity (critical).

  - id: I-02
    check: lockfile-failed
    detectable_by: [dependency-scan]
    axis: code-security
    polarity: gap
    note: P-01's failed audit, a gap against the target (its lockfile is unreadable).

  - id: I-03
    check: lockfile-not-audited
    detectable_by: [dependency-scan]
    axis: code-security
    polarity: fact
    note: >
      P-01 again, as the fact that holds d-dependencies-known-clean at not-measured
      when no critical advisory decides it (here I-01 does, so it reads unmet).

# What osv-scanner records over this target (assay #179), keyed by its native category.
  - id: I-04
    check: critical
    detectable_by: [osv-scanner]
    axis: code-security
    polarity: gap
    note: The advisories on P-02 and P-03, each at its own CVSS band (both critical, 9.8).

  - id: I-05
    check: source-failed
    detectable_by: [osv-scanner]
    axis: code-security
    polarity: gap
    note: P-01 again, as osv-scanner reads it (it reports the unreadable lockfile on stderr).

  - id: I-06
    check: source-audited
    detectable_by: [osv-scanner]
    axis: code-security
    polarity: fact
    note: app/package-lock.json and python/requirements.txt, each audited (the fact another decider's not-audited fact is answered by).

# The status the yardstick's measurement of this target should read (assay yardstick/README.md, "Known answers").
requirements:
  - id: d-dependencies-known-clean
    status: unmet
    reason: "P-02 and P-03: a critical advisory in an npm lockfile (both auditors) and in a pip pin (osv-scanner alone)."
