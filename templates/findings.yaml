# findings.yaml — neutral evidence base for <TARGET> (run <slug>-<YYYY-MM-DD>).
# Facts + structured descriptors + file:line evidence. NO severity, NO priority —
# those are view outputs. Evidence paths are repo-relative to the TARGET repo.
# Merge the six per-dimension pass files (dimension order) under this header;
# ids are unique per run, no dimension meaning (SCHEMA.md §3). Validate with
# tools/validate.mjs before compiling any view.

# ═══════════════════════════ 01-legibility ═══════════════════════════

- id: F-001                    # unique F-### (no dimension band)
  dimension: artifact-legibility
  polarity: strength           # strength | gap | fact
  subject_type: artifact       # effect | control | artifact | contract | process | capability
  observation: >
    ONE grounded sentence — the fact, not the interpretation.
  evidence: [path/to/file.ts:12, path/to/other.md:3]   # mandatory, non-empty
  confidence: confirmed        # confirmed | plausible | unverified

