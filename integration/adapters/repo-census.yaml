# Adapter: repo-census (INSTRUMENT — the deterministic repo census) -> the axis
# roster (integration/scanner-contract.md, instrument role, §3d). tools/repo-census.mjs
# checks, read-only against the tree: an architecture page that names an external
# service or data store (root and per app in a monorepo), a present-tense agent
# contract (AGENTS.md/CLAUDE.md, same monorepo rule), a runbook covering restart /
# roll back / rotate / restore, a CI workflow that gates on pull_request or push
# to the default branch without a step that fails open, and six owner-evidence
# transcript checks (andyschwab/ai-native-framework#124, format at
# templates/evidence/README.md) for what a repository cannot show by itself.
# tools/ingest.mjs (profile repo-census) turns each `gap` check into one gap row
# and each `pass` check into one strength row (so the axis sees the evidence, not
# just the absence of a gap); a `not-applicable` check yields nothing. Instruments
# never contribute an axis; these rows feed the axes the descriptor register
# already homes the floor rows on (registry/descriptors.yaml): architecture-page /
# agent-contract / runbook feed the docs-legibility axis these floor rows already
# live on (d-architecture-page, d-agent-contract, d-runbook -> artifact-legibility);
# ci-gate feeds the shared verification-gate axis (d-ci-gate-on-default-branch ->
# deterministic-gates, the same axis fresh-clone's lint/typecheck/test rows land
# on). The six evidence categories follow the axis the register now homes each
# re-kinded row on (registry/descriptors.yaml); the adapter follows the register,
# never the reverse — see the per-row comments below for which register row's axis
# each one carries and, where the register row itself carries no axis, which
# nearest tier-mate's axis it was assigned (registry/descriptors.yaml never edited
# to match). Keyed by the check name (the runner's closed set); a category this map
# does not know halts loud. The six evidence categories are the real, colon-bearing
# names (`evidence:<descriptor-id>`) everywhere outside this file — findings,
# registry/descriptors.yaml, tests; here they are spelled `evidence__<descriptor-id>`
# because the minimal YAML reader's map-key grammar cannot spell a colon
# ([A-Za-z0-9_-]+ only). tools/project.mjs resolves the `__` alias to `:` at
# lookup time (the one place this translation happens); nothing else needs to
# know it.
scanner: repo-census
targets_taxonomy: 3
role: instrument

contributes: []

map:
  architecture-page:            # legibility: one page shows the parts and services
    axis: artifact-legibility
  agent-contract:                # the agent contract exists and is present-tense; homed where the register homes d-agent-contract
    axis: improvement-loop
  runbook:                       # legibility: the one-page runbook covers the four procedures
    axis: artifact-legibility
  ci-gate:                       # a verification gate exists on the default branch and holds
    axis: deterministic-gates
  evidence__d-backup-restore-exercised:   # evidence:d-backup-restore-exercised — register row carries no axis; nearest tier-mate (safety) is d-personal-data-enumerated, code-security
    axis: code-security
  evidence__d-rollback-exercised:         # evidence:d-rollback-exercised — register row carries no axis; nearest tier-mate (reproducibility) is d-schema-versioned, context-economy
    axis: context-economy
  evidence__d-deploy-one-command:         # evidence:d-deploy-one-command — register row carries no axis; nearest tier-mate (reproducibility) is d-dependencies-pinned, code-security
    axis: code-security
  evidence__d-smoke-on-deployed:          # evidence:d-smoke-on-deployed — register row carries no axis; nearest tier-mate (verification) is d-lint-typecheck-gate, deterministic-gates
    axis: deterministic-gates
  evidence__d-monitoring-with-alert:      # evidence:d-monitoring-with-alert — register row carries no axis; nearest tier-mate (operability) is d-errors-reach-a-person, verification
    axis: verification
  evidence__d-cost-alerts:                # evidence:d-cost-alerts — register row carries no axis; nearest tier-mate (operability) is d-runbook, artifact-legibility
    axis: artifact-legibility

default: FAIL

capabilities:
  - id: verify-fix
    invoke: "re-run tools/repo-census.mjs against the target and confirm the check reads pass"
