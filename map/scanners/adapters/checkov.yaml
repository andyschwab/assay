# Adapter: checkov (external instrument) -> the axis roster (map/scanners/CONTRACT.md).
# Infrastructure-as-code and container configuration against a graph-based policy set
# (https://github.com/bridgecrewio/checkov, Apache-2.0): Terraform, CloudFormation,
# Kubernetes, Helm, Kustomize, Dockerfiles, Serverless, ARM and Bicep. Adopted as #181 as
# the one IaC instrument (map/scanners/CANDIDATES.md). Keyed by the framework a failed
# check reports (its check_type). A tree with no such file reads not-applicable through
# the no-input fact, never clean.
scanner: checkov
targets_taxonomy: 3
role: instrument
fails_loud: checkov-instrument
verified_against: "3.4.0"
# what `node assay.mjs tools install` puts on PATH (map/tools.mjs; CONTRACT.md §3g): a
# package with a large dependency tree, so pinned by version into its own environment
tool:
  bin: checkov
  version: "3.4.0"
  upstream: "pypi:checkov"
  pypi: checkov
run:
  bin: checkov
  # offline (no external module download, no results upload), passed checks kept (not
  # --quiet: a file audited clean is on the record), IaC and container
  # frameworks only: GitHub Actions is zizmor's, secrets gitleaks', dependencies the
  # dependency instruments'
  args:
    - "--directory"
    - "."
    - "--output"
    - "json"
    - "--compact"
    - "--skip-download"
    - "--skip-results-upload"
    - "--framework"
    - "terraform"
    - "cloudformation"
    - "kubernetes"
    - "helm"
    - "kustomize"
    - "dockerfile"
    - "serverless"
    - "arm"
    - "bicep"
  # A Terraform variable set only per environment (envs/prod.tfvars, never loaded by the
  # tool) reaches a check as the bare `var.x` and fails it whatever every environment sets
  # (#306). The runner hands checkov, after --var-file, each variable that every value
  # file outside terraform.tfvars and *.auto.tfvars (which checkov loads itself) sets to one
  # identical literal; one the environments disagree on stays unresolved and is judged so.
  agreed_values:
    flag: "--var-file"
    files:
      - "**/*.tfvars"
    loaded:
      - "terraform.tfvars"
      - "*.auto.tfvars"
    skip:
      - ".terraform"
  ok_exits: [0, 1]          # 0 every check passed, 1 at least one failed
  version:
    - "--version"
  install: "node assay.mjs tools install --only checkov (the pin is this adapter's tool: block)"
  timeout_s: 1200
ingest:
  format: checks-report
  start_id: 990
# the open policy set reports no severity, so every failed check reads Medium
bands:
  default: Medium

contributes: []

map:
  terraform:
    axis: code-security
  cloudformation:
    axis: code-security
  kubernetes:
    axis: code-security
  helm:
    axis: code-security
  kustomize:
    axis: code-security
  dockerfile:
    axis: code-security
  serverless:
    axis: code-security
  arm:
    axis: code-security
  bicep:
    axis: code-security
  config-audited:               # a FACT row per file a framework audited
    axis: code-security
  config-not-audited:           # a FACT row: a file a framework could not parse
    axis: code-security
  no-input:                     # a FACT row: no IaC or container file in the tree
    axis: code-security

default: FAIL

# confidence (map/scanners/CONTRACT.md §3, map/confidence.mjs, #319): a deterministic
# instrument, with one rule it declares misfires in context. CKV_DOCKER_2 asks a container
# image for a HEALTHCHECK instruction, which the runtime that starts the image acts on. A tree
# the census reads as deployed by a platform that starts the image without reading it (Heroku's
# heroku.yml, Fly's fly.toml, Kubernetes through a Helm chart, kustomization or Skaffold file,
# each of which checks health by its own config; or a Terraform file declaring a Cloud Run
# service, v1 google_cloud_run_service or v2 google_cloud_run_v2_service, read by resource type,
# whose health is the service's own startup and liveness probes) is not helped by one, unless a
# Compose file (which does read it) is beside them. The hit stays visible as a gap; it never reads met.
confidence:
  evidence: deterministic
  misfires:
    - id: healthcheck-ignored-by-platform
      category: dockerfile
      native_id: "^CKV_DOCKER_2@"
      reason: "the census reads this tree as deployed by a platform that checks health by its own config and does not run an image's HEALTHCHECK, so the instruction would change nothing there"
      deployed_on:
        - "^heroku\\.yml$"
        - "^fly\\.toml$"
        - "^chart\\.yaml$"
        - "^kustomization\\.ya?ml$"
        - "^skaffold\\.yaml$"
      deployed_on_resource:
        - "^google_cloud_run_(v2_)?service$"
      unless_deployed_on:
        - "^(docker-)?compose(\\..+)?\\.ya?ml$"

# consequence (map/scanners/CONTRACT.md §3, map/consequence.mjs, #330): what a failed check
# would expose, by a closed table of check ids, read off the row's native_id (check@resource@file).
# Only checks whose meaning is plain from the policy set's own name for them are listed; a check
# not listed reads null and keeps the value its row gives, never a guess. Unlisted on purpose:
# versioning, replication and lifecycle (recovery and housekeeping, not one exposure), an image's
# tag and HEALTHCHECK (reproducibility and operation; CKV_DOCKER_2's misfire is confidence's), and
# whole-account admin policies (a grant too wide reads by what it reaches, which the check does not say).
consequence:
  exposure:
    - id: public-write
      when:
        native_id: "^CKV_AWS_57@"
      value: authority
      reason: "a bucket ACL that allows public WRITE: anyone may write what only its owner is granted to"
    - id: open-admin-ingress
      when:
        native_id: "^CKV_AWS_(24|25)@"
      value: authority
      reason: "a security group open to 0.0.0.0/0 on port 22 or 3389: an administrative entry point reachable by anyone, past the network grant"
    - id: public-read
      when:
        native_id: "^CKV_AWS_(20|17)@"
      value: others-data
      reason: "a bucket ACL that allows public READ, or a database instance publicly accessible: the data it stores is open to anyone"
    - id: unencrypted-at-rest
      when:
        native_id: "^CKV_AWS_(3|16|19)@"
      value: others-data
      reason: "data at rest not encrypted (an EBS volume, an RDS instance, an S3 bucket): whoever reaches the storage reads what it holds"
    - id: unencrypted-in-transit
      when:
        native_id: "^CKV_AWS_2@"
      value: others-data
      reason: "a load balancer listener that does not use HTTPS: what passes through it is readable in transit"
    - id: hard-coded-secret
      when:
        native_id: "^CKV_AWS_(41|45|46)@"
      value: credential
      reason: "an access key in a provider block, or a secret in a function's environment or an instance's user data: a credential written where others can read it"
    - id: logging-and-monitoring
      when:
        native_id: "^(CKV_AWS_(18|67|126)|CKV2_AWS_62)@"
      value: hardening
      reason: "access logging, a trail in every region, detailed monitoring, event notifications: the layer that would notice an attack, missing where the check shows no direct path"
    - id: second-layer-controls
      when:
        native_id: "^(CKV_AWS_(7|79|145)|CKV2_AWS_6)@"
      value: hardening
      reason: "key rotation, IMDSv2, a customer key over default encryption, a public access block: a second layer beside the control that decides (a bucket's own ACL and policy, which CKV_AWS_20 and CKV_AWS_57 check, decide whether it is public)"
    - id: container-runs-as-root
      when:
        native_id: "^CKV_DOCKER_(3|8)@"
      value: hardening
      reason: "a container image with no user of its own, or whose last USER is root: least privilege inside the container, a second layer behind what runs in it"
    - id: description-and-build-tidiness
      when:
        native_id: "^(CKV_AWS_23|CKV_DOCKER_11)@"
      value: hygiene
      reason: "a security group rule without a description, or a multistage build whose FROM aliases repeat: tidiness with no security consequence"

decides:
  - requirement: d-infrastructure-config-secure
    category: [terraform, cloudformation, kubernetes, helm, kustomize, dockerfile, serverless, arm, bicep]
    not_applicable_when: no-input
    not_measured_when: config-not-audited
