# Adapter: gitleaks (INSTRUMENT — a deterministic secrets enumerator) -> the axis
# roster (map/scanners/CONTRACT.md, instrument role). Instruments never
# contribute an axis (contributes is empty by design — ten instruments add zero
# chapters); their rows feed existing axes. Rows are produced by map/ingest.mjs,
# which verifies the tool's exit code before any row exists (a tool that errored
# must never read as zero findings) and never copies a matched secret value. Every
# leak collapses to one native category ("secret" — the tool's whole taxonomy),
# keeping the rule id in native_id, so this map stays one row while gitleaks' rule
# set grows. Committed-secret rows corroborate the delegation credential census
# (METHOD.md, Pass 0): the census traces where secrets sit relative to the prompt
# boundary; gitleaks enumerates which are committed at all.
scanner: gitleaks
targets_taxonomy: 3
role: instrument
# the harness block holding this scanner's fail-loud halts (map/scanners/INTAKE.md)
fails_loud: instrument-port

# what `node assay.mjs tools install` puts on PATH (map/tools.mjs; CONTRACT.md §3g): the
# release archive, its sum from the release's checksums file: the version and the linux sum
# CI installs (.github/workflows/ci.yml), held equal by tests/blocks/tools.mjs
tool:
  bin: gitleaks
  version: "8.21.2"
  upstream: "github:gitleaks/gitleaks"
  fetch:
    linux-x64:
      url: "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
      sha256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
      member: "gitleaks"
    darwin-arm64:
      url: "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_darwin_arm64.tar.gz"
      sha256: "cad3de5dc9a4d5447d967a70a4d49499c557f04db028274cc324f9ff983f6502"
      member: "gitleaks"
contributes: []

map:
  secret:
    axis: code-security

default: FAIL

# handoff (map/scanners/CONTRACT.md §3, block style only): every leak is a
# read-first TRIAGE bucket, never one session prompt per hit — confirm which
# are live before rotating or purging anything. triage: true implies
# unit: scanner. client_proof needs nothing this repository's own team does not
# already have: the gitleaks binary itself, scoped both to history and the tree.
handoff:
  triage: true
  client_proof: "`gitleaks detect --source . --redact` (the history) and `gitleaks detect --no-git --source . --redact` (the tree) report none of these, or each remaining one is recorded in `.gitleaksignore` with the reason a person confirmed it is not a live secret."

capabilities:
  - id: verify-fix
    invoke: "re-run gitleaks scoped to the finding's evidence path (and its history) and confirm the rule no longer fires"
