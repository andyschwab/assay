# Adapter: fresh-clone (INSTRUMENT — the scripted fresh-clone run) -> the axis
# roster (map/scanners/CONTRACT.md, instrument role). map/fresh-clone.mjs
# clones the target into a scratch directory, runs the declared install / build /
# lint / typecheck / test / migrate steps, and replays the README's command claims
# for presence; map/ingest.mjs (profile fresh-clone) turns a failed or timed-out
# step, a NOT-DECLARED floor step (lint, typecheck, test, migrate — absence is a
# gap, never clean), or a MISSING README claim into one gap row each. A run where
# every declared step passed and every claim is present is the explicit empty
# map/findings/fresh-clone.yaml. A SKIPPED step (install broke) is one
# `<step>-not-run` fact row, never silence. Instruments never contribute an axis; these rows
# feed the axes the yardstick already homes the floor rows on
# (yardstick/requirements.yaml): the reproducibility rows (d-fresh-clone-runs) on
# context-economy, the verification-gate rows (d-tests-execute-core,
# d-lint-typecheck-gate) on deterministic-gates, the README-truth row
# (d-readme-true) on artifact-legibility. Keyed by the step name (the runner's
# closed set) plus readme-claim; a category this map does not know halts loud.
scanner: fresh-clone
targets_taxonomy: 3
role: instrument
# the harness block holding this scanner's fail-loud halts (map/scanners/INTAKE.md)
fails_loud: fresh-clone

contributes: []

map:
  install:                      # reproducibility: it installs from a clean checkout
    axis: context-economy
  build:                        # reproducibility: it builds from a clean checkout
    axis: context-economy
  migrate:                      # reproducibility: migrations replay from empty
    axis: context-economy
  no-database-signal:           # a fact row: no database signal anywhere in the tree — decides
    axis: context-economy       # d-schema-versioned not-applicable (yardstick/requirements.yaml)
  lint:                         # a verification gate exists and is green
    axis: deterministic-gates
  typecheck:
    axis: deterministic-gates
  test:                         # tests exist and execute on a clean machine
    axis: deterministic-gates
  readme-claim:                 # the README is true, measured by replaying it
    axis: artifact-legibility
  service-setup:                # a target's declared service setup (#256): a refused declaration,
    axis: context-economy       # or a setup command that failed — its own row, never charged to test
  # a fact row per SKIPPED step (install broke, so it never ran): homed beside its step,
  # it decides that step's requirement not measured (not_measured_when), never met
  install-not-run:
    axis: context-economy
  build-not-run:
    axis: context-economy
  migrate-not-run:
    axis: context-economy
  lint-not-run:
    axis: deterministic-gates
  typecheck-not-run:
    axis: deterministic-gates
  test-not-run:
    axis: deterministic-gates

default: FAIL

# confidence (map/scanners/CONTRACT.md §3, map/confidence.mjs, #319): a deterministic
# instrument, with one step it declares could not have run (#256). A test step that failed
# within seconds, reported no test counts (tests: unparsed), on a tree carrying a database
# signal (a database file or dependency, map/fresh-clone.mjs) and no services declaration
# (.assay/services.yaml, #305: where one is present it decides, so a provided service's
# failure is the suite's and a refused declaration never turns a failing suite into not
# measured), is the suite refusing to start for want of a service this measurement did not
# give it: nothing about the suite was measured. Ingest records each fact on the row's detail:.
confidence:
  evidence: deterministic
  not_measured:
    - id: test-refused-for-want-of-a-service
      category: test
      reason: "the suite stopped within seconds with no test counted, on a tree that names a database this clean machine did not provide, and no services declaration says how to give it one: no test ran, so the step measured nothing about the suite (#256)"
      when:
        status: failed
        tests: unparsed
        duration_ms:
          at_most: 10000
        needs_service:
          present: true

# handoff (map/scanners/CONTRACT.md §3, block style only): the default unit
# (finding) already groups every step failing the same way under one remedy.
# client_proof needs nothing this repository's own team does not already have:
# a plain clone of the branch the run measured.
handoff:
  client_proof: "From a fresh clone of the default branch (`git clone <repository> <scratch dir>`), the step the finding names passes."

capabilities:
  - id: verify-fix
    invoke: "re-run map/fresh-clone.mjs against the target and confirm the step reads passed (or the README claim reads present)"
