# Adapter: repo-census (INSTRUMENT — the deterministic repo census) -> the axis
# roster (map/scanners/CONTRACT.md, instrument role, §3d). map/repo-census.mjs
# checks, read-only against the tree: an architecture page that names an external
# service or data store (root and per app in a monorepo), a present-tense agent
# contract (AGENTS.md/CLAUDE.md, same monorepo rule), a runbook covering restart /
# roll back / rotate / restore, a CI workflow that gates on pull_request or push
# to the default branch without a step that fails open, and six owner-evidence
# transcript checks (format at
# owner/evidence/README.md) for what a repository cannot show by itself.
# map/ingest.mjs (profile repo-census) turns each `gap` check into one gap row
# and each `pass` check into one strength row (so the axis sees the evidence, not
# just the absence of a gap); a `not-applicable` check yields nothing. Instruments
# never contribute an axis; these rows feed the axes the yardstick
# already homes the floor rows on (yardstick/requirements.yaml): architecture-page /
# agent-contract / runbook feed the docs-legibility axis these floor rows already
# live on (d-architecture-page, d-agent-contract, d-runbook -> artifact-legibility);
# ci-gate feeds the shared verification-gate axis (d-ci-gate-on-default-branch ->
# deterministic-gates, the same axis fresh-clone's lint/typecheck/test rows land
# on). The six evidence categories follow the axis the yardstick now homes each
# re-kinded row on (yardstick/requirements.yaml); the adapter follows the yardstick,
# never the reverse — see the per-row comments below for which register row's axis
# each one carries and, where the yardstick row itself carries no axis, which
# nearest tier-mate's axis it was assigned (yardstick/requirements.yaml never edited
# to match). Keyed by the check name (the runner's closed set); a category this map
# does not know halts loud. The six evidence categories are `evidence-<descriptor-id>`.
scanner: repo-census
targets_taxonomy: 3
role: instrument

contributes: []

map:
  architecture-page:            # legibility: one page shows the parts and services
    axis: artifact-legibility
  agent-contract:                # the agent contract exists and is present-tense; homed where the yardstick homes d-agent-contract
    axis: improvement-loop
  runbook:                       # legibility: the one-page runbook covers the four procedures
    axis: artifact-legibility
  ci-gate:                       # a verification gate exists on the default branch and holds
    axis: deterministic-gates
  # The six owner-evidence checks decide requirements whose topic is operability or
  # reproducibility, which no axis measures; their rows land on the nearest axis so the
  # axis walk shows them, and the yardstick reports them under their own topic.
  evidence-d-backup-restore-exercised:
    axis: code-security
  evidence-d-rollback-exercised:
    axis: context-economy
  evidence-d-deploy-one-command:
    axis: code-security
  evidence-d-smoke-on-deployed:
    axis: deterministic-gates
  evidence-d-monitoring-with-alert:
    axis: verification
  evidence-d-cost-alerts:
    axis: artifact-legibility

default: FAIL

capabilities:
  - id: verify-fix
    invoke: "re-run map/repo-census.mjs against the target and confirm the check reads pass"
