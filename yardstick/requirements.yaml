    sources: [manifest/d4-eval-seed, method/calibration-probe]
    status: draft
  - id: d-ai-feature-evals
    title: Shipped AI features carry evals for answer quality
    tier: verification
    topic: verification   # register row carried no axis; nearest topic to its tier (verification) and title
    tags: [ai-operating]
