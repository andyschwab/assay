# yardstick/requirements.yaml — the requirements. yardstick/README.md is the contract.
#
# One row per requirement: what must be true of a repository somebody stands behind,
# stated without naming a stack, with the mechanism that DECIDES it from a map.
# Extracted from practice, never designed: every row names its sources. Block YAML so
# lib/yaml-min.mjs parses it.
#
# decide.kind (closed):
#   facet       computed from the finding schema's forced fields (effect and capability facets)
#   census      an authored, enumerated population against a stated bar (map/censuses.yaml)
#   instrument  a scanner's rows, read through the run record and the scanner's coverage
#   claim       only the owner can decide it; a run reads it NOT MEASURED, never inferred from prose
# topic (every row): an axis of the roster (map/project.mjs AXIS_ORDER), or custody,
# reproducibility or operability, which no scanner measures as an axis.
version: 0
namespace: assay
tiers: [custody, safety, reproducibility, verification, legibility, operability]
tags: [floor, fleet, ai-operating]
# harm (every floor row, and only a floor row): what its gap can harm. A row is floor when its
# gap can cause harm to data, to people, to money or to recovery (yardstick/README.md, #161).
harms: [data, people, money, recovery]

# members: the closed vocabulary a facet or census row's population is drawn from (yardstick/README.md,
# "The four deciding kinds"). Each facet and census row's check opens "Population: every <term> ...",
# naming one term here, and no two rows name the same one, so a finding a reader places on a term
# lands on one requirement (yardstick/population.mjs requirementTaking). subject_types: the finding
# subject types a member may carry; record: the effect or capability finding this term takes by its
# own facets, with no reader's word (halt-class-effect, effect, capability). A term no row names is a
# stated boundary: a finding placed on it is taken by no requirement, and the term says why.
members:
  - term: halt-class effect
    subject_types: [effect, control]
    record: halt-class-effect
    means: an irreversible or external effect, its own finding, or a finding about whether a gate stands in front of it
  - term: halt-class effect's record
    subject_types: [control, process]
    means: whether a halt-class effect leaves any durable record
  - term: effect gate
    subject_types: [control, contract]
    means: the gate in front of a gated effect, and how it fails when what it needs is absent
  - term: effect
    subject_types: [effect, control, process]
    record: effect
    means: an effect that is not halt-class, its own finding, or the form of any effect's record
  - term: AI context
    subject_types: [capability, control]
    record: capability
    means: one model call site with the input, data and effects within its reach
  - term: enumerated candidate
    subject_types: []
    means: a channel candidate, route handler or effect-site member of map/raw/enumerate.json; not a finding
  - term: secret
    subject_types: [control, artifact]
    means: a secret the running application reads, and what it can reach
  - term: doc claim
    subject_types: [artifact, process, contract]
    means: a concrete statement in the prose docs (README, the pages it routes to, the agent contract) the code can be checked against
  - term: non-obvious decision
    subject_types: [artifact, process]
    means: a choice a newcomer would question, and whether its why can be read from the files
  - term: module
    subject_types: [artifact, contract]
    means: a source file, package or directory an agent loads to change one concern
  - term: interface
    subject_types: [contract, artifact]
    means: what the application offers a caller (a route, a command, a tool, a screen, a data file or format)
  - term: lesson
    subject_types: [process, control, artifact]
    means: an incident, correction or recorded lesson, and whether it became a mechanism
  - term: change gate
    subject_types: [contract, control, process]
    means: a check the repository runs on a change before it lands or ships (a CI job or step, a hook, a config-driven check)
  - term: model call site
    subject_types: [control, process]
    means: one place the application obtains model output, a call through a provider's SDK or HTTP API or a local stand-in (a stub or wrapper called in place of one), and whether it records the call; what the call can reach is the AI context's
  - term: ingestion point
    subject_types: [control, contract, artifact]
    means: one place where text from outside the team enters the application (an upload, a fetch, an inbound message, webhook or feed, a file or page read in) and is stored, rendered or handed to a model
  # claim rows' populations (#262, M4 of #257): the owner decides each row; a run lists the findings
  # it saw on one in map/censuses.yaml's context:, shown as context and never a decision
  - term: second account
    subject_types: [artifact, process, contract, control]
    means: a fact the system relies on stated in a second place in the docs or the code; d-one-home-per-fact's population
  - term: model in use
    subject_types: [artifact, process, control]
    means: a model and tier the application calls, and whether its choice is recorded with a rationale and a re-qualification trigger; d-model-qualification's population
  - term: outward AI output
    subject_types: [control, contract, process, artifact]
    means: a channel through which model-written content reaches a person outside the team (a reply, a message, a post, a page, a change in another repository), and how it discloses AI involvement; d-ai-disclosure's population
  - term: guard fixture
    subject_types: [control, contract, process]
    means: a shipped check and the negative fixture meant to turn it red when the check is weakened; d-guards-bite's population
  - term: backlog record
    subject_types: [artifact, process]
    means: a place outstanding work is written down (an issue, a list file with rows, a to-do block), and how it is tracked to done; d-backlog-is-issues' population
  - term: AI feature
    subject_types: [contract, process, control, artifact]
    means: a shipped feature whose answer a model produces, and whether an eval checks that answer's quality; d-ai-feature-evals' population
  - term: relied-on rubric
    subject_types: [artifact, process, contract, control]
    means: a skill, prompt or rubric the application relies on for a judgment, and whether its repeatability was measured; d-calibration-harness' population
  - term: change verification
    subject_types: [contract, process, control]
    means: how a change states the verification it carries before it lands (a pull request template's section, a check on the pull request body or the commit message); d-change-carries-verification's population
  # stated boundaries: no facet or census row takes these (a claim or instrument row may name the property)
  - term: code comment
    subject_types: [artifact, contract]
    means: a comment or header inside code, stale or not; no row takes it until a docs-current-with-code row is promoted (#257)
  - term: spend ceiling
    subject_types: [control, process]
    means: a per-run or per-process ceiling on paid calls enforced before the call; no row takes it (the paid-spend-capped candidate, #257)
  - term: billing alert
    subject_types: [control, process]
    means: an alert on an account's bill after the spend; d-cost-alerts is decided by the repo census's owner-evidence transcript alone
  - term: request authorization
    subject_types: [control, contract]
    means: whether the server checks who is asking before it answers; d-routes-authorized takes only its instruments' rows
  - term: data scope
    subject_types: [control, artifact, contract]
    means: whose data a request or an effect reaches; d-tenant-isolation-in-data-layer takes only its instruments' rows
  - term: acting principal
    subject_types: [control, artifact, contract]
    means: whom an effect or an agent acts as; no row takes it (the effects-attributed-to-verified-actor candidate, #257)
  - term: test
    subject_types: [contract, control, process]
    means: whether a test exercises a path; d-effect-sites-tested is a claim row, and the suite's run is fresh-clone's

requirements:

  # ── custody: we cannot carry what we do not control ──────────────────────
  - id: d-accounts-enumerated
    title: Every account the application depends on is enumerated with an owner and a transfer path
    tier: custody
    topic: custody
    tags: [floor]
    harm: [recovery]
    decide:
      kind: claim
    check: the owner's packet (owner/ask-owner.md), one row per account (host, cloud, domain, data, mail, payments, model APIs, analytics, error tracking), each with an owner role and a transfer path
    sources: [floor/c-accounts]
    status: draft
    owner:
      risk: "If the logins for your hosting, domain, database, email, payments and AI provider are not written down with who owns each one, losing access to one person's account can mean losing the app or its data for good, with no way back in."
      fix: "Have your AI list every paid or hosted account the app depends on, name who owns the login for each, and write down how ownership could be handed to someone else."
  - id: d-credentials-enumerated
    title: Every credential is enumerated and its boundary confirmed
    tier: custody
    topic: delegation
    tags: [floor, ai-operating]
    harm: [data, money]
    decide:
      kind: census
      measures: [credentials-below-boundary, credential-boundary, credential]
      candidates: [secrets]
    check: "Population: every secret the running application reads (an environment variable, a config value or a key file that grants access to an account, a service or data), each secret name map/raw/enumerate.json lists in populations.secrets one candidate, triaged once in map/census-triage.yaml to the one finding that judges it, listed as the credential census's member; excluded: secret-named constants no site reads from the environment (enumerate's secretConstants, never a candidate), a candidate that is an inert string planted in a test fixture or a name that grants nothing, each triaged out of scope with the reason, and the accounts themselves (d-accounts-enumerated). Question: is what it can reach traced in the code, where it is read and what it may do there, rather than guessed? Judged, weighing whether the finding cites the read site and the uses it reaches in the code, rather than inferring them from the name. A census with no members never reads met"
    sources: [floor/c-credentials, manifest/d5-secrets-below-artifact, method/credential-census]
    status: draft
    owner:
      risk: "A key or password whose reach (what it is allowed to do) you have not confirmed might do far more than the app actually needs, for example delete everything instead of only reading it, so a single leak does more damage than it has to."
      fix: "Have your AI list every key and password the app uses, and for each one confirm and write down exactly what it is allowed to do."
  - id: d-bus-factor
    title: More than one person can build, deploy, and recover the application
    tier: custody
    topic: custody
    tags: [floor]
    harm: [recovery]
    decide:
      kind: claim
    check: an author census from history plus one deploy and one restore from a second machine
    sources: [floor/c-bus-factor]
    status: draft
    owner:
      risk: "If only one person can build, deploy, and recover the app, that person becoming unavailable (illness, a lost laptop, a falling-out) can leave the app stuck with nobody able to fix or even restart it."
      fix: "Have a second person actually deploy the app and restore it from a backup, from their own machine, once, and write down what they needed."

  # ── safety: nothing destructive can happen unnoticed ─────────────────────
  - id: d-secrets-out-of-history
    title: No secret lives in the tree or its history, and every leaked key has been rotated
    tier: safety
    topic: code-security
    tags: [floor]
    harm: [data, money]
    decide:
      kind: instrument
    check: a secrets scan over the full history exits clean; each prior leak has a rotation recorded
    sources: [floor/s-secrets, foundation/never-a-secret-in-a-file, manifest/invariants]
    status: draft
    owner:
      risk: "Anyone who ever gets a copy of the code gets any key written into it too, and the code's history remembers every past version forever, so deleting the line later does not undo it. That key can then be used to act as your app: read data, send mail, or run up a bill."
      fix: "Have your AI search the whole project and its history for anything that looks like a password or key, move each one out of the code into the hosting platform's settings, and then replace (rotate) every key that was ever exposed."
  - id: d-infrastructure-config-secure
    title: Infrastructure and container configuration carries no known misconfiguration
    tier: safety
    topic: code-security
    tags: [floor, fleet]
    harm: [data]
    decide:
      kind: instrument
    # decided through an adapter's decides: (an IaC policy instrument, #181); a tree with no
    # IaC or container file reads not-applicable, and a file it could not parse not-measured
    check: an IaC and container policy scan of every Terraform, CloudFormation, Kubernetes, Helm, Kustomize, Dockerfile, Serverless, ARM and Bicep file in the tree fails no check; a file it could not parse reads not-measured, never clean; a tree with none of them reads not-applicable
    sources: [scanner-candidates/core, issue/181]
    status: draft
    owner:
      risk: "The files that describe your servers, storage and containers can quietly leave a door open: a storage bucket anyone can read, a database reachable from the internet, a container running with full control of its machine. Nothing in the app itself shows it, and the first sign is often someone else finding it."
      fix: "Have your AI run an infrastructure policy check over every infrastructure and container file, fix each failed check (or record why it does not apply), and run the check again until it is clean."
  - id: d-untrusted-input-checked
    title: Untrusted input never reaches a dangerous sink unchecked
    tier: safety
    topic: code-security
    tags: [floor, fleet]
    harm: [data, people]
    decide:
      kind: instrument
    # decided through an adapter's decides: (a static-analysis instrument with vendored taint
    # rules behind a positive control, #232); a tree with no file in a language those rules read
    # reads not-applicable, never met
    check: a taint analysis of every JavaScript, TypeScript and Python file in the tree, run beside a positive control that fired, finds no request input reaching a SQL string, a shell command, returned markup, a filesystem path, an outbound request URL, an unsafe deserializer or evaluator, or a redirect target unchecked; a tree with no file in those languages reads not-applicable
    sources: [scanner-candidates/core, issue/232]
    status: draft
    owner:
      risk: "If something a visitor types or sends can travel unchecked into a database query, a system command, a page the app sends back, a file path or a web address the server fetches, a stranger can use it to read or change other people's data, run commands on your server, or send your users somewhere harmful."
      fix: "Have your AI run a taint analysis over the code, and for each place it finds input reaching such a sink, pass the input through a bound parameter, an argument list, escaping or an allowlist, then run it again until it is clean."
  - id: d-routes-authorized
    title: Every route that touches data is behind server-side authorization
    tier: safety
    topic: code-security
    tags: [floor]
    harm: [data, people]
    decide:
      kind: instrument
    check: a route census where every data route names its check; the code scanner's application-security domain clean
    sources: [floor/s-auth, takeover-eval/unauthenticated-paid-route]
    status: draft
    owner:
      risk: "If the check for who is allowed to see something lives only in what the screen shows and hides, anyone who knows how to ask the server directly, which is easy, can read or change any user's data, not just their own."
      fix: "Have your AI review every place the app reads or writes data and confirm the server itself checks who is asking before it answers, not just the screen."
  - id: d-tenant-isolation-in-data-layer
    title: Scoping is enforced in the data layer, not only in the UI
    tier: safety
    topic: code-security
    tags: [floor, fleet]
    harm: [data, people]
    decide:
      kind: instrument
    check: every scoped table carries its policy; the scanner's multi-tenancy domain clean
    sources: [foundation/structural-rule-3, takeover-eval/identity-re-derived]
    status: draft
    owner:
      risk: "If keeping one customer's or user's data separate from another's is enforced only in what the app displays, a bug or a direct request can show one person's data to another, even though the screen never would have."
      fix: "Have your AI confirm that every shared table or store enforces which user or account owns each row where the data actually lives, not only in the app's screens."
  - id: d-dependencies-known-clean
    title: No known-critical dependency vulnerability is present
    tier: safety
    topic: code-security
    tags: [floor, fleet]
    harm: [data]
    decide:
      kind: instrument
      scanner: dependency-scan
      category: critical
      not_applicable_when: no-manifest
      not_measured_when: [no-lockfile, lockfile-not-audited]
    # the descriptor is worded on critical only (its category), so a run with high
    # (or moderate/low/info) advisories and zero critical rows still reads met —
    # narrower than the title; widen the category only with a reviewed change.
    check: dependency-scan (npm, pnpm or yarn audit over every lockfile in the tree), and every dependency auditor an adapter binds here (decides:, over the lockfiles of other ecosystems too), report no critical advisory; a lockfile one auditor could not read is answered where another audited it; a manifest with dependencies and no lockfile covering it, or a lockfile nothing audited (the audit failed, or its package manager was not on the runner), reads not-measured, never clean; no package.json anywhere in the tree reads not-applicable
    sources: [floor/s-deps, scanner-candidates/core]
    status: draft
    owner:
      risk: "The app is built partly from other people's free code, and a known serious flaw in one of those pieces is a published weakness, not a secret one; anyone can look up how to exploit it."
      fix: "Have your AI run the dependency check and fix or replace any package it flags as critically vulnerable."
  - id: d-effects-gated
    title: Every irreversible or outward effect runs behind a gate that holds
    tier: safety
    topic: deterministic-gates
    tags: [floor, ai-operating]
    harm: [data, people, money]
    decide:
      kind: facet
      rule: halts-gated
    check: "Population: every halt-class effect (irreversible, or leaving the trust boundary) in the run's triaged effect inventory, the effect finding itself and any finding about whether a gate stands in front of it; excluded: reversible internal effects, how a gate in front of an effect fails (open, or never ending), which is d-gates-fail-closed's, and gates on a change (CI, hooks, config), which are d-change-gates-fail-closed's. Question: does a gate that holds stand in front of it? Read off the effect facets (doctrine.mjs): zero halt-class effects without a gate that holds; one authenticated person's own recorded act (gate_type initiated-by-person) holds, an unattended job doing the same write does not"
    sources: [floor/s-effects-gated, manifest/d5-halt-tripwire, foundation/halts, takeover-eval/weekly-publish-unrecallable]
    status: draft
    owner:
      risk: "An action that cannot be undone or that reaches outside the app, sending an email, charging a card, deleting data, running with nothing standing in front of it means one bug or one bad input performs it for real, with no chance to catch it first."
      fix: "Have your AI list every action that sends, charges, deletes, or otherwise cannot be undone, and add a check in front of each one that must pass before it runs. An action a signed-in person starts on purpose, like clicking Save, already counts if the click is recorded; the ones to fix run on their own."
  - id: d-effects-traced
    title: Every irreversible or outward effect leaves a durable record
    tier: safety
    topic: verification
    tags: [floor, ai-operating]
    harm: [people, money]
    decide:
      kind: facet
      rule: halts-traced
    check: "Population: every halt-class effect's record, one per halt-class effect in the run's triaged effect inventory; excluded: reversible internal effects, and whether a record is structured or audited enough to prove the effect by, which is d-effects-provable's. Question: does the effect leave a durable record at all? Read off the effect facets: zero halt-class effects with telemetry none"
    sources: [floor/s-effects-traced, foundation/structural-rule-2]
    status: draft
    owner:
      risk: "If a send, a charge, or a delete leaves no record, you cannot later tell whether it happened, when, or to whom, so when a customer says 'I never got that email' or 'I was charged twice,' you have nothing to check it against."
      fix: "Have your AI make sure every send, charge, or delete writes a timestamped record you can look up afterward."
  - id: d-gates-fail-closed
    title: No gate is open when a dependency it needs is absent
    tier: safety
    topic: deterministic-gates
    tags: [floor, fleet]
    harm: [data, people, money]
    decide:
      kind: facet
      rule: gates-fail-closed
    check: "Population: every effect gate, the gate in front of each gated effect (gate_type other than none) in the run's triaged effect inventory; excluded: effects with no gate, which are d-effects-gated's, and gates on a change (CI jobs, hooks, config checks), which are d-change-gates-fail-closed's. Question: when a dependency it needs is absent, or its check runs without end, does it refuse? Read off the effect facets: zero gated effects with fail_mode open or unterminated, each counted apart; a gate whose secret or tool is missing goes red, never green, and a gate check that never finishes is no verdict"
    sources: [foundation/never-skip-a-test, takeover-eval/privacy-gate-passes-unset, manifest/d3-guards-bite]
    status: draft
    owner:
      risk: "If a safety check quietly turns itself off when something it needs is missing, a setting, a key, a connection, instead of blocking the action, the app can look protected while actually running wide open, at the moment it is most likely to matter. A check that can hang forever without an answer is no safer."
      fix: "Have your AI test each safety check with its setting or key removed, and confirm the check blocks the action instead of letting it through. Make sure each check also gives up and blocks after a set time, instead of waiting forever."
  - id: d-capability-budget
    title: No single AI context holds untrusted input, private data, and an outward effect at once
    tier: safety
    topic: delegation
    tags: [floor, ai-operating]
    harm: [data, people]
    decide:
      kind: facet
      rule: trifecta
    check: "Population: every AI context, one per capability finding (a model call site and the input, data and effects within its reach); excluded: a scheduled job's trifecta-shaped reach with no model call, which is an effect, and the effects themselves, which are the effect rows'. Question: does it hold untrusted input, private data and an outward effect at once while reaching an effect with no gate that holds? No capability finding holds all three legs and reaches an effect with no gate that holds"
    sources: [floor/s-trifecta, manifest/d5-capability-budget, method/trifecta-screen]
    status: draft
    owner:
      risk: "If one AI-driven step can read something a stranger wrote, see private data, and also send or delete something, a stranger's note or message can instruct the AI to leak that data or take that action, because to the model the words in the data and the words in its instructions look the same."
      fix: "Have your AI redesign any single step that reads outside text, sees private data, and can act, so a person confirms before the action, or split reading from acting into separate steps."
  - id: d-personal-data-enumerated
    title: Personal data held is enumerated, and nothing is stored the product never needed
    tier: safety
    topic: code-security
    tags: [floor]
    harm: [people]
    decide:
      kind: instrument
    check: a personal-data census over stores and schemas; the scanner's privacy domain clean
    sources: [floor/s-personal-data]
    status: draft
    owner:
      risk: "Without a written list of what personal information the app stores (names, emails, notes, locations), you cannot tell people what you hold about them, cannot delete it properly if asked, and are more likely to be keeping things you never actually needed."
      fix: "Have your AI list every place personal data is stored in the app, and remove anything that is not actually used."
  - id: d-backup-restore-exercised
    title: Backups exist and a restore has been performed
    tier: safety
    topic: operability
    tags: [floor, fleet]
    harm: [data, recovery]
    decide:
      kind: instrument
      scanner: repo-census
      category: evidence-d-backup-restore-exercised
      not_applicable_when: evidence-d-backup-restore-exercised-not-applicable
      not_measured_when: evidence-d-backup-restore-exercised-unverifiable
    check: the repo census, a fresh, complete, passing transcript at ops/evidence/d-backup-restore-exercised.md naming the backup, the scratch instance restored into, and the data check that verified it; whether the restore truly happened rests on the named person's attestation in version history, not on this check; the commit it names must resolve in the checkout's history, else a gap — a shallow checkout that cannot confirm this reads not-measured, never pass; with no deployment signal anywhere in the tree (map/scanners/CONTRACT.md §3d) the census records that it looked and found none, and the requirement reads not-applicable — never met
    sources: [floor/s-backup, foundation/nightly-restore]
    status: draft
    owner:
      risk: "If backups exist but nobody has ever restored from one, you do not actually know they work; the first time you find out is the day you need them and they fail."
      fix: "Take a backup, restore it into a throwaway copy of the app, confirm the data is really there, and write down what you did."
  - id: d-ingested-content-is-data
    title: Ingested content is stored verbatim, rendered escaped, and never acted on as instructions
    tier: safety
    topic: delegation
    tags: [ai-operating, fleet]
    decide:
      kind: census
      measures: [ingested-content, ingestion-points]
      open: "no tool lists it from the tree: outside text enters through an upload, a fetch, an inbound message or a file read, and enumerate lists only some of those shapes (route handlers, http writes), while whether a read takes in outside text is read at the site"
      why: "census (#262): a run closes the population by reading the tree, since outside text enters only through an upload, a fetch, an inbound route, webhook or feed, or a file read the code makes, and how it is kept, rendered and used is read where it lands"
    check: "Population: every ingestion point, each place where text from outside the team enters the application (an upload, a fetch, an inbound message, webhook or feed, a file or page read in) and is stored, rendered or handed to a model, one finding per point listed as the ingested-content census's members; excluded: whether request input is checked before it reaches a dangerous sink, which is d-untrusted-input-checked's, what a model call can reach, the AI context's, and the effects a reply drives, which the effect rows take. Question: is its text kept as data, stored verbatim with its provenance, rendered escaped, and never acted on as an instruction? Judged, weighing each path its text takes to a store, a render or a model prompt. A census with no members never reads met"
    sources: [foundation/ingested-content-is-data, method/acting-from]
    status: draft
    owner:
      risk: "If text the app pulls in from outside (a note, an email, a web page) can be treated as commands rather than as content, anyone who can get text into the app can quietly steer what the app or its AI does."
      fix: "Have your AI confirm that anything read in from outside is only ever displayed or analyzed, never executed as an instruction, anywhere in the app."

  # ── reproducibility: it runs on a machine that is not yours ──────────────
  - id: d-fresh-clone-runs
    title: It installs, builds, and runs from the README on a clean machine
    tier: reproducibility
    topic: reproducibility
    tags: [floor]
    harm: [recovery]
    decide:
      kind: instrument
      scanner: fresh-clone
      category: [install, build]
      not_measured_when: [install-not-run, build-not-run]
    check: the fresh-clone install and build steps both read passed from a clean checkout (map/fresh-clone.mjs), root and every workspace; an undeclared build reads unmet, the same as an undeclared lint or test gate — absence is not a pass
    sources: [floor/r-fresh-clone]
    status: draft
    owner:
      risk: "If the app does not reliably start from a plain copy of the code on a different computer, you depend on the one machine that happens to still have it working; losing that machine can mean losing the ability to run or fix your app at all."
      fix: "On a clean checkout of the code, on a different machine if possible, follow your own setup instructions exactly and fix anything that does not work."
  - id: d-config-declared
    title: Configuration is declared once and nothing environment-specific is hardcoded
    tier: reproducibility
    topic: reproducibility
    tags: [fleet]
    decide:
      kind: instrument
    check: the env example is complete against the code's reads; the scanner's config domain clean
    sources: [floor/r-config, foundation/config-stated-once]
    status: draft
    owner:
      risk: "If settings that differ between your computer and the live app (addresses, keys, feature switches) are baked into the code instead of declared in one place, moving the app to a new environment silently carries over the wrong settings, or breaks it."
      fix: "Have your AI move every environment-specific value out of the code and into one declared settings list, with an example file showing what each one is."
  - id: d-dependencies-pinned
    title: Dependencies and the toolchain are pinned, and CI actions by commit
    tier: reproducibility
    topic: reproducibility
    tags: [floor, fleet]
    harm: [recovery]
    decide:
      kind: instrument
      any_gap: unmet                # every property the check names must hold (#177)
    check: a lockfile honoured by CI, a toolchain version declared, actions pinned by SHA; decided through adapters (decides:): the code reviewer's supply-chain domain and a workflow auditor's unpinned-action reading, any gap from either deciding it unmet
    sources: [floor/r-deps-pinned, foundation/lockfile-and-nvmrc]
    status: draft
    owner:
      risk: "If the exact versions of the tools and packages the app depends on are not locked, the app you test today may not be the app that actually gets built or deployed tomorrow; an update nobody chose can quietly change behavior."
      fix: "Have your AI confirm every dependency and the automated setup use pinned, exact versions rather than 'latest'."
  - id: d-deploy-one-command
    title: One documented command deploys, and what runs is what is committed
    tier: reproducibility
    topic: operability
    tags: [floor, fleet]
    harm: [recovery]
    decide:
      kind: instrument
      scanner: repo-census
      category: evidence-d-deploy-one-command
      not_applicable_when: evidence-d-deploy-one-command-not-applicable
      not_measured_when: evidence-d-deploy-one-command-unverifiable
    check: the repo census, a fresh, complete, passing transcript at ops/evidence/d-deploy-one-command.md naming the one deploy command and the deployed build's reported sha, which must equal the transcript's own commit (else a gap); whether the deploy truly ran rests on the named person's attestation in version history, not on this check; the commit it names must resolve in the checkout's history, else a gap — a shallow checkout that cannot confirm this reads not-measured, never pass; with no deployment signal anywhere in the tree (map/scanners/CONTRACT.md §3d) the census records that it looked and found none, and the requirement reads not-applicable — never met
    sources: [floor/r-deploy, foundation/deploy-and-promote]
    status: draft
    owner:
      risk: "If deploying takes more than one documented step, or what gets deployed is not provably the same code that is committed, you cannot be sure the live app matches what you or anyone else reviewed."
      fix: "Have your AI write one documented command or button that deploys the app, and confirm the deployed version matches exactly what is committed."
  - id: d-rollback-exercised
    title: A rollback path exists and has been exercised
    tier: reproducibility
    topic: operability
    tags: [floor, fleet]
    harm: [recovery]
    decide:
      kind: instrument
      scanner: repo-census
      category: evidence-d-rollback-exercised
      not_applicable_when: evidence-d-rollback-exercised-not-applicable
      not_measured_when: evidence-d-rollback-exercised-unverifiable
    check: the repo census, a fresh, complete, passing transcript at ops/evidence/d-rollback-exercised.md naming the from/to versions and the check run afterward; whether the rollback truly happened rests on the named person's attestation in version history, not on this check; the commit it names must resolve in the checkout's history, else a gap — a shallow checkout that cannot confirm this reads not-measured, never pass; with no deployment signal anywhere in the tree (map/scanners/CONTRACT.md §3d) the census records that it looked and found none, and the requirement reads not-applicable — never met
    sources: [floor/r-rollback, foundation/promote]
    status: draft
    owner:
      risk: "If you have never actually gone back to a previous version, a bad release can leave the app broken for everyone with no proven way back, exactly when you are under the most pressure to fix it fast."
      fix: "Deploy a small change, then roll it back to the previous version using your documented process, and confirm the app still works afterward."
  - id: d-schema-versioned
    title: The schema is versioned and migrations replay from empty
    tier: reproducibility
    topic: reproducibility
    tags: [floor, fleet]
    harm: [data, recovery]
    decide:
      kind: instrument
      scanner: fresh-clone
      category: migrate
      not_applicable_when: no-database-signal
      not_measured_when: migrate-not-run
    check: the fresh-clone migrate step replays from an empty database on a clean checkout, measured on a clean machine with no service of assay's own; a database the target declares (.assay/services.yaml) is started throwaway only on the opt-in (fresh-clone --services), and otherwise a migrate bound to it with no dry form reads not measured, never unmet; with no database signal (file or dependency — Prisma, Knex, TypeORM, Supabase, Drizzle, a raw db/sql migrations folder, …) anywhere in the tree, fresh-clone records that it looked and found none, and the requirement reads not-applicable — never met, nothing was measured; a database signal with no migrate step declared reads unmet, never met
    sources: [floor/r-migrations, foundation/never-hand-apply-a-migration]
    status: draft
    owner:
      risk: "If the shape of your stored data is not tracked in files that can rebuild it from nothing, restoring from a backup, moving to a new host, or bringing on a second developer can leave you unable to recreate the database at all."
      fix: "Have your AI put every change to the data's shape into tracked files that can replay from an empty database, and confirm they do."

  # ── verification: something other than a person catches a regression ────
  - id: d-tests-execute-core
    title: Tests exist, run on a clean machine, and execute their core
    tier: verification
    topic: deterministic-gates
    tags: [floor]
    harm: [people]
    decide:
      kind: instrument
      scanner: fresh-clone
      category: test
      not_measured_when: test-not-run
    check: the fresh-clone test step reads passed, never merely not-declared, from a clean checkout on a clean machine with no service of assay's own; a suite that skips its core when a variable is unset is unmet; services the target declares (.assay/services.yaml) are started throwaway only on the opt-in (fresh-clone --services), and a test bound to them that did not get them reads not measured, never unmet; with nothing declared, a failing test is unmet
    sources: [floor/v-tests, manifest/d3-gates-live, foundation/pnpm-check]
    status: draft
    owner:
      risk: "If the automated tests do not actually run their real checks on a clean machine, 'all tests passed' can be true while the app is broken; the green checkmark is telling you nothing."
      fix: "On a clean checkout, run the test command and confirm it actually executes the real checks rather than skipping them."
  - id: d-ci-gate-on-default-branch
    title: A CI check on the default branch runs the gates and fails closed
    tier: verification
    topic: deterministic-gates
    tags: [floor, fleet]
    harm: [people]
    decide:
      kind: instrument
      scanner: repo-census
      category: ci-gate
      not_measured_when: ci-gate-unverifiable
    check: the repo census, a workflow that triggers on pull_request, merge_group or push to the default branch and runs a test/check/lint/typecheck/build step, directly or through a package script the repository declares, with no step failing open (continue-on-error, or a run script that swallows its own non-zero exit with `|| true` / `|| exit 0` / `|| :` / `set +e`); a `set +e` that reads the exit status and exits non-zero on it, or hands it through $GITHUB_OUTPUT to a later step of the same job that exits non-zero under an if: on it, does not fail open, and one whose hand-on the census cannot follow reads not-measured, never met; whether the check is required by branch protection is not visible from the tree and stays a sidecar claim
    sources: [floor/v-ci, foundation/branch-protection]
    status: draft
    owner:
      risk: "Without an automatic check that runs on every change to the main version of the app and blocks anything that fails, a broken change can reach the live app before a person happens to notice."
      fix: "Have your AI set up an automatic check that runs the tests on every change and blocks it from merging if anything fails."
  - id: d-change-gates-fail-closed
    title: No gate a change passes through reads green when what it checks is absent or never finishes
    tier: verification
    topic: deterministic-gates
    tags: [floor, fleet]
    harm: [people]
    decide:
      kind: census
      measures: [change-gates, change-gates-fail-closed]
      candidates: [changeGates]
    check: "Population: every change gate, each check the repository runs on a change before it lands or ships (a CI job or step, a commit or push hook, a config-driven lint, typecheck, test, scan or schema check), each member map/raw/enumerate.json lists in populations.changeGates one candidate (a CI step, a job with no steps, a hook, a package script named for a check), triaged once in map/census-triage.yaml to the one finding that judges it, listed as the change-gates census's member, or out of scope with the reason (a setup step that checks nothing); excluded: gates in front of the application's own effects, which are d-gates-fail-closed's, whether a CI workflow on the default branch exists and runs the gates, which is d-ci-gate-on-default-branch's, and whether branch protection requires a check, which the tree does not show. Question: when the tool, secret, input or target it needs is absent, or its check never finishes, does it go red rather than green? Judged, weighing what the step does, read in its script, when what it needs is unset or never answers. A step that swallows its own exit, or skips its work when a variable is unset, passes nothing; a census with no members never reads met"
    sources: [issue/257, issue/261, takeover-eval/privacy-gate-passes-unset, foundation/never-skip-a-test]
    status: draft
    owner:
      risk: "If an automatic check on a change quietly passes when the tool, key or file it needs is missing, or when it never finishes, a broken or unsafe change can reach your users while every check shows green, and the green tells you nothing."
      fix: "Have your AI list every automatic check a change passes through (in CI, in commit hooks, in config), remove what each one needs in turn, and confirm the check goes red instead of passing; give each a time limit after which it fails."
  - id: d-guards-bite
    title: Every shipped check carries a negative fixture that fails when the check is disabled
    tier: verification
    topic: deterministic-gates
    tags: [fleet]
    decide:
      kind: claim
      context: [guard-fixtures]
      why: "claim (#262): seeing a check turn red when it is weakened takes a mutation run the lane does not make, and the checks themselves are the change-gates census's population, so the tree shows a fixture exists, never that it bites"
    check: "Population: every guard fixture, each shipped check with the negative fixture meant to turn it red; excluded: whether a change gate goes red when what it needs is absent, which is d-change-gates-fail-closed's, and whether the gates run on the default branch, which is d-ci-gate-on-default-branch's. Question: does the self-test flip red when that one check is weakened? Met when, by execution, the check with its condition removed or inverted makes its own self-test exit non-zero, a run the owner or a mutation tool makes and records; a fixture present but never seen failing is context, not met"
    sources: [manifest/d3-guards-bite]
    status: draft
    owner:
      risk: "A safety check that has never been proven to actually catch anything might be doing nothing at all; it looks reassuring but has never been tested against the thing it is supposed to catch."
      fix: "For each safety check, deliberately break the thing it is supposed to catch and confirm the check turns red."
  - id: d-lint-typecheck-gate
    title: Lint and typecheck gates exist and pass
    tier: verification
    topic: deterministic-gates
    tags: [fleet]
    decide:
      kind: instrument
      scanner: fresh-clone
      category: [lint, typecheck]
      not_measured_when: [lint-not-run, typecheck-not-run]
    check: the fresh-clone lint and typecheck steps both read passed from a clean checkout; never the raw output
    sources: [floor/v-lint, scanner-candidates/inverted-mode]
    status: draft
    owner:
      risk: "Without automatic checks that catch obvious mistakes (typos, wrong kinds of values) before they ship, small careless errors that a machine could catch in seconds reach the live app instead."
      fix: "Have your AI add and confirm automatic style and type checks run and pass on a clean copy of the code."
  - id: d-smoke-on-deployed
    title: A smoke check proves the deployed application comes up and the main path works
    tier: verification
    topic: operability
    tags: [floor, fleet]
    harm: [people]
    decide:
      kind: instrument
      scanner: repo-census
      category: evidence-d-smoke-on-deployed
      not_applicable_when: evidence-d-smoke-on-deployed-not-applicable
      not_measured_when: evidence-d-smoke-on-deployed-unverifiable
    check: the repo census, a fresh, complete, passing transcript at ops/evidence/d-smoke-on-deployed.md naming the environment and the check run against it; whether the smoke check truly ran rests on the named person's attestation in version history, not on this check; the commit it names must resolve in the checkout's history, else a gap — a shallow checkout that cannot confirm this reads not-measured, never pass; with no deployment signal anywhere in the tree (map/scanners/CONTRACT.md §3d) the census records that it looked and found none, and the requirement reads not-applicable — never met
    sources: [floor/v-smoke, foundation/doctor]
    status: draft
    owner:
      risk: "If nothing actually checks that the live, deployed app comes up and its main feature works, a broken deploy can sit there unnoticed until a real user hits it."
      fix: "Set up a simple check that hits the live app after every deploy and confirms the main path works, and run it once now."
  - id: d-effects-provable
    title: Every effect can prove it happened, deterministically, from outside the AI
    tier: verification
    topic: verification
    tags: [ai-operating]
    decide:
      kind: facet
      rule: effects-provable
    check: "Population: every effect in the run's triaged effect inventory, halt-class or not, through the record it leaves (the effect finding itself when it is not halt-class, and any finding about the form of an effect's record); excluded: whether a halt-class effect leaves any record at all, which is d-effects-traced's, and a halt-class effect's own finding, which is d-effects-gated's. Question: is its record structured or audited, so the effect can be proved from outside the AI? Read off the effect facets: effects with a structured or audited record, of all effects"
    sources: [method/verification-measure]
    status: draft
    owner:
      risk: "If an important action (a send, a charge) cannot prove afterward that it actually happened, using something other than the AI's own claim, you are trusting the AI's word for something that may have failed silently."
      fix: "Have your AI make sure every important action writes a record that something outside the AI itself (a log, a receipt) can check afterward."
  - id: d-contract-test-per-vendor
    title: Every external system reached has a recorded contract test against its sandbox
    tier: verification
    topic: verification
    tags: [fleet]
    decide:
      kind: claim
    check: one contract test per vendor; the null adapter every spec runs on
    sources: [foundation/integrations-guide, takeover-eval/no-provider-contract]
    status: draft
    owner:
      risk: "If you have never tested against a real outside service's own test environment, your code might work against your own assumptions about that service while breaking the moment it talks to the real thing."
      fix: "Have your AI write and run one test against each outside service's own sandbox or test mode, not just a fake stand-in."
  - id: d-effect-sites-tested
    title: The code paths that produce effects are exercised by tests
    tier: verification
    topic: deterministic-gates
    tags: [floor]
    harm: [people, money]
    decide:
      kind: claim
    check: each effect channel's driver has a test that exercises the site where the effect is decided
    sources: [takeover-eval/cascade-driver-untested]
    status: draft
    owner:
      risk: "If the exact code that decides whether to send, charge, or delete is never exercised by a test, you are relying on nobody ever breaking it, and eventually someone will, without anyone noticing."
      fix: "Have your AI add a test that specifically exercises the code path where each send, charge, or delete decision is made."
  - id: d-change-carries-verification
    title: Every change lands with its own verification stated
    tier: verification
    topic: verification
    tags: [fleet]
    decide:
      kind: claim
      context: [change-verification]
      why: "claim (#262): the population is the changes, which live in the forge's history, not in the tree, and the template with the check on it is one artifact, not a population; a run shows what it saw as context"
    check: "Population: every change verification, the way a change states the verification it carries before it lands (a pull request template's section, a check on the pull request body or the commit message); excluded: whether a gate goes red when what it needs is absent, which is d-change-gates-fail-closed's. Question: is the verification section mandatory, with CI refusing an empty one? Met when a check that runs on every change reads the pull request body or the commit message and exits non-zero when the verification section is missing, empty or the template's placeholder unchanged; what a change writes in it is not weighed, and a template section no check reads is a gap"
    sources: [manifest/d4-verification-rhythm, foundation/pr-template]
    status: draft
    owner:
      risk: "If nobody has to say how a change was checked before it ships, changes can merge on hope rather than on having actually been verified."
      fix: "Require every change to state how it was checked before it can be merged, and have your AI refuse to skip that."

  # ── legibility: someone else can find their way in ───────────────────────
  - id: d-readme-true
    title: The README is true for this application, measured by running it, not by reading it
    tier: legibility
    topic: artifact-legibility
    tags: [fleet]
    decide:
      kind: census
      measures: [doc-freshness]
      open: "no tool lists it from the tree: a doc claim is a sentence of prose, and which sentences state a command, a count, a path or an endpoint the code can be checked against is read, not listed"
    check: "Population: every doc claim, a concrete statement in the repository's prose docs (the README, the doc pages it routes to, the agent contract file) of a command, a count, a path, an endpoint or a capability the code is said to have; excluded: comments and headers in code, which no requirement takes until a docs-current-with-code row is promoted (#257), a second account of one fact, decision rationale, which is d-decisions-reconstruct's, and whether the agent contract file exists, which is d-agent-contract's. Question: does it hold when replayed against the code or checked in the fresh-clone run? Judged, weighing whether the claim is concrete enough to replay; a path, command or count the tree does not bear out is a gap"
    sources: [floor/l-readme, method/docs-freshness-probe]
    status: draft
    owner:
      risk: "If your setup instructions describe commands or features that do not actually work, the next person, or the next AI session, will trust them, waste time, or ship something broken because they believed the instructions."
      fix: "Run every command your setup instructions describe, on a clean copy, and fix or remove any that do not actually work."
  - id: d-decisions-reconstruct
    title: Non-obvious decisions reconstruct their rationale from the files alone
    tier: legibility
    topic: artifact-legibility
    tags: [fleet]
    decide:
      kind: census
      measures: [decision-reconstruction, decision-rationale, patch-rationale]
      open: "no tool lists it from the tree: a non-obvious decision is a choice a newcomer would question, and nothing in the files marks one as such, so choosing the members is itself a judgment: the terrain draws them and freezes them before assessment, and two terrains may draw different ones (#293)"
    check: "Population: every non-obvious decision the terrain enumerates and freezes before assessment (a choice a newcomer would question: a dependency, a shortcut, a default, a boundary), one finding per decision; excluded: choices the code alone makes obvious, a stale claim in the docs, which is d-readme-true's, and a lesson from a past failure, which is d-corrections-become-mechanisms'. Question: can a newcomer reconstruct why it was made from the repository's files alone? Judged, weighing whether the files (a comment at the choice, a decision record, a doc page) name what was chosen and why over the obvious alternative"
    sources: [floor/l-decisions, manifest/d1-decision-container, method/pass-1]
    status: draft
    owner:
      risk: "If the reasoning behind a non-obvious choice lives only in someone's memory or a chat history, that reasoning is gone the moment they are not available, and the next person may undo a decision that was made for a good reason."
      fix: "Have your AI write down, next to the code, why each non-obvious decision was made, so someone new could understand it from the files alone."
  - id: d-modules-standalone
    title: A bounded context can load one module alone with something to read and something to run
    tier: legibility
    topic: context-economy
    tags: [fleet]
    decide:
      kind: census
      measures: [modules-standalone, module-standalone, module-loadability, control-plane-modules-standalone]
      open: "no tool lists it from the tree: the tree lists files, packages and directories, and which of them is the unit an agent loads to change one concern is the terrain's judgment"
    check: "Population: every module in the terrain's module population, a source file, package or directory an agent loads to change one concern; excluded: generated and vendored code, tests, the prose docs (d-readme-true) and a stale comment inside a module, which no requirement takes. Question: can an agent load it alone, with something to read and something to run, and change it without loading the rest? Met when all three hold, read off the tree: something to read, a non-empty comment block at the head of its file or a README in its directory; something to run, a test file that imports it directly; and alone, its transitive imports inside the repository reach at most ten source files (for a directory or package, any of its files, its imports counted outside it). A member missing any one is a gap"
    sources: [method/pass-2]
    status: draft
    owner:
      risk: "If understanding one part of the app requires holding the whole thing in your head, or an AI's working memory, at once, every small task becomes expensive, and mistakes creep in from parts nobody could actually see at the same time."
      fix: "Have your AI confirm each major part of the app has something to read and something to run on its own, without needing the rest of the app loaded."
  - id: d-architecture-page
    title: One page shows the parts, the data flow, and the external services
    tier: legibility
    topic: artifact-legibility
    tags: [fleet]
    decide:
      kind: instrument
      scanner: repo-census
      category: architecture-page
    check: the repo census, an architecture page present (at the root and every location map/projects.mjs finds; a workspace with none of its own is covered by its project's passing page unless it is a separately deployed unit, a container file, hosting config or infrastructure manifest of its own) naming at least one external service or data store; a full match against every effect channel the inventory found stays a sidecar claim
    sources: [floor/l-architecture, foundation/docs-architecture]
    status: draft
    owner:
      risk: "Without one page showing what the app is made of and what outside services it talks to, a new person, or a new AI session, has to reverse-engineer that from scratch every time, and easily misses an outside service that matters."
      fix: "Have your AI write one page naming the app's parts, how data flows between them, and every outside service it depends on."
  - id: d-agent-contract
    title: An agent contract exists, is present-tense, and is the home for house rules
    tier: legibility
    topic: improvement-loop
    tags: [floor, fleet]
    harm: [data, money]
    decide:
      kind: instrument
      scanner: repo-census
      category: agent-contract
    check: the repo census, AGENTS.md or CLAUDE.md present (at the root and every location map/projects.mjs finds; a workspace with none of its own is covered by its project's passing contract unless it is a separately deployed unit, a container file, hosting config or infrastructure manifest of its own) with no status/history/changelog/todo/backlog heading and no dated changelog line; dated evidence it is used stays a sidecar claim
    sources: [floor/l-agent-contract, manifest/d2-tiered-contract, manifest/d1-contract-history-separation, foundation/CLAUDE.md]
    status: draft
    owner:
      risk: "Without one clear, current page of house rules for anyone, human or AI, working on the app, habits and decisions drift, and each new session or person re-guesses the rules instead of following them."
      fix: "Have your AI write one present-tense page stating the house rules for working on this app, and keep it current rather than a history log."
  - id: d-one-home-per-fact
    title: Each fact the system relies on has one authoritative home, in docs and in code
    tier: legibility
    topic: code-correctness
    tags: [fleet]
    decide:
      kind: claim
      context: [second-accounts]
      why: "claim (#262): no listing closes the facts a system relies on, so a run cannot enumerate every second account; it shows the ones it came across as context"
    check: "Population: every second account, a fact the system relies on (a list, a rule, a count, a membership) stated in a second place in the docs or the code; excluded: a duplicated block of code, which is d-no-drifting-duplicates' (structure-scan decides it), and a doc claim the code contradicts, which is d-readme-true's. Question: does one home stay authoritative, a docs guard refusing a second account of a list and one store per remembered fact in code? Its population is a judgment: a code listing can find a duplicated literal, but no listing closes the facts the docs state, so the members are the second accounts the review came across, never a closed list. Judged, weighing whether one account is marked as the home and the other defers to it or is guarded against drift"
    sources: [foundation/where-things-are-written, takeover-eval/one-fact-many-memories]
    status: draft
    owner:
      risk: "If the same fact, a list of accounts, a set of rules, is written down in two places, they will eventually disagree, and nobody will know which one is true."
      fix: "Have your AI find every fact that is duplicated across the docs or code and consolidate each one to a single authoritative place."
  - id: d-no-drifting-duplicates
    title: No block of code is carried in two copies that can drift apart
    tier: legibility
    topic: code-maintainability
    tags: [fleet]
    decide:
      kind: instrument
      scanner: structure-scan
      category: duplicate
      not_measured_when: duplicate-not-run
    check: structure-scan ran its duplication pass and found no clone pair of 50 tokens or more; a pass that was skipped or failed reads not-measured with its reason, never met
    sources: [issue/110, scanner-candidates/structure-scan]
    status: draft
    owner:
      risk: "When the same block of code lives in two places, a fix made in one copy misses the other, and every change costs more than it should."
      fix: "Have your AI find each duplicated block and keep one copy, or add a test that fails when the copies drift."
  - id: d-no-dead-code
    title: No file, export, dependency or abandoned copy remains that nothing uses
    tier: legibility
    topic: code-maintainability
    tags: [fleet]
    decide:
      kind: instrument
      scanner: structure-scan
      category: [unused, stale-artifact]
      not_applicable_when: unused-not-applicable
      not_measured_when: unused-not-run
      excluding: unconfigured
    check: structure-scan ran its unused-code pass and found no unused dependency, and no unused file, export, type or member where the target carries a knip configuration naming its entry points (without one, knip cannot see a module reached by path, so those rows stay in the map flagged unconfigured and never decide this), and its tree pass found no tracked file named as abandoned; an unused-code pass that was skipped or failed reads not-measured with its reason, and a tree with no package.json reads not-applicable, unless a stale file was found
    sources: [issue/110, scanner-candidates/structure-scan]
    status: draft
    owner:
      risk: "Code and packages nobody uses still have to be understood, updated and secured, so they cost time and attention without doing anything for the app."
      fix: "Have your AI remove the packages and code nothing uses, one change at a time with the tests green after each; if the app loads parts of itself by name, first have it list those starting points for the unused-code checker so it can tell what is really unused."

  # ── operability: we can see it and afford it ─────────────────────────────
  - id: d-errors-reach-a-person
    title: Errors and logs reach somewhere a person looks
    tier: operability
    topic: operability
    tags: [floor, fleet]
    harm: [people]
    decide:
      kind: instrument
    check: an error sink configured and one induced error observed arriving
    sources: [floor/o-errors]
    status: draft
    owner:
      risk: "If errors only print to a log nobody watches, the app can be failing for real users right now and you would only find out when they complain, if they bother to."
      fix: "Set up a place that collects errors from the running app, and deliberately cause one error to confirm it actually arrives there."
  - id: d-monitoring-with-alert
    title: Uptime or smoke monitoring exists with an alert route that has been tested
    tier: operability
    topic: operability
    tags: [floor, fleet]
    harm: [people, recovery]
    decide:
      kind: instrument
      scanner: repo-census
      category: evidence-d-monitoring-with-alert
      not_applicable_when: evidence-d-monitoring-with-alert-not-applicable
      not_measured_when: evidence-d-monitoring-with-alert-unverifiable
    check: the repo census, a fresh, complete, passing transcript at ops/evidence/d-monitoring-with-alert.md naming the monitor and carrying the alert-fired and alert-received timestamps (received not before fired); whether the alert truly fired and was received rests on the named person's attestation in version history, not on this check; the commit it names must resolve in the checkout's history, else a gap — a shallow checkout that cannot confirm this reads not-measured, never pass; with no deployment signal anywhere in the tree (map/scanners/CONTRACT.md §3d) the census records that it looked and found none, and the requirement reads not-applicable — never met
    sources: [floor/o-monitoring]
    status: draft
    owner:
      risk: "Without a check that watches whether the app is actually up, and an alert proven to reach a real person, the app can go down and stay down until a user happens to notice and tell you."
      fix: "Set up an uptime or health check with an alert to a person, then deliberately trigger it once and confirm the alert arrives."
  - id: d-cost-alerts
    title: Cost alerts exist on every metered account from day one
    tier: operability
    topic: operability
    tags: [floor, fleet]
    harm: [money]
    decide:
      kind: instrument
      scanner: repo-census
      category: evidence-d-cost-alerts
      not_applicable_when: evidence-d-cost-alerts-not-applicable
      not_measured_when: evidence-d-cost-alerts-unverifiable
    check: the repo census, a fresh, complete, passing transcript at ops/evidence/d-cost-alerts.md listing at least one account, each naming the account, its threshold, and its recipient; whether the alerts truly exist in the billing console rests on the named person's attestation in version history, not on this check; the commit it names must resolve in the checkout's history, else a gap — a shallow checkout that cannot confirm this reads not-measured, never pass; with no deployment signal anywhere in the tree (map/scanners/CONTRACT.md §3d) the census records that it looked and found none, and the requirement reads not-applicable — never met
    sources: [floor/o-cost, foundation/budgets]
    status: draft
    owner:
      risk: "A hosting plan, database, or AI provider with no spending limit or alert means a bug, a loop, or someone else using a leaked key can run up a bill far larger than expected before anyone notices."
      fix: "On every account the app pays for, turn on a spending alert with a threshold and a recipient, today."
  - id: d-runbook
    title: A one-page runbook covers restart, roll back, rotate a key, restore
    tier: operability
    topic: operability
    tags: [floor, fleet]
    harm: [recovery]
    decide:
      kind: instrument
      scanner: repo-census
      category: runbook
    check: the repo census, the runbook present with a heading or paragraph for restart, roll back, rotate a key/secret/credential, and restore from backup; each procedure having been run once stays the owner's evidence
    sources: [floor/o-runbook, foundation/RUNBOOKS.md]
    status: draft
    owner:
      risk: "Without a written page covering how to restart the app, undo a bad release, replace a leaked key, and restore from backup, an outage becomes a from-scratch investigation instead of following steps that already exist."
      fix: "Have your AI write one page covering how to restart, roll back, replace a key, and restore from backup."
  - id: d-health-read
    title: One command reports the whole foundation green or red with a reason
    tier: operability
    topic: operability
    tags: [fleet]
    decide:
      kind: claim
    check: the doctor script, same output shape on every application
    sources: [foundation/doctor]
    status: draft
    owner:
      risk: "Without one command that tells you the whole app is healthy or names exactly what is wrong, checking on the app after a change means guessing what to look at, and things get missed."
      fix: "Have your AI add one command that checks the whole app and reports healthy, or exactly what is wrong."
  - id: d-every-run-terminates
    title: Every automated run ends red or green with a reason, never hangs
    tier: operability
    topic: operability
    tags: [fleet]
    decide:
      kind: claim
    check: every job declares a timeout; a stall is a red check in minutes
    sources: [foundation/red-means-stop, foundation/deploy-timeouts]
    status: draft
    owner:
      risk: "An automated job that can hang forever instead of failing with a reason ties up time and money and hides the fact that something actually went wrong."
      fix: "Have your AI add a time limit to every automated job, so a stall shows up as a clear failure within minutes."
  - id: d-backlog-is-issues
    title: The backlog is the repository's issues, labelled by need-by, kind, and size, and the merge empties it
    tier: operability
    topic: operability
    tags: [fleet]
    decide:
      kind: claim
      context: [backlog-records]
      why: "claim (#262): the issues, their labels and which change closed them live on the forge, not in the tree, so a run cannot close the backlog; it shows the records it saw as context"
    check: "Population: every backlog record, each place outstanding work is written down (an issue, a list file with rows, a to-do block); excluded: a lesson from a past failure, which is d-corrections-become-mechanisms'. Question: is it an issue on the repository's tracker, labelled by need-by, kind and size and closed by the change that finishes it, with no list file carrying rows? Judged, weighing whether the closing change finishes the work the issue names"
    sources: [foundation/docs-backlog, manifest/d7-coordination-adapter]
    status: draft
    owner:
      risk: "If outstanding work lives scattered across notes and files instead of one tracked list, things get forgotten or done twice, and nobody has one place to see what is still open."
      fix: "Have your AI move every outstanding to-do into the repository's tracked issue list and remove the scattered notes."
  - id: d-foundation-asks-swept
    title: Asks of the platform owner are marked at the code site and swept before they go stale
    tier: operability
    topic: operability
    tags: [fleet]
    decide:
      kind: claim
    check: the marker sweep runs with a staleness threshold and goes red past it
    sources: [foundation/foundation-asks]
    status: draft
    owner:
      risk: "A request left as a comment in the code for someone else to handle, with nobody checking it periodically, can sit forgotten for months, quietly blocking something that was supposed to happen."
      fix: "Have your AI find every such request left in the code, and set up a periodic check that flags any left unresolved too long."
  - id: d-template-partition-synced
    title: The template-owned partition is declared, synced from the template, and guarded on both sides
    tier: operability
    topic: operability
    tags: [fleet]
    decide:
      kind: claim
    check: the sync manifest present; the guard test red on a template-owned file edited locally
    sources: [foundation/template-sync]
    status: draft
    owner:
      risk: "If a shared starting template updates its own files and yours have silently drifted from it with no boundary enforced, you can lose fixes or protections the template added without knowing it happened."
      fix: "Have your AI declare which files are template-owned, and add a check that flags if they are edited locally without syncing."
  - id: d-template-currency
    title: The application knows which template version it carries and when it is behind
    tier: operability
    topic: operability
    tags: [fleet]
    decide:
      kind: claim
    check: a template commit stamp, a sync check that exits non-zero on drift, a currency line in the health read
    sources: [template-eval/F-107]
    status: draft
    owner:
      risk: "Not knowing which version of a shared starting template your app is built from means you cannot tell when it has fallen behind on a fix or improvement everyone else already has."
      fix: "Have your AI record which template version the app is on and add a check that flags when a newer one is available."
  - id: d-red-main-stops-work
    title: A red run on the default branch is the work now, before anything else merges
    tier: operability
    topic: operability
    tags: [fleet]
    decide:
      kind: claim
    check: the contract states it; the default branch's latest runs are green at every merge
    sources: [foundation/red-means-stop]
    status: draft
    owner:
      risk: "If a broken check on the main version of the app does not stop everything else, more work piles on top of a broken foundation, and untangling it later gets harder the longer it is ignored."
      fix: "Agree, and write down, that a broken check on the main version is fixed before anything else merges, and confirm the main version is currently passing."

  # ── ai-operating: the model-call layer, on top of any foundation ─────────
  - id: d-effect-channels-enumerated
    title: Every channel through which an AI surface produces effects is enumerated, and each is triaged
    tier: safety
    topic: delegation
    tags: [ai-operating]
    decide:
      kind: facet
      rule: channels-triaged
    check: "Population: every enumerated candidate, each channel candidate, route handler and effect-site member the run's enumeration lists (map/raw/enumerate.json, written by assay start); excluded: an effect the list does not name, which is still a finding and closes no candidate. Question: is it triaged in map/effect-triage.yaml, to the effect finding that covers it or out of scope with the reason? A candidate is not a finding, so this row takes no finding: the effect findings a triage names are the effect rows'"
    sources: [method/canon, method/enumerate]
    status: draft
    owner:
      risk: "Without one written list of every way an AI feature can cause a real-world effect (sending, paying, deleting), it is easy to miss one when reviewing what could go wrong; you cannot check a channel you did not know existed."
      fix: "Have your AI list every channel through which an AI feature in the app can send, pay, delete, or otherwise act, in one place."
  - id: d-model-call-telemetry
    title: Every model call emits a structured record with tier, spend, and outcome
    tier: verification
    topic: context-economy
    tags: [ai-operating]
    decide:
      kind: census
      measures: [model-call-telemetry, model-calls]
      why: "census (#262): a run closes the population by reading the tree, since every model call is a provider SDK import, a call to a provider's API, or a local stand-in for one that the code defines and names as such (#293), and whether the call writes a record is read at the call site"
      candidates: [modelCalls]
    check: "Population: every model call site, each place the application obtains model output: a call to a provider's SDK or HTTP API, or a local stand-in, a stub or wrapper the application calls in place of one; each file map/raw/enumerate.json lists in populations.modelCalls (a provider call, or a function whose name or the comment directly above it says it stands in for a model call) one candidate, triaged once in map/census-triage.yaml to the one finding that judges the calls in it, listed as the model-call-telemetry census's member, or out of scope with the reason (an import no call uses), and a stand-in enumerate does not list is a member outside the list; excluded: what the call can reach, the AI context's (d-capability-budget), a ceiling on spend enforced before the call, which no row takes, and an alert on the bill after it, which is d-cost-alerts'. Question: does the call emit one structured record, in a machine-readable sink, of its tier, its spend and its outcome? Met when, on every return of the call, success or error, a record carries the model or tier, the usage or cost, and the outcome as fields of a structured entry (an object or JSON log line, a table row, a metrics event), never only words in a message; a record missing any of the three, or a call with none, is a gap. A census with no members never reads met"
    sources: [manifest/d6-telemetry-native, method/spend-meter]
    status: draft
    owner:
      risk: "Without a record of every call made to an AI model, what it cost, which tier, what happened, a cost spike or a bad response has no trail to investigate, and spending can run away unnoticed."
      fix: "Have your AI make every model call write a record of which model, what it cost, and what the outcome was, to one place you can look up."
  - id: d-model-qualification
    title: Model and tier choices are recorded with rationale and re-qualified when models ship
    tier: verification
    topic: verification
    tags: [ai-operating]
    decide:
      kind: claim
      context: [model-qualification]
      why: "claim (#262): a qualification happens off the repository (a model tried against the work, a choice made), so the tree cannot show it was done; a run shows the records it found as context"
    check: "Population: every model in use, each model and tier the application calls; excluded: whether each call is recorded, which is d-model-call-telemetry's, and whether an AI feature's answers are evaluated, which is d-ai-feature-evals'. Question: is there a dated qualification record for it, with the rationale for the choice and the trigger that re-qualifies it when models ship? The owner decides, weighing a qualification that happens off the repository"
    sources: [method/pass-2-spend]
    status: draft
    owner:
      risk: "Using an AI model without having checked it actually works well for what you are asking it to do, and without re-checking when a newer model comes out, means quality can quietly degrade without anyone deciding to accept that."
      fix: "Have your AI write down which model is used for what, why, and what would trigger re-checking it."
  - id: d-calibration-harness
    title: Any skill or rubric the application relies on is hardened by measurement, not assumed repeatable
    tier: verification
    topic: verification
    tags: [ai-operating]
    decide:
      kind: claim
      context: [rubric-calibration]
      why: "claim (#262): which skills and rubrics the application relies on is the owner's to say, and the blind repeated runs happen in a model, not in the tree; a run shows the harnesses it saw as context"
    check: "Population: every relied-on rubric, each skill, prompt or rubric the application relies on for a judgment; excluded: an AI feature's answer quality, which is d-ai-feature-evals'. Question: was it hardened by measurement, a frozen input run blind n times with the divergence disposed into named classes? Judged, weighing whether the runs and their divergence classes are recorded beside the rubric"
    sources: [manifest/d4-eval-seed, method/calibration-probe]
    status: draft
    owner:
      risk: "If a skill or a scoring rule the app leans on has never been tested for how consistent it actually is, you are assuming it behaves the same way every time when it may not, and you would have no way to know."
      fix: "Run the same input through the skill or rule several times and record how much the results actually differ."
  - id: d-ai-feature-evals
    title: Shipped AI features carry evals for answer quality
    tier: verification
    topic: verification
    tags: [ai-operating]
    decide:
      kind: claim
      context: [ai-feature-evals]
      why: "claim (#262): which features ship, and which call sites make up one feature, is a product boundary the tree does not draw, so a run cannot close the population; it shows the evals it saw as context"
    check: "Population: every AI feature, each shipped feature whose answer a model produces; excluded: the model's qualification, which is d-model-qualification's, and a skill or rubric's repeatability, which is d-calibration-harness'. Question: does an eval of its answer quality exist and run in CI? Met when, for a feature the owner names, a test that a CI job runs on every change calls the feature's model path with fixed inputs and asserts on its answer (an expected output, or a score against a threshold); how good the eval set is is not weighed, and an eval no CI job runs is a gap. A dynamic scanner is the eventual instrument"
    sources: [scanner-candidates/dynamic-tier, issue/2]
    status: draft
    owner:
      risk: "Shipping an AI feature with nothing checking the quality of its answers means a change to the model or the prompt can quietly make it worse, and nobody would notice until a user does."
      fix: "Have your AI write a small set of example checks for each AI feature's answer quality, and run them automatically."
  - id: d-ai-disclosure
    title: AI involvement is disclosed to the audience's norms, structurally where the audience requires it
    tier: safety
    topic: delegation
    tags: [ai-operating]
    decide:
      kind: claim
      context: [ai-disclosure]
      why: "claim (#262): whether a disclosure meets its audience's norms is the owner's to say, since the audience is not in the tree; a run shows the channels and mechanisms it saw as context"
    check: "Population: every outward AI output, each channel through which model-written content reaches a person outside the team; excluded: the send itself, which the effect rows take, and what the call can reach, the AI context's. Question: does the channel name its disclosure mechanism, or record why its audience needs none? The owner decides, weighing the norms of the channel's audience"
    sources: [method/authorship-probe]
    status: draft
    owner:
      risk: "If people interacting with an AI-driven part of the app do not know they are talking to one, and your audience expects to know that, you can lose their trust the moment they find out."
      fix: "For every place the app shows AI-generated content or replies to people, name how it discloses that, or write down why it does not need to."
  - id: d-agent-consumable-surface
    title: Every capability is reachable by an agent through an API or format contract, not only a human UI
    tier: legibility
    topic: multiplayer
    tags: [ai-operating, fleet]
    decide:
      kind: census
      measures: [agent-access-surface, agent-consumable-surface]
      open: "no tool lists it from the tree: routeHandlers and channelCandidates list some interfaces (an HTTP route, a command, a tool), but a screen, or a data file or format other tools read, has no listing, and routeHandlers and contracts do not close a target's interfaces"
    check: "Population: every interface the application offers a caller, person or program (an HTTP route, a command, a tool or MCP tool, a screen, a data file or format other tools read); excluded: internal functions nothing outside the code reaches, whether the server checks who is asking (d-routes-authorized), whose data a request reaches (d-tenant-isolation-in-data-layer) and whom an effect acts as, which no census takes. Question: can an agent reach and use it through an API or format contract stated outside the code, not only through a human screen? Met when a contract the tree keeps outside the code names the member: an API schema (OpenAPI, GraphQL or JSON Schema) or a doc page giving a route's method and path, a doc page giving a command's usage, a tool's or MCP tool's input schema, which the agent is handed with the tool, or a schema or doc page giving a data format's fields; a screen meets it when every route, command or tool its code calls to act is itself a member that meets the row, named on its finding, and a screen that acts through anything else is a gap. Interfaces consumable by an agent, of all interfaces"
    sources: [manifest/d7-agent-surface, manifest/d7-format-contracts, foundation/structural-rule-4]
    status: draft
    owner:
      risk: "If every capability of the app is only reachable by clicking through a human screen, no automated tool or AI assistant can use it on your behalf, which limits what can be automated later."
      fix: "Have your AI list which capabilities have no non-screen way to reach them, and add one where it matters."
  - id: d-corrections-become-mechanisms
    title: Recorded lessons become durable mechanisms rather than notes
    tier: legibility
    topic: improvement-loop
    tags: [fleet, ai-operating]
    decide:
      kind: census
      measures: [incidents-became-mechanisms, incident-lesson, lessons-mechanized]
      open: "no tool lists it from the tree: a lesson is recorded in prose (an incident note, a postmortem, a review correction, a lessons-file entry), and which prose records one is read, not listed"
    check: "Population: every lesson the repository records, an incident, postmortem, review correction, lessons-file entry or fix that names its cause; excluded: plans and backlog items nothing has yet been learned from, and decision rationale, which is d-decisions-reconstruct's. Question: did it become a mechanism (a test, a lint, a hook, a guard) that would catch the same failure again? Judged, weighing whether the mechanism fails on the cause the lesson names. Lessons that became a mechanism, of lessons recorded"
    sources: [manifest/d6-correction-capture, foundation/lesson-with-its-incident]
    status: draft
    owner:
      risk: "A lesson learned from a past mistake that only lives as a note, rather than as something the system enforces, gets forgotten, and the same mistake happens again."
      fix: "Have your AI turn your most recently recorded lessons into an actual enforced check rather than leaving them as notes."
  - id: d-independent-review
    title: Non-trivial work is reviewed by a context that did not produce it before it merges
    tier: verification
    topic: verification
    tags: [ai-operating]
    decide:
      kind: claim
    check: the review step present in the contract and evidenced on merged PRs
    sources: [manifest/d4-independent-review]
    status: draft
    owner:
      risk: "Work that ships without anyone, or anything, other than whoever built it looking it over is more likely to carry a mistake the builder was too close to see."
      fix: "Require a review by a different person or a fresh AI session before non-trivial work merges, and confirm it happened on your last few changes."
